{id:'rpc',term:'RPC',full:'Remote Procedure Call',cn:'远程过程调用 RPC',zone:'abbr',lv:3,abbr:true,tl:'<b>RPC（Remote Procedure Call，远程过程调用）</b>是让调用远程服务像调本地函数：背后网络传输、序列化全帮你包好——写代码的人感觉不到「远程」。',ana:'打 114 查号：你拨号（调用），接线员帮你查（远程执行），结果念给你（返回）——你像在本地问了个人。',scn:'微服务架构标配词——订单服务调库存服务，代码里看着像普通函数调用，底下全是 RPC；gRPC 是最流行的现代实现。',rel:['api3','api','http','json','febe'],al:['RPC','远程过程调用','远程调用','gRPC'],one:'调远程服务像调本地函数',cf:'别和 REST 混——REST 面向资源（网址+动词），RPC 面向动作（直接调函数）；内部服务间 RPC 更高效，对外开放 API 常用 REST。',dlg:[{q:'既然像本地函数，坑在哪？',a:'网络会断、会超时、会重——本地函数没有的失败模式它全有，所以幂等和重试必须设计。'},{q:'gRPC 为啥快？',a:'二进制序列化（Protobuf）+ HTTP/2 多路复用，比 JSON 文本省很多。'}],quiz:{q:'RPC 的设计目标？',o:['加密所有流量','替代数据库','让远程调用像本地函数一样自然','压缩网页'],a:2,why:'Remote Procedure Call——远程「过程」调用，透明化是全部意义。'}},
{id:'uuid',term:'UUID',full:'Universally Unique Identifier',cn:'唯一标识 UUID',zone:'abbr',lv:1,abbr:true,tl:'<b>UUID</b> 是随机生成的全球唯一编号：36 位十六进制，撞号概率低到忽略不计——不用中央发号，谁都能本地生成，保证不重。',ana:'身份证由公安统一发号（自增 ID）；UUID 像每个人自己随口编一句「天书」——天书空间太大，两人编出同一句的概率约等于零。',scn:'让 Codex 生成「唯一标识」时它常给 uuid——数据库主键、文件命名、trace 追踪号都在用。',rel:['hash','db','api','json','idem'],al:['UUID','通用唯一标识符','GUID','唯一编号'],one:'随机生成全球唯一编号，不用中央发号',cf:'UUID 无序——做数据库主键会打乱索引效率；所以大数据量场景常改用「有序 UUID」或雪花 ID。',dlg:[{q:'为什么不用自增编号？',a:'自增要中央计数还暴露规模（看到 id=1051 知道你有 1050 个用户）；UUID 分散生成还不泄密。'},{q:'撞号了怎么办？',a:'理论上可能，概率约等于连续中彩票——工程上当作不可能。'}],quiz:{q:'UUID 的核心优势？',o:['短','有序','加密','分散生成也能全球不重'],a:3,why:'去中心化生成 + 撞号概率趋零，是它存在的意义。'}}
];

<script>
/* ============ 逻辑 ============ */
var ZONES={ai:{n:'AI 核心',e:'🧠'},code:{n:'编程基础',e:'⌨️'},misc:{n:'杂词 / 软件',e:'🧩'},abbr:{n:'缩写速查',e:'🔤'}};
var LV={1:'入门',2:'进阶',3:'硬核'};
var STORE={fav:{},read:{},hist:[],miss:{},wrong:{},qlog:[],theme:'auto'};
try{var raw=localStorage.getItem('mingcixiaochao');if(raw){var p=JSON.parse(raw);
  STORE.fav=p.fav||{};STORE.read=p.read||{};STORE.hist=p.hist||[];STORE.miss=p.miss||{};STORE.wrong=p.wrong||{};STORE.qlog=p.qlog||[];STORE.theme=p.theme||'auto'}}catch(e){}
function save(){try{localStorage.setItem('mingcixiaochao',JSON.stringify(STORE))}catch(e){}}
/* 浏览历史：最近看的排前面，去重，最多留 12 个 */
function markView(id){
  STORE.hist=[id].concat((STORE.hist||[]).filter(function(x){return x!==id})).slice(0,12);save();
}
/* 搜不到时用户点「记下来」：存本地，下次补词时优先补 */
function addMiss(q){
  q=String(q||'').trim();if(!q)return;
  STORE.miss=STORE.miss||{};STORE.miss[q]=(STORE.miss[q]||0)+1;save();
}

var screenEl=document.getElementById('screen');
var stack=[],cur='home',curArg=null,QI=0,PICKED=null,timers=[];

function esc(s){return String(s).replace(/&(?!\w+;)/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function strip(s){return esc(String(s).replace(/<[^>]+>/g,''))}
function byId(id){for(var i=0;i<WORDS.length;i++){if(WORDS[i].id===id)return WORDS[i]}return null}
function clearTimers(){timers.forEach(clearTimeout);timers=[]}
function push(fn,t){timers.push(setTimeout(fn,t))}
function go(v,a){if(cur)stack.push({v:cur,a:curArg});cur=v;curArg=a;render()}
function back(){var p=stack.pop();if(p){cur=p.v;curArg=p.a;render()}}

function isDesk(){return window.matchMedia('(min-width:900px)').matches}

function render(){
  clearTimers();
  var h='';
  if(cur==='home')h=viewHome();
  else if(cur==='list')h=viewList(curArg);
  else if(cur==='detail')h=viewDetail(curArg);
  else if(cur==='quiz')h=viewQuiz();
  else if(cur==='qlog')h=viewQLog();
  else if(cur==='about')h=viewAbout();
  else if(cur==='aboutsub')h=viewAboutSub(curArg);
  else if(cur==='fav')h=viewFav();
  /* v5.0 桌面分栏：首页/列表/收藏进左栏，右栏常驻显示当前词详解 */
  if(isDesk()&&(cur==='home'||cur==='list'||cur==='fav')){
    var rightHtml=deskId
      ?'<div class="view v-detail">'+detailInner(deskId)+'</div>'
      :'<div class="dk-hint">👈 点左边任意一个词<br>详解会显示在这里</div>';
    h='<div class="desk"><div class="dk-left">'+h+'</div>'
     +'<div class="dk-right" id="dkRight">'+rightHtml+'</div></div>';
  }
  screenEl.innerHTML=h;
  window.scrollTo(0,0);
  document.getElementById('q').value=(cur==='list'&&curArg&&curArg.q)?curArg.q:'';
  syncTab();
  if(cur==='detail')startDemo(curArg);
  if(isDesk()&&deskId&&(cur==='home'||cur==='list'||cur==='fav'))startDemo(deskId);
}

/* v5.0 桌面模式：点词/点相关词只刷新右栏，不跳页 */
var deskId=null;
function deskShow(id){
  var r=document.getElementById('dkRight');
  if(!r){go('detail',id);return}
  deskId=id;
  r.innerHTML='<div class="view v-detail">'+detailInner(id)+'</div>';
  r.scrollTop=0;
  startDemo(id);
}
function syncTab(){
  var t=document.querySelectorAll('#tabbar div');
  for(var i=0;i<t.length;i++){
    var k=t[i].getAttribute('data-tab');
    t[i].className=(k===cur||(cur==='list'&&k==='home')||(cur==='aboutsub'&&k==='about')||(cur==='detail'&&k==='home'))?'on':'';
  }
}

function rowHTML(w,isAbbr){
  var f=STORE.fav[w.id]?'on':'';
  var inner=isAbbr
   ? '<div class="abbrline"><span class="a">'+w.term+(w.shot&&SHOTS[w.shot]?' 🖼':'')+'</span><span class="f">'+w.full+' · '+strip(w.cn)+'</span></div>'
     +'<div class="rd">'+strip(w.tl)+'</div>'
   : '<div class="rn">'+w.term+(w.new?' <span class="badge">NEW</span>':'')
     +' <span class="chip lv">'+LV[w.lv]+'</span></div>'
     +'<div class="rd">'+strip(w.cn)+' — '+strip(w.tl)+'</div>';
  return '<div class="row" data-go="detail" data-id="'+w.id+'"><div class="rt">'+inner+'</div>'
    +'<div class="star '+f+'" data-star="'+w.id+'">★</div></div>';
}
/* 一个词所有可被搜到的文本：词、全称、中文、别名、释义、类比、场景 */
function hayOf(w){
  return (w.term+' '+w.full+' '+w.cn+' '+((w.al||[]).join(' '))+' '
    +strip(w.tl)+' '+strip(w.ana||'')+' '+strip(w.scn||'')+' '+strip(w.one||'')).toLowerCase();
}
function searchWords(q){
  q=String(q).toLowerCase().trim();if(!q)return [];
  /* 先把查询按空格拆开，每个片段都要命中（搜「ai 幻觉」= 同时含两者） */
  var parts=q.split(/\s+/);
  return WORDS.filter(function(w){
    var hay=hayOf(w);
    return parts.every(function(p){return hay.indexOf(p)>-1});
  });
}
/* 搜不到时的兜底：模糊找最接近的 N 个（逐字命中 + 连续两字加权） */
function nearWords(q,n){
  q=String(q).toLowerCase().trim();if(!q)return [];
  var scored=[];
  WORDS.forEach(function(w){
    var hay=hayOf(w),sc=0,used={},i;
    for(i=0;i<q.length;i++){var c=q[i];if(used[c])continue;if(hay.indexOf(c)>-1){sc++;used[c]=1}}
    if(q.length>1)for(i=0;i+1<q.length;i++){if(hay.indexOf(q.substr(i,2))>-1)sc+=2}
    if(sc>0)scored.push({w:w,sc:sc});
  });
  scored.sort(function(a,b){return b.sc-a.sc});
  return scored.slice(0,n).map(function(x){return x.w});
}
function missHTML(q){
  var near=nearWords(q,3);
  var h='<div class="empty"><span class="e">🔍</span>没找到「'+esc(q)+'」<br>'
   +(near.length?'你要找的可能是这几个：':'试试搜「套壳」「变笨」「额度」这种大白话')+'</div>';
  if(near.length)h+=near.map(function(w){return rowHTML(w,false)}).join('');
  var noted=(STORE.miss||{})[String(q).trim()];
  h+='<div class="missbox"><div class="mt">都不是？</div>'
   +'<button class="btn ghost" data-miss="'+esc(q)+'">'+(noted?'✅ 已记下了':'📌 记下来，下次补上')+'</button>'
   +'<div class="ms">记下后存在你手机本地，不上传；下次加词时我优先补它</div></div>';
  return h;
}
function listHTML(o,isAbbr){
  if(o&&o.q){
    var list=searchWords(o.q);
    if(!list.length)return missHTML(o.q);
    return list.map(function(w){return rowHTML(w,isAbbr)}).join('');
  }
  /* v6.0：三个新入口页 —— 最该先搞懂 / 最近新增 / 今日推荐 */
  if(o&&o.sp==='hot'){
    return ['llm','token','context','prompt','hallu','agent','rag','api','mcp','skill']
      .map(byId).filter(Boolean)
      .sort(function(a,b){return a.lv-b.lv})
      .map(function(w){return rowHTML(w,false)}).join('');
  }
  if(o&&o.sp==='new'){
    var nl=WORDS.filter(function(w){return w.new}).slice().reverse();
    return nl.map(function(w){return rowHTML(w,false)}).join('');
  }
  if(o&&o.sp==='daily'){
    return dailyFive().map(function(w){return rowHTML(w,false)}).join('');
  }
  /* v6.2：分区列表按难度升序 + 可按难度筛选 */
  var zl=WORDS.filter(function(w){return w.zone===o.z});
  if(o.lv)zl=zl.filter(function(w){return String(w.lv)===String(o.lv)});
  zl.sort(function(a,b){return a.lv-b.lv});
  if(!zl.length)return '<div class="empty"><span class="e">📭</span>这个难度下暂无词</div>';
  return zl.map(function(w){return rowHTML(w,isAbbr)}).join('');
}

/* v6.0：今日 5 词 = 1 主推（当日动画词）+ 4 个相关词（主推词的 rel 优先，不够从热门补） */
function dailyFive(){
  var dw=dailyWord();
  var out=[dw],seen={};seen[dw.id]=1;
  (dw.rel||[]).forEach(function(id){
    if(out.length>=5)return;
    var w=byId(id);if(w&&!seen[id]){out.push(w);seen[id]=1}
  });
  ['llm','token','context','prompt','hallu','agent','rag','api','mcp','skill'].forEach(function(id){
    if(out.length>=5)return;
    var w=byId(id);if(w&&!seen[id]){out.push(w);seen[id]=1}
  });
  return out;
}

function dailyWord(){
  var d=new Date(),n=Math.floor(d.getTime()/86400000);
  var core=WORDS.filter(function(w){return w.demo});
  return core.length?core[n%core.length]:WORDS[0];
}

function viewHome(){
  /* v6.0：首页 = 纯目录，一张具体词都不铺
     ① 每日一词仍是 1 张大卡，点进去才看今天的 5 个词（1 主推 + 4 相关）
     ② 入口卡 2×3：第一行「最该先搞懂」「最近新增」，下面四大分区
     ③ 最近新增点进去 = 全部新词（倒序） */
  var dw=dailyWord();
  var nNew=WORDS.filter(function(w){return w.new}).length;
  var h='<div class="view v-home">';
  h+='<div class="daily" data-go="list" data-sp="daily" style="cursor:pointer">'
   +'<div class="lbl">📅 每日 5 词</div>'
   +'<div class="w">'+dw.term+' <em>'+strip(dw.cn)+'</em></div>'
   +'<div class="d">'+strip(dw.tl)+'</div>'
   +'<div class="go">看今天 5 个词 →</div></div>';
  h+='<div class="zones">';
  h+='<div class="zone" data-go="list" data-sp="hot"><div class="e">🔥</div>'
   +'<div class="n">最该先搞懂</div><div class="c">10 个词</div></div>';
  h+='<div class="zone" data-go="list" data-sp="new"><div class="e">🆕</div>'
   +'<div class="n">最近新增</div><div class="c">新词共 '+nNew+' 个</div></div>';
  ['ai','code','misc','abbr'].forEach(function(z){
    var c=WORDS.filter(function(w){return w.zone===z||(z==='abbr'&&w.abbr)}).length;
    h+='<div class="zone" data-go="list" data-z="'+z+'"><div class="e">'+ZONES[z].e+'</div>'
     +'<div class="n">'+ZONES[z].n+'</div><div class="c">'+c+' 个词</div></div>';
  });
  h+='</div>';
  /* v7.1：首页底部大扫除——tip 删除、说明全部搬进「关于」页（点左上角标题进入） */
  h+=footer();
  return h+'</div>';
}
/* v7.3：关于页二级结构（条目列表 + 点进各自说明页） */
var ABOUT_META = {
  ver : {icon:'📋', t:'版本与更新',  s:'v8.6 · 词库 507 · 每周一补新词'},
  priv: {icon:'🔒', t:'数据与隐私',  s:'所有记录只存你手机本地'},
  theme:{icon:'🎨', t:'外观设置',    s:'跟随系统 / 浅色 / 深色'},
  pwa : {icon:'📌', t:'添加到主屏幕', s:'手机和电脑的安装方法'}
};
var ABOUT_BODY = {
  ver : function(){
    return '<div class="abwrap">'
      +'<div class="abcard">'
      +'<div class="abkv"><span class="k">当前版本</span><span class="v">v8.6</span></div>'
      +'<div class="abkv"><span class="k">词库规模</span><span class="v">391 个词</span></div>'
      +'<div class="abkv"><span class="k">词库更新</span><span class="v">2026-09-26</span></div>'
      +'<div class="abkv"><span class="k">手写精讲题</span><span class="v">178 道</span></div>'
      +'<div class="abkv"><span class="k">补新词节奏</span><span class="v">每周一早上 9 点</span></div>'
      +'</div>'
      +'</div>';
  },
  priv: function(){
    return '<div class="abwrap">'
      +'<div class="abcard"><h4>存了什么、存在哪</h4>'
      +'<p>收藏 ⭐、答题记录、错题池、外观偏好——<b>全部只存在你手机本地</b>'
      +'（浏览器 localStorage），<b>不上传任何服务器</b>，也没有账号系统、不需要登录。</p>'
      +'</div>'

/* ---------- 动画驱动 ---------- */
function tokenize(s){
  var out=[],re=/[\u4e00-\u9fa5]|[A-Za-z]+|\d+|[^\sA-Za-z0-9\u4e00-\u9fa5]/g,m;
  while((m=re.exec(s))!==null){var t=m[0];
    if(/[A-Za-z]{5,}/.test(t)){var i=0;while(i<t.length){out.push(t.slice(i,i+4));i+=4}}
    else out.push(t);}
  return out;
}
function startDemo(wordId){
  /* v5.1 修复：桌面分栏下页面停在首页/列表，curArg 不是词 id，
     必须由调用方显式传入词 id，否则动画全都不启动 */
  var w=byId(wordId);if(!w||!w.demo)return;
  var k=w.demo;
  if(k==='llm')runLLM();
  if(k==='token')runToken();
  if(k==='ctx')runCtx();
  if(k==='temp')runTemp();
  if(k==='agent'||k==='rag')runSteps(k==='agent'?'#agSteps':'#ragSteps');
  if(k==='moe')runMoe();
}
function runSteps(sel){
  var steps=document.querySelectorAll(sel+' .step');if(!steps.length)return;
  var n=steps.length,i=0;
  (function loop(){
    for(var j=0;j<steps.length;j++)steps[j].classList.remove('on');
    if(i<n){steps[i].classList.add('on');i++}
    else{i=0;push(loop,1400);return}
    push(loop,1600);
  })();
}
function runLLM(){
  var out=document.getElementById('out'),hint=document.getElementById('llmHint');
  if(!out)return;
  var seq=['真','好','啊'],tips=['「真」——概率最高','「好」——接在真后面最顺','「啊」——可以收尾了'];
  push(function(){hint.innerHTML='它先看到「<b>今天天气</b>」，然后开始猜下一个字…'},500);
  seq.forEach(function(c,n){
    push(function(){out.textContent+=c;
      hint.innerHTML='吐出第 '+(n+1)+' 个字：<b style="color:var(--accent)">'+c+'</b>　'+tips[n];},1400+n*1000);
  });
  push(function(){hint.innerHTML='✅ 看出来了吗？<b>它不是一个字一个字想好了再写，是每次只猜下一个最可能的字，串起来就成了句子。</b>'},1400+seq.length*1000+300);
}
function runToken(){
  var stage=document.getElementById('tokStage'),hint=document.getElementById('tokHint'),
      inp=document.getElementById('tokIn'),cnt=document.getElementById('tokCount');
  if(!stage)return;
  var demo='我爱吃苹果',toks=tokenize(demo);
  var hints=['先拿到你说的话…','AI 不认识整句，先把它拆成积木块','中文基本一个字一块','每块就是一个 Token','拆完才能算钱、算长度'];
  stage.innerHTML=toks.map(function(t){return '<span class="tok">'+esc(t)+'</span>'}).join('');
  var spans=stage.querySelectorAll('.tok');
  toks.forEach(function(t,i){
    push(function(){if(spans[i])spans[i].classList.add('on');
      hint.innerHTML='<b>'+(i+1)+'</b> / '+toks.length+' 块 — '+hints[Math.min(i,hints.length-1)];},400+i*430);
  });
  push(function(){
    hint.innerHTML='✅ 拆完了：<b>'+toks.length+' 个 Token</b>。中文一般一个字一块，记「字数 ≈ Token 数」基本够用。'
     +'<br><span style="color:var(--faint)">（真实分词器会把「苹果」这类常见词合并，实际会略少，但数量级一样。）</span>';},
    400+toks.length*430+300);
  if(inp)inp.addEventListener('input',function(){
    var v=inp.value.trim();
    if(!v){stage.innerHTML=toks.map(function(t){return '<span class="tok on">'+esc(t)+'</span>'}).join('');cnt.textContent='';return}
    var tk=tokenize(v),show=tk.slice(0,60),col=['#3566f0','#7b4ff0','#1f9d55','#f2622e','#f6a623'];
    stage.innerHTML=show.map(function(t,i){
      return '<span class="tok on" style="border-color:'+col[i%5]+';color:'+col[i%5]+'">'+esc(t)+'</span>'}).join('')
      +(tk.length>60?'<span class="tok on">…还有 '+(tk.length-60)+' 块</span>':'');
    cnt.textContent='你这句 = '+tk.length+' 个 Token';
  });
}
function runCtx(){
  var win=document.getElementById('ctxWin'),hint=document.getElementById('ctxHint');
  if(!win)return;
  var msgs=['第 1 轮：帮我写个公众号标题','第 2 轮：再短一点','第 3 轮：换成健身主题的',
            '第 4 轮：加个 emoji','第 5 轮：再改改','第 6 轮：还是第一个好',
            '第 7 轮：再加个数字','第 8 轮：好了就用第一个'];
  var caps=4,i=0,nodes=[];
  msgs.forEach(function(m,n){
    var d=document.createElement('div');d.className='msg';d.textContent=m;win.appendChild(d);nodes.push(d);
  });
  (function loop(){
    if(i<msgs.length){
      if(i>=caps){nodes[i-caps].classList.add('out');hint.innerHTML='⚠️ 桌子坐不下了！<b>第 '+(i-caps+1)+' 轮被挤了出去</b>，它从此<b>真的忘了</b>那句话。';}
      else{hint.innerHTML='会议室还能坐：已用 <b>'+(i+1)+' / '+caps+'</b>，都还记得。';}
      nodes[i].classList.add('on');i++;push(loop,1500);
    }else{
      push(function(){
        nodes.forEach(function(nd){nd.classList.remove('on');nd.classList.remove('out')});
        i=0;loop();},2600);
    }
  })();
}

   [1,0.3,'夏天很热，注意防暑。','夏季气温升高，需注意防晒与补水。','夏天是一年中最热的季节，建议做好防暑降温。'],

  var i=0;
  (function loop(){
    ex.forEach(function(e){e.classList.remove('on')});
    var q=qs[i%qs.length];
    q[1].forEach(function(k){ex[k].classList.add('on')});
    hint.innerHTML='问题：'+q[0]+'　→　只叫醒 <b>'+q[1].length+' 个</b>相关专家，其余 4 个继续睡觉 💤';
    i++;push(loop,2200);
  })();
}

/* ---------- 测验 / 收藏 ---------- */
/* ── v6.3：考考我改版 ──
   ① 题库自动生成：没手写题的词用「一句话」自动出两种题（释义选词 / 词选释义），
      干扰项取同分区的词；题库 20 → 140，新词自动带题
   ② 每轮随机洗牌组卷 10 题：错题池优先（≤4）→ 全库混合补足
   ③ 答错进错题池（存本地），答对自动出池；一轮结束给小结
   ④ 30 天答题记录（按天分组可查） */
var QPAPER=null,QLOG=[],SCORE=0;
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function autoQuiz(w){
  var same=WORDS.filter(function(x){return x.id!==w.id&&x.zone===w.zone});
  var src=shuffle(same.length>=3?same:WORDS.filter(function(x){return x.id!==w.id})).slice(0,3);
  var def=strip(w.one);
  var useDef=Math.random()<0.5,q,opts;
  if(useDef){
    q='「'+def+'」说的是哪个词？';
    opts=shuffle([{t:w.term,id:w.id,ok:1},{t:strip(src[0].term),id:src[0].id},{t:strip(src[1].term),id:src[1].id},{t:strip(src[2].term),id:src[2].id}]);
  }else{
    q='「'+w.term+'」是什么意思？';
    opts=shuffle([{t:def,id:w.id,ok:1},{t:strip(src[0].one),id:src[0].id},{t:strip(src[1].one),id:src[1].id},{t:strip(src[2].one),id:src[2].id}]);
  }
  var a=0;for(var i=0;i<opts.length;i++){if(opts[i].ok)a=i}
  return {w:w,q:q,o:[opts[0].t,opts[1].t,opts[2].t,opts[3].t],
    ids:[opts[0].id,opts[1].id,opts[2].id,opts[3].id],
    a:a,why:w.term+'（'+strip(w.cn)+'）：'+def,auto:true};
}
function buildPaper(){
  /* 全库混合洗牌：手写精讲题与自动题自然混排，错题池置顶 */
  var pool=shuffle(WORDS.slice());
  var wrong=shuffle(Object.keys(STORE.wrong||{}).filter(function(id){return byId(id)}));
  var used={},paper=[];
  function take(w){
    if(used[w.id]||paper.length>=10)return;
    used[w.id]=1;
    paper.push(w.quiz?{w:w,q:w.quiz.q,o:w.quiz.o,a:w.quiz.a,why:w.quiz.why,auto:false}:autoQuiz(w));
  }
  wrong.slice(0,4).forEach(function(id){take(byId(id))});
  pool.forEach(function(w){take(w)});
  QPAPER=paper.slice(0,10);QLOG=[];SCORE=0;QI=0;PICKED=null;
}
function viewQuiz(){
  if(!QPAPER||!QPAPER.length)buildPaper();
  var h='<div class="view v-quiz"><div class="topbar"><div class="back" data-back="1">‹ 返回</div><div class="t">考考我</div></div>';
  if(QI>=QPAPER.length){
    var ok=QLOG.filter(function(x){return x.ok}).length;
    var wl=QLOG.filter(function(x){return !x.ok}).map(function(x){return byId(x.id)}).filter(Boolean);
    var L=(STORE.qlog||[]);
    var okN=L.filter(function(x){return x.ok}).length;
    var pct=L.length?Math.round(okN*100/L.length):0;
    h+='<div class="qbox"><div class="qnum">本轮小结</div>'
     +'<div class="qtxt">答对 <b style="font-size:22px">'+ok+'</b> / '+QLOG.length+'</div>'
     +'<div class="expl">近 30 天累计答题 <b>'+L.length+'</b> 道 · 正确率 <b>'+pct+'%</b></div>';
    if(wl.length){
      h+='<div class="expl">错过的这几个已进错题池，下一轮优先重考：</div>';
      wl.forEach(function(w){h+=rowHTML(w,false)});
    }else h+='<div class="expl">✅ 全对！下一轮全是新题</div>';
    h+='<button class="btn" data-rebuild="1">再来一轮（重新组卷）</button></div>';
    h+='<button class="btn ghost" data-go="qlog">📋 30 天答题记录</button>';
    h+='<p class="tip">💡 📝 精讲题优先出 · 答错的词进错题池下轮重考</p>'+footer()+'</div>';
    return h;
  }
  var q=QPAPER[QI];
  var last=(QI===QPAPER.length-1);
  h+='<div class="qbox"><div class="qnum">第 '+(QI+1)+' / '+QPAPER.length+' 题 · 题库 '+WORDS.length+' 词'
   +(q.auto?'':' · 📝 精讲题')+'</div><div class="qtxt">'+q.q+'</div>';
  q.o.forEach(function(o,i){
    var cls='';
    if(PICKED!==null){if(i===q.a)cls=' right';else if(i===PICKED)cls=' wrong'}
    h+='<div class="opt '+cls+'" data-pick="'+i+'">'+String.fromCharCode(65+i)+'. '+esc(o)+'</div>';
  });
  if(PICKED!==null){
    var okAns=(PICKED===q.a);
    h+='<div class="expl">'+(okAns?'✅ 答对了！':'❌ 正确答案：'+String.fromCharCode(65+q.a)+'。')+' '+q.why+'</div>';
    if(!okAns&&q.ids&&q.ids[PICKED]&&q.ids[PICKED]!==q.w.id){
      var pickedW=byId(q.ids[PICKED]);
      if(pickedW)h+='<div class="expl">你选的 '+String.fromCharCode(65+PICKED)+' 其实是「<b>'+pickedW.term+'</b>」（'+strip(pickedW.cn)+'）：'+strip(pickedW.one)
       +'　<button class="morelink" data-go="detail" data-id="'+pickedW.id+'">看它的详解 →</button></div>';
    }
    if(!okAns){
      var favCls=STORE.fav[q.w.id]?' on':'';
      h+='<div class="expl">容易混？<span class="star '+favCls+'" data-star="'+q.w.id+'" style="font-size:19px;cursor:pointer">★</span> 收藏「'+q.w.term+'」，在收藏页重点看</div>';
    }
    h+='<button class="btn" data-next="1">'+(last?'看本轮成绩 →':'下一题 →')+'</button>';
  }else h+='<button class="btn" disabled>选一个答案</button>';
  h+='<button class="btn ghost" data-go="detail" data-id="'+q.w.id+'">看看这个词的详解</button>';
  h+='</div><p class="tip">💡 答错的词会进错题池，下一轮优先重考　·　<button class="morelink" data-go="qlog">📋 答题记录</button></p>'+footer()+'</div>';
  return h;
}
/* v6.3：30 天答题记录页（按天分组，可点词进详解） */
function viewQLog(){
  var h='<div class="view v-list"><div class="topbar"><div class="back" data-back="1">‹ 返回</div><div class="t">📋 答题记录（近 30 天）</div></div>';
  var log=(STORE.qlog||[]).slice().reverse();
  if(!log.length){
    h+='<div class="empty"><span class="e">📋</span>还没有答题记录<br>去「考考我」答几题就有啦</div>';
  }else{
    var days={},order=[];
    log.forEach(function(x){
      var d=new Date(x.t),k=d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
      if(!days[k]){days[k]={ok:0,n:0,items:[]};order.push(k)}
      days[k].n++;if(x.ok)days[k].ok++;
      days[k].items.push(x);
    });
    order.forEach(function(k){
      var d=days[k];
      h+='<div class="secttl"><span>📅 '+k+'</span><span class="more">答 '+d.n+' 题 · 对 '+d.ok+'</span></div>';
      d.items.forEach(function(x){
        var w=byId(x.id);if(!w)return;
        h+='<div class="row" data-go="detail" data-id="'+w.id+'"><div class="rt">'
          +'<div class="rn">'+w.term+' '+(x.ok?'✅':'❌')+'</div>'
          +'<div class="rd">'+strip(w.cn)+' — '+strip(w.one||w.tl)+'</div></div>'
          +'<div class="star"></div></div>';
      });
    });
  }
  return h+footer()+'</div>';
}
function pruneLog(){
  var cut=Date.now()-30*86400000;
  if(STORE.qlog&&STORE.qlog.length)STORE.qlog=STORE.qlog.filter(function(x){return x.t>=cut});
}
function viewFav(){
  var list=WORDS.filter(function(w){return STORE.fav[w.id]});
  var h='<div class="view v-fav"><div class="topbar"><div class="back" data-back="1">‹ 返回</div><div class="t">我的收藏</div></div>';
  if(!list.length)h+='<div class="empty"><span class="e">⭐</span>还没有收藏<br><br>在任意词条右上角点个星<br>它就会出现在这里</div>';
  else{list.forEach(function(w){h+=rowHTML(w,false)});
    h+='<button class="btn" data-go="quiz">🎯 用收藏的词考考我</button>';}
  return h+footer()+'</div>';
}

/* ---------- 事件 ---------- */
document.getElementById('screen').addEventListener('click',function(e){
  var n;
  if((n=e.target.closest('[data-star]'))){
    var id=n.getAttribute('data-star');STORE.fav[id]=!STORE.fav[id];save();
    n.classList.toggle('on',!!STORE.fav[id]);return;
  }
  if((n=e.target.closest('[data-miss]'))){
    addMiss(n.getAttribute('data-miss'));render();return;
  }
  if((n=e.target.closest('[data-back]'))){clearTimers();back();return}
  if((n=e.target.closest('[data-zoom]'))){openZoom(n.getAttribute('data-zoom'));return}
  if((n=e.target.closest('[data-pick]'))){
    if(PICKED===null){
      PICKED=parseInt(n.getAttribute('data-pick'),10);
      var qz=QPAPER&&QPAPER[QI];
      if(qz){
        var okAns=(PICKED===qz.a);
        QLOG.push({id:qz.w.id,ok:okAns});
        STORE.qlog=STORE.qlog||[];
        STORE.qlog.push({t:Date.now(),id:qz.w.id,ok:okAns});
        pruneLog();save();
        if(okAns){SCORE++}
        else{STORE.wrong=STORE.wrong||{};STORE.wrong[qz.w.id]=1;save()}
      }
    }
    render();return;
  }
  if((n=e.target.closest('[data-rebuild]'))){buildPaper();render();return}
  if((n=e.target.closest('[data-next]'))){QI++;PICKED=null;render();return}
  if((n=e.target.closest('[data-lvf]'))){
    if(cur==='list'&&curArg){curArg.lv=n.getAttribute('data-lvf')||'';render()}
    return;
  }
  if((n=e.target.closest('[data-tset]'))){
    STORE.theme=n.getAttribute('data-tset');save();applyTheme();render();return;
  }
  if((n=e.target.closest('[data-go]'))){
    var v=n.getAttribute('data-go');
    if(v==='detail'){
      /* v5.0 桌面分栏：当前在首页/列表/收藏时点词 → 只刷新右栏 */
      if(isDesk()&&(cur==='home'||cur==='list'||cur==='fav'))deskShow(n.getAttribute('data-id'));
      else go('detail',n.getAttribute('data-id'));
    }
    else if(v==='list')go('list',{z:n.getAttribute('data-z')||'',sp:n.getAttribute('data-sp')||'',q:''});
    else if(v==='fav')go('fav');
    else if(v==='quiz'){PICKED=null;go('quiz')}
    else if(v==='qlog')go('qlog');
    else if(v==='about')go('about');
    else if(v==='aboutsub')go('aboutsub',{sub:n.getAttribute('data-sub')||'ver'});
  }
});
document.getElementById('q').addEventListener('input',function(){
  var v=this.value.trim();
  if(v){
    if(cur!=='list'){stack.push({v:cur,a:curArg});cur='list';curArg={z:'ai',q:v};render();return}
    curArg={z:curArg.z,q:v};
    var box=document.getElementById('listBox');
    if(box)box.innerHTML=listHTML(curArg,false);
    var t=document.querySelector('#screen .topbar .t');if(t)t.textContent='搜索“'+esc(v)+'”';
  }else if(cur==='list'){back();}
});
document.getElementById('tabbar').addEventListener('click',function(e){
  var n=e.target.closest('[data-tab]');if(!n)return;
  var k=n.getAttribute('data-tab');
  stack=[];
  if(k==='quiz'){QI=0;PICKED=null;go('quiz')}
  else if(k==='fav')go('fav');
  else if(k==='about')go('about');
  else{cur='home';curArg=null;render()}
});
document.getElementById('cnt').innerHTML=WORDS.length+' 词<br><span style="font-size:10px">每周一更新</span>';
render();


/* ── v3.0 PWA：Service Worker 注册 + 更新提示 ── */
if('serviceWorker' in navigator){
  var _updBg=function(){
    fetch('./index.html',{cache:'reload'}).then(function(r){return r.text()}).then(function(t){
      caches.match('./index.html').then(function(old){
        if(!old)return;
        old.text().then(function(ot){
          if(ot!==t){
            caches.open('aigc-glossary-v8.6').then(function(c){c.put('./index.html',new Response(t))});
            var b=document.getElementById('updBar');if(b)b.style.display='block';
          }
        });
      });
    }).catch(function(){});
  };
  navigator.serviceWorker.register('./sw.js').then(function(reg){
    /* 已被 SW 接管的页面：SW 检测到新版会 postMessage 过来 */
    navigator.serviceWorker.addEventListener('message',function(e){
      if(e.data&&e.data.type==='UPDATED'){
        var b=document.getElementById('updBar');if(b)b.style.display='block';
      }
    });
    /* 首次进页面也主动对一次版本（覆盖 SW 未接管时的场景） */
    _updBg();
  }).catch(function(){});
}
var _updBar=document.getElementById('updBar');
if(_updBar)_updBar.addEventListener('click',function(){location.reload()});
