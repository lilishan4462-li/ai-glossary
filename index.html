{id:'modem',term:'光猫',full:'Modem',cn:'光猫',tl:'<b>光纤的「信号翻译官」</b>：把光纤里的光信号翻译成电信号给路由器，反向亦然。',ana:'像<b>港口的翻译官</b>：远洋货轮（光信号）说的是「光语」，市内货车（路由器）说的是「电语」——翻译官不在中间坐镇，两边对不上话。',zone:'misc',lv:2,one:'运营商装机送的「信号翻译官」',cf:'和路由器的分工：光猫管翻译，路由器管分发——有些光猫自带路由功能。',al:["光调制解调器", "光猫"],rel:['router','bandwidth','firmware'],scn:'家里断网先看光猫指示灯：闪红灯=光信号丢了（光纤断/没插紧），重启不行就报修；红灯之外的闪灯多半正常。',dlg:[{q:'闪红灯是什么意思？',a:'光信号丢失：光纤断了或没插紧——先重启，不行就报修。'},{q:'自己能换吗？',a:'运营商绑定设备，换/移机要报装，别自己拆。'}],new:true,quiz:{q:'闪红灯是什么意思？',o:["红灯表示有人盗用你的网络","光信号丢失：光纤断了或没插紧——先重启，不行就报修。","光猫过热自动进入保护模式","红灯说明宽带欠费被停了"],a:1,why:'光纤的「信号翻译官」。'}},
{id:'bandwidth',term:'带宽',full:'Bandwidth',cn:'带宽',tl:'<b>网速管道的「口径」</b>：带宽越粗，单位时间能过的数据越多——300M 宽带就是更粗的管子。',ana:'像<b>水管的粗细</b>：口径决定单位时间出水量；但拧开龙头水小，也可能是邻居家全在放水（高峰拥堵）或水厂限压（服务器限速）。',zone:'misc',lv:2,one:'网络管道的「粗细」',cf:'单位注意：运营商说的 100M 是 Mbps（兆比特），下载显示的是 MB/s（兆字节）——8 倍关系，100M 宽带下载峰值约 12.5MB/s。',al:["带宽", "网速"],rel:['throughput','cdn'],scn:'「办了千兆宽带为啥测速不到」：线路损耗、Wi-Fi 折损、对方服务器限速都在吃带宽——峰值是理论上限，不是保底。',dlg:[{q:'为什么实际达不到峰值？',a:'线路损耗、对方服务器限速、WiFi 损耗——峰值是理论上限。'},{q:'上行带宽是什么？',a:'上传方向的粗细——家用宽带上行通常只有下行的几分之一（传文件慢的主因）。'}],new:true,quiz:{q:'为什么实际达不到峰值？',o:["运营商偷偷限速克扣流量","带宽峰值纯属骗人的营销数字","测试软件不准确才测不出来","线路损耗、对方服务器限速、WiFi 损耗——峰值是理论上限。"],a:3,why:'网速管道的「口径」。'}},
{id:'packet',term:'数据包',full:'Packet',cn:'数据包',tl:'<b>网络传输的「集装箱」</b>：大数据切块封装、编号发货，到齐后按序拼装，丢件只补丢的那块。',ana:'像<b>搬家时的纸箱编号</b>：一车装不下就分箱标号（1/57、2/57……）——丢一个箱子补一箱，不用整批重来。',zone:'misc',lv:3,one:'网络传输的「集装箱」',cf:'和「带宽」的区别：带宽是管子多粗（一次能过多少），数据包是货物的打包方式（怎么切怎么运）——粗管子运碎箱子，才又快又稳。',al:["Packet", "网络数据包"],rel:['bandwidth','router'],scn:'视频卡顿、游戏延迟，背后常有「丢包」；测速工具里「丢包率 0%」就是健康信号。',dlg:[{q:'为什么切成包？',a:'一条大管道大家共享，切包让多个人「同时」传——丢一个包只需重传那一小包。'},{q:'丢包是什么？',a:'某些包在路上丢了——网速不稳、视频卡顿的主因。'}],new:true,quiz:{q:'为什么切成包？',o:["一条大管道大家共享，切包让多个人「同时」传——丢一个包只需重传那一小包。","网线一次只能传 1500 字节","数据包是收费单位，切小省钱","不切包防火墙会拦大文件"],a:0,why:'网络传输的「集装箱」。'}},
{id:'firewall2',term:'防火墙',full:'Firewall',cn:'防火墙',tl:'<b>网络的「门禁系统」</b>：按规则放行/拦截进出流量，没约的敲门、可疑的外联都被它挡。',ana:'像<b>小区门禁+监控</b>：快递员登记进（放行规则）、陌生人拦下（外部扫描）、有人半夜往外搬家电（程序异常外联）立刻报警。',zone:'misc',lv:2,one:'网络的「门卫」',cf:'和杀毒软件的区别：防火墙管「进出的门」（网络流量），杀毒管「屋里的东西」（文件里的病毒）——管的是不同环节，正经电脑两个都要。',al:["Firewall", "网络防火墙"],rel:['bot','twofa'],scn:'公司电脑常被 IT 的防火墙管着（有些网站进不去）；个人电脑的系统防火墙默认开着别关——它是第一道门。',dlg:[{q:'拦的是什么？',a:'外部未经邀请的连接尝试、程序异常外联——病毒常被它挡在门外或困在里面。'},{q:'和杀毒软件的区别？',a:'杀软查已经进来的毒，防火墙守门口不让进——互补，都要。'}],new:true,quiz:{q:'拦的是什么？',o:["拦截所有弹窗广告和垃圾短信","只拦截带毒的压缩文件","外部未经邀请的连接尝试、程序异常外联——病毒常被它挡在门外或困在里面。","拦截运营商的限速指令"],a:2,why:'网络的「门禁系统」。'}},

{id:'bot',term:'机器人流量',full:'Bot',cn:'机器人流量',tl:'<b>网上「非人类访客」</b>：自动化脚本模拟访问——爬内容的、抢票的、刷量的，都是它。',ana:'像<b>商场里的神秘客流</b>：有商场自己请的「气氛组」（搜索引擎爬虫，带客上门），也有黄牛雇的（秒杀脚本，专薅羊毛）——看着都「是人」，性质天差地别。',zone:'misc',lv:2,one:'不是真人的自动化访问',cf:'和病毒的区别：bot 是「自动化访问」本身（技术中性），病毒是「恶意代码」——同一段 bot 代码，抓公开数据是服务，抢单/刷量就是作恶。',al:["Bot", "机器人程序"],rel:['scraper','aioverview','firewall2'],scn:'你用第三方数据服务抓公众号阅读量，是「好 bot」的合规形态；反过来你的文章被批量搬运，坏 bot 就在薅你。',dlg:[{q:'为什么好坏并存？',a:'技术中性——同一段脚本，用于索引是服务，用于秒杀是薅羊毛。'},{q:'怎么区分真人和 Bot？',a:'验证码（人一眼认识，机器难识别）、行为分析（真人会乱动鼠标）。'}],new:true,quiz:{q:'为什么好坏并存？',o:["好机器人免费，坏机器人收费","白天是好的，晚上是坏的","机器人超过 1000 个就会变坏","技术中性——同一段脚本，用于索引是服务，用于秒杀是薅羊毛。"],a:3,why:'网上「非人类访客」。'}},
{id:'scraper',term:'网页抓取工具',full:'Scraper',cn:'网页抓取工具',tl:'<b>网页数据的「批量搬运工」</b>：自动把网页内容按结构抓下来存成表格/数据库，人不用一页页抄。',ana:'像<b>雇了个抄书先生</b>：一本本抄（手动复制粘贴）他一晚上抄完全馆——但抄什么、抄了干嘛用，规矩得先讲清楚。',zone:'misc',lv:2,one:'自动「抄网页」的工具',cf:'和爬虫的关系：爬虫是统称，scraper 常指针对特定页面的提取工具。',al:["Scraper", "数据采集"],rel:['bot','api','userscript'],scn:'公众号数据服务、电商比价工具，本质都是合规化后的「抓取」；抓公开数据自用一般没事，绕登录、高频猛抓、拿去商用就要掂量。',dlg:[{q:'合法吗？',a:'看抓什么和怎么用：公开数据自用一般没问题；绕过登录/大量请求/商用需谨慎。'},{q:'不用代码能抓吗？',a:'浏览器插件可视化抓取已很成熟，圈选字段就能导出表格。'}],new:true,quiz:{q:'合法吗？',o:["看抓什么和怎么用：公开数据自用一般没问题；绕过登录/大量请求/商用需谨慎。","一律违法，抓了就得进去","完全合法，网上的东西随便抓","只要不赚钱就绝对不违法"],a:0,why:'网页数据的「批量搬运工」。'}},
{id:'daemon',term:'后台进程',full:'Daemon',cn:'后台进程',tl:'<b>幕后的「隐形工作者」</b>：不弹窗口、默默在后台跑的服务——同步、推送、监控全靠它们值守。',ana:'像<b>酒店深夜的后勤</b>：客人睡了（你关了窗口），锅炉房、监控室、冷库照常运转（后台进程）——看不见，但停了早上就是灾难。',zone:'misc',lv:3,one:'默默在后台运行的服务程序',cf:'名字来源：发音同 demon（精灵），取「幕后默默干活」之意，Mac 系统尤其常用这个词。',al:["Daemon", "后台服务"],rel:['terminal','automation'],scn:'手机「后台耗电」榜单上的常客就是它们；有些关不掉是故意的——系统/安全服务被设计成自动重启，防被恶意关闭。',dlg:[{q:'为什么有些关不掉？',a:'系统/安全软件的核心服务被设计为自动重启——防止被恶意关闭。'},{q:'怎么管理？',a:'任务管理器/系统配置里看，不确定的别禁——先搜名字再动手。'}],new:true,quiz:{q:'为什么有些关不掉？',o:["因为程序有 bug 卡死了","关掉会触发硬件过热保护","系统/安全软件的核心服务被设计为自动重启——防止被恶意关闭。","它们是系统隐藏的付费服务"],a:2,why:'幕后的「隐形工作者」。'}},







{id:'ci3',term:'CDN 回源',full:'回源拉取',cn:'CDN 回源',tl:'<b>CDN 的「补货机制」</b>：节点没有或缓存过期时，回头向源站要数据——回源越多，CDN 省的钱越少。',ana:'像<b>便利店的补货</b>：顾客要的货店里没有（未缓存），店员骑车去总仓调（回源）——十次顾客九次能就地取货，便利店才划算。',zone:'abbr',lv:3,one:'「便利店缺货去仓库调货」',cf:'和「缓存」的区别：缓存是「存起来就近用」这件事本身，回源是「存货没了去补」的动作——缓存命中率高，回源就少，反之亦然。',al:["CDN 回源", "回源"],rel:['cdn','cache','bandwidth'],scn:'你的 GitHub Pages 站点更新后「看到的还是旧内容」，就是 CDN 缓存没过期——等十分钟或加个随机参数强制绕缓存。',dlg:[{q:'什么时候发生回源？',a:'首次访问、缓存过期、缓存被清——回源多了 CDN 就白买了。'},{q:'怎么减少回源？',a:'延长缓存时间、预热（提前推内容到节点）、合理设置过期策略。'}],new:true,quiz:{q:'什么时候发生回源？',o:["首次访问、缓存过期、缓存被清——回源多了 CDN 就白买了。","用户每次刷新页面都会回源","只在凌晨低峰期定时回源","回源是运营商的强制行为"],a:0,why:'CDN 的「补货机制」。'}},
{id:'sdk2',term:'SDK 面板',full:'软件开发包',cn:'SDK 面板',tl:'<b>功能集成的「预制工具箱」</b>：厂商把支付/地图/推送打包成一套代码+工具，按文档拼进你的应用就能用。',ana:'像<b>宜家的整套装柜</b>：板材、螺丝、说明书配齐（SDK 文档+示例代码），照着装一天出货；自己开料打柜（从零实现）得一个月。',zone:'abbr',lv:1,one:'Software Development Kit',cf:'和 API 的区别：API 是「服务窗口」（你发请求它回数据），SDK 是「工具箱+说明书」（含调用 API 的代码）。',al:["SDK", "开发工具包"],rel:['api','plugin','deploy'],scn:'App 里「微信登录」「地图选点」都是接 SDK——自己写要几个月，集成几天；SDK 报错先看版本兼容，八成是版本对不上。',dlg:[{q:'为什么要用 SDK？',a:'支付、地图、推送这些功能自己写要几个月，SDK 集成几天。'},{q:'集成 SDK 注意什么？',a:'看权限要多少、体积多大、是否常更新——僵尸 SDK 是隐患。'}],new:true,quiz:{q:'为什么要用 SDK？',o:["SDK 能让 App 体积小一半","不用 SDK 应用无法上架商店","支付、地图、推送这些功能自己写要几个月，SDK 集成几天。","SDK 反正免费，不用白不用"],a:2,why:'功能集成的「预制工具箱」。'}},
{id:'ramageddon',term:'RAMageddon',full:'RAMageddon',cn:'内存末日 / 内存荒',zone:'misc',lv:2,
 tl:'<b>AI 公司把内存条抢光了，内存涨价，手机和游戏机跟着变贵</b>。2026 年科技圈的自嘲黑话。',
 ana:'像<b>演唱会一开票，全城酒店立刻翻倍</b>——不是酒店变好了，是被包圆了。',
 scn:'出处同样是 TechCrunch 的 AI 术语表。<b>跟你盯的存储、算力赛道是一回事：AI 抢货，整条产业链跟着涨。</b>',
 rel:['gpu','server'],al:['内存末日','内存荒','内存涨价','RAMageddon','ramageddon','内存短缺','存储涨价','内存危机'],one:'AI 抢光内存条，手机游戏机跟着涨价',cf:'不是真末日，是圈子自嘲的说法',dlg:['甲：手机怎么又贵了','乙：内存末日，货都被 AI 抢走了'],new:true}, {id:'pretrain',term:'预训练 / 后训练',full:'Pre-training / Post-training',cn:'预训练 / 后训练',zone:'ai',lv:1,new:true,tl:'<b>AI 的两段式培养：先海量自学打通识底子（预训练），再按岗位学规矩（后训练）</b>。发布时说的「训练 36T Token」就是第一段。',ana:'像<b>先读完图书馆再进岗前培训班</b>：预训练攒通识，后训练教会它怎么答话、什么不该说——两段目标完全不同。',one:'AI 两段式培养：先自学再培训',cf:'和「微调」的区别：微调是在成品上小改手艺；预训练/后训练是从零培养的全流程。',al:['Pre-training','基座训练','预训练模型'],rel:['training','compute','rlhf'],scn:'公众号聊「某模型预训练用了 36T tokens」「后训练对齐了价值观」说的就是这两段；买模型 API 时「基座版 vs 对话版」的差别也在这里。',dlg:[{q:'两段哪个更烧钱？',a:'预训练贵得惊人——几万块显卡跑几个月；后训练相对便宜。'},{q:'为什么分开说？',a:'目标不同：一个攒通识底子，一个学表达和规矩。'}],shot:'pretrain',quiz:{q:'模型「预训练」阶段在干什么？',o:["练习怎么讨好用户","联网查最新资料","海量读数据打通识底子，还没学怎么对话","背下题库准备考试"],a:2,why:'预训练=通识自学；怎么对话、守规矩是后训练的事。'}}, {id:'rl',term:'强化学习',full:'Reinforcement Learning',cn:'强化学习',zone:'ai',lv:2,new:true,tl:'<b>不教标准答案，靠奖惩试错自己练出来</b>：做对了给奖励、做错了扣分，AI 在反复尝试中摸索出本事。AlphaGo 和会办事的 Agent 都靠它。',ana:'像<b>训练小狗</b>：没人教「坐下」的语法，做对了给零食——次数多了，它自己就懂了。',one:'靠奖惩试错自己练出本事',cf:'和「监督学习」的区别：监督学习有标准答案照着学；强化学习没人给答案，自己试出路子。',al:['Reinforcement Learning','RL'],rel:['rlhf','reason','training'],scn:'公众号讲「强化学习让模型学会推理」「RLHF 人类反馈强化学习」都是这套；RLHF 就是它的分支——奖励改由人类打分。',dlg:[{q:'RLHF 里的 HF 是什么？',a:'Human Feedback——奖励改由人类打分，教模型说人话、守规矩。'},{q:'为什么 Agent 特别依赖它？',a:'办事没有唯一正确答案，只有「结果好不好」——正适合奖惩式学习。'}],shot:'rl',quiz:{q:'强化学习的「学习」方式是？',o:["靠背标准答案","靠复制别的模型","靠人工逐条教","靠奖惩反馈反复试错"],a:3,why:'奖励做对的、惩罚做错的，AI 在试错中自己摸索。'}}, {id:'diffusion',term:'扩散模型',full:'Diffusion Model',cn:'扩散模型',zone:'ai',lv:2,new:true,tl:'<b>AI 绘画的原理：从一团雪花噪点开始，一步步「去噪」，最后显出完整的图</b>。Midjourney、文生图背后都是它。',ana:'像<b>隔着起雾的玻璃看画</b>：一开始全是噪点，每擦一层清楚一点——擦几十层后，一幅完整的画就出来了。',one:'从噪点一步步去噪成图',cf:'和「GAN」的区别：GAN 两个网络对抗出图；扩散模型逐步去噪——现在主流文生图都是后者。',al:['Diffusion Model','去噪模型'],rel:['t2i','gan','compute'],scn:'用文生图时「出图先模糊后清晰」就是它在去噪；公众号聊「扩散模型取代 GAN」说的是绘画技术的两代路线。',dlg:[{q:'为什么出图先模糊后清晰？',a:'那就是去噪过程：噪点越擦越少，图越来越清楚。'},{q:'文生视频也用它？',a:'是——把「去噪」扩展到时间轴上，就是图生视频。'}],shot:'diffusion',quiz:{q:'扩散模型「生成图片」的过程是？',o:["给照片加滤镜","从纯噪点一步步去噪显出图","像打印机逐行扫描","从网上拼贴素材"],a:1,why:'先一团雪花噪点，模型一步步「擦」出清晰图像。'}}, {id:'gan',term:'生成对抗网络',full:'Generative Adversarial Network',cn:'生成对抗网络',zone:'ai',lv:3,new:true,tl:'<b>两个 AI 对打：一个造假、一个验货，互相对抗着变强</b>。扩散模型出现之前的图像生成主力。',ana:'像<b>假币贩子 vs 验钞警察</b>：互相过招，越练越强——造假的手艺是在对抗里逼出来的。',one:'造假与验货对抗着变强',cf:'和「扩散模型」的区别：GAN 对抗出图，扩散模型逐步去噪——后者已成主流。',al:['GAN','对抗网络'],rel:['diffusion','t2i','training'],scn:'公众号讲「GAN 时代」「对抗训练」会撞见；如今文生图主力已换成扩散模型，GAN 在风格迁移等场景仍活跃。',dlg:[{q:'GAN 还在用吗？',a:'图像生成让位了，但风格迁移、超分辨率等场景仍活跃。'},{q:'「对抗」好在哪？',a:'不用人工标注对错，两个网络互当老师。'}],quiz:{q:'GAN 的「对抗」指什么？',o:["造假网络和验货网络互相较劲","模型和用户吵架","两家公司打价格战","病毒攻防战"],a:0,why:'生成器造假、判别器验货，对抗中双双变强。'}}, {id:'alignment',term:'对齐',full:'Alignment',cn:'对齐',zone:'ai',lv:1,new:true,tl:'<b>让 AI 的行为对准人类意图的总工程</b>：不胡说、不使坏、按你想要的来。对齐做不好，模型越强越危险。',ana:'像<b>给千里马配缰绳</b>：马跑得越快，缰绳越关键——「能力」和「听指挥」必须同步升级。',one:'让 AI 行为对准人类意图',cf:'和「越狱」的关系：越狱是攻破对齐的漏洞——一个修墙，一个翻墙。',al:['Alignment','价值对齐'],rel:['jailbreak','guardrail','redteam'],scn:'公众号聊「对齐税」「对齐失败」「超级对齐」全在说它；越狱、红队测试、护栏，都是围绕「对齐有没有漏洞」展开的攻防。',dlg:[{q:'「对齐税」是什么？',a:'为守规矩牺牲的性能——模型太听话会显得笨，这个代价被戏称为税。'},{q:'对齐靠谁做？',a:'厂商为主：红队测试、护栏、人类反馈训练都是对齐手段。'}],shot:'alignment',quiz:{q:'AI 圈说的「对齐」是让什么对齐？',o:["发布时间和股价对齐","界面显示对齐","AI 行为对准人类意图和价值观","模型参数对齐小数点"],a:2,why:'让 AI 按人类期望行事——不胡说、不使坏、不越界。'}}, {id:'redteam',term:'红队测试',full:'Red Teaming',cn:'红队测试',zone:'ai',lv:3,new:true,tl:'<b>雇「自己人当黑客」攻击自家 AI</b>：专门想办法让它胡说、越界、泄密，找到漏洞赶在坏人前面修掉。',ana:'像<b>银行请人演练抢劫</b>：不知道漏洞在哪，就花钱请「攻击者」真刀真枪试一遍。',one:'自己人扮黑客找漏洞',cf:'和「越狱」的区别：越狱是攻击行为；红队测试是厂商组织的合法攻击演练。',al:['Red Teaming','红队'],rel:['alignment','jailbreak','guardrail'],scn:'大模型发布前的「安全测试」多数是它；公众号聊「 researchers 攻破某模型护栏」的演示，就是红队的手笔。',dlg:[{q:'红队都是谁？',a:'安全研究员+外部专家，甚至众包给普通用户一起找茬。'},{q:'找到漏洞怎么办？',a:'修护栏、补训练，下一版发布前再测一轮。'}],quiz:{q:'AI「红队测试」在测什么？',o:["测网速延迟","测电池续航","对比竞品跑分","想办法攻破自家 AI 找漏洞"],a:3,why:'赶在坏人之前找到越狱、泄密的口子，先修掉。'}}, {id:'watermark',term:'模型水印',full:'Watermarking',cn:'模型水印',zone:'ai',lv:3,new:true,tl:'<b>在 AI 生成的内容里埋隐形记号</b>：肉眼看不出，检测器一扫就知道「这是 AI 产的」，用来溯源和防冒充。',ana:'像<b>纸币的隐形水印</b>：平时看不见，验钞灯一照就现形。',one:'AI 内容里的隐形溯源记号',cf:'和「AI 味检测」的区别：水印是主动埋的记号，AI 味是从文风猜的——一个准一个猜。',al:['Watermarking','AI 水印'],rel:['deepfake','aiflav','guardrail'],scn:'公众号聊「AI 内容标识新规」「AI 生成必须打标」，落地手段之一就是水印；视频平台的 AI 生成标注也在铺开。',dlg:[{q:'水印能被去掉吗？',a:'能被对抗手段削弱，所以法规要求「标识+声明」双保险。'},{q:'文字也能埋水印？',a:'能，靠微调用词规律实现，只是比图片更容易被洗掉。'}],quiz:{q:'AI 内容「水印」是给谁看的？',o:["给黑客的挑战书","给检测器溯源用的隐形记号","给用户的打赏码","给模型的训练提示"],a:1,why:'肉眼看不见，专门用来验证「是不是 AI 产的」。'}}, {id:'deepfake',term:'深度伪造',full:'Deepfake',cn:'深度伪造',zone:'ai',lv:1,new:true,tl:'<b>AI 换脸+仿声造假</b>：做出以假乱真的视频和语音——视频里「你亲口说」的话可能一句都没说过。反诈高频词。',ana:'像<b>超级易容术</b>：古玩造假骗行家，深度伪造骗的是你的眼睛和耳朵。',one:'AI 换脸仿声以假乱真',cf:'和「语音克隆」的区别：voiceclone 是技术本身（也有正经用途）；deepfake 强调拿它造假害人。',al:['Deepfake','AI 换脸'],rel:['voiceclone','watermark','t2i'],scn:'公众号反诈文里的「AI 换脸诈骗」「假明星带货」全是它；语音克隆是它的技术近亲——克隆你的声音去骗你妈。',dlg:[{q:'「视频里是我」还能信吗？',a:'不能直接信——画面可伪造，关键事必须换个渠道核实。'},{q:'平台管吗？',a:'管：标识义务+检测下架，但防诈核心仍是你自己的核实习惯。'}],shot:'deepfake',quiz:{q:'防范深度伪造诈骗最有效的一招？',o:["约定只有彼此知道的暗语核实","看视频清不清楚","听口音对不对","多转发提醒家人"],a:0,why:'画面声音都能伪造，只有「圈外暗语」AI 编不出来。'}}, {id:'dataset',term:'数据集 / 语料',full:'Dataset / Corpus',cn:'数据集 / 语料',zone:'ai',lv:2,new:true,tl:'<b>AI 的「课本」</b>：训练时喂给它的大批数据——网页、书籍、图片、对话。课本的质量直接封死学生的上限。',ana:'像<b>学校的教材质量</b>：教材错漏百出，再好的老师也教不出好学生——「垃圾进，垃圾出」。',one:'AI 的课本：训练数据合集',cf:'和「语料」的区别：语料偏文本；数据集范围更广，含图片、音频、视频。',al:['Dataset','Corpus','语料库'],rel:['syndata','datalabel','training'],scn:'公众号聊「训练数据快用完了」「版权数据之争」说的是数据集的供给危机；合成数据（用 AI 编课本）是行业的新解法。',dlg:[{q:'数据集会不够用吗？',a:'公开优质文本快见底了——「数据墙」是行业真焦虑，合成数据因此走红。'},{q:'版权怎么算？',a:'争议中：训练用了你的文章算不算侵权，多起诉讼还没定论。'}],quiz:{q:'「垃圾进垃圾出」在 AI 训练里指什么？',o:["显卡散热不好","标注员工资低","训练数据差，模型必然差","服务器垃圾文件多"],a:2,why:'数据集是课本——课本质量封死模型上限。'}}, {id:'datalabel',term:'数据标注',full:'Data Labeling',cn:'数据标注',zone:'ai',lv:2,new:true,tl:'<b>给数据「贴答案」的工作</b>：标出图里哪是猫、文本里哪是重点——AI 的陪练，没有标注就没有会做题的模型。',ana:'像<b>给题库录标准答案</b>：学生（模型）刷题之前，得有人先把每道题的答案标好。',one:'给数据贴答案的 AI 陪练',cf:'和「合成数据」的区别：标注是人工给真实数据贴答案；合成数据是 AI 直接生成新题——后者正在抢前者的活。',al:['Data Labeling','标注员'],rel:['dataset','rlhf','training'],scn:'公众号聊「AI 背后的数据工人」「标注厂开在县城」就是它；RLHF 里的人类打分，也是一种高级标注。',dlg:[{q:'标注会被 AI 取代吗？',a:'简单标注正被模型预标注替代，但高难度判断（医学影像等）仍离不开人。'},{q:'门槛高吗？',a:'入门低，但好标注需要领域知识——医疗标注得懂医。'}],shot:'datalabel',quiz:{q:'数据标注员的工作是？',o:["给 AI 写代码","修服务器","设计模型结构","给数据贴上正确答案供模型学习"],a:3,why:'模型刷的每道「题」，都得先有人标好「标准答案」。'}}, {id:'syndata',term:'合成数据',full:'Synthetic Data',cn:'合成数据',zone:'ai',lv:2,new:true,tl:'<b>用 AI 生成数据来训练 AI</b>：真课本快用完了，就「编」新课本——便宜、量大、无版权纠纷，但要防「近亲繁殖」退化。',ana:'像<b>老师自己编练习册</b>：市面上真题刷完了，编题给学生接着练——编得好提质，编得固化就只会做一类题。',one:'用 AI 编的数据再喂 AI',cf:'和「数据增强」的区别：数据增强是把真数据变形扩充；合成数据是 AI 从零生成新数据。',al:['Synthetic Data','编数据'],rel:['dataset','distill','training'],scn:'公众号聊「真数据耗尽」「模型教模型」是它；你之前问过「编数据」能不能信——这个词就是答案：是解法也是风险。',dlg:[{q:'合成数据靠谱吗？',a:'数学、代码类很靠谱（对错好验证），风险在开放文本（好坏难辨）。'},{q:'怎么防近亲繁殖？',a:'掺真数据校准、多模型交叉生成、验证环节把关。'}],shot:'syndata',quiz:{q:'合成数据的最大风险是？',o:["版权费高","AI 生成数据喂 AI，错处被放大近亲繁殖","价格太贵","要人工标一个月"],a:1,why:'模型学模型，错误和偏见会滚雪球——需要真数据「校准」。'}}, {id:'flywheel',term:'数据飞轮',full:'Data Flywheel',cn:'数据飞轮',zone:'ai',lv:2,new:true,tl:'<b>用户越用、数据越多、产品越聪明、用户更多的循环</b>——AI 产品的增长发动机，也是头部效应的根源。',ana:'像<b>滚雪球</b>：雪球越大粘的雪越多——先发者拿用户数据练模型，后来者连入场雪坡都没有。',one:'用户越多产品越强的循环',cf:'和「网络效应」的区别：网络效应是用户之间互相增值（微信）；数据飞轮是使用行为喂养模型。',al:['Data Flywheel','增长飞轮'],rel:['syndata','dataset','evals'],scn:'公众号聊「大厂数据飞轮」「护城河」说的就是它；你做 IP 的「粉丝越多、数据越多、内容越准」也是同构。',dlg:[{q:'飞轮靠什么转起来？',a:'用户使用产生数据、数据反哺产品变强——循环一旦转起就很难被追上。'},{q:'小团队能转吗？',a:'难在先发优势——所以小团队多选垂直细分场景起手。'}],shot:'flywheel',quiz:{q:'数据飞轮的「飞」靠什么转起来？',o:["用户使用产生数据，数据反哺产品变强","烧钱补贴拉新","服务器越买越多","名字里有个轮字"],a:0,why:'使用→数据→变强→更多用户，循环一旦转起来很难被追上。'}}, {id:'spatial',term:'空间智能',full:'Spatial Intelligence',cn:'空间智能',zone:'ai',lv:2,new:true,tl:'<b>让 AI 理解三维空间：哪是桌子哪是门、东西放哪、怎么绕过去</b>——机器人走进真实世界的前提。',ana:'像<b>给 AI 装「空间感」</b>：看照片的人知道杯子在桌上，以前的 AI 只认识「杯子」，不知道「在桌上」。',one:'让 AI 理解三维空间关系',cf:'和「世界模型」的区别：世界模型预测「世界会怎么变」，空间智能理解「东西在哪」。',al:['Spatial Intelligence','空间理解'],rel:['world','fullmodal','embodied'],scn:'公众号聊「机器人进厨房」「AI 理解物理世界」背后就是它——具身智能的核心拼图之一。',dlg:[{q:'和具身智能什么关系？',a:'有身体行动前得先「看懂空间」——空间智能是它的眼睛。'},{q:'现在做到什么程度？',a:'能从单张图重建三维场景，但精细操作仍差得远。'}],shot:'spatial',quiz:{q:'「空间智能」要让 AI 懂什么？',o:["网页排版布局","外太空知识","物体的三维位置和空间关系","股票走势空间"],a:2,why:'从「认出杯子」到「知道杯子在桌上、怎么拿」——机器人进现实的前提。'}}, {id:'sys1sys2',term:'快思考与慢思考',full:'System 1 / System 2',cn:'快思考与慢思考',zone:'ai',lv:2,new:true,tl:'<b>借人类的思维分型：系统 1 直觉秒答，系统 2 慢思考推理</b>——推理模型就是给 AI 装上了「慢思考」。',ana:'像<b>「三七乘二十几」张口就报 vs 列竖式慢慢算</b>：直觉快但易错，慢想费劲但靠谱——AI 有这两副脑子。',one:'直觉秒答与慢想推理两副脑子',cf:'和「思维链」的区别：思维链是让 AI 写出推理步骤；快慢思考是它的理论框架——深度思考功能就是框架的产品化。',al:['System 1 / System 2','双系统'],rel:['reason','extended','testtime'],scn:'公众号讲「推理模型为什么慢还贵」背后是它；你在 Claude Code 里看到「深度思考中」的转圈，就是系统 2 在转。',dlg:[{q:'什么时候用慢思考？',a:'数学、代码、复杂决策这类高难任务；问天气就别浪费这笔算力。'},{q:'慢思考一定更准吗？',a:'大概率更准但非绝对——也可能把简单题想复杂，选对模式很重要。'}],shot:'sys1sys2',quiz:{q:'推理模型的「慢思考」指什么？',o:["服务器反应慢","用户打字慢","网络延迟高","回答前先在内部多步推理，费时但更准"],a:3,why:'普通模型直觉秒答；推理模型先想再答——慢和贵换准确。'}}, {id:'extended',term:'扩展思考',full:'Extended Thinking',cn:'扩展思考',zone:'ai',lv:3,new:true,tl:'<b>模型回答前先「关起门想一段」的功能</b>：思考可长可短，想完再交答案。2026 年各家旗舰的标配能力。',ana:'像<b>考试先打草稿</b>：草稿纸你不看，但答案质量因它而变——有的题值得多打草稿，有的题一眼出答案。',one:'回答前先打草稿深想一会',cf:'和「深度研究」的区别：扩展思考是答题前内部推理（秒到分级）；深度研究是外出查几十份资料写报告（分钟级）。',al:['Extended Thinking','深度思考'],rel:['reason','sys1sys2','testtime'],scn:'你在 Codex/Claude Code 里看到「正在深度思考」就是它；按思考量计费也成了新的成本变量。',dlg:[{q:'思考越多答案越好？',a:'总体是但有边际递减——所以出现了「思考预算」可调的设计。'},{q:'怎么控制？',a:'按任务难度选档位，或直接设定最大思考量。'}],quiz:{q:'「扩展思考」的思考过程用户能看到吗？',o:["必须全部公开","一般只看到摘要或看不到，答案是重点","全程直播","像视频一样回放"],a:1,why:'厂商通常只给思考摘要——草稿纸是内部的。'}}, {id:'testtime',term:'推理时算力',full:'Test-Time Compute',cn:'推理时算力',zone:'ai',lv:3,new:true,tl:'<b>不重训模型、答题时多烧算力换质量</b>：同一道题多想几条路、多验几遍——o1 式模型的核心思路。',ana:'像<b>考场上多花时间检查</b>：卷子还是那张，多算几遍正确率就上去——代价是变慢、电费变贵。',one:'答题时多烧算力换质量',cf:'和「预训练」的区别：预训练是出厂前一次性大投入；推理时算力是每道题的实时开销——一个是学费，一个是草稿纸。',al:['Test-Time Compute','测试时计算'],rel:['reason','extended','compute'],scn:'公众号聊「推理成本暴涨」「按效果付费」背后是它；Token 经济里「贵的是思考」说的就是这部分。',dlg:[{q:'为什么有的题突然变贵？',a:'触发了深度思考——多想的部分按算力计费，题越难花得越多。'},{q:'这思路的意义？',a:'把「更聪明」从「更大模型」里解放出来：小模型+多思考也能出好答案。'}],quiz:{q:'「推理时算力」把算力花在哪？',o:["答题阶段多想多验","重新训练模型","买显卡挖矿","网页加载加速"],a:0,why:'训练一次到位，答题时按题难度灵活加算力——质量随投入上涨。'}}, {id:'deepresearch',term:'Deep Research 深度研究',full:'Deep Research',cn:'深度研究',zone:'ai',lv:1,new:true,tl:'<b>AI 自动查几十上百份资料、交叉核对后产出带引用的研究报告</b>——分钟级干完人几天的活，2026 旗舰标配。',ana:'像<b>雇了个研究员助理</b>：你给课题，他翻文献、做表格、写综述，睡一觉起来报告在桌上。',one:'自动查证几十份资料出报告',cf:'和「搜索」的区别：搜索给链接，深度研究给结论+引用——它也会编引用，越像真的越要核。',al:['Deep Research','深度研究'],rel:['agent','rag','evals'],scn:'你做 IP 调研对标、写深度稿的前期资料活它能省大半；但引用也可能有幻觉——关键数字务必点开原文复核。',dlg:[{q:'报告能直接用吗？',a:'框架和线索很好用，关键数据必须自己验——幻觉在引用环节最隐蔽。'},{q:'为什么一次要 15-30 分钟？',a:'它在后台并行读几十个来源互相印证——慢工出细活。'}],shot:'deepresearch',quiz:{q:'Deep Research 和普通搜索的区别？',o:["只能搜英文","速度一定更快","自主多轮检索交叉核对，产出结构化报告","只给链接列表"],a:2,why:'搜索给你「门的地址」，它把门后的资料读完消化再交作业。'}}, {id:'llmjudge',term:'模型裁判',full:'LLM-as-judge',cn:'模型裁判',zone:'ai',lv:2,new:true,tl:'<b>用一个 AI 给另一个 AI 的输出打分</b>：人工评测太慢太贵，就让模型当裁判——AI 评测体系的核心手段。',ana:'像<b>请 AI 当阅卷老师</b>：一千份答案人改不动，AI 按标准几分钟批完——但阅卷老师自己也可能看走眼。',one:'让 AI 给 AI 的答案打分',cf:'和「竞技场」的区别：竞技场靠真人盲投对比；模型裁判是 AI 直接打分——前者贵但准，后者便宜但可能偏。',al:['LLM-as-judge','AI 裁判'],rel:['eval','evals','benchmark'],scn:'你听到的「自动化评测」「模型对比打分」背后常是它；风险也直白：裁判偏心（偏爱长答案、偏爱自家风格）怎么办。',dlg:[{q:'怎么防裁判偏心？',a:'交换顺序评两遍、写详细评分标准、抽检和人工对齐。'},{q:'我能用吗？',a:'能——拿标准答案让 AI 批产出，就是最朴素的用法。'}],shot:'llmjudge',quiz:{q:'「LLM-as-judge」的主要风险是？',o:["打分太慢","费用高于人工","不能打分","裁判模型自身有偏见（偏爱长答案等）"],a:3,why:'裁判不是法官——它的偏好会系统性带歪评测结果。'}}, {id:'tokeneco',term:'Token 经济',full:'Token Economy',cn:'Token 经济',zone:'ai',lv:1,new:true,tl:'<b>按「字数」（Token）计费的 AI 商业逻辑</b>：模型调用按输入输出字数收费，Token 成了生产资料——成本意识决定用 AI 的姿势。',ana:'像<b>打电话按分钟计费</b>：啰嗦的人账单惊人——会说话（精简提示词）、选对套餐（模型档位）能省一大半。',one:'按字数计费的 AI 生意账',cf:'和「订阅制」的区别：订阅是包月随便用（有隐藏限额）；按 Token 是按量付费——量大包月划算，量小按量灵活。',al:['Token Economy','词元经济'],rel:['token','quota','latency'],scn:'你用 Codex/Claude Code 的订阅额度、API 按 Token 计费都是它；2026 年「Token 消耗一年涨 300 倍」的新闻说的就是这门生意的体量。',dlg:[{q:'为什么说 Token 是生产资料？',a:'Agent 时代 AI 干活全程烧 Token——它像电费一样进了成本表。'},{q:'长对话为什么越聊越贵？',a:'每轮把全部历史重新计费——上下文越长越贵，所以有了压缩和缓存。'}],shot:'tokeneco',quiz:{q:'省 Token 费用最直接的一招？',o:["多开几个窗口","精简提示词+按任务难度选对模型档位","换台新手机","深夜调用"],a:1,why:'输入输出都按 Token 计费——话少一半钱少一半，简单任务用小模型再省一档。'}}, {id:'genui',term:'生成式界面',full:'Generative UI',cn:'生成式界面',zone:'ai',lv:3,new:true,tl:'<b>界面不再是预设的，是 AI 按你的意图现场生成的</b>：你要对比机票，它当场长出对比表格——软件形态的新想象。',ana:'像<b>私人管家随手画表格</b>：固定菜单点不到的，他直接铺开纸给你画一张——界面因需求而生。',one:'界面按你的意图现场生成',cf:'和「AI 画布」的区别：画布是固定的侧边编辑区；生成式界面连这块区域本身都是动态长出来的。',al:['Generative UI','动态界面'],rel:['fullmodal','copilot2','vibe'],scn:'AI 画布（Artifacts）是它的雏形；公众号聊「传统 App 要被 Agent 取代」时，指的终局就是界面随需生成。',dlg:[{q:'传统 App 会消失吗？',a:'短期不会——但「点菜单」会越来越多变成「说一句，界面自己来」。'},{q:'靠谱吗？',a:'演示惊艳，可靠性仍在爬坡：生成错界面的代价比点错菜单高。'}],quiz:{q:'「生成式界面」和普通 App 界面的区别？',o:["界面由 AI 按当前需求现场生成","界面更大更漂亮","必须戴眼镜看","加载更快"],a:0,why:'固定菜单→因需而变：同一句话今天出表格明天出地图。'}}, {id:'aibrowser',term:'AI 浏览器',full:'AI Browser',cn:'AI 浏览器',zone:'ai',lv:2,new:true,tl:'<b>浏览器里内置 AI Agent</b>：能读懂网页、替你点按、跨标签页干活——Atlas、Comet 一类新品，浏览器的下一代形态。',ana:'像<b>浏览器从「看的窗口」变成「干的助手」</b>：以前它给你看菜单，现在它能替你点单。',one:'内置 Agent 能替你操作的浏览器',cf:'和「龙虾智能体」的区别：龙虾是独立 Agent 操控浏览器；AI 浏览器是浏览器原生长出 Agent——一个外挂一个内置。',al:['AI Browser','智能浏览器'],rel:['aioverview','agent','lobster'],scn:'公众号聊「浏览器大战 2.0」「Chrome 被挑战」说的就是这波；和龙虾智能体的浏览器操作是同一方向的产品化。',dlg:[{q:'安全吗？',a:'要警惕：能替你点按钮就能替你「确认付款」——支付类页面务必自己来。'},{q:'和插件助手什么区别？',a:'插件是浏览器里的租客；AI 浏览器的 Agent 是房东自己造的，权限深得多。'}],quiz:{q:'AI 浏览器和普通浏览器的核心区别？',o:["广告更少","只能上特定网站","内置 Agent 能读懂网页替你操作","多了个书签栏"],a:2,why:'从「人看网页」到「AI 替你看网页、替你动手」。'}}, {id:'vibemkt',term:'氛围营销',full:'Vibe Marketing',cn:'氛围营销',zone:'ai',lv:2,new:true,tl:'<b>vibe coding 的营销版：小团队用 AI Agent 海量产出内容、快速试错投放</b>——一人干出一个部门的声量，2026 定义性趋势。',ana:'像<b>从手工作坊到流水线</b>：写文案、做图、剪视频、投渠道全被 AI 加速——试 10 个爆款的成本降到原来的十分之一。',one:'AI 加速的营销流水线打法',cf:'和「vibe coding」的区别：vibe coding 用自然语言造软件；vibe marketing 用同样方法造内容和投放——一个造产品一个造声量。',al:['Vibe Marketing','氛围营销'],rel:['vibe','aigc','solopreneur'],scn:'这是你的主场：数据选题、AI 配图、批量起号本质都是这套打法；「氛围营销」让你给惯用的打法有了名字。',dlg:[{q:'和批量发垃圾内容什么区别？',a:'本质区别在「数据筛选」——AI 批量出的是候选，爆款靠数据选出来，不是无脑灌。'},{q:'风险是什么？',a:'同质化和平台反制：大家都 AI 批量时，独特观点反而更值钱。'}],shot:'vibemkt',quiz:{q:'Vibe Marketing 的核心打法？',o:["手工打磨一篇精品","雇更多人加班","只做付费广告","AI 批量产出+快速试错，用数据筛出爆款"],a:3,why:'AI 把「试一次」的成本打到地板价——试错次数就是新护城河。'}}, {id:'verticalagent',term:'垂直智能体',full:'Vertical Agent',cn:'垂直智能体',zone:'ai',lv:3,new:true,tl:'<b>专攻一个行业的 Agent</b>：法律合同审查、医疗预诊、财报分析——不做万能助手，只把一件事做到专家级。2026 资本热点。',ana:'像<b>专科医生 vs 全科医生</b>：全科什么都会一点，专科在一个领域深扎——企业买单的往往是「专」而不是「全」。',one:'专攻单一行业的 Agent',cf:'和「通用助手」的区别：通用助手广而浅，垂直智能体窄而深——带着行业知识库和专用工具上场。',al:['Vertical Agent','行业智能体'],rel:['agent','a2a','swarm'],scn:'公众号聊「AI 替代初级律师」「AI 财报分析师」背后是它；你用的股票行情 Skill 也是垂直智能体的思路。',dlg:[{q:'为什么 2026 火了？',a:'通用能力到顶后，钱开始流向「谁能把 Agent 卖给律所医院」——垂直才能定高价。'},{q:'壁垒在哪？',a:'行业私有数据和流程 know-how，这些通用大模型学不到。'}],quiz:{q:'「垂直智能体」的「垂直」指什么？',o:["只能上下对话","深耕单一行业或职能","站得高看得远","竖屏界面"],a:1,why:'横向的通用助手难收费，纵向的行业专家才敢收企业的钱。'}}, {id:'sandwich',term:'三明治工作法',full:'Sandwich Model',cn:'三明治工作法',zone:'ai',lv:2,new:true,tl:'<b>人类定策略 → AI 干脏活 → 人类终审</b>的三明治分工：两头是人、中间是 AI——2026 被微软等大厂验证的协作模式。',ana:'像<b>餐厅老板与后厨</b>：老板定菜单（策略），后厨猛火炒菜（AI 执行），出餐前老板尝一口（终审）——责任始终在人。',one:'人定策略 AI 执行 人终审',cf:'和「人在环内」的区别：人在环内强调关键节点人介入；三明治是完整分工框架——策略和验收是人，中间全可交给 AI。',al:['Sandwich Model','三明治模型'],rel:['agent','hitl','workflow'],scn:'你在 AI 工作台的用法就是标准三明治：你出选题和判断，AI 查资料写初稿，你终审定稿；公众号聊「AI 时代人的位置」多指此。',dlg:[{q:'为什么中间不派人盯？',a:'中间的执行是数据密集型脏活，人盯性价比最低——把人放在两头杠杆最大。'},{q:'小团队适用吗？',a:'最适用——一人公司就是老板+一群 Agent 的三明治。'}],shot:'sandwich',quiz:{q:'三明治工作法里 AI 负责哪一层？',o:["中间的执行脏活","顶层定策略","最后一锤定音","什么都不负责"],a:0,why:'人负责「想对的事」和「守最终质量」，AI 负责「把活干完」。'}}, {id:'fedlearn',term:'联邦学习',full:'Federated Learning',cn:'联邦学习',zone:'ai',lv:2,new:true,tl:'<b>数据不出门，模型来上门</b>：各家在自己设备上训练，只上传模型更新不传原始数据——隐私和效果的兼得方案。',ana:'像<b>各家银行不交客户账本，只派讲师交流经验</b>：每家的秘密都在家，学到的本事汇总共享。',one:'数据不出门 模型来上门',cf:'和「本地部署」的区别：本地部署是单家自己跑模型；联邦学习是多家联合训练——共同变强还都不泄底。',al:['Federated Learning','联邦训练'],rel:['training','dataset','local'],scn:'公众号聊「医院联合训练 AI 又不泄病历」「键盘学习不上传打字记录」背后就是它；隐私严监管时代的刚需。',dlg:[{q:'效果会差吗？',a:'比数据集中训练略差，但隐私价值远超这点损失——医疗金融几乎是唯一解。'},{q:'手机输入法也在用？',a:'是，手机键盘的联想词优化是它最大的民用案例。'}],shot:'fedlearn',quiz:{q:'联邦学习保护的是什么？',o:["训练完全免费","速度更快","原始数据不出本地","模型绝对不被破解"],a:2,why:'只共享「学到什么」，不共享「数据是什么」——敏感数据场景的关键。'}}, {id:'codingagent',term:'编程智能体',full:'Coding Agent',cn:'编程智能体',zone:'ai',lv:1,new:true,tl:'<b>专干软件活的 Agent</b>：读代码库、写实现、跑测试、修报错、提 PR 一条龙自主推进——Codex/Claude Code 的本体。',ana:'像<b>从「AI 补全」进化到「AI 同事」</b>：以前它递给你代码片段，现在你给一个任务单，它自己干到交付。',one:'自主干到交付的 AI 码农',cf:'和「Copilot 类产品」的区别：Copilot 嵌在编辑器里随叫随到；编程智能体接的是任务单，能自己跑完全程。',al:['Coding Agent','编程 Agent'],rel:['agent','codegen','vibe'],scn:'你天天用的 Codex/Claude Code 就是它；2026 报告说智能体已能独立完成 8 小时级开发任务（按规格书实现+过测试+提 PR）。',dlg:[{q:'它能独立完成多大任务？',a:'案例是「按规格书实现新模块+过测试+提 PR」的 8 小时级任务。'},{q:'人干嘛？',a:'写清楚任务单、验收结果——瓶颈从「写代码」变成「会派活」。'}],quiz:{q:'编程智能体和「AI 补全」的本质区别？',o:["打字更快","界面更漂亮","完全免费","能自主规划多步任务并交付结果"],a:3,why:'补全帮你写下一行，智能体帮你交付整个功能。'}}, {id:'specdev',term:'规范驱动开发',full:'Spec-Driven Development',cn:'规范驱动开发',zone:'ai',lv:2,new:true,tl:'<b>先写清规格书（需求+验收标准），AI 照单施工</b>——2026 主流开发范式：人管「要什么」，AI 管「怎么做」。',ana:'像<b>装修交给施工队</b>：你出图纸和验收标准，施工队照图干——图纸越细，翻车越少。',one:'先写规格书 AI 照单施工',cf:'和「敏捷开发」的区别：敏捷追求快速迭代；规范驱动追求一次把规格写对——AI 时代改规格最便宜、改代码最贵。',al:['Spec-Driven Development','Spec Coding'],rel:['spec','codingagent','vibe'],scn:'Codex/Claude Code 用户的进阶玩法：先让 AI 出方案确认再放手干；你查词工具里那份项目规范文件就是活例子——AI 读它就知道规矩。',dlg:[{q:'规格书谁来写？',a:'人主笔意图和验收标准，AI 起草你修订。'},{q:'和计划模式什么关系？',a:'计划模式是它的轻量版：先出方案你点头再动手。'}],quiz:{q:'规范驱动开发的核心动作是？',o:["多招几个程序员","直接抄竞品","先把需求和验收标准写成规格书","让 AI 随便发挥再改"],a:2,why:'规格越清楚 AI 交付越准——「会派活」是 AI 时代的核心技能。'}}, {id:'aicanvas',term:'AI 画布 / 工件',full:'Canvas / Artifacts',cn:'AI 画布 / 工件',zone:'ai',lv:2,new:true,tl:'<b>聊天窗旁边开一块可编辑工作区</b>：代码、文档、网页 AI 边聊边改，你实时看结果——Claude/GPT/Gemini 已收敛成同一形态。',ana:'像<b>和装修师傅共用一块白板</b>：他边说边画你边看，不满意当场改——不用等「交付」。',one:'边聊边改的共享工作区',cf:'和「生成式界面」的区别：画布是固定的侧边工作区；生成式界面连这块区域都是动态长出——画布已落地，后者还在路上。',al:['Canvas','Artifacts','工件'],rel:['copilot2','genui','vibe'],scn:'你用 Claude 的 Artifacts 预览网页就是它；你的查词工具早期 demo 也是这么迭代出来的。',dlg:[{q:'和直接聊天有什么区别？',a:'聊天输出是死的文本；画布产出是活的文件——能改、能跑、能保存。'},{q:'适合什么活？',a:'网页、文档、SVG 这类「改了就能看到效果」的产出。'}],quiz:{q:'「AI 画布」的最大特点是？',o:["只能画图","聊天记录更多","不用联网","边聊边改，产出实时可见可编辑"],a:3,why:'从「AI 给你看」变成「AI 和你共用一块白板」。'}}, {id:'edgeai',term:'端侧 AI',full:'Edge AI / On-Device AI',cn:'端侧 AI',zone:'ai',lv:2,new:true,tl:'<b>不联网、在手机/电脑本地跑的 AI</b>：隐私数据不出门、没网也能用——靠模型压缩和 NPU 专用芯片实现。',ana:'像<b>从中央厨房到自家灶台</b>：菜不一定有中央厨房精致，但随做随吃、不排队、不泄配方。',one:'在设备本地跑的 AI',cf:'和「本地部署」的区别：本地部署偏自己服务器跑开源模型；端侧 AI 强调跑在手机/PC 等终端上。',al:['Edge AI','On-Device AI','端侧智能'],rel:['local','compression','quant'],scn:'手机厂商发布会讲的「本地大模型」、输入法离线 AI 都是它；公众号聊「端侧 vs 云端」之争的「端侧」就是这词。',dlg:[{q:'端侧模型多小？',a:'几 B 参数级别，靠量化塞进手机——能力比云端旗舰弱一档。'},{q:'什么时候选端侧？',a:'涉隐私（输入法/相册）或要离线（车载）的场景。'}],quiz:{q:'端侧 AI 最大的卖点是？',o:["下载更快","隐私数据不出设备、离线可用","模型一定更聪明","完全免费"],a:1,why:'牺牲一点智力换隐私和离线——敏感场景的唯一解。'}}, {id:'selfheal',term:'自愈系统',full:'Self-Healing Systems',cn:'自愈系统',zone:'ai',lv:3,new:true,tl:'<b>出 bug 自己发现自己修的软件</b>：AI 监测到故障，自动定位、打补丁、部署——2026 企业软件的新形态。',ana:'像<b>人体伤口自愈</b>：小伤口自己结痂——运维从「救火队」变成「体检医生」。',one:'软件自己修自己的故障',cf:'和「回滚」的区别：回滚是退回旧版止血；自愈是生成新补丁根治——先回滚止血再自愈根治是标准组合。',al:['Self-Healing','自动修复'],rel:['agentops','bug','deploy'],scn:'公众号聊「AI 吃掉软件」「运维自动化」指的方向；你的工具「报错→修复→门禁」流程是它的手动雏形。',dlg:[{q:'敢让它自动改生产系统？',a:'分层放权：小问题自动修，大改动仍要人审批。'},{q:'靠什么技术？',a:'可观测性（发现问题）+ Agent（定位生成）+ 灰度（安全上线）。'}],quiz:{q:'「自愈系统」的「自愈」指？',o:["软件自动定位并修复自己的故障","硬盘自我修复","用户手动重启","杀毒软件"],a:0,why:'Agent 发现问题→生成补丁→自动部署，把人从救火中解放。'}}, {id:'affectcomp',term:'情感计算',full:'Affective Computing',cn:'情感计算',zone:'ai',lv:3,new:true,tl:'<b>让 AI 识别和表达情绪</b>：听出语气里的不耐烦、看出表情里的犹豫——语音助手「带情绪回答」的技术底座。',ana:'像<b>给 AI 上「察言观色」课</b>：不只听懂你说什么，还听懂你怎么说。',one:'让 AI 识别和表达情绪',cf:'和「AI 伴侣」的关系：AI 伴侣是产品，情感计算是它「贴心」的技术来源。',al:['Affective Computing','情感 AI'],rel:['fullmodal','tts','voiceclone'],scn:'全模态模型演示的「听出你生气了」就是它；客服 AI、陪伴 AI 的核心竞争力。',dlg:[{q:'准吗？',a:'语音情绪识别已不错，微表情仍在爬坡——人类自己也常猜错。'},{q:'有争议吗？',a:'有：情绪被算法判定涉及隐私伦理，欧盟 AI 法案有限制。'}],quiz:{q:'「情感计算」算的是什么？',o:["股票情绪指标","CPU 发热","人的情绪状态（语气/表情/文本）","水电燃气费"],a:2,why:'从「听懂内容」到「听懂情绪」——交互自然度的关键一层。'}}, {id:'sovereignai',term:'主权 AI',full:'Sovereign AI',cn:'主权 AI',zone:'ai',lv:3,new:true,tl:'<b>各国搞「自己的 AI」：自主模型、自主算力、自主数据</b>——不想在关键技术上依赖别国，2026 国际新闻高频词。',ana:'像<b>粮食安全</b>：饭碗要端在自己手里——AI 时代的「饭碗」就是模型和算力。',one:'各国自建不被卡脖子的 AI',cf:'和「开源模型」的关系：开源是主权 AI 的捷径——拿开源模型自建，不用从零造轮子。',al:['Sovereign AI','AI 主权'],rel:['compute','llm','cloud'],scn:'公众号国际版块聊「欧洲主权 AI 基金」「某国本土大模型」都是它；解释了为什么各国都在砸钱扶持自家模型。',dlg:[{q:'和小国有关吗？',a:'越相关——小国缺算力缺数据，靠开源+区域合作。'},{q:'对中国用户意味着什么？',a:'国产模型生态已能全链路自给，你用的国产 App 背后都是。'}],quiz:{q:'「主权 AI」关心的核心是？',o:["AI 要有国籍人格","AI 只服务政府","禁止跨国使用","关键 AI 能力不被他国卡脖子"],a:3,why:'模型、算力、数据三大件自主可控——AI 时代的战略安全。'}}, {id:'foundation',term:'基座模型',full:'Foundation Model',cn:'基座模型',zone:'ai',lv:1,new:true,tl:'<b>各家发布的「大模型本体」</b>：预训练完成、能力全面但还没专门定制——是所有上层应用（对话版、思考版、Agent 版）的地基。',ana:'像<b>毛坯房</b>：结构水电都好了，精装修（对话定制）和开小店（垂直应用）都在它基础上来。',one:'大模型的本体和地基',cf:'和「推理模型」的区别：推理模型是基座+强化学习的思考特化版；基座是全能型毛坯。',al:['Foundation Model','基础模型'],rel:['pretrain','llm','saas'],scn:'公众号聊「某厂发布新基座」「基座能力决定上限」高频；模型官网的「基础版/对话版/思考版」就是同一基座的分层产品。',dlg:[{q:'基座强就代表产品强？',a:'不一定——后训练和产品设计同样关键，毛坯好只是上限高。'},{q:'开源基座意味着什么？',a:'人人可下载改造——端侧模型、行业定制都从开源基座起。'}],shot:'foundation',quiz:{q:'「基座模型」对应装修里的哪个阶段？',o:["烂尾楼","毛坯房——结构完成待装修","精装修交付","家具家电齐备"],a:1,why:'基座=预训练完成的通识底座，上层定制都在它身上盖。'}}, {id:'streaming',term:'流式输出',full:'Streaming',cn:'流式输出',zone:'ai',lv:1,new:true,tl:'<b>AI 回复一个字一个字往外蹦的「打字机」效果</b>：不是慢慢打字，是生成一点就推一点——先出字比等全部写完体验好。',ana:'像<b>水龙头放水 vs 一桶水扛过来</b>：总量一样，但水龙头让你立刻喝上第一口。',one:'生成一点推一点的打字机效果',cf:'和「WebSocket」的关系：流式是「怎么给」，WebSocket 是「用什么管道给」——一个策略一个通道。',al:['Streaming','流式传输'],rel:['latency','websocket','token'],scn:'你天天见的打字机效果就是它；API 里「流式输出」开关也照它设——内容没变，体感天差地别。',dlg:[{q:'为什么有的产品不流式？',a:'批量处理/后端调用不需要体感——流式是给「人看」的场景准备的。'},{q:'流式输出能中断吗？',a:'能，随时停止生成——已输出的部分保留。'}],shot:'streaming',quiz:{q:'流式输出「省」的是什么？',o:["体感等待时间（首字更快出现）","Token 费用","模型算力","网络流量"],a:0,why:'总时间没变，但先看到字的心理等待大幅缩短。'}}, {id:'promptcache',term:'上下文缓存',full:'Prompt Caching',cn:'上下文缓存',zone:'ai',lv:2,new:true,tl:'<b>重复的内容不重复计费</b>：把固定的系统提示、常用文档缓存起来，下次调用这部分按极低价格算——API 省钱利器。',ana:'像<b>把常看的书放在手边</b>：不再每次全价重买——系统提示这种「每次都要说的话」最该缓存。',one:'重复内容不重复计费的机制',cf:'和「KV 缓存」的区别：KV 缓存是模型内部的提速机制（不省钱）；上下文缓存是计费层的省钱机制。',al:['Prompt Caching','提示词缓存'],rel:['token','api','cache'],scn:'调 API 传大段固定说明文字时开了缓存能省一半以上；公众号聊「API 降价真相」常提它。',dlg:[{q:'缓存有时效吗？',a:'有——几分钟到几小时，超时未用就失效。'},{q:'自己搭应用怎么开？',a:'API 参数里标记可缓存前缀，文档都有说明。'}],shot:'promptcache',quiz:{q:'上下文缓存最适合缓存什么？',o:["用户的密码","一次性问题","每次调用都重复的固定内容","随机闲聊"],a:2,why:'重复率越高省得越多——变化的对话部分没法缓存。'}}, {id:'aihardware',term:'AI 硬件',full:'AI Hardware',cn:'AI 硬件',zone:'ai',lv:3,new:true,tl:'<b>专为 AI 设计的独立小设备</b>：无屏幕胸针、随身助手——试图绕过手机做 AI 入口。争议品类：多款已阵亡。',ana:'像<b>为听歌造个随身听</b>：手机明明能放歌，但有人认为专用设备体验更好——成不成，市场说了算。',one:'专为 AI 造的独立设备',cf:'和「AI 眼镜」的关系：AI 眼镜是 AI 硬件里目前唯一跑出规模的品类。',al:['AI Hardware','AI 设备'],rel:['fullmodal','guitraining','aiglasses'],scn:'公众号聊「AI 硬件元年」「某设备翻车」是它；AI 眼镜是目前唯一跑出量的品类。',dlg:[{q:'为什么大多失败了？',a:'功能被手机全覆盖+价格高+学习成本——三座大山。'},{q:'那为什么还在做？',a:'赌「下一代交互」：一旦出现手机做不了的场景（全天候第一视角），就是新入口。'}],quiz:{q:'AI 硬件品类的现状？',o:["全面普及","被禁售","只卖企业","多数遇冷，AI 眼镜是跑出量的例外"],a:3,why:'手机太强——专用硬件必须找到手机做不了的独特场景。'}}, {id:'aiglasses',term:'AI 眼镜',full:'AI Glasses',cn:'AI 眼镜',zone:'ai',lv:2,new:true,tl:'<b>戴上就能问的眼镜</b>：摄像头+麦克风+AI 助手，看到什么问什么——AI 硬件里目前唯一跑出量的品类。',ana:'像<b>眼睛旁边长了张会说话的嘴</b>：看到的当下就能提问，不用掏手机拍照上传。',one:'戴上就能对所见提问的眼镜',cf:'和「VR 眼镜」的区别：VR 造一个虚拟世界；AI 眼镜增强现实世界——一个躲进虚拟，一个看穿现实。',al:['AI Glasses','智能眼镜'],rel:['fullmodal','aihardware','asr2'],scn:'公众号开箱评测高频主角；「第一人称视角+实时问答」是手机给不了的体验——通勤认人、外语看牌、维修找教程。',dlg:[{q:'续航怎么样？',a:'重度使用一天一充，比手机差——电池是最大短板。'},{q:'隐私问题？',a:'拍摄提示灯是行业共识，偷拍争议仍多——公共场所规矩在完善。'}],shot:'aiglasses',quiz:{q:'AI 眼镜的核心体验是？',o:["近视矫正","看到什么当场问——第一人称+实时问答","听歌更清楚","防蓝光"],a:1,why:'不用掏手机，「所见即所问」——它从 AI 硬件里跑出来的原因。'}}, {id:'humanoid',term:'人形机器人',full:'Humanoid Robot',cn:'人形机器人',zone:'ai',lv:2,new:true,tl:'<b>长成人样的 AI 载体</b>：会走、会抓、听懂指令干活——Physical AI 的终极形态，2026 从发布会走进工厂实训。',ana:'像<b>给大脑造个标准身体</b>：世界是按人的尺寸设计的（楼梯、门把、货架）——人形是最省改造成本的通用形态。',one:'长成人样的 AI 载体',cf:'和「机械臂」的区别：机械臂在固定工位干单件事；人形机器人要在人类环境干多样事——通用性换难度。',al:['Humanoid Robot','人形机器人'],rel:['embodied','physical','world'],scn:'公众号视频里「机器人翻跟头、拧螺丝」主角就是它；「进厂打工」实训是当前主战场，进家庭还早。',dlg:[{q:'什么时候进家庭？',a:'先工厂后商业再家庭——价格降、可靠性过关才可能。'},{q:'大脑是谁？',a:'大模型+空间智能——身体造好了，「脑子」成了瓶颈。'}],shot:'humanoid',quiz:{q:'机器人做成「人形」的主要原因？',o:["世界按人的尺寸设计，通用性最好","更像人有亲切感","成本最低","好看"],a:0,why:'楼梯、门把、工具全是人形尺寸——人形让 AI 直接用人类环境。'}}, {id:'aidetector',term:'AI 检测器',full:'AI Detector',cn:'AI 检测器',zone:'ai',lv:2,new:true,tl:'<b>判断「这段内容是不是 AI 写的」的工具</b>：学校查作业、平台查灌号、编辑查投稿都在用——但准确率远非百分百。',ana:'像<b>测酒驾的仪器</b>：能给出指标，但偶尔误判——「指标异常」只能起疑，不能定罪。',one:'判断内容是否 AI 生成',cf:'和「模型水印」的区别：水印是 AI 主动埋的确定记号；检测器是从文本特征猜的——有记号看记号，没记号才靠猜。',al:['AI Detector','AI 检测'],rel:['aiflav','watermark','workslop'],scn:'老师查论文、平台限流灌水号都用它；它和 AI 味检测是两条路线——误伤人类作者的消息也常上热搜。',dlg:[{q:'被判 AI 就完了？',a:'申诉机制很重要——保留写作过程（草稿、版本历史）是最好的自证。'},{q:'AI 改写后还查得出吗？',a:'深度改写能绕过大部分检测器——猫鼠游戏持续中。'}],quiz:{q:'AI 检测器最大的问题是？',o:["速度太慢","不支持中文","会误判——人写的也可能被标成 AI","收费太贵"],a:2,why:'统计特征不是铁证——误伤人类作者常上热搜，结果只能当参考。'}}, {id:'airewrite',term:'AI 洗稿',full:'AI Rewriting Spam',cn:'AI 洗稿',zone:'misc',lv:3,new:true,tl:'<b>用 AI 批量改写别人的内容冒充原创</b>：换词、调序、拼接，检测器和读者都难分辨——内容平台的治理重点。',ana:'像<b>抄袭者的洗白流水线</b>：抄一遍是抄袭，AI 深度改写十遍，连原作者都难举证。',one:'AI 深改他人内容冒原创',cf:'和「AI 味」的区别：AI 味是 AI 直接写的通病；AI 洗稿是有意伪装成人类原创——后者更恶劣。',al:['AI Rewriting Spam','AI 洗稿'],rel:['workslop','aiflav','scraper'],scn:'你刷公众号时「似曾相识」的爆款文背后常有它；和 AI 瞎生产（workslop）不同——洗稿偷的是别人的成果。',dlg:[{q:'被洗稿怎么办？',a:'原创时间戳是最强证据——发布记录、草稿历史都留好，投诉有据。'},{q:'怎么识别？',a:'同热点多看几篇，观点案例高度雷同只换说法的基本是。'}],quiz:{q:'AI 洗稿的「洗」指什么？',o:["清洗训练数据","把 AI 文改成人味","洗掉错别字","深度改写他人内容冒充原创"],a:3,why:'换词调序拼接让溯源困难——平台靠时间戳和交叉比对打击。'}}, {id:'datacontam',term:'数据污染',full:'Data Contamination',cn:'数据污染',zone:'ai',lv:3,new:true,tl:'<b>考试题混进了训练课本</b>：模型刷分刷的是「背过的原题」不是真本事——跑分虚高的主因，评测可信度的头号敌人。',ana:'像<b>考前偷看了试卷</b>：分数很高，能力存疑——所以有了「考后新题重测」的惯例。',one:'考题混进课本刷分虚高',cf:'和「过拟合」的区别：过拟合是模型死记训练数据；数据污染是评测题泄漏进训练集——一个是学习问题，一个是考试作弊。',al:['Data Contamination','评测污染'],rel:['eval','benchmark','arena'],scn:'公众号聊「某模型跑分虚高」「评测集泄漏」就是它；竞技场用真人实时盲测就是为了绕开这个坑。',dlg:[{q:'怎么发现污染？',a:'拿评测发布之后的新题重测——分数骤降就是背题实锤。'},{q:'能完全避免吗？',a:'很难——互联网数据互相抄，所以真人盲测的竞技场越来越重要。'}],quiz:{q:'「数据污染」让模型的什么失真？',o:["价格","跑分（背过原题不等于真本事）","体重","参数量"],a:1,why:'评测题混进训练数据，分数高不代表能力强。'}}, {id:'arena',term:'竞技场',full:'Chatbot Arena / LMArena',cn:'竞技场',zone:'ai',lv:2,new:true,tl:'<b>模型排行榜的「真人盲测赛」</b>：两个模型匿名同题对战，你投一票——用真人对实时新题的判断绕开跑分作弊。',ana:'像<b>美食盲评大赛</b>：不报店名只报菜，食客投真实喜好——名厨翻车、小店逆袭都可能。',one:'真人盲测投票的模型排行',cf:'和「标准跑分」的区别：跑分是固定考卷可被污染；竞技场是实时新题真人投——可信但吵（众口难调）。',al:['Chatbot Arena','LMArena'],rel:['benchmark','eval','llmjudge'],scn:'你选模型时看到的「人类偏好排行榜」多源于它；匿名+实时新题+众投，让背题和自报分数都使不上劲。',dlg:[{q:'排行榜能全信吗？',a:'参考「人类偏好」没问题，但偏好不等于正确——顺眼的答案不一定对。'},{q:'我也能投？',a:'能，官网匿名对战随手投一票——你的票就是排行榜的一分子。'}],shot:'arena',quiz:{q:'竞技场排行榜的可信点在哪？',o:["真人盲测实时新题，难作弊","模型自己投票","厂家自报分数","只看参数量"],a:0,why:'匿名+实时新题+众投——数据污染和自报分数都使不上劲。'}}, {id:'weights',term:'模型权重',full:'Weights',cn:'模型权重',zone:'abbr',lv:2,new:true,tl:'<b>模型学到的全部「神经连接强度」，是一堆巨大的数字文件</b>——开源模型下载的就是它：有了权重，才算有了模型本体。',ana:'像<b>学霸的「脑内笔记」</b>：课本人人有，脑内笔记才是他成绩的来源——下载权重就是把笔记拷回家。',one:'模型学到的全部参数文件',cf:'和「API」的区别：API 是租脑子按次付费；开源权重是把脑子拷回家自己养——隐私、成本、定制各有所图。',al:['Weights','权重文件'],rel:['pretrain','local','oss'],scn:'下载开源模型时那几个 GB~几百 GB 的文件就是权重；「开放权重」和「只开放 API」是开源程度的分水岭。',dlg:[{q:'权重文件能看懂吗？',a:'就是海量数字，人读没意义——但微调工具能改它。'},{q:'「开放权重」=开源吗？',a:'不一定——有的不给训练细节、限制商用，看许可证。'}],shot:'weights',quiz:{q:'「开源权重」意味着你能拿到什么？',o:["作者代码仓库权限","自动获得商用授权","模型学到的全部参数文件，可本地运行","训练数据原文"],a:2,why:'权重=模型本体——拿到它才能本地部署和微调。'}}, {id:'checkpoint',term:'检查点',full:'Checkpoint',cn:'检查点',zone:'abbr',lv:3,new:true,tl:'<b>训练过程的「存档点」</b>：每隔一段把模型当前状态存下来——断了能续、坏了能退、中间版本还能拿来用。',ana:'像<b>游戏存档</b>：练到一半断电不至于从头再来——存档还能回看「哪个阶段最强」。',one:'训练过程的存档点',cf:'和「模型版本」的区别：检查点是训练中间态（可能很差）；版本是挑出来发布验证过的成品。',al:['Checkpoint','存档点'],rel:['training','pretrain','backup'],scn:'下载开源模型时常见「checkpoint-1000」这类文件夹，就是训练存档；微调自己模型时也靠它防翻车。',dlg:[{q:'存档很占空间？',a:'占——每个都是完整模型副本，所以只留关键节点和最近几个。'},{q:'中间存档能用吗？',a:'能，有时中间「半成品」泛化反而更好，社区常淘。'}],quiz:{q:'训练时设「检查点」最主要图什么？',o:["加快训练速度","省显卡","好看","中断能续训、出问题能回退"],a:3,why:'几天的训练断了重来代价巨大——存档点是最基础的保险。'}}, {id:'vram',term:'显存',full:'VRAM',cn:'显存',zone:'abbr',lv:1,new:true,tl:'<b>显卡上临时放模型和计算数据的「工作台桌面」</b>：桌面不够大，模型再好也跑不动——本地跑 AI 的第一道门槛。',ana:'像<b>书桌面积</b>：书（模型参数）摊开占桌面——桌面小了，厚书根本摊不开，只能看缩印版（量化）。',one:'显卡上放模型的工作台',cf:'和「内存」的区别：内存是电脑的桌子，显存是显卡的桌子——AI 推理主要占的是显存。',al:['VRAM','显存'],rel:['gpu','quant','local'],scn:'本地跑模型第一问就是「我的显存够吗」；不够的解法是量化（把书缩印）或换更小的模型。',dlg:[{q:'多大显存够？',a:'7B 量化版 6-8GB 能跑，70B 级别要几十 GB——看参数量和精度。'},{q:'和打游戏共用吗？',a:'共用同一块显存——打游戏的卡跑 AI，散热和显存都得算好。'}],shot:'vram',quiz:{q:'「显存不够」的常见解法？',o:["清浏览器缓存","用量化压缩模型或换更小的模型","重启电脑","多插网线"],a:1,why:'把模型「缩印」进有限桌面——量化是标准动作。'}}, {id:'infereng',term:'推理引擎',full:'Inference Engine',cn:'推理引擎',zone:'abbr',lv:3,new:true,tl:'<b>本地跑模型的工具</b>：Ollama 一条命令下载开跑、vLLM 高并发扛企业流量——权重只是食材，引擎才是灶台。',ana:'像<b>厨房灶台</b>：食材（权重）有了，怎么高效做熟端上桌（加载、量化、并发）全看灶台。',one:'本地跑模型的灶台工具',cf:'和「AI 浏览器」的区别：推理引擎管本地怎么跑模型；AI 浏览器管云端 Agent 替你操作——一个后厨一个前厅。',al:['Inference Engine','Ollama/vLLM'],rel:['local','quant','gpu'],scn:'本地玩模型第一步「装个 Ollama」说的就是它；教程里的 vLLM、llama.cpp 都是同类。',dlg:[{q:'Ollama 和 vLLM 怎么选？',a:'个人玩 Ollama 一条命令省心；企业高并发上 vLLM——吞吐差几倍。'},{q:'引擎决定模型上限吗？',a:'不影响智力，影响速度和并发——同一模型换引擎，聪明程度一样。'}],quiz:{q:'「推理引擎」负责什么？',o:["把权重文件高效跑起来（加载/量化/并发）","训练模型","生成训练数据","画界面"],a:0,why:'权重是食材，引擎是灶台——加载、加速、并发都靠它。'}}, {id:'negprompt',term:'负向提示词',full:'Negative Prompt',cn:'负向提示词',zone:'ai',lv:3,new:true,tl:'<b>告诉 AI 绘图「别画什么」</b>：模糊、多余的手指、水印……写进负面栏，出图质量立升——文生图老手必备。',ana:'像<b>点菜备注「不要香菜不要辣」</b>：正面说你想要什么不够，负面排除也重要。',one:'告诉绘图 AI 别画什么',cf:'和「正向提示词」的关系：正向定主体和风格，负向扫除常见翻车点——老手的负面栏都是攒出来的经验。',al:['Negative Prompt','反向提示词'],rel:['t2i','prompt','comfyui'],scn:'用 ComfyUI/Midjourney 的「负面提示词」栏就是它；AI 视频同样适用（不要抖动、不要字幕）。',dlg:[{q:'负向写越多越好？',a:'不是——堆太多互相冲突，写高频翻车点（模糊、畸形、水印）就够。'},{q:'有通用模板吗？',a:'社区有成熟模板起步，再按自己常翻车的点补。'}],quiz:{q:'「负向提示词」的作用是？',o:["加水印","切换画风","排除不想要的元素（模糊、畸形等）","让 AI 画得更慢"],a:2,why:'正向说你想要什么，负向排除你不要什么——两手都要抓。'}}, {id:'aicompanion',term:'AI 伴侣',full:'AI Companion',cn:'AI 伴侣',zone:'misc',lv:2,new:true,tl:'<b>陪伴聊天型 AI 产品</b>：角色扮演、情绪价值、随叫随到——公众号高频争议话题：慰藉孤独 vs 情感依赖。',ana:'像<b>电子宠物进化成「电子知己」</b>：它记得你所有偏好，永远耐心——也正因如此让人放不下。',one:'提供情绪价值的陪伴型 AI',cf:'和「智能音箱」的区别：音箱是工具型（定闹钟查天气）；AI 伴侣是关系型（长期记忆、情感互动）。',al:['AI Companion','AI 男友/女友'],rel:['affectcomp','syc','memory'],scn:'公众号聊「AI 男友」「AI 树洞」「青少年依赖」都是它；情感计算是它「贴心」的技术来源。',dlg:[{q:'它真的「懂」你吗？',a:'「懂」建立在你的数据上——好用，但要清楚对面是概率不是感情。'},{q:'家长最该警惕什么？',a:'青少年把情感寄托全押上去——平台已有时长和年龄提醒。'}],quiz:{q:'AI 伴侣引发的最大争议？',o:["收费太贵","不够聪明","没有声音","情感依赖与隐私边界"],a:3,why:'慰藉孤独和放大孤独一线之隔——青少年群体尤其敏感，监管在收紧。'}}, {id:'hf',term:'Hugging Face',full:'Hugging Face',cn:'Hugging Face（模型仓库）',zone:'abbr',lv:2,new:true,tl:'<b>模型界的 GitHub</b>：开源模型、数据集、在线演示全在这——玩本地 AI 和开源模型的必经之地，机器学习社区的心脏。',ana:'像<b>AI 界的应用商店+开源仓库合体</b>：找模型、找数据集、在线试用一站搞定。',one:'模型界的 GitHub 开源仓库',cf:'和「GitHub」的区别：GitHub 存代码为主；HF 存模型权重和数据集为主——AI 时代两者都是基础设施。',al:['Hugging Face','HF 模型库'],rel:['weights','oss','local'],scn:'本地跑模型教程说「去 HF 下载」就是它；每个模型页的「模型卡」写清用途和限制——先读卡再下载。',dlg:[{q:'下载要账号吗？',a:'部分模型要同意条款才能下，多数直接下。'},{q:'Spaces 是什么？',a:'在线试用别人部署的 Demo——先试再决定要不要下载。'}],shot:'hf',quiz:{q:'下载开源模型前应先看什么？',o:["只看文件大小","模型卡（用途/限制/许可证）","下载次数最多的就对","封面图"],a:1,why:'模型卡写明训练范围和禁用场景——盲下可能不适用甚至违规。'}}, {id:'chunking',term:'分块',full:'Chunking',cn:'分块',zone:'ai',lv:2,new:true,tl:'<b>把长文档切成小段再喂给 AI 检索</b>：切得科学，检索才准——RAG 效果好不好，一半看分块怎么切。',ana:'像<b>整理百科全书做索引卡</b>：一整本没法查，按条目拆成卡片、每张带出处——查起来才能一击即中。',one:'长文档切小段供检索',cf:'和「上下文压缩」的区别：分块是入库前的「切」，压缩是对话中的「删」——一个管库，一个管窗口。',al:['Chunking','文本分块'],rel:['rag','kb','dataset'],scn:'搭知识库、让 AI 读长 PDF 的背后就是它；「答非所问」多半是切得太碎或太粗。',dlg:[{q:'切多大合适？',a:'几百字一段起步，按内容结构（段落/标题）切比死抠字数好。'},{q:'块之间要重叠吗？',a:'要一点重叠——防止答案正好被切在缝里。'}],shot:'chunking',quiz:{q:'分块切得不好最直接的后果？',o:["检索答非所问——太碎丢上下文，太粗混噪音","文件打不开","模型拒绝回答","网速变慢"],a:0,why:'块是检索的最小单位——切不好，找到的就不是你问的。'}}, {id:'rerank',term:'重排序',full:'Rerank',cn:'重排序',zone:'ai',lv:2,new:true,tl:'<b>检索结果先粗筛一把再精排</b>：向量召回 100 条「大概相关」，重排模型挑出 5 条「真正相关」——RAG 提效的最后一步。',ana:'像<b>招聘的两轮筛选</b>：HR 按关键词海选简历（召回），部门主管面试定终选（重排）——粗筛快而广，终选准而贵。',one:'检索结果二道精排',cf:'和「多路召回」的区别：多路召回是「多张网一起撒」（别漏），重排序是「捞上来的精挑」（排对）——前后接力。',al:['Rerank','重排'],rel:['rag','vdb','embed'],scn:'公众号聊「RAG 效果差怎么救」，重排序是标准答案之一；你点名的 rerank 就是它。',dlg:[{q:'不加重排会怎样？',a:'答案也能出，但常混进「字面相关、实际无关」的段落——质量天花板低。'},{q:'重排模型哪来的？',a:'有开源现成的（bge-reranker 等），也有商用 API。'}],quiz:{q:'「重排序」排在哪一步？',o:["用户提问之前","生成图片之前","向量粗筛召回之后，出答案之前","训练之前"],a:2,why:'召回管「别漏」，重排管「排对」——两步配合命中率才高。'}}, {id:'multi_recall',term:'多路召回',full:'Multi-route Retrieval',cn:'多路召回',zone:'ai',lv:3,new:true,tl:'<b>找资料不只撒一张网</b>：关键词、语义、标签多路并发检索再合并——单路必有盲区，多路才不漏。',ana:'像<b>找人多渠道</b>：朋友圈、通讯录、同事群同时问——单问一个人可能漏，多渠道交叉才保险。',one:'多张网一起撒防漏检',cf:'和「重排序」的区别：多路召回管「别漏」，重排序管「排对」——前后接力。',al:['Multi-route Retrieval','混合检索'],rel:['rag','rerank','vdb'],scn:'你点名的多路召回；RAG 进阶标配——和重排序、分块并称检索质量三件套。',dlg:[{q:'有哪些「路」？',a:'关键词、向量语义、标签过滤、倒排索引——各有各的盲区。'},{q:'结果会重复吗？',a:'会——所以合并后要去重去噪，再交给重排。'}],quiz:{q:'「多路召回」要解决的问题？',o:["模型太小","数据太多","单一检索方式必有盲区，多路合并防漏","网速慢"],a:2,why:'关键词搜不到的语义能搜到，反之亦然——多路互补。'}}, {id:'ssm',term:'状态空间模型',full:'SSM / Mamba',cn:'状态空间模型',zone:'ai',lv:3,new:true,tl:'<b>Transformer 的挑战者</b>：像滚雪球一样带着「状态」往前读，长文本处理更省——Mamba 是代表。',ana:'像<b>读书记笔记 vs 回头翻书</b>：Transformer 每读新词都要回头看全部历史；SSM 把要点滚进一个「状态」里带着走。',one:'带状态滚读的模型架构',cf:'和「Transformer」的区别：Transformer 靠注意力回看全史（贵但准）；SSM 滚动状态（省但取舍）——长文本场景后者有优势。',al:['SSM','Mamba'],rel:['transformer','llm','scalinglaw'],scn:'公众号聊「Transformer 被取代？」「Mamba 架构」就是它；目前仍是挑战者，未成主流。',dlg:[{q:'为什么还没有取代？',a:'生态、工具、经验全在 Transformer 侧——挑战者需要时间。'},{q:'该关注吗？',a:'值得——超长上下文需求爆发，架构创新是最可能的突破口。'}],quiz:{q:'SSM 相比 Transformer 的主打优势？',o:["出图更清晰","不用训练","免费","长文本处理更省算力"],a:3,why:'滚动状态避免每步回看全部历史——超长文本场景省得多。'}}, {id:'docker',term:'Docker 容器',full:'Docker / Container',cn:'Docker 容器',zone:'code',lv:2,new:true,tl:'<b>把程序和它的整套环境打包成「集装箱」</b>：到哪台机器都能原样跑——「在我机器上是好的」从此有解。',ana:'像<b>国际标准集装箱</b>：货物（程序）连货架（环境）一起封箱，卡车轮船（各家的服务器）通用装卸。',one:'程序连环境打包的集装箱',cf:'和「虚拟机」的区别：虚拟机连操作系统一起装（重）；容器共享系统内核只装差异（轻）——秒级启动。',al:['Docker','容器'],rel:['deploy','server','sandbox'],scn:'公众号技术文高频词；你用 AI 装开源项目时「有 Docker 版」就是给你省去环境折腾。',dlg:[{q:'和虚拟机什么区别？',a:'虚拟机模拟整台电脑（重），容器只打包差异部分（轻）——秒级启动、密度高。'},{q:'AI 公司用它？',a:'用——模型服务、Agent 运行环境全都容器化交付。'}],shot:'docker',quiz:{q:'Docker 解决的核心痛点？',o:["硬盘不够","环境不一致导致的「我机器上能跑」","代码写错","网速慢"],a:1,why:'程序连环境打包，到哪都原样运行——部署噩梦的终结者。'}}, {id:'image',term:'镜像',full:'Image',cn:'镜像',zone:'code',lv:2,new:true,tl:'<b>容器的「模板」</b>：把程序+环境做成只读快照，一个镜像能起无数个一样的容器——分工是「镜像=模板，容器=运行实例」。',ana:'像<b>月饼模子</b>：一个模子（镜像）压出无数个月饼（容器）——每个都一模一样。',one:'容器复用的只读模板',cf:'和「容器」的区别：镜像是死的模板，容器是活的运行实例——类和对象的关系。',al:['Image','镜像文件'],rel:['docker','backup','deploy'],scn:'「拉取镜像」「构建镜像」是 Docker 日常用语；AI 应用部署也全是镜像在流转。',dlg:[{q:'镜像和容器谁先谁后？',a:'先有镜像，从镜像「起」容器——一个镜像可同时起多个容器。'},{q:'镜像多大？',a:'几百 MB 到几 GB——所以有镜像仓库分层下载、增量更新。'}],quiz:{q:'「镜像」和「容器」的关系？',o:["镜像=模板，容器=运行实例","镜像是照片","容器是镜像的子集","互不相干"],a:0,why:'一个模板起多个实例——类和对象的关系。'}}, {id:'k8s',term:'Kubernetes',full:'Kubernetes / K8s',cn:'Kubernetes 容器编排',zone:'code',lv:3,new:true,tl:'<b>管理成千上万个容器的总调度</b>：谁挂了自动重启、流量高峰自动扩容——容器多了没有它就是灾难。',ana:'像<b>港口总调度系统</b>：几千个集装箱谁装哪船、坏船自动换——人管不过来，全靠系统调度。',one:'海量容器的自动总调度',cf:'和「Docker」的区别：Docker 管单个集装箱；K8s 管整个港口的集装箱群——一个工具一个体系。',al:['K8s','容器编排'],rel:['docker','server','deploy'],scn:'公众号聊「云原生」「K8s 工程师年薪」就是它；个人用不上，但理解它就懂了大厂的部署逻辑。',dlg:[{q:'「8」哪来的？',a:'K 和 s 之间有 8 个字母——程序员的缩写习惯。'},{q:'为什么要学？',a:'不做运维可不懂原理，但要认识这个词——云原生时代的基建名片。'}],quiz:{q:'Kubernetes 解决什么问题？',o:["图片压缩","数据库加密","海量容器的自动调度、扩容、自愈","写代码更快"],a:2,why:'容器一多人力管不过来——自动调度是刚需。'}}, {id:'semver',term:'语义化版本',full:'Semantic Versioning / SemVer',cn:'语义化版本',zone:'code',lv:2,new:true,tl:'<b>v1.4.2 三位数字各有含义</b>：第一位大改不兼容、第二位加功能、第三位修 bug——看版本号就知道敢不敢升级。',ana:'像<b>酒店星级</b>：五星换址重建（大改）、四星加个健身房（加功能）、三星换个灯泡（修 bug）——数字背后是风险等级。',one:'版本号的数字含义规范',cf:'和「随便起版本号」的区别：语义化是公约——遵守它，工具才能自动判断「敢不敢升」。',al:['SemVer','语义化版本号'],rel:['git','pkg','beta'],scn:'装依赖时看到版本号就不会盲升了；你自己的版本存档管理也是同一思想。',dlg:[{q:'第一位变了敢升吗？',a:'要谨慎——可能有兼容性破坏，先看迁移文档。'},{q:'第三位呢？',a:'放心升——修 bug 不加东西。'}],shot:'semver',quiz:{q:'v2.0.0 → v2.1.0 的变化是？',o:["大改不兼容","只修了 bug","回滚了功能","加了新功能（向后兼容）"],a:3,why:'第二位+1=加了向后兼容的新功能，放心升。'}}, {id:'lockfile',term:'锁文件',full:'Lockfile',cn:'锁文件',zone:'code',lv:3,new:true,tl:'<b>把依赖版本「钉死」的清单</b>：package-lock.json、uv.lock——保证你的电脑和我电脑装出来的东西一模一样。',ana:'像<b>菜谱精确到克</b>：「放盐少许」每桌味道不同，「放盐 3 克」天下一致——复现的关键是精确。',one:'钉死依赖版本的清单',cf:'和「依赖清单」的区别：清单（requirements）写范围「3.x 以上」，锁文件写精确值「3.2.1」——一个意向一个合同。',al:['Lockfile','package-lock.json'],rel:['dependency2','pkg','backup'],scn:'AI 帮你装依赖时看到 lock 文件别删——删了它，「同样的命令」装出来的版本可能不同，bug 凭空出现。',dlg:[{q:'锁文件要进 git 吗？',a:'应用项目要进——这是「复现」的保证；库项目另有讲究。'},{q:'它怎么来的？',a:'装依赖时自动生成，每次改动会同步更新。'}],quiz:{q:'锁文件（lockfile）的作用？',o:["生成文档","钉死依赖精确版本保证处处一致","加密代码","提升网速"],a:1,why:'「同样的命令装出同样的结果」——可复现性的基石。'}}, {id:'hotreload',term:'热重载',full:'Hot Reload',cn:'热重载',zone:'code',lv:3,new:true,tl:'<b>改完代码立刻见效，不用重启程序</b>：保存的一瞬间界面就更新——前端开发和调样式效率的支柱。',ana:'像<b>改 PPT 实时预览</b>：不用「关掉再打开」——每一笔改动立刻映在屏幕上。',one:'改代码立刻见效不用重启',cf:'和「重新部署」的区别：热重载是开发时的即时反馈；部署是发布给用户——一个对内一个对外。',al:['Hot Reload','热更新'],rel:['deploy','debug','build'],scn:'看 AI 写网页时「保存一下页面就变了」的魔法就是它；小程序、游戏引擎也都有各自的热重载。',dlg:[{q:'生产环境能用热重载吗？',a:'不能也不该——它是开发工具，线上要的是稳定版本。'},{q:'原理？',a:'监听文件变化，只替换改动的模块——保留现场只换零件。'}],quiz:{q:'「热重载」的「热」指？',o:["程序运行中即时替换改动","电脑发烫","网红热点","紧急修复"],a:0,why:'不熄火换轮子——运行中的程序吃下改动。'}}, {id:'grayrelease',term:'灰度发布',full:'Gray Release / Canary',cn:'灰度发布',zone:'code',lv:2,new:true,tl:'<b>新版本先放一小部分用户试用</b>：5%→50%→100%，每步观察数据——出问题随时拉闸，只影响少数人。',ana:'像<b>新菜先请熟客试吃</b>：没问题再上菜单——直接全员上，翻车就是事故。',one:'新版本小范围试水的发布法',cf:'和「A/B 测试」的区别：A/B 是同时对比两版定优劣；灰度是渐进放量防翻车——一个做决策，一个保安全。',al:['Gray Release','金丝雀发布','Canary'],rel:['deploy','abtest','rollback'],scn:'大厂更新从不一次全量；你的查词工具每次发版前自己先手机验证一遍，就是个人版灰度。',dlg:[{q:'「金丝雀」什么梗？',a:'矿工带金丝雀下井探测毒气—— Canary 先飞，出事预警。'},{q:'灰度数据看什么？',a:'报错率、性能、核心指标——和旧版对比着看。'}],shot:'grayrelease',quiz:{q:'「灰度发布」最大的好处？',o:["不用测试","省服务器","出问题只影响小部分用户，随时可拉闸","上线速度更快"],a:2,why:'爆炸半径可控——新版本的事故从「全员」变「少数」。'}}, {id:'concurrency',term:'并发',full:'Concurrency',cn:'并发',zone:'code',lv:2,new:true,tl:'<b>同时接待多个请求的能力</b>：开多个窗口同时办业务，而不是一个窗口排长队——高并发是服务端的核心考题。',ana:'像<b>银行开多个柜台</b>：客户不用一个个等——窗口数就是并发能力，排队长度是延迟。',one:'同时接待多个请求的能力',cf:'和「吞吐量」的区别：并发是「同时接多少」，吞吐量是「一天接多少」——窗口数和日接待量。',al:['Concurrency','高并发'],rel:['throughput','latency','async'],scn:'公众号聊「秒杀系统」「高并发架构」是它；你用 AI 查词时系统的并发能力决定高峰期卡不卡。',dlg:[{q:'并发高有什么代价？',a:'资源消耗、数据竞争——所以有锁、队列、限流一整套配套。'},{q:'和异步什么关系？',a:'异步是实现并发的常用手段——不傻等才能同时伺候多人。'}],shot:'concurrency',quiz:{q:'「并发」描述的是？',o:["网速快","存储容量","代码行数","同时处理多个请求的能力"],a:3,why:'多窗口同时办业务——高并发架构的核心考题。'}}, {id:'loadbalance',term:'负载均衡',full:'Load Balancing',cn:'负载均衡',zone:'code',lv:3,new:true,tl:'<b>把请求分流到多台服务器</b>：一台扛不住就十台，前面加个「分流闸」均匀分发——高并发的标配搭档。',ana:'像<b>银行大堂经理</b>：客户进门先问他办什么，分配到空闲柜台——不让某台累死、某台闲死。',one:'把请求分流到多台服务器',cf:'和「消息队列」的区别：负载均衡是「分人」（实时分流），消息队列是「存单」（异步缓办）——不同拥堵用不同药。',al:['Load Balancing','负载均衡器'],rel:['throughput','server','cloud'],scn:'你访问的每个大网站背后都有它；单体服务变集群，第一件事就是加负载均衡。',dlg:[{q:'怎么分才均匀？',a:'轮询、最少连接、按响应速度——各有适用场景。'},{q:'某台挂了？',a:'自动摘除、流量转给健康节点——用户无感。'}],quiz:{q:'「负载均衡」的分发对象？',o:["流量按月分","进来的请求分给多台服务器","电费分摊","代码按行分"],a:1,why:'不让任何一台累死——集群稳定的前提。'}}, {id:'msgqueue',term:'消息队列',full:'Message Queue',cn:'消息队列',zone:'code',lv:3,new:true,tl:'<b>任务先排队慢慢办</b>：订单潮水般涌来先取号入队，后台按能力消化——高峰不崩、低谷不闲，削峰填谷。',ana:'像<b>餐厅取号等位</b>：客人爆满不让站着堵门，取号入队叫号入座——前厅后厨节奏解耦。',one:'任务排队慢慢办的缓冲池',cf:'和「负载均衡」的区别：负载均衡实时分流人；消息队列异步缓办事——实时业务和后台任务各取所需。',al:['Message Queue','MQ','消息中间件'],rel:['cron','automation','webhook'],scn:'抢票、秒杀、发验证码这类「瞬时洪峰」背后全靠它；系统解耦的神器——发单方和办单方互相不认识。',dlg:[{q:'排队会丢单吗？',a:'正规消息队列有持久化和确认机制——办完才销单，没办完重投。'},{q:'什么场景必须用？',a:'发送方和接收方节奏不匹配、或需要「必达」的异步任务。'}],shot:'msgqueue',quiz:{q:'「消息队列」的核心价值？',o:["削峰填谷+系统解耦","加密传输","美化界面","加速计算"],a:0,why:'瞬时洪峰排队消化，系统间互不拖累。'}}, {id:'middleware',term:'中间件',full:'Middleware',cn:'中间件',zone:'code',lv:3,new:true,tl:'<b>请求必经的「检查站」</b>：登录校验、日志记录、权限判断都做成统一的关卡，请求到达业务代码前先过一遍。',ana:'像<b>机场安检</b>：不管你飞哪，登机前一律过安检——检查逻辑集中一处，所有航班共享。',one:'请求必经的统一检查站',cf:'和「插件」的区别：插件给软件加功能；中间件是请求链路上的固定关卡——一个是扩展，一个是流程。',al:['Middleware','中间层'],rel:['api','server','febe'],scn:'技术面试高频词；理解它就懂了「登录状态怎么统一校验」「日志为什么全站都有」。',dlg:[{q:'哪些算中间件？',a:'身份验证、日志、限流、跨域处理——凡「所有请求都要过的」都算。'},{q:'能串联吗？',a:'能——安检完过海关，海关完再登机，按顺序层层通过。'}],quiz:{q:'「中间件」工作在哪个位置？',o:["浏览器里","显卡上","请求到达业务代码之前的统一关卡","数据库内部"],a:2,why:'登录校验、日志这类「人人都要过」的逻辑集中放这。'}}, {id:'polling',term:'轮询',full:'Polling',cn:'轮询',zone:'code',lv:3,new:true,tl:'<b>不停地问「好了吗」</b>：客户端每隔几秒主动拉一次数据——笨但简单的实时方案，WebSocket 出现前的主流。',ana:'像<b>蹲在锅边掀盖子</b>：每隔 10 秒看一次饭好没好——.websocket 则是饭好了锅自己喊你。',one:'反复主动拉取的笨办法',cf:'和「推送」的区别：轮询是客户端反复问，推送是服务端主动说——轮询简单但浪费，推送高效但复杂。',al:['Polling','轮询机制'],rel:['websocket','api','cron'],scn:'快递状态自动刷新、聊天 App 老版本拉消息，都是轮询；「长轮询」是它的改良版。',dlg:[{q:'轮询间隔怎么定？',a:'体验和成本的权衡：太短浪费请求，太长不实时——常见几秒。'},{q:'现在还用吗？',a:'用——简单场景、兼容性要求高的场景，轮询仍是省心选择。'}],quiz:{q:'「轮询」和「推送」的区别？',o:["有线 vs 无线","加密 vs 明文","快 vs 慢","客户端反复问 vs 服务端主动说"],a:3,why:'一个拉一个推——轮询简单但空转多，推送高效但要建通道。'}}, {id:'dbindex',term:'数据库索引',full:'Database Index',cn:'数据库索引',zone:'code',lv:2,new:true,tl:'<b>给数据建「目录」</b>：百万行不用逐行翻，走索引直达——查询快百倍，代价是写入变慢、占存储。',ana:'像<b>书的目录</b>：没人从头翻到尾找一章——先查目录定位页码。但目录页本身也要纸（存储）和维护（写入变慢）。',one:'给数据建目录加速查询',cf:'和「缓存」的区别：索引是数据的目录结构（常驻）；缓存是热门结果的临时副本（会过期）——一个加快找，一个免重找。',al:['Index','索引'],rel:['db','cache','bug'],scn:'「这个查询怎么这么慢」的第一排查项；数据量小感觉不到，百万行起步就是天壤之别。',dlg:[{q:'索引越多越好？',a:'不是——每个索引都拖慢写入，只为高频查询字段建。'},{q:'怎么知道要建？',a:'看慢查询日志——查询慢的字段，八成缺索引。'}],shot:'dbindex',quiz:{q:'「数据库索引」的代价是？',o:["不能删除","写入变慢、占额外存储","查询变慢","数据丢失"],a:1,why:'目录本身要维护——每写一行都得同步更新目录。'}}, {id:'sqli',term:'SQL 注入',full:'SQL Injection',cn:'SQL 注入',zone:'code',lv:2,new:true,tl:'<b>在输入框里「夹带私货」骗数据库</b>：密码框输入一段代码，让数据库把「校验条件」变成「永真」——经典攻击，常年霸榜。',ana:'像<b>在表格里夹带指令</b>：本该填「姓名」的格子写了「顺便把全库密码给我」——程序不设防就照办。',one:'输入框夹带代码骗数据库',cf:'和「提示词注入」的区别：SQL 注入骗数据库执行假条件；提示词注入骗大模型无视规矩——数据当命令执行，同一个病。',al:['SQL Injection','注入攻击'],rel:['db','injection','xss'],scn:'理解它就懂了「为什么输入框危险」「为什么登录框也要防」；AI 时代注入换成「提示词注入」，套路一脉相承。',dlg:[{q:'现在还有吗？',a:'少了但没绝迹——老系统、忽视安全的系统仍是重灾区。'},{q:'怎么防？',a:'参数化查询（输入永远当数据）+最小权限——基本功。'}],shot:'sqli',quiz:{q:'SQL 注入的攻击原理？',o:["把恶意代码混进输入，让数据库当命令执行","暴力猜密码","偷看网线数据","病毒附件"],a:0,why:'数据被当成命令执行——「输入不可信」是安全第一课。'}}, {id:'xss',term:'跨站脚本',full:'XSS / Cross-Site Scripting',cn:'跨站脚本',zone:'code',lv:3,new:true,tl:'<b>往网页里塞恶意脚本</b>：评论框写段代码，别人一打开这条评论，代码就在「他的浏览器」里执行——偷 cookie、冒充操作。',ana:'像<b>公告栏贴「假通知」</b>：管理员没审查，来的人照着假通知操作——受害的是看公告的人。',one:'往网页塞脚本害访客',cf:'和「SQL 注入」的区别：SQL 注入骗服务器，XSS 骗其他用户的浏览器——一个打后端一个打前端。',al:['XSS','跨站脚本攻击'],rel:['sqli','cookie','js'],scn:'理解它就懂了「为什么网页不能随便插代码」「cookie 为什么重要」——和 SQL 注入并称 Web 安全双璧。',dlg:[{q:'怎么防？',a:'用户输入一律转义（标签变文字）、cookie 加保护标记。'},{q:'名字为什么是 X 不是 S？',a:'避开 CSS 重名——跨站脚本缩写成 XSS。'}],quiz:{q:'XSS 攻击的受害者是？',o:["攻击者自己","数据库","看到被塞脚本页面的其他用户","服务器管理员"],a:2,why:'脚本在访客浏览器里执行——偷的是访客的 cookie 和身份。'}}, {id:'cliflags',term:'命令行参数',full:'Flags / Arguments',cn:'命令行参数',zone:'code',lv:3,new:true,tl:'<b>命令后面跟的「选项」</b>：ls -a、docker run -d——短横线+字母开关，决定这条命令「怎么干」。',ana:'像<b>点单备注</b>：咖啡本体是命令，「-去冰 -半糖」是参数——同一杯咖啡可以有多种定制。',one:'命令后面的定制开关',cf:'和「命令本体」的区别：命令是动词（做什么），参数是副词（怎么做）——copy 和 copy -r 是两件事。',al:['Flags','CLI Options','命令行选项'],rel:['cli','terminal','json'],scn:'用 Codex/Claude Code 的各种 flag（如指定模型、模式）就是它；看懂 --help 输出是命令行基本功。',dlg:[{q:'-a 和 --all 什么关系？',a:'同一个参数的短写和长写——单横线缩写、双横线全称。'},{q:'记不住怎么办？',a:'命令 --help 或 -h，几乎所有工具都有说明书。'}],quiz:{q:'命令行参数的作用？',o:["加密命令","美化输出字体","加速网速","定制这条命令怎么执行"],a:3,why:'同一个命令，参数不同行为不同——-r 就多递归一层。'}}, {id:'pipe',term:'管道',full:'Pipe',cn:'管道',zone:'code',lv:2,new:true,tl:'<b>命令之间的「接力棒」</b>：用 | 把上一条命令的输出，直接喂给下一条当输入——小工具串成流水线。',ana:'像<b>工厂流水线</b>：A 工位产出的半成品直接传给 B 工位——每站只干一件事，串起来干大活。',one:'命令间传输出的接力棒',cf:'和「重定向 >」的区别：> 是把输出写进文件（存起来）；| 是把输出传给下一条命令（继续加工）。',al:['Pipe','管道符'],rel:['cli','terminal','automation'],scn:'Unix 哲学的灵魂「做一件事，做好它」；你看 AI 生成的命令带 | 时知道是接力就行。',dlg:[{q:'能串多长？',a:'随意——三四条常见，串十几条的也大有人在。'},{q:'链路里一步出错？',a:'默认继续传（错误信息单独走一条通道），要看具体命令。'}],shot:'pipe',quiz:{q:'管道符 | 的作用？',o:["执行后台任务","把前一条命令的输出喂给后一条","画分隔线","表示「或者」"],a:1,why:'小工具串成流水线——每站只做一件事。'}}, {id:'ssh',term:'SSH 远程连接',full:'Secure Shell',cn:'SSH 远程连接',zone:'code',lv:2,new:true,tl:'<b>在自己电脑上安全操作远方服务器</b>：加密的远程终端——管理云服务器、提交代码的标配通道。',ana:'像<b>遥控驾驶</b>：人在家里，方向盘、油门直连千里外的车——所有操作加密传输，路上偷看不到。',one:'加密通道操作远方服务器',cf:'和「远程桌面」的区别：远程桌面传的是整个图形画面（重）；SSH 传的是命令行文字（轻）——服务器管理首选。',al:['SSH','Secure Shell'],rel:['terminal','vpn','twofa'],scn:'买云服务器后第一步 ssh 连上去；你听说的「密钥登录比密码登录安全」就是 SSH 的两种认证。',dlg:[{q:'「密钥登录」好在哪？',a:'不用密码（防猜解），密钥对匹配才放行——还可以加口令双重保护。'},{q:'端口 22 是什么？',a:'SSH 的默认门牌号——改掉它能挡住大量自动化攻击。'}],quiz:{q:'SSH 的核心特性？',o:["加密的远程命令行通道","图形化界面","免流量","自动写代码"],a:0,why:'全加密传输+密钥认证——远程管理服务器的标配。'}}, {id:'script',term:'脚本',full:'Script',cn:'脚本',zone:'code',lv:2,new:true,tl:'<b>写进文件的一串指令，跑一遍自动化完成</b>：备份、改名、批量处理——不用每次手动敲，「脚本小子」的起点。',ana:'像<b>食谱写下来</b>：口头说一遍就忘，写成菜谱（脚本）谁来都能照做——可复用、可交接。',one:'自动化重复动作的指令文件',cf:'和「程序」的区别：脚本是轻量自动化（解释执行、改了就生效）；程序是完整软件（编译打包）——修水管和盖楼。',al:['Script','脚本文件'],rel:['cli','automation','cron'],scn:'你的体检脚本、备份脚本都是它；AI 时代「写个脚本批量处理」是普通人最先用上的编程能力。',dlg:[{q:'脚本和命令行敲的命令什么区别？',a:'命令是一次性的；脚本存成文件可以反复跑、定时跑、交接给别人跑。'},{q:'会不会很危险？',a:'批处理有破坏力——先小范围试跑（dry run）再全量，是好习惯。'}],quiz:{q:'「脚本」最大的价值？',o:["界面好看","不需要电脑","把重复动作自动化、可复用","运行速度最快"],a:2,why:'写一次，以后每次一键执行——重复劳动的终结者。'}}, {id:'interpreter',term:'解释器',full:'Interpreter',cn:'解释器',zone:'code',lv:3,new:true,tl:'<b>边翻译边执行的语言环境</b>：Python、JS 改完立刻能跑——和「先整本翻译完再运行」的编译型（C/Go）相对。',ana:'像<b>同声传译 vs 出版翻译</b>：同传（解释）说一句译一句立刻反馈；出版（编译）整本翻好才发行——各有各的舞台。',one:'边翻译边执行的语言环境',cf:'和「编译器」的区别：编译器一次性翻完整本（快但要多一步编译）；解释器逐句翻（灵活但慢）——Python/C 的分野。',al:['Interpreter','解释执行'],rel:['compile','js','cli'],scn:'敲 python 进 REPL 边写边看结果，就是解释器在实时翻译；改完代码立刻见效（热重载）也拜它所赐。',dlg:[{q:'为什么 Python 不用编译？',a:'解释器实时翻译——灵活但运行慢，适合脚本和快速迭代。'},{q:'JS 也是解释执行？',a:'现代引擎用「即时编译」混合方案——既灵活又快。'}],quiz:{q:'「解释器」的工作方式？',o:["提前整本翻译成机器码","只检查不执行","把代码变成图片","逐句翻译立即执行"],a:3,why:'改一行跑一行——灵活快速迭代是解释型语言的生命力。'}}, {id:'venv',term:'虚拟环境',full:'Virtual Environment / venv',cn:'虚拟环境',zone:'code',lv:2,new:true,tl:'<b>每个项目一个独立的「调料柜」</b>：A 项目要老版本库、B 项目要新版本，互相隔离不串味——Python 新手第一课。',ana:'像<b>分厨房</b>：两家餐厅共用一个仓库必打架——各自小厨房各备各的料，菜单（依赖）自由。',one:'项目隔离的独立调料柜',cf:'和「容器」的区别：venv 隔离的是「库版本」这一层；Docker 隔离整个环境（含系统）——轻隔离和重隔离。',al:['venv','Virtual Env','虚拟环境'],rel:['env','pkg','dependency2'],scn:'AI 生成的 Python 项目十有八九先教你「创建虚拟环境」——不隔离，全局库版本冲突能把人逼疯。',dlg:[{q:'怎么创建？',a:'python -m venv 名字，然后激活——AI 会生成完整命令，照跑即可。'},{q:'能删吗？',a:'能，删了重建就行——里面只有库没有你的代码，代码在项目里。'}],shot:'venv',quiz:{q:'「虚拟环境」隔离的是什么？',o:["显示器","各项目的库版本互不干扰","网络连接","操作系统"],a:1,why:'A 要老版本 B 要新版本——分厨房解决「版本冲突」。'}}, {id:'issue',term:'Issue 工单',full:'Issue',cn:'Issue 工单',zone:'code',lv:3,new:true,tl:'<b>GitHub 上的问题登记处</b>：报 bug、提需求、讨论方案都开 Issue——开源项目协作的公共记事本。',ana:'像<b>餐厅的问题登记本</b>：菜咸了、想加新品、桌子晃了——一条条记下来，处理完关闭，全员可查。',one:'开源项目的问题登记本',cf:'和「讨论区」的区别：Issue 是可关闭、可追踪的任务单元；讨论区是无边界的聊天——办事用 Issue。',al:['Issue','工单','议题'],rel:['repo','git','wiki'],scn:'你逛开源仓库看到的 Issues 页就是它；给开源项目提 bug 也靠开 Issue——AI 项目没有之一。',dlg:[{q:'报 bug 怎么写？',a:'复现步骤+期望结果+实际结果——三件套齐了开发者才好下手。'},{q:'Issue 和 PR 什么关系？',a:'Issue 提问题，PR 交修复——很多 PR 就是为关闭某个 Issue 而生。'}],quiz:{q:'「Issue」在开源项目里是？',o:["问题与需求的公共登记单元","惩罚记录","下载页面","聊天室"],a:0,why:'一条 Issue 一个问题——记录、讨论、修复、关闭全程可追踪。'}}, {id:'staticsite',term:'静态网站',full:'Static Site',cn:'静态网站',zone:'code',lv:2,new:true,tl:'<b>预先做好的网页文件，直接发给访客</b>：没有服务器端计算——快、稳、便宜，博客和小工具的最优解。',ana:'像<b>印刷好的宣传册</b>：内容定稿印出来，谁来发的都一样——不用现做，翻得再快也不糊。',one:'预先生成好直接分发的网站',cf:'和「动态网站」的区别：动态网站每次请求现算（登录、下单）；静态网站内容固定（查词、博客）——按需选型。',al:['Static Site','静态站点'],rel:['html','deploy','domain'],scn:'你的查词工具就是静态网站——GitHub Pages 托管，零服务器成本、全球 CDN 加速、几乎不会宕机。',dlg:[{q:'静态网站不能登录？',a:'原生不能——登录需要服务端，或借助第三方服务（云端方案）。'},{q:'内容怎么更新？',a:'改文件重新发布——你的每周补新词自动化就是这条流水线。'}],quiz:{q:'「静态网站」的优势？',o:["一定要数据库","必须登录才能看","快、稳、便宜、几乎不宕机","能处理用户下单"],a:2,why:'文件现成的、CDN 直接发——没有计算就没有崩溃点。'}}, {id:'cloudfunc',term:'云函数',full:'Serverless / Cloud Function',cn:'云函数',zone:'code',lv:3,new:true,tl:'<b>只上传一个函数，服务器全托管</b>：有请求自动启动、没请求缩到零——「无服务器」不是没服务器，是你不用管服务器。',ana:'像<b>打车 vs 买车</b>：不用养车（服务器），用车（算力）时才计费——用一次付一次，闲置不花钱。',one:'不用管服务器 只上传函数',cf:'和「买服务器」的区别：服务器是包月租房（空转也付费）；云函数按调用计费（闲置为零）——流量波动大就选后者。',al:['Serverless','云函数','无服务器'],rel:['paas','deploy','api'],scn:'轻量 API、定时任务、Webhook 处理的最优解；你的自动化任务如果上云，首选就是云函数。',dlg:[{q:'「冷启动」是什么？',a:'长时间没请求实例被回收，下一个请求要多等几百毫秒「现起炉灶」。'},{q:'适合什么？',a:'突发、低频、轻计算——重计算常驻服务还是传统部署划算。'}],quiz:{q:'「云函数/Serverless」的计费特点？',o:["包月固定","按硬盘大小","买断制","按调用次数和时长计费，闲置为零"],a:3,why:'不用管服务器+按用量付费——轻量任务的性价比之王。'}}, {id:'timeout',term:'超时',full:'Timeout',cn:'超时',zone:'code',lv:3,new:true,tl:'<b>等太久自动放弃的机制</b>：连接 5 秒没响应就断开报错——没有它，一个卡死的请求能拖垮整个系统。',ana:'像<b>外卖超时自动取消</b>：等不起无限等——设定上限，超时止损、重新下单。',one:'等太久自动放弃的上限',cf:'和「延迟」的区别：延迟是「有多慢」（客观数值）；超时是「慢过阈值就放弃」（保护策略）——一个是测量，一个是保险丝。',al:['Timeout','超时机制'],rel:['latency','api','idem'],scn:'「请求超时」是小白最常见的报错之一；重试机制常和它配套——超时重试一次，配合幂等才安全。',dlg:[{q:'超时设多长合适？',a:'比正常响应略长、比用户忍耐略短——比如正常 1 秒，设 5 秒。'},{q:'超时后怎么办？',a:'重试（配合幂等）、降级（换个方案）或明确报错——绝不能无限等。'}],quiz:{q:'「超时机制」保护的是？',o:["界面美观","系统不被卡死的请求拖垮","网络速度","数据加密"],a:1,why:'没有超时=可以无限等——一个卡死请求的连锁反应能拖垮全局。'}}, {id:'dbtransaction',term:'数据库事务',full:'Transaction',cn:'数据库事务',zone:'code',lv:3,new:true,tl:'<b>要么全成、要么全不算</b>：转账「扣你的钱+加他的钱」必须同生共死——中间断电也不能出现钱没了人没收到。',ana:'像<b>一手交钱一手交货</b>：两个动作绑定成一个原子动作——任何一步失败，全部退回重来。',one:'要么全成要么全不算的原子操作',cf:'和「回滚」的区别：回滚是版本退回旧档；事务是操作组的原子性——「全组撤销」是事务的核心能力之一。',al:['Transaction','事务'],rel:['db','rollback','log'],scn:'支付、库存扣减这类「绝不能对不上账」的场景全靠它；「ACID」是它四大特性的缩写口诀。',dlg:[{q:'为什么转账必须事务？',a:'扣款成功加款失败=钱凭空消失——事务保证两步同生共死。'},{q:'并发下会乱吗？',a:'事务有隔离级别控制——这就是「并发+事务」成为面试名题的原因。'}],quiz:{q:'「事务」的核心保证？',o:["一组操作要么全成功要么全撤销","速度更快","数据加密","自动备份"],a:0,why:'原子性——钱不能凭空消失，账不能对不上。'}}, {id:'build',term:'构建打包',full:'Build',cn:'构建打包',zone:'code',lv:3,new:true,tl:'<b>源代码→可发布成品的流水线</b>：压缩、合并、转格式——你写的代码是「菜谱」，构建出的成品才是「菜」。',ana:'像<b>出版的印刷装订</b>：手稿（源码）不能直接卖，要排版、印刷、装订（构建）成书——读者拿到的是成品。',one:'源码变成品的生产流水线',cf:'和「编译」的区别：编译偏语言翻译（C→机器码）；构建是发布工程的总称（翻译+压缩+合并+打包）——编译常是构建的一环。',al:['Build','构建','打包'],rel:['deploy','compile','scaffold'],scn:'前端项目「npm run build」后才有 dist 目录可发布；你的查词工具源码=真源，发布副本=构建产物。',dlg:[{q:'为什么源码不直接发布？',a:'源码有注释、未压缩、体积大——构建后用户加载快，源码也得到保护。'},{q:'构建产物进 git 吗？',a:'一般不进——可随时重新构建，进 git 反而制造噪音。'}],quiz:{q:'「构建」的输入输出？',o:["图片进，压缩包出","需求进，设计出","源代码进，可发布成品出","用户数据进，报表出"],a:2,why:'菜谱变菜——中间的压缩、合并、转格式全是流水线工序。'}}, {id:'encryption',term:'加密',full:'Encryption',cn:'加密',zone:'code',lv:2,new:true,tl:'<b>用钥匙把数据变乱码，有钥匙才能还原</b>：对称加密一把钥匙开关，非对称加密公钥锁私钥开——安全的基石。',ana:'像<b>带锁的箱子寄快递</b>：对称是同一把钥匙锁和开（快，但钥匙怎么寄是个问题）；非对称是你寄开着的锁、钥匙不外传（解决送钥匙难题）。',one:'有钥匙才能还原的上锁',cf:'和「Base64」的区别：Base64 公开可逆人人能解（换装）；加密必须有钥匙（上锁）——「编码」和「加密」是两码事。',al:['Encryption','加密算法'],rel:['ssl','base64','hash'],scn:'理解它就分清了和 Base64 的本质区别（换装 vs 上锁）；HTTPS、端到端加密、SSH 全靠它撑着。',dlg:[{q:'对称和非对称怎么选？',a:'混合用——非对称安全交换钥匙，对称高速传数据（HTTPS 就这么干）。'},{q:'加密=绝对安全？',a:'算法是安全的，钥匙管理才是短板——钥丢=裸奔。'}],quiz:{q:'加密和 Base64 的本质区别？',o:["Base64 更安全","没有区别","加密不可逆","加密需要钥匙，Base64 人人可逆"],a:3,why:'换装 vs 上锁——一个防误读，一个防窥视。'}}, {id:'oauth',term:'第三方登录',full:'OAuth',cn:'第三方登录',zone:'code',lv:2,new:true,tl:'<b>「用微信登录」背后的协议</b>：跳转微信授权，你点同意后 App 只拿到一张限时通行证——密码永远不经过第三方。',ana:'像<b>酒店代客泊车</b>：给的是「代客泊车授权」（限定权限的通行证），不是「车钥匙全套」（账号密码）。',one:'授权拿通行证 不交密码',cf:'和「账号密码登录」的区别：密码登录把钥匙交出去；OAuth 只给限定权限的临时通行证——密码永远只存在微信那里。',al:['OAuth','第三方授权登录'],rel:['cookie','twofa','api'],scn:'你每天点的「微信登录」「Apple 登录」全是它；好处是密码不扩散+信任大厂托管——坏处是账号被平台拿捏。',dlg:[{q:'「授权了什么」怎么看？',a:'授权页写着权限范围（昵称/头像/手机号）——最小授权原则，能不给的不给。'},{q:'能撤销吗？',a:'能——微信/各平台的「账号安全」里有授权管理，定期清理是好习惯。'}],shot:'oauth',quiz:{q:'OAuth 登录时第三方 App 拿到什么？',o:["你的全部好友数据","一张限定权限的临时通行证","你的账号密码","你的微信支付密码"],a:1,why:'密码不经过第三方——授权的是「权限」不是「身份本体」。'}}, {id:'feframework',term:'前端框架',full:'Frontend Framework / React / Vue',cn:'前端框架',zone:'code',lv:3,new:true,tl:'<b>造网页的「预制体系」</b>：React、Vue 提供现成的组织方式和工具箱——不用从和泥砌墙开始盖房。',ana:'像<b>精装修套餐 vs 毛坯自装</b>：框架把水电、结构给你配好，你专注布置房间——大项目自装会疯。',one:'造网页的预制工具体系',cf:'和「原生 HTML/JS」的区别：原生是手搓（小项目灵活）；框架是体系（大项目不疯）——规模决定选择。',al:['React','Vue','前端框架'],rel:['febe','html','js'],scn:'AI 生成网页项目时问「用 React 还是 Vue」就是它；小红书/知乎/Figma 的网页版都是它们的杰作。',dlg:[{q:'小白要先学吗？',a:'不必——AI 时代让框架为你打工，懂概念（组件、状态）比会手写更重要。'},{q:'React 和 Vue 哪个好？',a:'都好——React 大厂生态广，Vue 上手温和——选哪个都能干成事。'}],quiz:{q:'「前端框架」的核心价值？',o:["大型网页项目 organized 不失控","让网页变好看","替代后端","免费服务器"],a:0,why:'规模一大，原生手搓必疯——框架提供组织和复用体系。'}}, {id:'component',term:'组件',full:'Component',cn:'组件',zone:'code',lv:3,new:true,tl:'<b>界面的「乐高积木块」</b>：按钮、卡片、输入框各做一个，处处复用——改一处，全站生效。',ana:'像<b>宜家标准化板材</b>：同一块板用在无数柜子上——坏了换一块，设计改一版全线更新。',one:'可复用的界面积木块',cf:'和「复制粘贴代码」的区别：复制粘贴改 bug 要改十处；组件改一处全站生效——复用是工程化的灵魂。',al:['Component','UI 组件'],rel:['febe','html','css'],scn:'你看到的「组件库」（Ant Design 等）就是现成积木包；AI 生成页面时也是按组件组装的思路。',dlg:[{q:'组件多大合适？',a:'单一职责——一个组件管一件事，太大就拆。'},{q:'和模板什么区别？',a:'模板是静态复用；组件带逻辑和状态——是「活」的积木。'}],quiz:{q:'「组件化」最大的好处？',o:["不需要后端","自动适配手机","一处修改全站生效，复用不重复","页面加载更快"],a:2,why:'改一处全线更新——可维护性是大型项目的命。'}}, {id:'responsive',term:'响应式设计',full:'Responsive Design',cn:'响应式设计',zone:'code',lv:3,new:true,tl:'<b>一套代码自适应手机/电脑/平板</b>：屏幕多宽就长成什么样——不是做三个网站，是一个网站会变形。',ana:'像<b>水倒入不同形状的容器</b>：水是同一份水（内容），杯圆则圆、杯方则方——布局跟着屏幕走。',one:'一套代码适配所有屏幕',cf:'和「单独做 App」的区别：响应式是一套网页全端通吃；App 是独立开发——成本和体验的权衡。',al:['Responsive Design','自适应布局'],rel:['html','css','febe'],scn:'你的查词工具手机竖屏单栏、电脑横屏双栏，就是响应式（v5.0 方案 A）；「媒体查询」是实现的关键技术。',dlg:[{q:'怎么判断网站做了响应式？',a:'拖动浏览器窗口宽度——布局跟着变化就是；或者手机和电脑打开排版都舒服。'},{q:'对 AI 生成页面意味着什么？',a:'AI 生成时必须带上响应式规则，否则手机上排版全乱——验收时要看真机。'}],quiz:{q:'「响应式设计」的核心思路？',o:["手机电脑各做一个站","只适配 iPhone","缩放整页","一套内容随屏幕宽度自动变形"],a:3,why:'同一份内容，容器变则布局变——一套代码全端通吃。'}}, {id:'permmode',term:'权限模式',full:'Permission Mode',cn:'权限模式',zone:'code',lv:3,new:true,tl:'<b>AI 干活前先问「允许动什么」的开关</b>：只读、可改指定文件、可跑命令、全自动——Claude Code 等工具的安全阀门。',ana:'像<b>给装修工人的授权等级</b>：只参观、可刷漆、可砸墙——等级越_high 越省事，翻车风险也越大。',one:'AI 能动什么的分级开关',cf:'和「沙箱」的区别：沙箱是物理隔离（关笼子里）；权限模式是规则授权（发通行证）——一个硬一个软，常配合使用。',al:['Permission Mode','权限模式'],rel:['sandbox','cli','guardrail'],scn:'你用 Claude Code 时的「逐个确认/本次会话允许/全自动」就是它；自动化效率和安全的平衡杆。',dlg:[{q:'什么时候开全自动？',a:'任务边界清晰、有版本控制兜底、重要文件已备份时——信任建立在流程上。'},{q:'默认建议？',a:'新手从逐个确认开始，熟悉了再放宽——宁可多按几次确认。'}],quiz:{q:'「权限模式」平衡的是？',o:["价格与质量","自动化效率与操作安全","网速与流量","美观与性能"],a:1,why:'全自动省事但危险，逐个确认安全但累——分级授权是平衡杆。'}}, {id:'planmode',term:'计划模式',full:'Plan Mode',cn:'计划模式',zone:'code',lv:3,new:true,tl:'<b>AI 先出方案你点头再动手</b>：只读分析、给出计划、不写一行代码——等你批准后切换执行。Claude Code 的安全起步档。',ana:'像<b>装修前先出效果图</b>：不动一砖一瓦，先看方案——满意的方案再施工，不满意的零成本重来。',one:'先出方案批准后再动手',cf:'和「直接执行」的区别：直接执行省事但可能南辕北辙；计划模式多一步确认——大活必开，小活随意。',al:['Plan Mode','计划模式'],rel:['spec','planexec','codingagent'],scn:'复杂任务起步的最佳档位：让 AI 先读懂代码库出计划，你审完批准再执行——你的「先出方案不执行」习惯的官方形态。',dlg:[{q:'什么时候用？',a:'复杂任务、改动面大、你不确定 AI 理解对不对的时候——先看计划再放行。'},{q:'计划模式会变慢吗？',a:'多一轮往返，但减少了「跑偏重做」——大任务总耗时反而更短。'}],quiz:{q:'「计划模式」的流程？',o:["只读分析出计划 → 你批准 → 再执行","直接干完再汇报","只写测试不写代码","只能查资料"],a:0,why:'先看图纸再施工——方向错了零成本纠偏。'}}, {id:'ux',term:'用户体验',full:'User Experience / UX',cn:'用户体验',zone:'abbr',lv:2,new:true,tl:'<b>用起来「顺手不顺手」的学问</b>：功能都一样，有的产品让人爱不释手、有的让人想摔手机——差的就是 UX。',ana:'像<b>两家味道一样的餐厅</b>：一家排队混乱、一家动线顺滑——味道之外的全是 UX。',one:'把能用的打磨成好用的',cf:'和「UI」的区别：UI 是「长相」，UX 是「整个过程顺不顺」——长相好不等于好用。',al:['User Experience','用户体验设计'],rel:['febe','aiglasses','dashboard2'],scn:'公众号聊「某 App 改版被骂」背后是它；你的查词工具首页怎么排、搜索怎么联想，全是 UX 决策。',dlg:[{q:'UX 和 UI 怎么分？',a:'UI 管好看，UX 管好用——美的界面配反人类流程，照样被骂。'},{q:'怎么提升？',a:'看用户怎么用而不是听他怎么说——行为数据比口头反馈诚实。'}],shot:'ux',quiz:{q:'「UX 用户体验」关注的是？',o:["服务器成本","代码是否优雅","使用过程的顺畅度和感受","界面配色好不好看"],a:2,why:'功能一样、体验天差地别——差的就是 UX。'}}, {id:'npu',term:'神经处理单元',full:'Neural Processing Unit / NPU',cn:'神经处理单元',zone:'abbr',lv:2,new:true,tl:'<b>芯片里的「AI 专用车道」</b>：CPU 什么都会但不专、GPU 大批量但费电，NPU 专攻神经网络运算——省电又快。',ana:'像<b>三种车道</b>：CPU 全能车道、GPU 十车道高速、NPU 是 AI 专用 BRT——AI 任务走它最省油。',one:'芯片里的 AI 专用车道',cf:'和「GPU」的区别：GPU 靠通用并行硬扛 AI；NPU 为神经网络电路级优化——同任务更省电。',al:['NPU','AI 芯片'],rel:['edgeai','gpu','humanoid'],scn:'手机发布会讲的「本地大模型」「AI 拍照」都靠 NPU；「这台手机 AI 强不强」第一看 NPU 算力。',dlg:[{q:'为什么手机需要 NPU？',a:'云端 AI 有隐私和延迟问题——NPU 让 AI 本地实时跑，还不费电。'},{q:'看参数怎么比？',a:'看 TOPS（每秒万亿次运算）——但架构不同数字仅供参考。'}],shot:'npu',quiz:{q:'NPU 相比 GPU 的核心优势？',o:["跑游戏更快","更便宜","更通用","跑 AI 任务更省电"],a:3,why:'电路级为神经网络定制——AI 任务能效比碾压。'}}, {id:'tpu',term:'张量处理器',full:'Tensor Processing Unit / TPU',cn:'张量处理器',zone:'abbr',lv:3,new:true,tl:'<b>Google 自研的 AI 芯片</b>：为自家模型训练推理量身定做——云上租算力时「TPU 实例」就是它。',ana:'像<b>自家车队专用卡车</b>：市面上有通用卡车（GPU），Google 给自己的物流线路造了专用车。',one:'Google 自研的 AI 芯片',cf:'和「NPU」的区别：NPU 装在终端本地跑；TPU 在数据中心训练推理——一个端一个云。',al:['TPU','Tensor Processing Unit'],rel:['npu','compute','cloud'],scn:'公众号聊「Google 算力自给」「TPU 集群训练大模型」是它；和 NPU/GPU 同属 AI 算力三兄弟。',dlg:[{q:'能买到 TPU 吗？',a:'硬件买不到，Google Cloud 能租——很多大模型就是 TPU 训的。'},{q:'和 GPU 二选一？',a:'训练推理各有胜负——生态绑定和价格才是决策关键。'}],quiz:{q:'TPU 是谁家的 AI 芯片？',o:["英伟达","Google","苹果","小米"],a:1,why:'Tensor Processing Unit——Google 为自家模型定制的算力底座。'}}, {id:'mvp',term:'最小可行产品',full:'Minimum Viable Product / MVP',cn:'最小可行产品',zone:'abbr',lv:1,new:true,tl:'<b>能跑通核心流程的最简版本</b>：先上线 20% 的功能验证「有没有人要」，再决定投入剩下 80%——创业第一课。',ana:'像<b>先摆摊卖三笼包子</b>：有人排队再开店——别装修完整条街才发现没人爱吃。',one:'先做最简版验证需求',cf:'和「Demo」的区别：Demo 是给人看的演示（不求能用）；MVP 是给真人用的产品（必须能跑通闭环）。',al:['Minimum Viable Product','MVP 产品'],rel:['solopreneur','pmf','poc'],scn:'你做 IP 工具、AI 产品的路线图就是它；「一人公司」方法论的核心词——先验证需求再重投入。',dlg:[{q:'MVP 要多简？',a:'简到只剩核心闭环——用户能完成最关键的那件事，其他全砍。'},{q:'验证什么？',a:'验证「有人愿意用/付钱」，不是验证「功能做全了」。'}],shot:'mvp',quiz:{q:'「MVP」的核心理念？',o:["先做最简可用版本验证需求，再决定投入","一步到位做完美产品","功能越多越好","先招齐团队再开工"],a:0,why:'用最小成本验证「有没有人要」——避免闷头半年没人要。'}}, {id:'pmf',term:'产品市场契合',full:'Product-Market Fit / PMF',cn:'产品市场契合',zone:'abbr',lv:3,new:true,tl:'<b>产品刚好接住市场需求的状态</b>：用户自发口口相传、留存高、不推也涨——创业的分水岭（之前是找，之后是放大）。',ana:'像<b>钥匙插对了锁</b>：拧不动是没契合（再用力也没用），契合了轻轻一转就开。',one:'产品和需求对上眼了',cf:'和「MVP」的区别：MVP 是验证需求的工具；PMF 是验证通过的状态——做 MVP 就是为了找到 PMF。',al:['Product-Market Fit','PMF'],rel:['mvp','poc','solopreneur'],scn:'公众号聊「找到 PMF 才算活下来」是它；和 MVP 是接力——MVP 是找 PMF 的工具。',dlg:[{q:'怎么判断到没到？',a:'经典信号：不用推广也有自然增长、留存曲线走平不归零。'},{q:'没到怎么办？',a:'转型或换需求——没契合前放大投入=加速死亡。'}],quiz:{q:'「PMF」描述的状态是？',o:["团队扩大了","功能做全了","产品刚好满足市场需求，增长自发发生","融到资了"],a:2,why:'钥匙插对锁——之前是找钥匙，之后才是放大。'}}, {id:'poc',term:'概念验证',full:'Proof of Concept / POC',cn:'概念验证',zone:'abbr',lv:3,new:true,tl:'<b>先做个样品证明「技术上走得通」</b>：不管好看、不管规模，只回答一个问题——这事到底能不能成。',ana:'像<b>先做纸板原型</b>：不是最终产品，但能证明结构成立——纸板都立不住，钢架也白搭。',one:'先做样品证明可行',cf:'和「MVP」的区别：POC 证明技术可行（给内部看）；MVP 证明有人要用（给市场看）——一先一后。',al:['Proof of Concept','POC'],rel:['mvp','pmf','solopreneur'],scn:'企业采购 AI 方案常见流程：POC 验证→试点→采购；给客户演示「AI 能做什么」的 demo 就是 POC 思路。',dlg:[{q:'POC 要做多久？',a:'几天到几周——超过一个月说明范围太大，该砍。'},{q:'通过就稳了？',a:'不——POC 是理想环境跑通，真实环境的脏数据才是考验。'}],quiz:{q:'「POC」要回答的问题是？',o:["要不要上市","定价多少","找谁融资","技术上到底走不走得通"],a:3,why:'纸板原型先立起来——技术可行性的最低成本验证。'}}, {id:'roi',term:'投入产出比',full:'Return on Investment / ROI',cn:'投入产出比',zone:'abbr',lv:2,new:true,tl:'<b>花 1 块钱收回几块钱</b>：ROI>1 才值得做——衡量任何投入（广告、工具、人力）值不值的最通用标尺。',ana:'像<b>鱼塘投喂</b>：扔 10 斤料捞回 8 斤鱼是亏的——饲料钱和鱼钱的比值一目了然。',one:'花的钱收回了几倍',cf:'和「利润率」的区别：利润率看单笔生意；ROI 看一笔投入的整体回报——买设备、投广告都用它。',al:['Return on Investment','ROI'],rel:['ctrcvr','kpi','saas2'],scn:'你投流、买工具、接商单都在算它；「这个 AI 工具值不值订阅」的本质就是 ROI——省下的时间×时薪 vs 订阅费。',dlg:[{q:'怎么算？',a:'（收益-投入）÷投入——花 1 万赚 1.5 万，ROI=0.5。'},{q:'AI 工具怎么算？',a:'省下的时间×时薪+多赚的钱，对比订阅费——多数自动化工具轻松回本。'}],quiz:{q:'「ROI」衡量的是？',o:["用户总数","投入与回报的比值","团队规模","功能多少"],a:1,why:'花 1 块回几块——一切投入值不值的最通用标尺。'}}, {id:'lts',term:'长期支持版',full:'Long-Term Support / LTS',cn:'长期支持版',zone:'abbr',lv:3,new:true,tl:'<b>官方承诺「修 bug 修很多年」的稳定版本</b>：不追新功能，只保安全——正经项目都选 LTS 而不是最新版。',ana:'像<b>餐厅的招牌菜</b>：新品会变会下架，招牌菜长期供应且品质稳定——服务器环境选它的理由。',one:'承诺多年维护的稳定版',cf:'和「最新版」的区别：最新版有新功能但变动大；LTS 砍新功能换多年维护——尝鲜和生产各取所需。',al:['LTS','长期支持版本'],rel:['semver','beta','deploy'],scn:'装 Node/Python/Ubuntu 选 LTS 是铁律——新功能版适合尝鲜，生产环境要的是「别出幺蛾子」。',dlg:[{q:'LTS 会一直更吗？',a:'维护到承诺期结束（通常数年）——到期前记得规划升级。'},{q:'什么时候选非 LTS？',a:'想用新特性、能承受变动的开发环境——生产永远 LTS。'}],quiz:{q:'选 LTS 版本的核心理由？',o:["长期安全维护，稳定不折腾","功能最新","速度最快","免费其他收费"],a:0,why:'生产环境要的是「别出幺蛾子」——LTS 用维护换稳定。'}}, {id:'flops',term:'算力单位',full:'FLOPS',cn:'FLOPS（每秒浮点运算）',zone:'abbr',lv:3,new:true,tl:'<b>算力的计量单位</b>：每秒能做多少次浮点运算——前面的量词（万亿/PFLOPS）决定算力档次。',ana:'像<b>厨房出餐速度</b>：每秒能炒几个菜——FLOPS 是 AI 算力的「出餐速度表」。',one:'每秒运算次数的计量',cf:'和「参数量」的区别：参数量是模型多大；FLOPS 是算得多快——图书馆厚度和翻书速度。',al:['FLOPS','PFLOPS'],rel:['compute','npu','gpu'],scn:'公众号聊「万卡集群」「多少 EFLOPS」是它；E 级（百亿亿）是当前大厂军备竞赛的计量单位。',dlg:[{q:'训练一个大模型要多少算力？',a:'头部模型按「万卡×数月」计——换算成 FLOPS 是天文数字。'},{q:'买卡看什么？',a:'FP16/BF16 算力（AI 精度）+显存，别只看游戏帧数。'}],quiz:{q:'「FLOPS」计量的是？',o:["网速","电费","每秒浮点运算次数（算力）","存储容量"],a:2,why:'AI 算力的出餐速度表——EFLOPS 级是大厂竞赛单位。'}}, {id:'daumau',term:'日活 / 月活',full:'DAU / MAU',cn:'日活 / 月活',zone:'abbr',lv:2,new:true,tl:'<b>每天/每月有多少人真的在用</b>：下载量是虚的，日活月活才是真热度——两者的比值还藏着粘性秘密。',ana:'像<b>餐厅客流</b>：办卡人数是虚的，每天来吃才是真的——月卡多少人天天来，说明菜真香。',one:'每天每月真在用的人数',cf:'和「注册量」的区别：注册是「来过」，日活是「今天又来了」——前者虚后者实。',al:['DAU','MAU','日活月活'],rel:['saas2','kpi','heatmap'],scn:'公众号聊「某产品日活破亿」「月活下滑」是它；DAU/MAU 比值高=天天用（微信级），低=偶尔用（工具级）。',dlg:[{q:'DAU/MAU 比值怎么看？',a:'除一下：0.5+ 是高频神器，0.1 以下是低频工具——粘性一目了然。'},{q:'为什么大厂都晒 DAU？',a:'日活代表真实注意力和数据飞轮转速——投资市场认这个。'}],quiz:{q:'「日活（DAU）」的准确定义？',o:["注册用户总数","付费用户数","下载次数","某一天真实使用产品的人数"],a:3,why:'每天来的是日活——下载量和注册量都是虚的。'}}, {id:'ctrcvr',term:'点击率 / 转化率',full:'CTR / CVR',cn:'点击率 / 转化率',zone:'abbr',lv:2,new:true,tl:'<b>漏斗的两个关键阀门</b>：CTR 看多少人点进来（吸引），CVR 看点进来的人多少成交（说服）——IP 变现的核心指标。',ana:'像<b>店铺的两道关</b>：门头吸引路人进店（CTR），店内话术促成下单（CVR）——进店多不买=话术差，进店少=门头差。',one:'吸进来多少人 成交多少人',cf:'和「完播率」的区别：完播率是内容端「看完了没」，CTR/CVR 是转化端「进没进、买没买」——漏斗不同层。',al:['CTR','CVR','点击率转化率'],rel:['abtest','landing','kpi'],scn:'你的公众号场景：标题封面决定 CTR，正文引导决定 CVR；AI 批量生成标题后 A/B 测 CTR 就是氛围营销的日常。',dlg:[{q:'CTR 高 CVR 低说明什么？',a:'标题党了——吸引来的不是目标用户，改进定向和落地页。'},{q:'整体怎么提升？',a:'先定位漏斗哪层漏——一层层修，别全链路瞎猜。'}],quiz:{q:'CTR 高但 CVR 低，最可能的原因？',o:["服务器慢","吸引来的不是目标用户（标题党）","内容质量太高","价格太低"],a:1,why:'进店多买得少=来错人了——修定向和承接页。'}}, {id:'gmv',term:'成交总额',full:'Gross Merchandise Volume / GMV',cn:'成交总额',zone:'abbr',lv:3,new:true,tl:'<b>平台成交的总流水</b>：包括取消、退货——电商/直播带货晒规模的首选数字（水分也在这）。',ana:'像<b>菜市场的流水账</b>：所有摊位开单金额加起来——听着风光，刨掉退货未付款才是真金。',one:'平台成交的总流水',cf:'和「营收」的区别：GMV 是流水（含退款取消），营收是公司确认收入——GMV 常是营收的数倍。',al:['GMV','成交总额'],rel:['ctrcvr','saas2','kpi'],scn:'直播间晒「GMV 破亿」要留心眼：GMV 含退款——「实际支付口径」才是真成交。',dlg:[{q:'为什么平台爱晒 GMV？',a:'数字大口径宽——投资叙事和招商都好用，看财报要问口径。'},{q:'带货怎么算自己的？',a:'盯「实际支付 GMV」和退货率——退款后才是佣金基数。'}],quiz:{q:'GMV 数字的水分主要在？',o:["包含取消和退货的订单","算错小数点","含税不含税","汇率换算"],a:0,why:'流水口径宽——实际支付+退货率才是真金。'}}, {id:'sql',term:'数据库查询语言',full:'SQL / Structured Query Language',cn:'SQL 查询语言',zone:'abbr',lv:2,new:true,tl:'<b>和数据库对话的通用语言</b>：SELECT 查、INSERT 存、UPDATE 改——诞生五十年，仍是数据世界的硬通货。',ana:'像<b>和图书馆管理员对话的标准句式</b>：「帮我找 2024 年出版、作者姓李的书」——条件说得越准拿得越准。',one:'和数据库对话的通用语言',cf:'和「Excel 公式」的区别：Excel 管一张表；SQL 管整个数据库的多表关联——百万行时只有它扛得住。',al:['SQL','结构化查询语言'],rel:['db','dbindex','bitable'],scn:'分析数据、导出表格时底层都是 SQL 在跑；AI 时代「自然语言转 SQL」让小白也能用。',dlg:[{q:'小白要学吗？',a:'可以不写但要会读——看懂 AI 生成的 SQL 在查什么就够。'},{q:'和「SQL 注入」？',a:'SQL 是语言，注入是把恶意 SQL 塞进输入框——语言无罪使用不当出事。'}],quiz:{q:'「SQL」的用途？',o:["训练模型","写网页样式","查询和操作数据库","画图表"],a:2,why:'五十年的硬通货——数据世界的通用对话语言。'}}, {id:'xml',term:'XML 标记语言',full:'XML / eXtensible Markup Language',cn:'XML 标记语言',zone:'abbr',lv:3,new:true,tl:'<b>用标签包裹数据的「快递单」格式</b>：收件人、地址都用标签标好——JSON 的前辈，企业系统里仍常见。',ana:'像<b>格式统一的传统快递单</b>：字段齐全谁都能读，就是啰嗦——新系统多用 JSON，老系统离不开 XML。',one:'用标签包数据的快递单',cf:'和「HTML」的区别：同是标签语言，HTML 标签是显示用的（固定）；XML 标签是自定义的数据含义。',al:['XML','可扩展标记语言'],rel:['json','html','yaml'],scn:'看公众号底层数据源、企业接口文档会撞见；遇到别慌——AI 一秒帮你转成 JSON。',dlg:[{q:'和 JSON 选哪个？',a:'新项目 JSON 几乎必胜——更短更好读；企业老系统仍是 XML。'},{q:'为什么还没死？',a:'存量系统巨大+某些领域标准成熟——换不动。'}],quiz:{q:'XML 和 JSON 的关系？',o:["XML 更短","毫无关系","JSON 是图片格式","XML 是前辈，JSON 更短更流行"],a:3,why:'标签快递单 vs 简洁便签——老系统 XML、新系统 JSON。'}}, {id:'http',term:'超文本传输协议',full:'HTTP',cn:'HTTP 超文本传输协议',zone:'abbr',lv:2,new:true,tl:'<b>浏览器和服务器说话的规矩</b>：一问一答、有来有回——GET 要、POST 交、404 没找到，全是它定的。',ana:'像<b>邮局的标准信封格式</b>：地址怎么写、正文怎么标——全网统一，谁的信都能送达。',one:'浏览器和服务器对话的规矩',cf:'和「REST API」的区别：HTTP 是传输规矩（信封格式）；REST 是用它设计接口的风格——地基和建筑风格。',al:['HTTP','HTTPS'],rel:['ssl','api','ssr'],scn:'网页报错「404 Not Found」是它的状态码；「HTTPS 加了把锁」是它的安全版——小白最常撞见的协议。',dlg:[{q:'404 是什么意思？',a:'你要的东西我这没有——链接失效或地址打错。'},{q:'HTTPS 的 S？',a:'Secure——HTTP 外面套一层 SSL/TLS 装甲，路上没人偷看。'}],shot:'http',quiz:{q:'「404」状态码的含义？',o:["网速太慢","你要的内容服务器上没有","服务器崩了","你没登录"],a:1,why:'404=Not Found——链接失效或地址打错。'}}, {id:'ssd',term:'固态硬盘',full:'SSD / Solid State Drive',cn:'固态硬盘',zone:'abbr',lv:3,new:true,tl:'<b>没有机械部件、靠闪存芯片存数据的硬盘</b>：快、静、抗震——本地跑 AI 的第一升级（模型加载快几十倍）。',ana:'像<b>从翻抽屉找文件到搜索直达</b>：机械盘要转盘寻道，固态电子寻址——快几十倍。',one:'闪存芯片的快速硬盘',cf:'和「内存」的区别：内存断电即失（工作台）；SSD 断电不失（仓库）——仓库再快也比工作台慢。',al:['SSD','固态硬盘'],rel:['local','vram','clouddisk'],scn:'本地跑大模型第一件事是把模型放 SSD——机械盘加载几十 GB 权重要等到天荒地老。',dlg:[{q:'买电脑看什么？',a:'容量之外看「是否 NVMe 协议」——同为固态速度差几倍。'},{q:'机械盘淘汰了吗？',a:'冷数据备份仍便宜大碗——仓库盘还有位置。'}],quiz:{q:'本地跑大模型推荐把模型放哪？',o:["SSD 固态硬盘（加载快）","机械硬盘","光盘","软盘"],a:0,why:'几十 GB 权重的读取速度——机械盘等到天荒地老。'}}, {id:'endpoint',term:'API 端点',full:'API Endpoint',cn:'API 端点',zone:'abbr',lv:3,new:true,tl:'<b>API 的「具体门牌地址」</b>：/chat 是聊天门牌、/translate 是翻译门牌——一个服务一串门牌。',ana:'像<b>大楼 vs 具体房间</b>：API 是这栋楼，端点是具体去哪个房间办哪件事——找错房间办错事。',one:'API 里具体办某事的门牌',cf:'和「API」的区别：API 是整套服务的总称；端点是里面具体功能的地址——总台和具体窗口。',al:['Endpoint','端点'],rel:['api','api3','json'],scn:'调 AI API 时文档里的「接口地址」就是端点；404 报错十有八九是端点打错或版本更新换了门牌。',dlg:[{q:'端点会变吗？',a:'会——版本升级常换（v1→v2），代码里端点别写死，进配置。'},{q:'怎么知道有哪些？',a:'看 API 文档或 OpenAPI 规范——列得清清楚楚。'}],quiz:{q:'「API 端点」是？',o:["机房位置","加密方式","API 中具体功能的访问地址","收费柜台"],a:2,why:'大楼里的具体房间——找错房间办错事。'}}, {id:'dl',term:'深度学习',full:'Deep Learning / DL',cn:'深度学习',zone:'abbr',lv:2,new:true,tl:'<b>用「多层神经网络」学的机器学习方法</b>：层数越深能学的越复杂——2012 年「深」起来后 AI 才爆发。',ana:'像<b>学认字</b>：一层认笔画、一层认偏旁、一层认整字——层层叠加，从像素学到语义。',one:'多层神经网络的学习方法',cf:'和「机器学习」的区别：机器学习是爹（各种学法）；深度学习是儿子里最能打的（专指多层神经网络）。',al:['DL','Deep Learning'],rel:['ml','transformer','training'],scn:'承接已删「神经网络」的概念面：公众号聊「深度学习革命」说的就是 2012 年那个拐点。',dlg:[{q:'为什么叫「深」？',a:'层数深——几十层上百层，层层提取越来越抽象的特征。'},{q:'一直深下去有尽头吗？',a:'数据、算力、架构三条腿——「更深」只是手段之一了。'}],shot:'dl',quiz:{q:'「深度学习」的「深」指？',o:["内容深奥","需要深海数据中心","学习时间长","神经网络的层数多"],a:3,why:'层层叠加的神经网络——从像素学到语义。'}}, {id:'lanwan',term:'内网与公网',full:'LAN / WAN',cn:'内网与公网',zone:'abbr',lv:2,new:true,tl:'<b>家里的小圈子 vs 全世界的大广场</b>：内网 IP（192.168.x.x）只有自家路由器认识，公网 IP 全球唯一直达。',ana:'像<b>小区楼牌 vs 收件地址</b>：「3 栋 502」出了小区没人懂；「XX 路 XX 号」全世界快递员都能送。',one:'家里的小圈子和全世界',cf:'和「VPN」的关系：VPN 是从外面接回内网的加密隧道——人在酒店也能像在家。',al:['LAN','WAN','内网公网'],rel:['ip','router','vpn'],scn:'NAS、打印机共享、家用摄像头都在内网；出差访问家里设备要「内网穿透」——远程办公高频场景。',dlg:[{q:'怎么判断我在内网？',a:'IP 是 192.168 / 10 / 172 开头基本就是内网地址。'},{q:'公司电脑为什么访问不了某些网站？',a:'公司内网+防火墙策略——你的机器在内网规则之下。'}],shot:'lanwan',quiz:{q:'192.168.x.x 这种 IP 是？',o:["错误地址","内网地址，只在局域网内有效","公网地址","IPv6"],a:1,why:'内网专用段——出了家门没人认识这个门牌。'}}, {id:'liandan',term:'炼丹',full:'模型训练黑话',cn:'炼丹',zone:'misc',lv:2,new:true,tl:'<b>训练模型的圈内黑话</b>：数据是药方、显卡是炉子、参数是火候——炼废了白烧几十万电费，炼成了出「金丹」。',ana:'像<b>太上老君的炼丹炉</b>：配方保密、火候靠经验、成不成看天意——「玄学」由此而来。',one:'训练模型的圈内黑话',cf:'和「推理」的区别：炼丹是训练（造模型，烧钱玄学）；推理是用模型（跑答案，按量付费）——开炉和用丹。',al:['模型训练黑话','开炉'],rel:['training','compute','gpu'],scn:'技术社区自嘲高频词：「今天开炉」「这批炼废了」；理解它就懂了为什么训练又贵又不可预测。',dlg:[{q:'炼丹师是什么职业？',a:'算法工程师的自嘲——调参像抽卡，同配方不同结果。'},{q:'「玄学」在哪？',a:'同数据同参数，随机种子不同结果天差地别——经验+运气缺一不可。'}],shot:'liandan',quiz:{q:'AI 圈的「炼丹」指？',o:["训练模型（数据配方+算力炉子）","炼制矿物颜料","给显卡除尘","密码破解"],a:0,why:'药方数据、炉子算力、火候参数——训练的黑话画像。'}}, {id:'license',term:'开源许可证',full:'Open Source License',cn:'开源许可证',zone:'misc',lv:2,new:true,tl:'<b>开源代码/模型的「使用条款」</b>：MIT 随便用署名就行、GPL 用了就得开源、部分模型禁止商用——白拿前先看条款。',ana:'像<b>共享菜谱的三种声明</b>：「随便做署名就行」（MIT）、「改良了也必须共享」（GPL）、「只能家里做不能开店卖」（非商用）。',one:'开源作品的使用条款',cf:'和「版权」的区别：版权是法律默认保护一切；许可证是作者主动开放部分权利——开源世界的合同。',al:['License','开源协议'],rel:['oss','hf','weights'],scn:'用开源模型商用前必查项；你的 AI 产品用了某开源组件，许可证传染可能要求整个项目开源。',dlg:[{q:'Llama 系注意什么？',a:'有用户量门槛和商用条款——月活过亿需申请。'},{q:'GPL 传染是什么？',a:'你的代码用了 GPL 代码，整个项目可能被要求同样开源。'}],shot:'license',quiz:{q:'「开源许可证」的作用？',o:["自动生成文档","防止下载","规定代码/模型能怎么用（含商用限制）","保证代码质量"],a:2,why:'白拿前先看合同——GPL 传染和商用限制是两大坑。'}}, {id:'aiinterviewer',term:'AI 面试官',full:'AI Interviewer',cn:'AI 面试官',zone:'misc',lv:3,new:true,tl:'<b>AI 当考官面你</b>：简历初筛、视频面试打分、模拟问答——求职链路从投简历到终面全面 AI 化。',ana:'像<b>先过机器人关再见到真人 boss</b>：第一轮 AI 筛人省成本，你能见到真人说明已经赢了一半。',one:'AI 当考官筛选和面试',cf:'和「AI 简历筛选」的区别：筛选是初筛关键词；AI 面试官更进一步——视频问答实时打分。',al:['AI Interviewer','AI 面试'],rel:['aigc','prompeng','agent'],scn:'求职公众号高频话题；反过来它也是你的陪练——用 AI 模拟面试提前排练，已是求职标配。',dlg:[{q:'怎么应对 AI 面试官？',a:'关键词对齐岗位、表达结构化（结论先行）——AI 吃这一套。'},{q:'公平吗？',a:'算法偏见是真实风险——所以多数流程仍保留真人终面。'}],quiz:{q:'「AI 面试官」最常见的用途？',o:["替你上班","发 offer","算工资","初筛简历+视频面试打分"],a:3,why:'第一轮 AI 省成本——见到真人说明赢了一半。'}}, {id:'aidiagnosis',term:'AI 问诊',full:'AI Diagnosis',cn:'AI 问诊',zone:'misc',lv:2,new:true,tl:'<b>AI 辅助看病</b>：读片诊断、预诊分诊、健康问答——公众号高频话题，监管严格（辅助为主，不能替代医生）。',ana:'像<b>老专家的会诊助手</b>：看片比人细、知识比人全，但签字担责的仍是医生。',one:'AI 辅助看病 但不替代医生',cf:'和「健康问答 App」的区别：医院内的是辅助诊断工具（医生用）；市面 App 是轻咨询（不能诊断开药）。',al:['AI Diagnosis','AI 辅助诊断'],rel:['aitherapy','cv2','ocr'],scn:'公众号聊「AI 读片准确率超医生」「AI 预诊试点」是它；关键词是「辅助」——法规和责任都还在医生这边。',dlg:[{q:'能替代医生吗？',a:'不能——读片可以辅助，开药手术的责任链必须是人。'},{q:'价值在哪？',a:'基层医疗资源不足时，AI 预诊能分流出真正需要专家的病人。'}],quiz:{q:'「AI 问诊」的合规定位？',o:["只能买药","辅助诊断，不替代医生","完全替代医生","只能挂号"],a:1,why:'技术再准，责任链和法规都在医生这边——关键词是「辅助」。'}}, {id:'aitherapy',term:'AI 心理陪伴',full:'AI Therapy',cn:'AI 心理陪伴',zone:'misc',lv:3,new:true,tl:'<b>AI 当「树洞」和情绪出口</b>：随时倾听、无评判回应——慰藉孤独的明星场景，也是伦理争议的中心。',ana:'像<b>一个永远在线、永远耐心的倾听者</b>：凌晨三点也能聊——但它的「共情」是概率，不是感情。',one:'AI 当树洞提供情绪出口',cf:'和「AI 伴侣」的区别：伴侣偏长期关系扮演；心理陪伴偏单点情绪疏导——都卡在「依赖」的伦理线上。',al:['AI Therapy','AI 心理咨询'],rel:['aicompanion','affectcomp','syc'],scn:'公众号高频争议话题；和 AI 伴侣重叠度高——心理陪伴强调「情绪支持」这个具体用途。',dlg:[{q:'能替代心理咨询师吗？',a:'轻度倾诉可以，确诊和干预必须专业人士。'},{q:'正经用途？',a:'正念引导、情绪记录、咨询前的基础疏导——工具定位最健康。'}],quiz:{q:'「AI 心理陪伴」的合规边界？',o:["情绪疏导可以，诊断治疗不行","完全替代咨询师","可以开药","必须线下"],a:0,why:'倾诉和工具是好用途，碰「诊断治疗」就越线。'}}, {id:'aitrans',term:'AI 翻译',full:'AI Translation',cn:'AI 翻译',zone:'misc',lv:2,new:true,tl:'<b>AI 时代的机器翻译</b>：整段译文自然流畅、能带语气翻、实时同传——从「能看懂」进化到「信达雅」。',ana:'像<b>从直译机器人到随身译员</b>：以前的翻译像逐字硬翻，现在的 AI 连「这个梗怎么翻」都能商量。',one:'从硬翻进化到信达雅',cf:'和「传统机翻」的区别：传统机翻逐词硬翻生硬；AI 翻译理解上下文和语气——科技文章已接近出版级。',al:['AI Translation','机器翻译'],rel:['nlp','fullmodal','asr2'],scn:'出境游、看外文资料、跨境电商全在用；耳机实时同传已商品化——「不用学外语了」的讨论随之而来。',dlg:[{q:'还要学外语吗？',a:'日常沟通 AI 够了；深度理解文化、谈判细微语气，语言仍是钥匙。'},{q:'翻译会出错吗？',a:'会——专业术语、文化梗、双关语仍是翻车区，重要文件留人工校对。'}],quiz:{q:'「AI 翻译」相比传统机翻的进步？',o:["必须逐词对照","不能翻语音","理解上下文语气，接近自然表达","只能翻英文"],a:2,why:'从逐词硬翻到理解式翻译——出版级质量门槛正在跨过。'}}, {id:'quantum',term:'量子计算',full:'Quantum Computing',cn:'量子计算',zone:'misc',lv:3,new:true,tl:'<b>利用量子特性并行探索的超强计算路线</b>：特定问题（模拟分子、破解加密）指数级加速——AI 的潜在下一站。',ana:'像<b>同时探索迷宫所有岔路</b>：经典计算一条条试，量子计算「波」一样铺满全图——特定问题上碾压。',one:'量子特性的超强计算路线',cf:'和「经典计算」的区别：经典是 0/1 串行试，量子是叠加态并行探——但只在特定问题类上碾压，不是全面快。',al:['Quantum Computing','量子计算机'],rel:['compute','encryption','sovereignai'],scn:'公众号高频前沿话题；和 AI 的结合（量子机器学习）还在早期——听到「量子+AI」先当长期故事看。',dlg:[{q:'能帮 AI 训练吗？',a:'理论上某些优化有潜力，但目前量子设备未到实用规模——远期故事。'},{q:'「量子威胁加密」？',a:'真风险——量子能破解现有加密，所以「抗量子加密」已开始部署。'}],quiz:{q:'「量子计算」的优势领域？',o:["全面碾压所有计算","打游戏更快","只用于军事","特定问题（模拟/优化/密码）指数级加速"],a:3,why:'不是全面快——是特定问题类上的指数级优势。'}}, {id:'bci',term:'脑机接口',full:'Brain-Computer Interface / BCI',cn:'脑机接口',zone:'misc',lv:3,new:true,tl:'<b>大脑直连电脑</b>：意念操控设备——Neuralink 等在人体试验，医疗先行、消费还远。',ana:'像<b>给大脑装 USB 口</b>：想法不经过手和嘴，直接传给机器——渐冻症患者已能用意念打字。',one:'大脑直连电脑的通道',cf:'和「AI」的关系：AI 是脑机接口的「翻译官」——脑信号乱成一团麻，AI 负责翻译成指令。',al:['BCI','脑机接口'],rel:['embodied','physical','humanoid'],scn:'公众号高频前沿：Neuralink 人体试验、国产脑机进展——医疗（渐冻/瘫痪）是当前唯一合规落点。',dlg:[{q:'普通人什么时候能用？',a:'医疗审批最快也要数年；健康人增强用途更远——先过伦理关。'},{q:'风险？',a:'手术风险+隐私新维度（脑数据）——「脑数据权」已是新法律议题。'}],quiz:{q:'「脑机接口」当前的合规落点？',o:["教育","医疗（渐冻、瘫痪辅助）","游戏增强","办公提效"],a:1,why:'先救命后增强——医疗是唯一已批准的落点。'}}, {id:'digtwin',term:'数字孪生',full:'Digital Twin',cn:'数字孪生',zone:'misc',lv:3,new:true,tl:'<b>给现实世界的东西造一个「活的虚拟镜像」</b>：工厂、城市都有数字分身——先在虚拟里试，再回现实里改。',ana:'像<b>给工厂造一个「游戏存档」</b>：现实改产线要停工损失百万，数字分身里先跑一遍，最优了再落地。',one:'现实世界的活的虚拟镜像',cf:'和「仿真模拟」的区别：仿真是离线模拟一次；数字孪生是实时同步的活镜像——数据一直喂，分身一直动。',al:['Digital Twin','数字双胞胎'],rel:['iot','world','dashboard2'],scn:'公众号聊「智慧工厂」「智慧城市」的底层技术就是它；IoT 传感器喂真实数据，分身才能「活」。',dlg:[{q:'和元宇宙什么关系？',a:'孪生是「复刻现实」，元宇宙多是「虚构世界」——一个重工业价值一个重社交娱乐。'},{q:'AI 加持什么？',a:'AI 让分身会「预测」——不只反映现状，还能推演接下来会发生什么。'}],quiz:{q:'「数字孪生」的核心特征？',o:["与现实实时同步的活虚拟镜像","一次性建模","纯游戏世界","只能是 2D"],a:0,why:'实时数据喂着的分身——先虚拟试错，再现实落地。'}}, {id:'blockchain',term:'区块链',full:'Blockchain',cn:'区块链',zone:'misc',lv:3,new:true,tl:'<b>全网共同记账、改不了的分布式账本</b>：没有中央管理员，每笔交易全网见证——比特币的底层技术。',ana:'像<b>全班人手一本一样的账本</b>：有人偷改自己的，和其他人对不上就作废——信任靠机制不靠管理员。',one:'全网见证改不了的账本',cf:'和「数据库」的区别：数据库有管理员能改（高效）；区块链无管理员改不了（可信但慢）——信任成本换效率。',al:['Blockchain','区块链技术'],rel:['cloud','twofa','watermark'],scn:'公众号聊「数字人民币不是区块链」「AI+区块链防伪」会撞见；AI 生成内容的确权溯源是它的新叙事。',dlg:[{q:'和比特币什么关系？',a:'区块链是技术，比特币是第一个应用——技术大于币。'},{q:'和 AI 什么结合？',a:'AI 生成内容泛滥后，「谁产的确权」变得值钱——链上溯源是新叙事。'}],quiz:{q:'「区块链」的核心特征？',o:["存储大","自动编程","分布式账本，全网见证难以篡改","网速快"],a:2,why:'没有管理员、人人有账本——信任靠机制。'}}, {id:'clickbait',term:'标题党',full:'Clickbait',cn:'标题党',zone:'misc',lv:3,new:true,tl:'<b>用夸张悬念骗点击的标题套路</b>：「震惊！」「最后一条泪目」——CTR 的邪道打法，平台正在系统性打压。',ana:'像<b>门口挂「免费送黄金」实卖锅</b>：进店率爆表，口碑崩盘——CTR 赢了，信任输了。',one:'用夸张悬念骗点击的套路',cf:'和「好标题」的区别：好标题是「把价值说到点上」；标题党是「价值给不出但话说满了」——分寸在兑现能力。',al:['Clickbait','震惊体'],rel:['ctrcvr','aiflav','workslop'],scn:'你做内容时最有体感的对手：标题党短期赢点击，长期被算法降权——平台已能识别「标题与内容不符」。',dlg:[{q:'AI 会助长标题党吗？',a:'会——AI 批量生成悬念标题成本低；但平台的匹配度检测也在 AI 化。'},{q:'正当的悬念怎么写？',a:'留缺口但要兑现——「我踩过的三个坑」比「震惊所有人」健康且长久。'}],quiz:{q:'「标题党」的代价？',o:["坐牢","账号立即清空","没有代价","短期点击高，长期信任与权重崩"],a:3,why:'CTR 邪道赢一时——平台的匹配度检测正在系统打压。'}}, {id:'prompeng',term:'提示词工程师',full:'Prompt Engineer',cn:'提示词工程师',zone:'misc',lv:3,new:true,tl:'<b>专门写提示词的职业</b>：2023 年火起、2026 年转型——单独写提示词被上下文工程和 AI 本身吸收了一半。',ana:'像<b>「打字员」到「办公室主任」的进化</b>：只会打字不够了，要管整个信息系统——提示词工程师升维到上下文工程。',one:'专门写提示词的转型岗位',cf:'和「上下文工程师」的区别：提示词工程师管「一句话怎么说」；上下文工程师管「AI 每步能看到什么」——后者是升维。',al:['Prompt Engineer','提示词工程'],rel:['prompt','ctxeng','solopreneur'],scn:'招聘网站仍见此岗，但 JD 已从「会写提示词」变成「会搭上下文体系+懂业务」——你调教 AI 工具的经验就是这项技能。',dlg:[{q:'这职业还有前途吗？',a:'「纯写提示词」在消亡，「懂业务+会管上下文」在增值——岗位升维不是消失。'},{q:'个人需要吗？',a:'不需要头衔，需要能力——你调教 AI 工具的每个经验都是这项技能。'}],quiz:{q:'「提示词工程师」岗位的 2026 趋势？',o:["只属于大厂","升维为上下文工程与业务结合","彻底消失","薪资暴跌无人做"],a:1,why:'纯写提示词被 AI 吸收——懂业务+会管上下文的人在增值。'}}, {id:'gpurent',term:'算力租赁',full:'GPU Rental',cn:'算力租赁',zone:'misc',lv:3,new:true,tl:'<b>按小时租 GPU</b>：不想花几万买卡，就按小时租云上的——炼丹、跑推理、玩开源模型的经济起点。',ana:'像<b>租车 vs 买车</b>：偶尔用车租车划算，天天用车买车——先算利用率再掏钱。',one:'按小时租 GPU 的经济起点',cf:'和「买显卡」的区别：买是固定资产（闲时浪费）；租是按需支出——利用率低于某值就租更划算。',al:['GPU Rental','租显卡'],rel:['gpu','compute','cloud'],scn:'本地跑模型教程里的「没有显卡去租一个」就是它；价格随行情波动——新模型爆火时一卡难求。',dlg:[{q:'租金大概多少？',a:'消费级卡几块钱一小时，A100/H100 级几十块——炼丹一周几千块起步。'},{q:'数据安全吗？',a:'租用环境磁盘可清空，敏感训练仍建议自有算力。'}],quiz:{q:'「算力租赁」适合谁？',o:["偶发大批量任务、不想囤卡的人","天天跑推理的大厂","只查词典的用户","没有电脑的人"],a:0,why:'偶发重任务租比买省——利用率是决策核心。'}}, {id:'natpierce',term:'内网穿透',full:'NAT Traversal',cn:'内网穿透',zone:'abbr',lv:3,new:true,tl:'<b>让外网能敲到你家的门</b>：家里设备没有公网门牌，通过一台公网中转服务器「打通一条隧道」——出差也能访问家里 NAS。',ana:'像<b>给没有门牌的家挂个代收点</b>：快递先寄到代收点（公网服务器），再由隧道转进你家——门牌还是没有，但东西进得来了。',one:'让外网访问没有公网 IP 的家',cf:'和「VPN」的区别：VPN 是你出去时接回家；内网穿透是让外面的别人进来——方向相反。',al:['NAT Traversal','frp 隧道'],rel:['lanwan','nas','vpn'],scn:'远程访问 NAS、远程连家里电脑、自建服务给别人用，全靠它；frp 是最常见的工具名。',dlg:[{q:'安全吗？',a:'隧道是条通道，进门仍要密码——但暴露了入口，务必设强密码。'},{q:'一定要买服务器吗？',a:'有免费公共穿透服务，但自建 frp+一台便宜 VPS 更稳更快。'}],quiz:{q:'「内网穿透」解决的是？',o:["WiFi 信号差","流量不够用","没有公网 IP 的内网设备被外网访问","网速太慢"],a:2,why:'没有公网门牌也能收快递——靠公网中转打通隧道。'}}, {id:'nas',term:'私有云存储',full:'NAS / Network Attached Storage',cn:'NAS 私有云',zone:'abbr',lv:3,new:true,tl:'<b>放在自己家的云盘柜子</b>：一台连网的硬盘盒，照片电影文档全存自己手里——不怕网盘限速、涨价、跑路。',ana:'像<b>自家挖的酒窖</
