.star{font-size:18px;color:var(--line);cursor:pointer;flex:none;line-height:1;padding-left:4px}

.stage{background:var(--soft);border-radius:11px;padding:13px}

 rel:['llm','ml','agent'],al:['人工智能','机器智能','人工智能技术','AI技术'],one:'让机器干以前只有人能干的活',cf:'它是一大类技术的统称，不是某一个具体产品',dlg:['甲：这功能谁做的？','乙：AI 自动生成的，没人手写']},

{id:'ml',term:'机器学习 / ML',full:'Machine Learning',cn:'机器学习',zone:'ai',lv:2,abbr:true,

 scn:'你刷抖音「猜你喜欢」、邮箱自动拦垃圾邮件，背后都是机器学习——没人写规则，它自己从你的行为里学的。',
 demo:null,rel:['ai','llm'],al:['机器学习','训练模型','机器学习算法'],one:'不写死规则，让机器自己从数据里找规律',cf:'机器学习只是实现 AI 的一条路，不等于 AI 全部',dlg:['甲：它怎么知道该推荐啥？','乙：看了几万条历史数据自己学的']},

{id:'llm',term:'LLM',full:'Large Language Model',cn:'大语言模型 / 大模型',zone:'ai',lv:1,abbr:true,

 scn:'你在 Codex / WorkBuddy 里<b>选模型</b>（GPT、Claude、GLM、DeepSeek），选的就是不同的 LLM；公众号说「用大模型写文案」，那个大模型就是它。',
 demo:'llm',
 quiz:{q:'「大模型」的「大」，到底大在哪？',o:['学过的文字和参数特别多','装它的服务器体积很大','收费很贵','只能处理很大的问题'],a:0,

 rel:['token','context','rag','ai'],al:['大模型','大语言模型','语言模型','大模'],one:'读了海量文本、专会接话茬的巨大模型',cf:'大模型专指语言类模型，不等于所有 AI',dlg:['甲：你用的哪个模型？','乙：GPT 那种大模型']},

{id:'token',term:'Token',full:'Token',cn:'词元 / 令牌',zone:'ai',lv:2,

 ana:'把文字想成<b>乐高积木</b>：AI 不认识整句话，先把话拆成一堆积木，再一块块拼着理解、一块块往外吐。你付的钱、它记住的长度，都按积木块数算。',
 scn:'Codex 提示「上下文剩 12%」，那个百分比就是剩余 Token；文章里说「这个词 3 个 token」，就是在说它被切成了 3 块。',

 quiz:{q:'「我爱吃苹果」大概会被切成几个 Token？',o:['5 个（一个字一块）','1 个（一整句）','11 个（一个字母一块）','看心情'],a:0,
 why:'中文通常一个字 ≈ 一个 Token；英文长单词反而会被拆成好几块，所以「按字数估钱」在中文里基本准，在英文里会算错。'},
 rel:['llm','context'],al:['词元','令牌','分词','字数','计费单位','tokens'],one:'AI 数文字的单位，不等于「字」',cf:'一个英文词常切成 2-3 个 token，中文多是一字一个',dlg:['甲：怎么又超了？','乙：你说太多，token 用完了']},

{id:'context',term:'上下文窗口',full:'Context Window',cn:'上下文窗口',zone:'ai',lv:2,

 scn:'Codex 提示「上下文快满了，建议 /compact」——就是会议室坐不下了，让你把前面的对话压缩一下腾地方。',
 demo:'ctx',rel:['token','llm','rag'],al:['上下文','上下文长度','记忆长度','能记住多少','窗口','context window','上下文限制'],one:'AI 一次能同时看到的字数上限',cf:'超了不会报错，它会悄悄忘掉最早的内容',dlg:['甲：它怎么忘了开头说的？','乙：超出上下文窗口，被挤掉了']},

{id:'prompt',term:'Prompt',full:'Prompt',cn:'提示词',zone:'ai',lv:1,
 tl:'你发给 AI 的那段话。<b>它写的每一个字都在影响答案</b>，所以「会提问」本身就是一门技术。',

 scn:'公众号圈说的「提示词工程」「咒语」，本质就是把活派清楚。你让我「用苏格拉底提问法问我」，那句话就是 Prompt。',
 demo:'prompt',
 quiz:{q:'想让 AI 答得更好，最便宜有效的一招是？',o:['把问题写得更长','换更贵的模型','多说几次「请」','给它几个你想要的样子当例子'],a:3,
 why:'这招叫「少样本」（Few-shot）：先给它 2～3 个你想要的样子，它立刻知道你要什么。比调参数、换模型都划算。'},
 rel:['sysprompt','cot','llm'],al:['提示词','提示语','咒语','指令','提问词','prompt词'],one:'你给 AI 下的那句话，说清要它干啥',cf:'不是几个关键词，是一段完整的话，越具体越好',dlg:['甲：我写的它老答偏','乙：提示词没说清要什么格式']},

{id:'sysprompt',term:'System Prompt',full:'System Prompt',cn:'系统提示词',zone:'ai',lv:2,

 scn:'你给我写的 SOUL.md、龙之心客服智能体的设定，本质上就是 System Prompt——它在每一次对话里都起作用，你看不见但它一直在。',
 demo:null,rel:['prompt','agent'],al:['系统提示词','系统指令','人设','预设指令','system prompt'],one:'对话开始前偷偷塞给 AI 的长期规矩',cf:'你说的每句叫 prompt，这个是后台固定的人设',dlg:['甲：它怎么知道自己是客服？','乙：系统提示词里写好了身份']},

{id:'hallu',term:'幻觉',full:'Hallucination',cn:'AI 幻觉 / 一本正经胡说',zone:'ai',lv:1,

 scn:'你让 AI 找五行针灸的原文出处，它可能给你编一个页码。<b>凡是引用、数据、人名，一定要自己核一遍</b>。',
 demo:'hallu',
 quiz:{q:'哪种做法最能减少 AI 瞎编？',o:['让它先查你的资料再回答（RAG）','把温度调到 0','每次都提醒它「不许编」','换个更大的模型'],a:0,
 why:'让它先翻你的资料再回答（RAG），答案有出处就不容易编。「不许编」这种叮嘱基本没用，它做不到。'},
 rel:['rag','llm'],al:['幻觉','胡说','编的','瞎编','一本正经胡说','乱说','造假'],one:'AI 一本正经地编造不存在的事实',cf:'它不是故意骗你，是真分不清自己知不知道',dlg:['甲：这书名是真的？','乙：查了没有，它幻觉了']},

{id:'temp',term:'温度',full:'Temperature',cn:'温度参数',zone:'ai',lv:2,

 scn:'写代码、查数据、做表格 → 调低（0～0.3）；写公众号标题、想创意、头脑风暴 → 调高（0.7～1）。大多数工具默认 0.7 左右。',
 demo:'temp',rel:['llm','prompt'],al:['温度','随机性','temperature','创造性参数','发散度'],one:'控制 AI 是照本宣科还是天马行空',cf:'调低不等于变聪明，只是更保守、花样更少',dlg:['甲：每次结果都不一样','乙：温度调高了，让它更有创意']},

{id:'agent',term:'Agent',full:'AI Agent',cn:'智能体',zone:'ai',lv:2,abbr:true,
 tl:'<b>不只回答问题，而是自己把活干完</b>的 AI：会拆步骤、会调工具、干完才来找你。',
 ana:'普通 AI 是<b>你问我答的客服</b>；Agent 是<b>外包员工</b>——你说「帮我调研竞品定价写成报告」，它自己搜、自己整理、自己写，最后把成品给你。',
 scn:'你让 WorkBuddy「做个名词工具」，它自己拆任务、读文件、写代码、跑测试，干完一次性给你结果——这就是 Agent 模式。',
 demo:'agent',
 quiz:{q:'下面哪个更像 Agent 而不是普通聊天 AI？',o:['问一句答一句的百科','只能聊天的客服机器人','你说目标，它自己搜资料→整理→写报告→交给你','需要你一步步指挥的工具'],a:2,
 why:'判断标准一句话：聊天机器人给你「步骤清单」，Agent 直接给你「可以验收的成品」。'},
 rel:['mcp','tool','workflow','harness'],al:['智能体','代理','agent模式','AI代理','智能代理','agentic','智能体的','agentic ai'],one:'能自己拆解任务、动手干活的 AI',cf:'聊天机器人只动嘴，Agent 会真的去点、去改文件',dlg:['甲：它自己就去改代码了？','乙：嗯，开着 Agent 模式呢']},

{id:'rag',term:'RAG',full:'Retrieval-Augmented Generation',cn:'检索增强生成',zone:'ai',lv:3,abbr:true,
 tl:'先让 AI <b>去你的资料里翻一遍</b>，再拿着翻到的内容回答你，而不是凭记忆瞎编。',
 ana:'等于<b>开卷考试</b>。不 RAG 是闭卷（凭训练记忆答，容易编）；RAG 是先发它一堆参考资料，让它照着答，还能告诉你答案出自第几页。',
 scn:'你把五行针灸的资料喂给它，问「护持一行怎么判断」，它从你资料里翻完再答——这就是 RAG。公众号说「给 AI 挂个知识库」，挂的就是这个。',
 demo:'rag',rel:['embed','vdb','hallu','llm'],al:['检索增强','外挂知识库','查资料再回答','知识库问答','rag技术'],one:'先翻你的资料，再照着资料回答',cf:'RAG 不改模型本身，只是临时给它参考资料',dlg:['甲：它怎么知道我公司的事？','乙：接了知识库，走的 RAG']},

{id:'embed',shot:'embed',term:'Embedding',full:'Embedding',cn:'向量化 / 嵌入',zone:'ai',lv:3,

 ana:'给每段话发一个<b>数学指纹</b>。电脑不认字只认数，有了指纹它就能算出「护持一行」和「主导一行」其实说的是一回事。',
 scn:'你搜「怎么判断五行人」，即使文章里一个字都没出现「判断」两个字，也能被搜出来——靠的就是这个。RAG 底层全靠它。',
 demo:null,rel:['rag','vdb'],al:['向量化','嵌入','embedding','转成数字','向量表示'],one:'把文字变成一串数字，好让机器比相似度',cf:'向量化不是压缩，是为了能算出「意思近不近」',dlg:['甲：怎么搜「变笨」能出别的词？','乙：靠 embedding 比语义']},

{id:'vdb',term:'向量数据库',full:'Vector Database',cn:'向量数据库',zone:'ai',lv:3,

 ana:'普通图书馆<b>按书名找书</b>；向量数据库是<b>按「讲的是什么」找书</b>——你说个大概意思，它把相关的都给你搬出来。',
 scn:'你给公众号历史文章做个「能对话的知识库」，文章就存在这种库里。常见产品：Pinecone、Milvus、Chroma。',
 demo:null,rel:['embed','rag'],al:['向量数据库','向量库','向量检索','相似度搜索'],one:'专门存那串数字、按「意思像不像」搜的库',cf:'普通数据库是精确匹配，它按语义相近排序',dlg:['甲：资料太多放哪？','乙：塞向量数据库，随时检索']},

{id:'ft',term:'微调',full:'Fine-tuning',cn:'微调 / 精调',zone:'ai',lv:3,
 tl:'在已经训练好的模型上，<b>再用你自己的数据练一遍</b>，让它养成某种固定风格或习惯。',
 ana:'预训练是<b>读完大学</b>（啥都学点）；微调是<b>上岗培训</b>（只在你们公司干，学会你们的黑话和规矩）。LoRA 是一种省钱的微调法，只改模型的一小部分。',
 scn:'「用龙梅老师的文章微调一个模型」，就是让它学会她的语气和说法。<b>注意：微调不能让它知道新知识</b>，那是 RAG 的活。',
 demo:'ft',
 quiz:{q:'想让 AI 学会你公司的新规定（每周都在变），该用哪个？',o:['RAG（挂知识库）','微调','换更大的模型','调高温度'],a:0,
 why:'微调是把知识「刻进脑子」，改起来慢又贵，适合固定风格；RAG 是给它一本书随时翻，内容变了改书就行。经常变的东西用 RAG。'},
 rel:['rag','llm'],al:['微调','精调','finetune','finetuning','训练自己的模型'],one:'拿现成模型再喂自己的数据，让它更懂你',cf:'微调会改模型参数；RAG 只外挂资料，不改模型',dlg:['甲：让它学会我的文风？','乙：那得微调，光提示词不够']},

{id:'multi',shot:'multi',term:'多模态',full:'Multimodal',cn:'多模态',zone:'ai',lv:1,
 tl:'AI 不只会读字，还<b>能看图、听声音、看视频</b>，混在一起理解。',
 ana:'以前它是<b>只能看文档的文员</b>，现在是<b>能看照片、能听语音、能看视频的全能助理</b>。',
 scn:'你把群聊截图直接丢给我，我能读出里面的发言并做统计——这就是多模态。以前必须你先把字打出来才行。',
 demo:null,rel:['llm','vlm'],al:['多模态','多模态模型','图文音视','能看图'],one:'能同时处理文字、图、声音、视频的 AI',cf:'不支持的类型它也会硬答，别被唬住',dlg:['甲：能让它看这张表吗？','乙：可以，这模型是多模态的']},

{id:'reason',term:'推理模型',full:'Reasoning Model / LRM',cn:'推理模型',zone:'ai',lv:2,abbr:true,
 tl:'<b>先想清楚再回答</b>的模型。回答前会在后台一步步推演、自我检查，难题更强，但更慢更贵。',
 ana:'普通模型是<b>脱口而出</b>；推理模型是<b>打草稿再交卷</b>。做数学题、写代码、复杂决策，草稿这一步差别巨大。',
 scn:'DeepSeek-R1、GPT 的 o 系列、Claude 的「扩展思考」都是这类。<b>日常闲聊用它 = 用大炮打蚊子</b>，又慢又贵。',
 demo:null,rel:['cot','llm'],al:['推理模型','慢思考','深度思考','o1','思维链模型','LRM','large reasoning model'],one:'回答前先自己想一通，慢但更准',cf:'不是啥题都该用，简单问答会又慢又贵',dlg:['甲：怎么等这么久？','乙：推理模型，它在一步一步想']},

{id:'cot',term:'思维链',full:'Chain of Thought / CoT',cn:'思维链',zone:'ai',lv:2,abbr:true,
 tl:'让 AI <b>把思考过程写出来再给结论</b>。就这一句话，正确率能提升一大截。',
 ana:'像数学考试<b>要写解题步骤，不能只写答案</b>。写着写着，它自己就发现哪步错了。',
 scn:'在提问后面加一句「<b>请一步一步思考</b>」，是全网验证过最省事的提分技巧。你现在就可以试。',
 demo:null,rel:['reason','prompt','opaque'],al:['思维链','一步步想','chain of thought','分步思考','推理过程'],one:'让 AI 把思考过程写出来，答案更靠谱',cf:'你让它「一步步想」，就是在用思维链',dlg:['甲：怎么让它少错？','乙：加一句「请一步步 reasoning」']},

{id:'param',term:'参数',full:'Parameters',cn:'参数 / 7B、70B',zone:'ai',lv:2,

 ana:'像<b>音响上的 EQ 均衡器</b>：旋钮越多，能调出的声音越细腻。但旋钮多不等于好听，还得看调没调好。',
 scn:'文章里说「本地跑个 7B 的小模型」，就是说它脑容量小、对电脑要求低、也便宜。<b>参数大 ≠ 一定更好用</b>，小模型精调后干专项活可能更合适。',
 demo:null,rel:['llm','quant'],al:['参数','参数量','模型大小','7b','70b','多少B'],one:'模型脑容量，B 越大越聪明也越吃硬件',cf:'参数多不等于一定好用，还得看训练数据',dlg:['甲：7B 和 70B 啥区别？','乙：参数量，后者强很多也更慢']},

{id:'moe',term:'MoE',full:'Mixture of Experts',cn:'混合专家模型',zone:'ai',lv:3,abbr:true,
 tl:'模型内部养了一群「专科医生」，<b>每个问题只叫醒相关的几个</b>，不用全员上岗。',
 ana:'大公司里有法务、财务、技术、市场。MoE 不是每次开会都叫齐所有人，而是<b>谁相关叫谁</b>——所以「总人数很多，干活却不慢」。',
 scn:'DeepSeek、Mixtral 都用这招，所以能做到「模型很大但很便宜」。文章里说「MoE 架构」就是在夸这一点。',

{id:'oss',term:'开源 / 闭源',full:'Open Source / Closed Source',cn:'开源模型 / 闭源模型',zone:'ai',lv:1,
 tl:'<b>开源</b>：模型文件公开，谁都能下载、改、自己部署（DeepSeek、Qwen、Llama）。<b>闭源</b>：只让你通过官方入口用，看不到里面（GPT、Claude）。',
 ana:'开源 = <b>给你菜谱和食材</b>，你想怎么改怎么改，但得自己有厨房；闭源 = <b>直接去饭店吃</b>，省心，但菜单由别人定。',
 scn:'你在 WorkBuddy 里配智谱、DeepSeek 的 API 用国产开源模型，成本低、数据可控；用 Claude 则是闭源，省心但按量付费。',
 demo:'oss',rel:['local','llm'],al:['开源','闭源','开源模型','免费模型','权重公开'],one:'开源=模型文件公开可自部署；闭源=只能用他家接口',cf:'开源不等于能免费商用，要看具体许可证',dlg:['甲：能下载到本地吗？','乙：开源模型可以，闭源不行']},

{id:'local',term:'本地部署',full:'Local Deployment',cn:'本地部署 / 端侧 AI',zone:'ai',lv:2,
 tl:'把模型<b>装在你自己的电脑或手机上跑</b>，数据不出门，断网也能用。',
 ana:'用网盘 vs <b>把文件存在自己硬盘</b>。前者方便但要联网、要信对方；后者慢一点、占地方，但东西在你手里。',
 scn:'你在自己电脑上装 Ollama 跑 DeepSeek，就是本地部署。好处：隐私好、不花钱；代价：能力比云端大模型弱一截。',
 demo:null,rel:['oss','quant'],al:['本地部署','本地运行','离线跑','端侧','私有化部署','装自己电脑上'],one:'把模型装在你自己电脑上跑，不联网也行',cf:'本地能保隐私，但效果通常弱于云端大模型',dlg:['甲：数据不能外传','乙：那就本地部署一套']},

{id:'quant',term:'量化 / 蒸馏',full:'Quantization / Distillation',cn:'模型减肥三件套',zone:'ai',lv:3,
 tl:'<b>量化</b>：把模型数字精度压低，体积变小跑得更快（画质略降）。<b>蒸馏</b>：让小模型跟着大模型学，把本事浓缩进小身板。',
 ana:'量化 = <b>高清视频转标清</b>：画质差一点，但手机能放；蒸馏 = <b>名师带徒弟</b>：徒弟没师傅懂得多，但够用且便宜。',
 scn:'文章里说「量化版」「4bit」「蒸馏模型」，都是同一个意思：让大模型能塞进你的电脑里跑。',
 demo:null,rel:['local','param','distill'],al:['量化','蒸馏','剪枝','模型压缩','减肥','int4','int8'],one:'给模型瘦身，少占显存、跑得更快',cf:'量化是降精度，蒸馏是小模型学大模型，不是一回事',dlg:['甲：显卡跑不动','乙：量化到 4bit 试试']},

{id:'ctxeng',term:'上下文工程',full:'Context Engineering',cn:'上下文工程',zone:'ai',lv:3,new:true,
 tl:'2025 年火起来的说法：不纠结「这一句怎么问」，而是研究<b>「在它开口前，该把哪些资料、规则、工具结果摆到它面前」</b>。',
 ana:'提示词工程是<b>琢磨怎么问这一句</b>；上下文工程是<b>给它准备一整个文件夹的参考资料，还分好类、排好序</b>。',
 scn:'你给 AI 挂飞书知识库、挂公众号历史文章、写 CLAUDE.md / SOUL.md，<b>全都是在做上下文工程</b>——你其实早就在做了。',
 demo:null,rel:['prompt','rag','context','harness','agentsmd'],al:['上下文工程','context engineering','喂资料','提示词工程升级版'],one:'研究该往 AI 眼前放哪些信息，让它答得准',cf:'提示词工程只打磨一句话，它管的是整个信息环境',dlg:['甲：光改提示词不管用','乙：得做上下文工程，把资料喂对']},

{id:'vibe',shot:'vibe',term:'Vibe Coding',full:'Vibe Coding',cn:'氛围编程',zone:'ai',lv:1,new:true,
 tl:'<b>不看代码、只说人话</b>的写程序方式：你描述想要什么，AI 写，报错就丢回给它改，你全程不看代码写了啥。',
 ana:'像<b>跟装修师傅说「我要个温馨的客厅」</b>——你不管水电怎么走、瓷砖怎么贴，只看最后效果。不满意就说「再暖一点」。',
 scn:'这就是你现在用 Codex、WorkBuddy 的方式。这个词 2025 年由 Karpathy 造出来，年底被《柯林斯词典》评为年度词汇。<b>副作用：你因此撞到一堆看不懂的名词——所以才有了这个工具。</b>',
 demo:null,rel:['agent','llm'],al:['氛围编程','vibe coding','凭感觉写','不看懂代码','让AI写'],one:'不看代码，只管说需求、能跑就行',cf:'适合做小玩具；要长期维护的项目不能这么干',dlg:['甲：你看懂它写的代码了吗？','乙：没看，能跑就行，vibe coding']},

{id:'world',term:'世界模型',full:'World Model',cn:'世界模型',zone:'ai',lv:3,new:true,
 tl:'让 AI 在内部<b>建一个物理世界的模拟器</b>，真的懂「球掉地上会弹」「杯子碎了不能用了」。',
 ana:'现在的大模型<b>很会说话但没常识</b>——你问杯子掉地上会怎样，它能答得头头是道，却并不真懂重力。世界模型要补的就是这块。',
 scn:'李飞飞的 World Labs 做的 Marble：给它一张照片，生成一个能走进去的 3D 世界。机器人、自动驾驶都指望它当大脑。',
 demo:null,rel:['embodied','agi'],al:['世界模型','world model','物理常识模型','预测下一步'],one:'让 AI 脑内模拟真实世界，能预判后果',cf:'大多还在研究阶段，别跟「多模态」混为一谈',dlg:['甲：它懂物理吗？','乙：有点儿，靠世界模型在推演']},

{id:'embodied',term:'具身智能',full:'Embodied AI',cn:'具身智能',zone:'ai',lv:2,
 tl:'AI <b>有了物理身体</b>（机器人），能看、能走、能抓、能在真实世界干活。',
 ana:'以前 AI 是<b>困在屏幕里的脑子</b>；具身智能是<b>给这个脑子装上手脚</b>，让它能真的端杯子、搬箱子。',
 scn:'工厂机械臂、送餐机器人、特斯拉 Optimus 都属于这条线。2026 年被普遍认为是它批量落地的一年。',
 demo:null,rel:['world','agi'],al:['具身智能','机器人','人形机器人','有身体的AI'],one:'给 AI 装上身体，能在现实里动手干活',cf:'不等于机器人，老式机器人没有大模型大脑',dlg:['甲：机器人也算 AI？','乙：有大脑的才叫具身智能']},

{id:'aigc',term:'AIGC',full:'AI Generated Content',cn:'AI 生成内容',zone:'ai',lv:1,abbr:true,

 scn:'公众号圈说「AIGC 降本增效」，意思就是用 AI 批量出内容。你用 AI 写的每一篇推文都是 AIGC。',

{id:'transformer',term:'Transformer',full:'Transformer Architecture',cn:'Transformer 架构',zone:'ai',lv:3,
 tl:'2017 年谷歌提出的架构，<b>今天几乎所有大模型的地基</b>。GPT 里的 T 就是它。',

 scn:'你基本只会在这两种地方见到它：讲技术原理的文章、模型发布会的 PPT。<b>知道它是「地基」就够了，不用懂细节。</b>',
 demo:null,rel:['attention','llm'],al:['transformer','Transformer架构','注意力架构','大模型基础架构'],one:'现代大模型的地基架构，靠注意力读懂上下文',cf:'它是模型结构，不是某个具体产品',dlg:['甲：GPT 的 T 是啥？','乙：Transformer，它的底层架构']},

{id:'attention',term:'注意力机制',full:'Attention Mechanism',cn:'注意力机制',zone:'ai',lv:3,
 tl:'让模型读一句话时，<b>自动判断哪些词更重要</b>，把算力花在刀刃上。',

 demo:null,rel:['transformer','context'],al:['注意力','attention','自注意力','关注重点'],one:'让模型自己判断该重点看哪些词',cf:'跟人的「注意力」只是比喻，本质是加权计算',dlg:['甲：它怎么知道主语是谁？','乙：注意力机制在算关联']},

{id:'emerge',term:'涌现能力',full:'Emergent Abilities',cn:'涌现能力',zone:'ai',lv:3,

 scn:'发布会里说「我们又刷了 SOTA」，背后的逻辑就是这条。但 2025 年后开始有人质疑：单纯堆规模，边际收益在变小。',

 why:'templates 是「骨架」（合同范本），会被复制出去变成你的文件；references 是「资料」（附录），只给 AI 查，不会变成你的东西。'},al:['templates','模板','样板','填空模板','模版'],one:'填空就能用的半成品',cf:'模板是起手式，scaffold 会生成一整套文件',dlg:['甲：从哪开始写？','乙：拿模板改']},

 demo:null,rel:['workflow','git'],al:['progress','进度','做到哪了','进展','进度表'],one:'记录活干到哪一步了',cf:'进度文件是快照，不是流水账日志',dlg:['甲：上次做到哪了？','乙：看 progress 文件']},

{id:'syc',term:'Sycophancy',full:'Sycophancy',cn:'拍马屁 / 谄媚',zone:'ai',lv:2,tl:'AI 一味附和你，你说啥它都说对。<b>它是在讨好你，不是在讲真话</b>。',ana:'像那种永远说「您说得对」的下属——听着舒服，其实没帮你把关。',scn:'你问「我这个方案是不是没问题」，它回「非常完善」，其实漏洞一堆。想听真话就把问题改成「请找出这个方案的三个问题」。',al:['拍马屁','谄媚','马屁精','附和','讨好','说好话','一味赞同','老说我对'],one:'它一味说你对，其实是在讨好你',cf:'跟幻觉不同：幻觉是瞎编，这是明知也不反驳',dlg:['甲：它说我方案完美','乙：拍马屁呢，让它挑毛病试试'],rel:['hallu','rlhf','prompt'],new:true},
{id:'compact',term:'Compaction',full:'Context compaction / /clear',cn:'压缩 / 清空',zone:'ai',lv:2,tl:'把长对话压成一段摘要，腾出空间继续干。<b>相当于给 AI 做一次「划重点」</b>。',ana:'像会议纪要：两小时讨论压成一页纸，重点还在，废话没了。',scn:'Claude Code 里打 /compact 或 /clear 就是在干这个。长任务干到一半感觉它开始糊了，压一下再继续，比硬撑着强。',al:['清空','压缩','上下文压缩','划重点','清会话','重开','compact','clear'],one:'把长对话压成摘要，腾地方继续干',cf:'压缩会丢细节；清空是从零开始，两者不一样',dlg:['甲：它越聊越糊','乙：/compact 压一下'],rel:['context','rot','token'],new:true},
{id:'quota',term:'Quota / Rate limit',full:'Quota / Rate limit',cn:'额度 / 限流',zone:'code',lv:1,tl:'服务商给你定的用量上限。<b>用完就停，不是坏了</b>。',ana:'像手机流量包：用完就断网，或者给你限速到能聊但很慢。',scn:'Codex 报错「You have exceeded your quota」、调极致了 API 返回 429，都是这个。看一眼重置时间，或者换个模型、换把 Key。',al:['额度','限流','配额','超额','429','用超了','用完','rate limit','超了','没额度'],one:'服务商给的用量上限，用完就停',cf:'限流是短时间太快；额度用完是总量没了',dlg:['甲：怎么突然不干了？','乙：额度用完，看下重置时间'],rel:['apikey','token','api'],new:true},
{id:'hitl',term:'Human-in-the-loop',full:'Human-in-the-loop',cn:'人在环内 / 人工把关',zone:'ai',lv:2,tl:'关键步骤必须由人点头，AI 才能往下走。<b>你不点头，它就停在那儿等你</b>。',ana:'像审批流：机器能干活，但签字这一步得人来。',scn:'Codex 要改你 Obsidian 里的笔记前弹一句「确认要改吗」，这就是人在环内。涉及删文件、花钱、发公众号的操作，一定要开着。',al:['人在环内','人工确认','需要审批','人工把关','要我点头','human in the loop','确认一下'],one:'关键步骤必须你点头，AI 才继续',cf:'不等于「全自动」的反面，是自动跑但关键处卡一下',dlg:['甲：它怎么老问我？','乙：开着人在环内，重要操作要你确认'],rel:['agent','guardrail','orchestr'],new:true},
{id:'handoff',term:'Handoff',full:'Session handoff',cn:'交接 / 换班',zone:'ai',lv:2,tl:'一个 AI 干到一半，把进度交代给下一个接着干。<b>不交接，就得从头讲一遍</b>。',ana:'像换班：交班的人得把「干到哪、坑在哪」写给接班的人。',scn:'你上午用 Codex 写到一半关了，下午开新会话它啥都不记得——这时候该让它先写一份交接说明，你下次贴给新会话，一秒接上。',al:['交接','换班','换会话','交班','接着干','继续上次','handoff','接着做'],one:'把进度交代清楚，换一个 AI 接着干',cf:'记忆是系统自动存；交接是你主动让它写下来',dlg:['甲：昨天那个活接着做','乙：先让它写份交接说明'],rel:['memory','context','subagent'],new:true},
{id:'nondet',term:'Non-determinism',full:'Non-determinism',cn:'非确定性 / 每次不一样',zone:'ai',lv:3,tl:'同一个问题问两遍，答案不一样。<b>这是 AI 的天性，不是 bug</b>。',ana:'像同一个厨师炒两次同一道菜，味道总有点差别。',scn:'你让 AI 生成公众号标题，每次给的都不一样。想要稳定结果，就把要求写死（格式、字数、风格），再把温度调低。',al:['非确定性','每次不一样','不稳定','随机性','结果不一样','时好时坏','两次不一样'],one:'同样的问题，两次答案不一样',cf:'不是出错了，是模型本来就带随机采样',dlg:['甲：刚才还好好的，这次又变了','乙：非确定性，把要求写死点'],rel:['temp','infer','benchmark'],new:true},
{id:'spec',term:'Spec',full:'Specification',cn:'需求说明 / 先说清楚',zone:'ai',lv:1,tl:'动手之前，先把「要做成什么样」写清楚。<b>写给 AI 看，也写给自己看</b>。',ana:'像装修前的设计图：没图纸就开工，返工的是你自己。',scn:'让 Codex 做东西前，先让它出一份 spec：要做什么、不做什么、怎么算做完。你确认后它再动手，返工能少一大半。',al:['需求说明','规格','设计方案','验收标准','先说清楚','spec','需求文档','要做成啥样'],one:'动手前先把要做成啥样写清楚',cf:'spec 说「做成什么样」，prompt 是「这一句怎么问」',dlg:['甲：直接让它写吧','乙：先出个 spec 你确认再动手'],rel:['prompt','ctxeng','vibe'],new:true},
{id:'grill',term:'Grilling',full:'Grilling',cn:'烤问 / 先反问你',zone:'misc',lv:2,tl:'不让 AI 直接开干，先反过来追问你一堆问题。<b>问清楚再动手，返工少</b>。',ana:'像老中医问诊：不先问清楚就开方子，多半不对症。',scn:'你说「帮我做个名词词典」，它先问：给谁用？手机上还是电脑上？要不要离线？——问完再干，比直接开写靠谱得多。',al:['烤问','反问','先问我','追问','问清楚','grilling','先别动手'],one:'先反过来问你一堆，问清楚再干',cf:'不是它在偷懒，问得越细后面返工越少',dlg:['甲：它怎么老问我问题？','乙：在烤问你，问清了才动手'],rel:['spec','prompt','agent'],new:true},
{id:'dryrun',term:'Dry run',full:'Dry run',cn:'预演 / 先别真改',zone:'code',lv:2,tl:'先跑一遍看看会做什么，但<b>不真的动手改</b>。',ana:'像消防演习：流程走一遍，但不真放火。',scn:'让 Codex 批量改你飞书多维表格的字段前，先说一句「先别改，把你要改的清单列给我看」——这就是预演。',al:['预演','试运行','先别改','dry run','演练','先看不改','模拟执行','列个清单'],one:'先跑一遍看看会改啥，但不真改',cf:'预演不改任何东西；真跑会直接落盘',dlg:['甲：怕它改错','乙：让它先 dry run，列清单给你看'],rel:['hitl','rollback','sandbox'],new:true},

<script>
/* ============ 逻辑 ============ */
var ZONES={ai:{n:'AI 核心',e:'🧠'},code:{n:'编程基础',e:'⌨️'},misc:{n:'杂词 / 软件',e:'🧩'},abbr:{n:'缩写速查',e:'🔤'}};
var LV={1:'入门',2:'进阶',3:'硬核'};
var STORE={fav:{},read:{},hist:[],miss:{},wrong:{},qlog:[],theme:'auto'};
try{var raw=localStorage.getItem('mingcixiaochao');if(raw){var p=JSON.parse(raw);
  STORE.fav=p.fav||{};STORE.read=p.read||{};STORE.hist=p.hist||[];STORE.miss=p.miss||{};STORE.wrong=p.wrong||{};STORE.qlog=p.qlog||[];STORE.theme=p.theme||'auto'}}catch(e){}
function save(){try{localStorage.setItem('mingcixiaochao',JSON.stringify(STORE))}catch(e){}}
/* 浏览历史：最近看的排前面，去重，最多留 12 个 */
function markView(id){
  STORE.hist=[id].concat((STORE.hist||[]).filter(function(x){return x!==id})).slice(0,12);save();
}
/* 搜不到时用户点「记下来」：存本地，下次补词时优先补 */
function addMiss(q){
  q=String(q||'').trim();if(!q)return;
  STORE.miss=STORE.miss||{};STORE.miss[q]=(STORE.miss[q]||0)+1;save();
}

var screenEl=document.getElementById('screen');
var stack=[],cur='home',curArg=null,QI=0,PICKED=null,timers=[];

function esc(s){return String(s).replace(/&(?!\w+;)/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function strip(s){return esc(String(s).replace(/<[^>]+>/g,''))}
function byId(id){for(var i=0;i<WORDS.length;i++){if(WORDS[i].id===id)return WORDS[i]}return null}
function clearTimers(){timers.forEach(clearTimeout);timers=[]}
function push(fn,t){timers.push(setTimeout(fn,t))}
function go(v,a){if(cur)stack.push({v:cur,a:curArg});cur=v;curArg=a;render()}
function back(){var p=stack.pop();if(p){cur=p.v;curArg=p.a;render()}}

function isDesk(){return window.matchMedia('(min-width:900px)').matches}

function render(){
  clearTimers();
  var h='';
  if(cur==='home')h=viewHome();
  else if(cur==='list')h=viewList(curArg);
  else if(cur==='detail')h=viewDetail(curArg);
  else if(cur==='quiz')h=viewQuiz();
  else if(cur==='qlog')h=viewQLog();
  else if(cur==='about')h=viewAbout();
  else if(cur==='fav')h=viewFav();
  /* v5.0 桌面分栏：首页/列表/收藏进左栏，右栏常驻显示当前词详解 */
  if(isDesk()&&(cur==='home'||cur==='list'||cur==='fav')){
    var rightHtml=deskId
      ?'<div class="view v-detail">'+detailInner(deskId)+'</div>'
      :'<div class="dk-hint">👈 点左边任意一个词<br>详解会显示在这里</div>';
    h='<div class="desk"><div class="dk-left">'+h+'</div>'
     +'<div class="dk-right" id="dkRight">'+rightHtml+'</div></div>';
  }
  screenEl.innerHTML=h;
  window.scrollTo(0,0);
  document.getElementById('q').value=(cur==='list'&&curArg&&curArg.q)?curArg.q:'';
  syncTab();
  if(cur==='detail')startDemo(curArg);
  if(isDesk()&&deskId&&(cur==='home'||cur==='list'||cur==='fav'))startDemo(deskId);
}

/* v5.0 桌面模式：点词/点相关词只刷新右栏，不跳页 */
var deskId=null;
function deskShow(id){
  var r=document.getElementById('dkRight');
  if(!r){go('detail',id);return}
  deskId=id;
  r.innerHTML='<div class="view v-detail">'+detailInner(id)+'</div>';
  r.scrollTop=0;
  startDemo(id);
}
function syncTab(){
  var t=document.querySelectorAll('#tabbar div');
  for(var i=0;i<t.length;i++){
    var k=t[i].getAttribute('data-tab');
    t[i].className=(k===cur||(cur==='list'&&k==='home')||(cur==='detail'&&k==='home'))?'on':'';
  }
}

function rowHTML(w,isAbbr){
  var f=STORE.fav[w.id]?'on':'';
  var inner=isAbbr
   ? '<div class="abbrline"><span class="a">'+w.term+(w.shot&&SHOTS[w.shot]?' 🖼':'')+'</span><span class="f">'+w.full+' · '+strip(w.cn)+'</span></div>'
     +'<div class="rd">'+strip(w.tl)+'</div>'
   : '<div class="rn">'+w.term+(w.new?' <span class="badge">NEW</span>':'')
     +' <span class="chip lv">'+LV[w.lv]+'</span></div>'
     +'<div class="rd">'+strip(w.cn)+' — '+strip(w.tl)+'</div>';
  return '<div class="row" data-go="detail" data-id="'+w.id+'"><div class="rt">'+inner+'</div>'
    +'<div class="star '+f+'" data-star="'+w.id+'">★</div></div>';
}
/* 一个词所有可被搜到的文本：词、全称、中文、别名、释义、类比、场景 */
function hayOf(w){
  return (w.term+' '+w.full+' '+w.cn+' '+((w.al||[]).join(' '))+' '
    +strip(w.tl)+' '+strip(w.ana||'')+' '+strip(w.scn||'')+' '+strip(w.one||'')).toLowerCase();
}
function searchWords(q){
  q=String(q).toLowerCase().trim();if(!q)return [];
  /* 先把查询按空格拆开，每个片段都要命中（搜「ai 幻觉」= 同时含两者） */
  var parts=q.split(/\s+/);
  return WORDS.filter(function(w){
    var hay=hayOf(w);
    return parts.every(function(p){return hay.indexOf(p)>-1});
  });
}
/* 搜不到时的兜底：模糊找最接近的 N 个（逐字命中 + 连续两字加权） */
function nearWords(q,n){
  q=String(q).toLowerCase().trim();if(!q)return [];
  var scored=[];
  WORDS.forEach(function(w){
    var hay=hayOf(w),sc=0,used={},i;
    for(i=0;i<q.length;i++){var c=q[i];if(used[c])continue;if(hay.indexOf(c)>-1){sc++;used[c]=1}}
    if(q.length>1)for(i=0;i+1<q.length;i++){if(hay.indexOf(q.substr(i,2))>-1)sc+=2}
    if(sc>0)scored.push({w:w,sc:sc});
  });
  scored.sort(function(a,b){return b.sc-a.sc});
  return scored.slice(0,n).map(function(x){return x.w});
}
function missHTML(q){
  var near=nearWords(q,3);
  var h='<div class="empty"><span class="e">🔍</span>没找到「'+esc(q)+'」<br>'

  if(near.length)h+=near.map(function(w){return rowHTML(w,false)}).join('');

  h+='<div class="missbox"><div class="mt">都不是？</div>'
   +'<button class="btn ghost" data-miss="'+esc(q)+'">'+(noted?'✅ 已记下了':'📌 记下来，下次补上')+'</button>'

function listHTML(o,isAbbr){
  if(o&&o.q){
    var list=searchWords(o.q);
    if(!list.length)return missHTML(o.q);
    return list.map(function(w){return rowHTML(w,isAbbr)}).join('');
  }
  /* v6.0：三个新入口页 —— 最该先搞懂 / 最近新增 / 今日推荐 */
  if(o&&o.sp==='hot'){
    return ['llm','token','context','prompt','hallu','agent','rag','api','mcp','skill']
      .map(byId).filter(Boolean)
      .sort(function(a,b){return a.lv-b.lv})
      .map(function(w){return rowHTML(w,false)}).join('');
  }
  if(o&&o.sp==='new'){
    var nl=WORDS.filter(function(w){return w.new}).slice().reverse();
    return nl.map(function(w){return rowHTML(w,false)}).join('');
  }
  if(o&&o.sp==='daily'){
    return dailyFive().map(function(w){return rowHTML(w,false)}).join('');
  }
  /* v6.2：分区列表按难度升序 + 可按难度筛选 */
  var zl=WORDS.filter(function(w){return w.zone===o.z});
  if(o.lv)zl=zl.filter(function(w){return String(w.lv)===String(o.lv)});
  zl.sort(function(a,b){return a.lv-b.lv});
  if(!zl.length)return '<div class="empty"><span class="e">📭</span>这个难度下暂无词</div>';
  return zl.map(function(w){return rowHTML(w,isAbbr)}).join('');
}

/* v6.0：今日 5 词 = 1 主推（当日动画词）+ 4 个相关词（主推词的 rel 优先，不够从热门补） */
function dailyFive(){
  var dw=dailyWord();
  var out=[dw],seen={};seen[dw.id]=1;
  (dw.rel||[]).forEach(function(id){
    if(out.length>=5)return;
    var w=byId(id);if(w&&!seen[id]){out.push(w);seen[id]=1}
  });
  ['llm','token','context','prompt','hallu','agent','rag','api','mcp','skill'].forEach(function(id){
    if(out.length>=5)return;
    var w=byId(id);if(w&&!seen[id]){out.push(w);seen[id]=1}
  });
  return out;
}

function dailyWord(){
  var d=new Date(),n=Math.floor(d.getTime()/86400000);
  var core=WORDS.filter(function(w){return w.demo});
  return core.length?core[n%core.length]:WORDS[0];
}

  if(k==='ft')return '<div class="cmp"><div class="side bad"><div class="t">🎓 微调 Fine-tuning</div>把知识<b>刻进脑子</b><br>· 改起来慢、贵<br>· 适合固定<b>风格</b>（说话口气、格式）<br>· 内容变了得重新练</div>'

  if(k==='oss')return '<div class="cmp"><div class="side good"><div class="t">🔓 开源（DeepSeek / Qwen / Llama）</div>给你菜谱和食材<br>· 能自己部署、随便改<br>· 便宜、数据不出门<br>· 但你得有「厨房」（技术/显卡）</div>'
   +'<div class="side bad"><div class="t">🔒 闭源（GPT / Claude）</div>直接去饭店吃<br>· 开箱即用，最强<br>· 按量付费<br>· 数据在别人那儿</div></div>'

   +'<div class="ex">👨‍⚖️ 法务</div><div class="ex">👩‍💻 技术</div><div class="ex">🧮 财务</div>'

   +'<div class="hint" id="moeHint">准备中…</div>'

  return '';
}

/* ---------- 动画驱动 ---------- */
function tokenize(s){
  var out=[],re=/[\u4e00-\u9fa5]|[A-Za-z]+|\d+|[^\sA-Za-z0-9\u4e00-\u9fa5]/g,m;
  while((m=re.exec(s))!==null){var t=m[0];
    if(/[A-Za-z]{5,}/.test(t)){var i=0;while(i<t.length){out.push(t.slice(i,i+4));i+=4}}
    else out.push(t);}
  return out;
}
function startDemo(wordId){
  /* v5.1 修复：桌面分栏下页面停在首页/列表，curArg 不是词 id，
     必须由调用方显式传入词 id，否则动画全都不启动 */
  var w=byId(wordId);if(!w||!w.demo)return;
  var k=w.demo;
  if(k==='llm')runLLM();
  if(k==='token')runToken();
  if(k==='ctx')runCtx();
  if(k==='temp')runTemp();
  if(k==='agent'||k==='rag')runSteps(k==='agent'?'#agSteps':'#ragSteps');
  if(k==='moe')runMoe();
}
function runSteps(sel){
  var steps=document.querySelectorAll(sel+' .step');if(!steps.length)return;
  var n=steps.length,i=0;
  (function loop(){
    for(var j=0;j<steps.length;j++)steps[j].classList.remove('on');
    if(i<n){steps[i].classList.add('on');i++}
    else{i=0;push(loop,1400);return}
    push(loop,1600);
  })();
}
function runLLM(){
  var out=document.getElementById('out'),hint=document.getElementById('llmHint');
  if(!out)return;
  var seq=['真','好','啊'],tips=['「真」——概率最高','「好」——接在真后面最顺','「啊」——可以收尾了'];
  push(function(){hint.innerHTML='它先看到「<b>今天天气</b>」，然后开始猜下一个字…'},500);
  seq.forEach(function(c,n){
    push(function(){out.textContent+=c;
      hint.innerHTML='吐出第 '+(n+1)+' 个字：<b style="color:var(--accent)">'+c+'</b>　'+tips[n];},1400+n*1000);
  });
  push(function(){hint.innerHTML='✅ 看出来了吗？<b>它不是一个字一个字想好了再写，是每次只猜下一个最可能的字，串起来就成了句子。</b>'},1400+seq.length*1000+300);

function runToken(){
  var stage=document.getElementById('tokStage'),hint=document.getElementById('tokHint'),
      inp=document.getElementById('tokIn'),cnt=document.getElementById('tokCount');
  if(!stage)return;
  var demo='我爱吃苹果',toks=tokenize(demo);
  var hints=['先拿到你说的话…','AI 不认识整句，先把它拆成积木块','中文基本一个字一块','每块就是一个 Token','拆完才能算钱、算长度'];
  stage.innerHTML=toks.map(function(t){return '<span class="tok">'+esc(t)+'</span>'}).join('');
  var spans=stage.querySelectorAll('.tok');
  toks.forEach(function(t,i){
    push(function(){if(spans[i])spans[i].classList.add('on');
      hint.innerHTML='<b>'+(i+1)+'</b> / '+toks.length+' 块 — '+hints[Math.min(i,hints.length-1)];},400+i*430);
  });
  push(function(){
    hint.innerHTML='✅ 拆完了：<b>'+toks.length+' 个 Token</b>。中文一般一个字一块，记「字数 ≈ Token 数」基本够用。'
     +'<br><span style="color:var(--faint)">（真实分词器会把「苹果」这类常见词合并，实际会略少，但数量级一样。）</span>';},
    400+toks.length*430+300);
  if(inp)inp.addEventListener('input',function(){

    var tk=tokenize(v),show=tk.slice(0,60),col=['#3566f0','#7b4ff0','#1f9d55','#f2622e','#f6a623'];
    stage.innerHTML=show.map(function(t,i){
      return '<span class="tok on" style="border-color:'+col[i%5]+';color:'+col[i%5]+'">'+esc(t)+'</span>'}).join('')
      +(tk.length>60?'<span class="tok on">…还有 '+(tk.length-60)+' 块</span>':'');
    cnt.textContent='你这句 = '+tk.length+' 个 Token';
  });

/* ── v6.3：考考我改版 ──
   ① 题库自动生成：没手写题的词用「一句话」自动出两种题（释义选词 / 词选释义），
      干扰项取同分区的词；题库 20 → 140，新词自动带题
   ② 每轮随机洗牌组卷 10 题：错题池优先（≤4）→ 全库混合补足
   ③ 答错进错题池（存本地），答对自动出池；一轮结束给小结
   ④ 30 天答题记录（按天分组可查） */
var QPAPER=null,QLOG=[],SCORE=0;
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function autoQuiz(w){
  var same=WORDS.filter(function(x){return x.id!==w.id&&x.zone===w.zone});
  var src=shuffle(same.length>=3?same:WORDS.filter(function(x){return x.id!==w.id})).slice(0,3);
  var def=strip(w.one);
  var useDef=Math.random()<0.5,q,opts;
  if(useDef){
    q='「'+def+'」说的是哪个词？';
    opts=shuffle([{t:w.term,id:w.id,ok:1},{t:strip(src[0].term),id:src[0].id},{t:strip(src[1].term),id:src[1].id},{t:strip(src[2].term),id:src[2].id}]);
  }else{
    q='「'+w.term+'」是什么意思？';
    opts=shuffle([{t:def,id:w.id,ok:1},{t:strip(src[0].one),id:src[0].id},{t:strip(src[1].one),id:src[1].id},{t:strip(src[2].one),id:src[2].id}]);
  }
  var a=0;for(var i=0;i<opts.length;i++){if(opts[i].ok)a=i}
  return {w:w,q:q,o:[opts[0].t,opts[1].t,opts[2].t,opts[3].t],
    ids:[opts[0].id,opts[1].id,opts[2].id,opts[3].id],
    a:a,why:w.term+'（'+strip(w.cn)+'）：'+def,auto:true};
}
function buildPaper(){
  /* 全库混合洗牌：手写精讲题与自动题自然混排，错题池置顶 */
  var pool=shuffle(WORDS.slice());
  var wrong=shuffle(Object.keys(STORE.wrong||{}).filter(function(id){return byId(id)}));
  var used={},paper=[];
  function take(w){
    if(used[w.id]||paper.length>=10)return;
    used[w.id]=1;
    paper.push(w.quiz?{w:w,q:w.quiz.q,o:w.quiz.o,a:w.quiz.a,why:w.quiz.why,auto:false}:autoQuiz(w));
  }
  wrong.slice(0,4).forEach(function(id){take(byId(id))});
  pool.forEach(function(w){take(w)});
  QPAPER=paper.slice(0,10);QLOG=[];SCORE=0;QI=0;PICKED=null;
}

  if(QI>=QPAPER.length){

    var L=(STORE.qlog||[]);

    var pct=L.length?Math.round(okN*100/L.length):0;
    h+='<div class="qbox"><div class="qnum">本轮小结</div>'
     +'<div class="qtxt">答对 <b style="font-size:22px">'+ok+'</b> / '+QLOG.length+'</div>'
     +'<div class="expl">近 30 天累计答题 <b>'+L.length+'</b> 道 · 正确率 <b>'+pct+'%</b></div>';
    if(wl.length){
      h+='<div class="expl">错过的这几个已进错题池，下一轮优先重考：</div>';
      wl.forEach(function(w){h+=rowHTML(w,false)});
    }else h+='<div class="expl">✅ 全对！下一轮全是新题</div>';
    h+='<button class="btn" data-rebuild="1">再来一轮（重新组卷）</button></div>';
    h+='<button class="btn ghost" data-go="qlog">📋 30 天答题记录</button>';
    h+='<p class="tip">💡 📝 精讲题优先出 · 答错的词进错题池下轮重考</p>'+footer()+'</div>';
    return h;
  }
  var q=QPAPER[QI];
  var last=(QI===QPAPER.length-1);
  h+='<div class="qbox"><div class="qnum">第 '+(QI+1)+' / '+QPAPER.length+' 题 · 题库 '+WORDS.length+' 词'
   +(q.auto?'':' · 📝 精讲题')+'</div><div class="qtxt">'+q.q+'</div>';
  q.o.forEach(function(o,i){
    var cls='';
    if(PICKED!==null){if(i===q.a)cls=' right';else if(i===PICKED)cls=' wrong'}
    h+='<div class="opt '+cls+'" data-pick="'+i+'">'+String.fromCharCode(65+i)+'. '+esc(o)+'</div>';
  });
  if(PICKED!==null){
    var okAns=(PICKED===q.a);
    h+='<div class="expl">'+(okAns?'✅ 答对了！':'❌ 正确答案：'+String.fromCharCode(65+q.a)+'。')+' '+q.why+'</div>';
    if(!okAns&&q.ids&&q.ids[PICKED]&&q.ids[PICKED]!==q.w.id){
      var pickedW=byId(q.ids[PICKED]);
      if(pickedW)h+='<div class="expl">你选的 '+String.fromCharCode(65+PICKED)+' 其实是「<b>'+pickedW.term+'</b>」（'+strip(pickedW.cn)+'）：'+strip(pickedW.one)
       +'　<button class="morelink" data-go="detail" data-id="'+pickedW.id+'">看它的详解 →</button></div>';
    }
    if(!okAns){
      var favCls=STORE.fav[q.w.id]?' on':'';
      h+='<div class="expl">容易混？<span class="star '+favCls+'" data-star="'+q.w.id+'" style="font-size:19px;cursor:pointer">★</span> 收藏「'+q.w.term+'」，在收藏页重点看</div>';
    }
    h+='<button class="btn" data-next="1">'+(last?'看本轮成绩 →':'下一题 →')+'</button>';
  }else h+='<button class="btn" disabled>选一个答案</button>';
  h+='<button class="btn ghost" data-go="detail" data-id="'+q.w.id+'">看看这个词的详解</button>';
  h+='</div><p class="tip">💡 答错的词会进错题池，下一轮优先重考　·　<button class="morelink" data-go="qlog">📋 答题记录</button></p>'+footer()+'</div>';
  return h;
}

  var v=this.value.trim();
  if(v){
    if(cur!=='list'){stack.push({v:cur,a:curArg});cur='list';curArg={z:'ai',q:v};render();return}
    curArg={z:curArg.z,q:v};
    var box=document.getElementById('listBox');
    if(box)box.innerHTML=listHTML(curArg,false);
    var t=document.querySelector('#screen .topbar .t');if(t)t.textContent='搜索“'+esc(v)+'”';
  }else if(cur==='list'){back();}
});
document.getElementById('tabbar').addEventListener('click',function(e){
  var n=e.target.closest('[data-tab]');if(!n)return;
  var k=n.getAttribute('data-tab');
  stack=[];
  if(k==='quiz'){QI=0;PICKED=null;go('quiz')}
  else if(k==='fav')go('fav');
  else{cur='home';curArg=null;render()}
});
document.getElementById('cnt').innerHTML=WORDS.length+' 词<br><span style="font-size:10px">每周一更新</span>';
render();

});

if('serviceWorker' in navigator){
  var _updBg=function(){
    fetch('./index.html',{cache:'reload'}).then(function(r){return r.text()}).then(function(t){
      caches.match('./index.html').then(function(old){
        if(!old)return;
        old.text().then(function(ot){
          if(ot!==t){
            caches.open('aigc-glossary-v7.3').then(function(c){c.put('./index.html',new Response(t))});
            var b=document.getElementById('updBar');if(b)b.style.display='block';
          }
        });
      });
    }).catch(function(){});
  };
  navigator.serviceWorker.register('./sw.js').then(function(reg){
    /* 已被 SW 接管的页面：SW 检测到新版会 postMessage 过来 */
    navigator.serviceWorker.addEventListener('message',function(e){
      if(e.data&&e.data.type==='UPDATED'){
        var b=document.getElementById('updBar');if(b)b.style.display='block';
      }
    });
    /* 首次进页面也主动对一次版本（覆盖 SW 未接管时的场景） */
    _updBg();
  }).catch(function(){});
}
