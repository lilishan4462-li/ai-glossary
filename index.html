/* v7.0：手动外观切换——用户选「深色/浅色」时直接覆盖系统偏好（防浏览器强制染色） */
:root[data-theme=dark]{
  --bg:#111318; --card:#191c22; --text:#e9ecf1; --sub:#a3acb9; --faint:#7c8593;
  --line:#272b33; --accent:#6d94ff; --accent-soft:#1c2540; --new:#ff7a45;
  --star:#ffc043; --ok:#3ecf8e; --bad:#ff6b6b; --soft:#20242b;
  --sh:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
}

  --bg:#f4f5f7; --card:#fff; --text:#171a1f; --sub:#5c6470; --faint:#8d95a1;
  --line:#e4e7eb; --accent:#3566f0; --accent-soft:#eaf0ff; --new:#f2622e;

}
.morelink{background:none;border:none;padding:0;font-size:12px;font-weight:700;
  color:var(--accent);cursor:pointer;text-decoration:underline}
/* v7.0：外观切换 */
.themebar{margin:12px 0 0;padding:10px 12px;background:var(--card);border:1px solid var(--line);
  border-radius:12px;display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:12px;color:var(--sub)}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-size:15px;line-height:1.7;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
  padding-bottom:env(safe-area-inset-bottom)}
.app{max-width:520px;margin:0 auto;min-height:100vh;position:relative}

.cnt{font-size:11.5px;color:var(--faint)}

.searchbox input{flex:1;border:0;outline:0;background:transparent;color:var(--text);
  font-size:15px;font-family:inherit;min-width:0}
.searchbox .ico{color:var(--faint);font-size:14px}
main{padding:12px 14px 96px}
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--card);
  border-top:1px solid var(--line);display:flex;max-width:520px;margin:0 auto;

.tabbar div{flex:1;text-align:center;padding:9px 0 8px;font-size:11.5px;color:var(--faint);cursor:pointer}

.view{animation:fade .2s ease}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

.daily{background:linear-gradient(135deg,#3566f0,#7b4ff0);color:#fff;border-radius:16px;
  padding:15px 17px;box-shadow:var(--sh);margin-bottom:14px}
.daily .lbl{font-size:11.5px;opacity:.85;letter-spacing:1px}
.daily .w{font-size:23px;font-weight:800;margin:3px 0 2px;line-height:1.3}
.daily .w em{font-style:normal;font-size:14px;font-weight:400;opacity:.85}
.daily .d{font-size:13px;opacity:.93;line-height:1.55}
.daily .go{margin-top:10px;display:inline-block;background:rgba(255,255,255,.22);
  padding:6px 14px;border-radius:20px;font-size:13px;cursor:pointer}
.zones{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:4px}
.zone{background:var(--card);border:1px solid var(--line);border-radius:13px;
  padding:12px 13px;cursor:pointer;box-shadow:var(--sh)}
.zone .e{font-size:19px}
.zone .n{font-weight:700;font-size:14.5px;margin-top:1px}
.zone .c{color:var(--faint);font-size:11.5px}
.secttl{font-size:12.5px;color:var(--sub);font-weight:700;margin:18px 0 8px;
  display:flex;align-items:center;justify-content:space-between}
.secttl .more{font-weight:400;font-size:12px;color:var(--accent);cursor:pointer}
/* v6.2：列表页难度筛选条 */
.chipsbar{display:flex;gap:7px;margin:2px 0 10px;flex-wrap:wrap}
.fchip{padding:6px 13px;border-radius:15px;font-size:12px;font-weight:700;cursor:pointer;
  background:var(--card);border:1px solid var(--line);color:var(--sub)}
.fchip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:11px 13px;margin-bottom:8px;cursor:pointer}
.row .rt{flex:1;min-width:0}
.row .rn{font-weight:700;font-size:14.5px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}

.badge{font-size:10px;padding:1px 6px;border-radius:5px;background:var(--new);color:#fff;font-weight:700}
.chip{font-size:11px;padding:2px 8px;border-radius:20px;background:var(--accent-soft);color:var(--accent)}
.chip.lv{background:var(--soft);color:var(--sub)}
.chip.z{background:var(--soft);color:var(--sub)}
.star{font-size:18px;color:var(--line);cursor:pointer;flex:none;line-height:1;padding-left:4px}
.star.on{color:var(--star)}

.topbar{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.back{cursor:pointer;color:var(--accent);font-size:14px;user-select:none;white-space:nowrap}
.topbar .t{font-weight:700;font-size:15px;flex:1;text-align:center;margin-right:38px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dterm{font-size:25px;font-weight:800;letter-spacing:-.4px;line-height:1.25}
.dfull{color:var(--faint);font-size:12.5px;margin-top:1px;word-break:break-word}
.dcn{color:var(--sub);font-size:13.5px;margin-top:2px}
.chips{margin:10px 0 2px;display:flex;gap:6px;flex-wrap:wrap}
.blk{background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:13px 15px;margin:11px 0;box-shadow:var(--sh)}
.blk .h{font-weight:700;font-size:14px;margin-bottom:5px}
.blk .b{font-size:14.5px;line-height:1.78}
.blk .b em{font-style:normal;background:linear-gradient(transparent 60%,#ffe08a 60%);font-weight:600}
@media (prefers-color-scheme:dark){.blk .b em{background:linear-gradient(transparent 60%,#5b4a16 60%)}}
.demoname{font-size:11.5px;color:var(--faint);margin:0 0 9px}
.shotbox{background:var(--soft);border:1px solid var(--line);border-radius:11px;
  padding:11px 9px 8px;cursor:zoom-in}
.shotbox svg{width:100%;height:auto;display:block}
.shotbox .zt{font-size:11px;color:var(--faint);text-align:center;margin-top:8px}
.zmask{position:fixed;top:0;left:0;right:0;bottom:0;z-index:200;

.zmask .zin{background:var(--card);border-radius:14px;padding:14px;width:100%;max-width:520px}
.zmask svg{width:100%;height:auto;display:block}
.zmask .zc{font-size:12px;color:var(--sub);text-align:center;margin-top:10px}
.rel .row{margin-bottom:6px;box-shadow:none}
.btn{display:block;width:100%;background:var(--accent);color:#fff;border:0;border-radius:12px;
  padding:12px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:12px}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn:disabled{opacity:.4}

/* 演示组件 */
.stage{background:var(--soft);border-radius:11px;padding:13px}
.hint{font-size:12.5px;color:var(--sub);margin-top:9px;min-height:19px;line-height:1.6}
.tok{padding:5px 9px;border-radius:7px;background:var(--card);border:1px solid var(--line);
  font-size:14px;opacity:.22;transform:scale(.92);transition:all .3s ease;display:inline-block;margin:3px}
.tok.on{opacity:1;transform:scale(1)}
.miniin{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--text);
  border-radius:10px;padding:9px 11px;font-size:14px;font-family:inherit;outline:0;margin-top:9px}
.miniin:focus{border-color:var(--accent)}
.counter{font-size:12.5px;color:var(--accent);font-weight:700;margin-top:7px}
.steps{display:flex;flex-direction:column;gap:6px}
.step{display:flex;align-items:center;gap:9px;padding:8px 11px;border-radius:10px;
  background:var(--soft);opacity:.32;transition:all .4s ease;font-size:13.5px}
.step.on{opacity:1;background:var(--accent-soft);color:var(--accent);font-weight:600}
.step .num{width:19px;height:19px;border-radius:50%;background:var(--card);
  border:1px solid var(--line);display:flex;align-items:center;justify-content:center;
  font-size:11px;flex:none;font-weight:700}
.step.on .num{background:var(--accent);color:#fff;border-color:var(--accent)}
.apirow{display:flex;align-items:center;gap:3px}
.apibox{flex:1;text-align:center;padding:8px 3px;border-radius:9px;background:var(--soft);font-size:12px}
.apibox.hi{background:var(--accent-soft);color:var(--accent);font-weight:700}
.apiline{flex:.6;height:2px;background:var(--line);position:relative;min-width:16px}
.apiline i{position:absolute;top:-3px;left:0;width:6px;height:6px;border-radius:50%;
  background:var(--accent);animation:move 2.2s linear infinite}
@keyframes move{0%{left:0;opacity:0}15%{opacity:1}85%{opacity:1}100%{left:calc(100% - 6px);opacity:0}}
.typing{background:var(--soft);border-radius:11px;padding:14px;font-size:17px;letter-spacing:1px}
.typing .q{color:var(--sub)}
.typing .o{color:var(--accent);font-weight:700}
.caret{display:inline-block;width:2px;height:17px;background:var(--accent);
  vertical-align:-2px;animation:blink .9s steps(2) infinite}
@keyframes blink{0%,50%{opacity:1}51%,100%{opacity:0}}
.cmp{display:flex;gap:8px}
.cmp .side{flex:1;border-radius:11px;padding:11px 12px;font-size:13px;line-height:1.6;
  background:var(--soft);border:1px solid var(--line)}
.cmp .side.bad{background:color-mix(in srgb,var(--bad) 10%,transparent);border:1px solid color-mix(in srgb,var(--bad) 35%,transparent)}
.cmp .side.good{background:color-mix(in srgb,var(--ok) 10%,transparent);border:1px solid color-mix(in srgb,var(--ok) 35%,transparent)}
.cmp .side .t{font-weight:700;font-size:12.5px;margin-bottom:4px}
.kit{display:flex;flex-direction:column;gap:5px}
.kit .lv1{border-radius:9px;padding:8px 12px;font-size:13px;background:var(--soft);text-align:center}
.kit .lv1.in2{background:color-mix(in srgb,var(--accent) 8%,transparent)}
.kit .lv1.in3{background:color-mix(in srgb,var(--accent) 16%,transparent)}
.kit .lv1.in4{background:color-mix(in srgb,var(--accent) 26%,transparent);color:var(--accent);font-weight:700}
.kit .ar{text-align:center;color:var(--faint);font-size:11px;line-height:1}
.win{border:1px dashed var(--line);border-radius:10px;padding:9px;min-height:96px;
  display:flex;flex-direction:column;gap:5px}
.msg{font-size:12.5px;padding:6px 9px;border-radius:8px;background:var(--soft);
  opacity:.35;transition:all .35s}
.msg.on{opacity:1}
.msg.out{background:color-mix(in srgb,var(--new) 14%,transparent);color:var(--new);text-decoration:line-through}
.slider{width:100%;margin:6px 0 2px;accent-color:var(--accent)}
.say{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 13px;
  font-size:13.5px;line-height:1.7;margin-top:8px;min-height:52px}
.moe{display:flex;gap:6px;flex-wrap:wrap}
.moe .ex{padding:6px 10px;border-radius:8px;background:var(--soft);font-size:12px;opacity:.4;transition:all .3s}
.moe .ex.on{opacity:1;background:var(--accent-soft);color:var(--accent);font-weight:700}

/* 测验 */
.qbox{background:var(--card);border:1px solid var(--line);border-radius:15px;
  padding:17px;margin-bottom:12px;box-shadow:var(--sh)}
.qnum{font-size:11.5px;color:var(--faint)}
.qtxt{font-size:16px;font-weight:700;margin:7px 0 13px;line-height:1.6}
.opt{border:1px solid var(--line);border-radius:11px;padding:11px 13px;margin-bottom:8px;
  cursor:pointer;font-size:14.5px}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent);color:var(--ok);font-weight:600}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent);color:var(--bad)}
.expl{font-size:13.5px;color:var(--sub);background:var(--soft);border-radius:10px;padding:11px 13px;margin-top:4px}
.empty{text-align:center;color:var(--faint);padding:50px 20px;font-size:14px;line-height:1.9}
.empty .e{font-size:36px;display:block;margin-bottom:8px}
.tip{font-size:12px;color:var(--faint);text-align:center;margin-top:16px;line-height:1.7}
.abbrline .a{font-weight:800;font-size:15px;color:var(--accent);min-width:58px;display:inline-block}
.abbrline .f{font-size:11.5px;color:var(--faint)}
footer{text-align:center;color:var(--faint);font-size:11.5px;padding:16px 20px 10px;line-height:1.8}
/* v2.0 随查三件套：一句话 / 别搞混 / 真实对话 */
.one{background:var(--accent-soft);border:1px solid var(--line);border-left:4px solid var(--accent);
  border-radius:12px;padding:13px 15px;font-size:17px;font-weight:700;line-height:1.62;margin:12px 0 2px}
.blk.cf .h{color:var(--bad)}
.blk.cf .b{font-size:14px}
.blk.talk .dl{font-size:13.5px;line-height:1.72;background:var(--soft);border-radius:10px;
  padding:8px 12px;margin-top:6px}
.blk.talk .dl+.dl{margin-top:6px}
.missbox{text-align:center;margin-top:14px;padding:14px;background:var(--soft);border-radius:12px}
.missbox .mt{font-size:13px;color:var(--sub);margin-bottom:8px}
.missbox .ms{font-size:11.5px;color:var(--faint);margin-top:8px;line-height:1.7}

/* ===== v5.0 桌面横版适配·方案A 左右分栏（≥900px 生效；手机端不受任何影响） ===== */
@media (min-width:900px){
  .app{max-width:1160px}
  .hd{padding:14px 26px 10px}
  .searchbox{max-width:560px}
  main{padding:16px 26px 120px}
  /* 底部导航：通栏实心底栏（v4.0 悬浮胶囊已废弃，不再遮挡内容） */
  .tabbar{max-width:1160px}
  /* 双栏骨架：左 400px 导航/列表，右栏词条详解 */
  .desk{display:grid;grid-template-columns:400px minmax(0,1fr);gap:20px;align-items:start}
  .dk-left{min-width:0}
  .dk-left .view{animation:none}
  .dk-right{position:sticky;top:118px;max-height:calc(100vh - 176px);overflow-y:auto;
    border:1px solid var(--line);border-radius:16px;padding:16px 20px 18px;background:var(--bg)}
  .dk-hint{color:var(--faint);font-size:13.5px;text-align:center;padding:70px 16px;line-height:2}
  /* 左栏列表保持单列（400px 塞不下双列） */
  .v-list #listBox{display:block}
  .v-list #listBox .row{margin-bottom:8px}
  /* 独立详情页/测验页（如从手机状态切过来）限宽居中 */
  .v-detail{max-width:760px;margin:0 auto}
  .v-quiz{max-width:720px;margin:0 auto}
  .zmask .zin{max-width:860px}
}

{id:'ml',term:'机器学习 / ML',full:'Machine Learning',cn:'机器学习',zone:'ai',lv:2,abbr:true,

 demo:null,rel:['ai','llm'],al:['机器学习','训练模型','机器学习算法'],one:'不写死规则，让机器自己从数据里找规律',cf:'机器学习只是实现 AI 的一条路，不等于 AI 全部',dlg:['甲：它怎么知道该推荐啥？','乙：看了几万条历史数据自己学的']},

{id:'llm',term:'LLM',full:'Large Language Model',cn:'大语言模型 / 大模型',zone:'ai',lv:1,abbr:true,

 scn:'你在 Codex / WorkBuddy 里<b>选模型</b>（GPT、Claude、GLM、DeepSeek），选的就是不同的 LLM；公众号说「用大模型写文案」，那个大模型就是它。',
 demo:'llm',

{id:'token',term:'Token',full:'Token',cn:'词元 / 令牌',zone:'ai',lv:2,

 scn:'Codex 提示「上下文剩 12%」，那个百分比就是剩余 Token；文章里说「这个词 3 个 token」，就是在说它被切成了 3 块。',

 why:'中文通常一个字 ≈ 一个 Token；英文长单词反而会被拆成好几块，所以「按字数估钱」在中文里基本准，在英文里会算错。'},
 rel:['llm','context'],al:['词元','令牌','分词','字数','计费单位','tokens'],one:'AI 数文字的单位，不等于「字」',cf:'一个英文词常切成 2-3 个 token，中文多是一字一个',dlg:['甲：怎么又超了？','乙：你说太多，token 用完了']},

 scn:'Codex 提示「上下文快满了，建议 /compact」——就是会议室坐不下了，让你把前面的对话压缩一下腾地方。',

{id:'prompt',term:'Prompt',full:'Prompt',cn:'提示词',zone:'ai',lv:1,

 scn:'公众号圈说的「提示词工程」「咒语」，本质就是把活派清楚。你让我「用苏格拉底提问法问我」，那句话就是 Prompt。',
 demo:'prompt',

 why:'这招叫「少样本」（Few-shot）：先给它 2～3 个你想要的样子，它立刻知道你要什么。比调参数、换模型都划算。'},
 rel:['sysprompt','cot','llm'],al:['提示词','提示语','咒语','指令','提问词','prompt词'],one:'你给 AI 下的那句话，说清要它干啥',cf:'不是几个关键词，是一段完整的话，越具体越好',dlg:['甲：我写的它老答偏','乙：提示词没说清要什么格式']},

{id:'sysprompt',term:'System Prompt',full:'System Prompt',cn:'系统提示词',zone:'ai',lv:2,

 scn:'你给 AI 写的那份「你是谁、怎么回答、什么不能说」的设定文件，本质上就是 System Prompt——它在每一次对话里都起作用，你看不见但它一直在。',
 demo:null,rel:['prompt','agent'],al:['系统提示词','系统指令','人设','预设指令','system prompt'],one:'对话开始前偷偷塞给 AI 的长期规矩',cf:'你说的每句叫 prompt，这个是后台固定的人设',dlg:['甲：它怎么知道自己是客服？','乙：系统提示词里写好了身份']},

{id:'hallu',term:'幻觉',full:'Hallucination',cn:'AI 幻觉 / 一本正经胡说',zone:'ai',lv:1,

 scn:'你让 AI 找某句名言的原文出处，它可能给你编一个页码。<b>凡是引用、数据、人名，一定要自己核一遍</b>。',

 why:'让它先翻你的资料再回答（RAG），答案有出处就不容易编。「不许编」这种叮嘱基本没用，它做不到。'},
 rel:['rag','llm'],al:['幻觉','胡说','编的','瞎编','一本正经胡说','乱说','造假'],one:'AI 一本正经地编造不存在的事实',cf:'它不是故意骗你，是真分不清自己知不知道',dlg:['甲：这书名是真的？','乙：查了没有，它幻觉了']},

{id:'temp',term:'温度',full:'Temperature',cn:'温度参数',zone:'ai',lv:2,

 scn:'写代码、查数据、做表格 → 调低（0～0.3）；写公众号标题、想创意、头脑风暴 → 调高（0.7～1）。大多数工具默认 0.7 左右。',
 demo:'temp',rel:['llm','prompt'],al:['温度','随机性','temperature','创造性参数','发散度'],one:'控制 AI 是照本宣科还是天马行空',cf:'调低不等于变聪明，只是更保守、花样更少',dlg:['甲：每次结果都不一样','乙：温度调高了，让它更有创意']},

{id:'agent',term:'Agent',full:'AI Agent',cn:'智能体',zone:'ai',lv:2,abbr:true,

 ana:'普通 AI 是<b>你问我答的客服</b>；Agent 是<b>外包员工</b>——你说「帮我调研竞品定价写成报告」，它自己搜、自己整理、自己写，最后把成品给你。',
 scn:'你让 AI「帮我做个查名词的小工具」，它自己拆任务、读文件、写代码、跑测试，干完一次性给你结果——这就是 Agent 模式。',
 demo:'agent',
 quiz:{q:'下面哪个更像 Agent 而不是普通聊天 AI？',o:['问一句答一句的百科','只能聊天的客服机器人','你说目标，它自己搜资料→整理→写报告→交给你','需要你一步步指挥的工具'],a:2,

 rel:['mcp','tool','workflow','harness'],al:['智能体','代理','agent模式','AI代理','智能代理','agentic','智能体的','agentic ai'],one:'能自己拆解任务、动手干活的 AI',cf:'聊天机器人只动嘴，Agent 会真的去点、去改文件',dlg:['甲：它自己就去改代码了？','乙：嗯，开着 Agent 模式呢']},

{id:'rag',term:'RAG',full:'Retrieval-Augmented Generation',cn:'检索增强生成',zone:'ai',lv:3,abbr:true,

 scn:'你把自己行业的资料喂给它，问一个只有资料里才有的细节，它从你资料里翻完再答——这就是 RAG。公众号说「给 AI 挂个知识库」，挂的就是这个。',
 demo:'rag',rel:['embed','vdb','hallu','llm'],al:['检索增强','外挂知识库','查资料再回答','知识库问答','rag技术'],one:'先翻你的资料，再照着资料回答',cf:'RAG 不改模型本身，只是临时给它参考资料',dlg:['甲：它怎么知道我公司的事？','乙：接了知识库，走的 RAG']},

{id:'embed',shot:'embed',term:'Embedding',full:'Embedding',cn:'向量化 / 嵌入',zone:'ai',lv:3,

 ana:'给每段话发一个<b>数学指纹</b>。电脑不认字只认数，有了指纹它就能算出「护持一行」和「主导一行」其实说的是一回事。',
 scn:'你搜「怎么判断五行人」，即使文章里一个字都没出现「判断」两个字，也能被搜出来——靠的就是这个。RAG 底层全靠它。',
 demo:null,rel:['rag','vdb'],al:['向量化','嵌入','embedding','转成数字','向量表示','向量','语义向量'],one:'把文字变成一串数字，好让机器比相似度',cf:'向量化不是压缩，是为了能算出「意思近不近」',dlg:['甲：怎么搜「变笨」能出别的词？','乙：靠 embedding 比语义'],quiz:{q:'Embedding（向量化）做的是？',o:['把文字变成数字坐标，意思越近坐标越近','把图片压缩变小','把外语翻译成中文','给数据加密'],a:0,why:'有了坐标，AI 才能「算出」两句话像不像。'}},

{id:'vdb',term:'向量数据库',full:'Vector Database',cn:'向量数据库',zone:'ai',lv:3,

 ana:'普通图书馆<b>按书名找书</b>；向量数据库是<b>按「讲的是什么」找书</b>——你说个大概意思，它把相关的都给你搬出来。',
 scn:'你给公众号历史文章做个「能对话的知识库」，文章就存在这种库里。常见产品：Pinecone、Milvus、Chroma。',
 demo:null,rel:['embed','rag'],al:['向量数据库','向量库','向量检索','相似度搜索','vectordb','vector db','语义检索'],one:'专门存那串数字、按「意思像不像」搜的库',cf:'普通数据库是精确匹配，它按语义相近排序',dlg:['甲：资料太多放哪？','乙：塞向量数据库，随时检索'],quiz:{q:'向量数据库查东西靠的是？',o:['关键词完全匹配','按编号查找','意思相近程度','字母排序'],a:2,why:'向量库查的是语义相似，找到后由大模型来判断和回答。'}},

{id:'ft',term:'微调',full:'Fine-tuning',cn:'微调 / 精调',zone:'ai',lv:3,
 tl:'在已经训练好的模型上，<b>再用你自己的数据练一遍</b>，让它养成某种固定风格或习惯。',
 ana:'预训练是<b>读完大学</b>（啥都学点）；微调是<b>上岗培训</b>（只在你们公司干，学会你们的黑话和规矩）。LoRA 是一种省钱的微调法，只改模型的一小部分。',
 scn:'「用某位作者的文章微调一个模型」，就是让它学会他的语气和说法。<b>注意：微调不能让它知道新知识</b>，那是 RAG 的活。',
 demo:'ft',
 quiz:{q:'想让 AI 学会你公司的新规定（每周都在变），该用哪个？',o:['RAG（挂知识库）','微调','换更大的模型','调高温度'],a:0,
 why:'微调是把知识「刻进脑子」，改起来慢又贵，适合固定风格；RAG 是给它一本书随时翻，内容变了改书就行。经常变的东西用 RAG。'},
 rel:['rag','llm'],al:['微调','精调','finetune','finetuning','训练自己的模型'],one:'拿现成模型再喂自己的数据，让它更懂你',cf:'微调会改模型参数；RAG 只外挂资料，不改模型',dlg:['甲：让它学会我的文风？','乙：那得微调，光提示词不够']},

{id:'multi',shot:'multi',term:'多模态',full:'Multimodal',cn:'多模态',zone:'ai',lv:1,
 tl:'AI 不只会读字，还<b>能看图、听声音、看视频</b>，混在一起理解。',

 demo:null,rel:['llm','vlm'],al:['多模态','多模态模型','图文音视','能看图'],one:'能同时处理文字、图、声音、视频的 AI',cf:'不支持的类型它也会硬答，别被唬住',dlg:['甲：能让它看这张表吗？','乙：可以，这模型是多模态的']},

{id:'reason',term:'推理模型',full:'Reasoning Model / LRM',cn:'推理模型',zone:'ai',lv:2,abbr:true,

 ana:'普通模型是<b>脱口而出</b>；推理模型是<b>打草稿再交卷</b>。做数学题、写代码、复杂决策，草稿这一步差别巨大。',
 scn:'DeepSeek-R1、GPT 的 o 系列、Claude 的「扩展思考」都是这类。<b>日常闲聊用它 = 用大炮打蚊子</b>，又慢又贵。',
 demo:null,rel:['cot','llm'],al:['推理模型','慢思考','深度思考','o1','思维链模型','LRM','large reasoning model'],one:'回答前先自己想一通，慢但更准',cf:'不是啥题都该用，简单问答会又慢又贵',dlg:['甲：怎么等这么久？','乙：推理模型，它在一步一步想']},

{id:'cot',term:'思维链',full:'Chain of Thought / CoT',cn:'思维链',zone:'ai',lv:2,abbr:true,
 tl:'让 AI <b>把思考过程写出来再给结论</b>。就这一句话，正确率能提升一大截。',
 ana:'像数学考试<b>要写解题步骤，不能只写答案</b>。写着写着，它自己就发现哪步错了。',
 scn:'在提问后面加一句「<b>请一步一步思考</b>」，是全网验证过最省事的提分技巧。你现在就可以试。',
 demo:null,rel:['reason','prompt','opaque'],al:['思维链','一步步想','chain of thought','分步思考','推理过程'],one:'让 AI 把思考过程写出来，答案更靠谱',cf:'你让它「一步步想」，就是在用思维链',dlg:['甲：怎么让它少错？','乙：加一句「请一步步 reasoning」']},

{id:'param',term:'参数',full:'Parameters',cn:'参数 / 7B、70B',zone:'ai',lv:2,

 ana:'像<b>音响上的 EQ 均衡器</b>：旋钮越多，能调出的声音越细腻。但旋钮多不等于好听，还得看调没调好。',
 scn:'文章里说「本地跑个 7B 的小模型」，就是说它脑容量小、对电脑要求低、也便宜。<b>参数大 ≠ 一定更好用</b>，小模型精调后干专项活可能更合适。',
 demo:null,rel:['llm','quant'],al:['参数','参数量','模型大小','7b','70b','多少B'],one:'模型脑容量，B 越大越聪明也越吃硬件',cf:'参数多不等于一定好用，还得看训练数据',dlg:['甲：7B 和 70B 啥区别？','乙：参数量，后者强很多也更慢']},

{id:'moe',term:'MoE',full:'Mixture of Experts',cn:'混合专家模型',zone:'ai',lv:3,abbr:true,

 ana:'大公司里有法务、财务、技术、市场。MoE 不是每次开会都叫齐所有人，而是<b>谁相关叫谁</b>——所以「总人数很多，干活却不慢」。',
 scn:'DeepSeek、Mixtral 都用这招，所以能做到「模型很大但很便宜」。文章里说「MoE 架构」就是在夸这一点。',
 demo:'moe',rel:['param','llm'],al:['混合专家','moe架构','专家模型','多个小模型','MoE 架构','混合专家模型'],one:'一堆小模型组团，每次只叫醒用得上的几个',cf:'不是多个模型投票，是路由挑几个来答',dlg:['甲：这么大怎么跑得动？','乙：MoE，每次只激活一部分'],quiz:{q:'为什么说 MoE 模型省钱？',o:['只唤醒一部分专家干活，算力省下来了','每次回答都要用上全部专家','专家越多推理一定越慢','它把模型压缩得很小'],a:0,why:'MoE 是「按需开工」，不是全员上阵。'}},

{id:'oss',term:'开源 / 闭源',full:'Open Source / Closed Source',cn:'开源模型 / 闭源模型',zone:'ai',lv:1,

 ana:'开源 = <b>给你菜谱和食材</b>，你想怎么改怎么改，但得自己有厨房；闭源 = <b>直接去饭店吃</b>，省心，但菜单由别人定。',
 scn:'你在 WorkBuddy 里配智谱、DeepSeek 的 API 用国产开源模型，成本低、数据可控；用 Claude 则是闭源，省心但按量付费。',
 demo:'oss',rel:['local','llm'],al:['开源','闭源','开源模型','免费模型','权重公开','opensource','开放源代码'],one:'开源=模型文件公开可自部署；闭源=只能用他家接口',cf:'开源不等于能免费商用，要看具体许可证',dlg:['甲：能下载到本地吗？','乙：开源模型可以，闭源不行'],quiz:{q:'「开源」的意思是？',o:['代码公开，谁都能看、能改','免费商用，没有任何限制','没有作者、没有版权','软件开放注册就能用'],a:0,why:'开源 = 代码公开；但能不能商用要看具体协议。'}},

{id:'local',term:'本地部署',full:'Local Deployment',cn:'本地部署 / 端侧 AI',zone:'ai',lv:2,
 tl:'把模型<b>装在你自己的电脑或手机上跑</b>，数据不出门，断网也能用。',
 ana:'用网盘 vs <b>把文件存在自己硬盘</b>。前者方便但要联网、要信对方；后者慢一点、占地方，但东西在你手里。',
 scn:'你在自己电脑上装 Ollama 跑 DeepSeek，就是本地部署。好处：隐私好、不花钱；代价：能力比云端大模型弱一截。',
 demo:null,rel:['oss','quant'],al:['本地部署','本地运行','离线跑','端侧','私有化部署','装自己电脑上'],one:'把模型装在你自己电脑上跑，不联网也行',cf:'本地能保隐私，但效果通常弱于云端大模型',dlg:['甲：数据不能外传','乙：那就本地部署一套']},

{id:'quant',term:'量化 / 蒸馏',full:'Quantization / Distillation',cn:'模型减肥三件套',zone:'ai',lv:3,
 tl:'<b>量化</b>：把模型数字精度压低，体积变小跑得更快（画质略降）。<b>蒸馏</b>：让小模型跟着大模型学，把本事浓缩进小身板。',
 ana:'量化 = <b>高清视频转标清</b>：画质差一点，但手机能放；蒸馏 = <b>名师带徒弟</b>：徒弟没师傅懂得多，但够用且便宜。',
 scn:'文章里说「量化版」「4bit」「蒸馏模型」，都是同一个意思：让大模型能塞进你的电脑里跑。',
 demo:null,rel:['local','param','distill'],al:['量化','蒸馏','剪枝','模型压缩','减肥','int4','int8'],one:'给模型瘦身，少占显存、跑得更快',cf:'量化是降精度，蒸馏是小模型学大模型，不是一回事',dlg:['甲：显卡跑不动','乙：量化到 4bit 试试']},

{id:'ctxeng',term:'上下文工程',full:'Context Engineering',cn:'上下文工程',zone:'ai',lv:3,new:true,

 scn:'你给 AI 挂知识库、挂历史资料、写 CLAUDE.md 这类设定文件，<b>全都是在做上下文工程</b>——你其实早就在做了。',
 demo:null,rel:['prompt','rag','context','harness','agentsmd'],al:['上下文工程','context engineering','喂资料','提示词工程升级版'],one:'研究该往 AI 眼前放哪些信息，让它答得准',cf:'提示词工程只打磨一句话，它管的是整个信息环境',dlg:['甲：光改提示词不管用','乙：得做上下文工程，把资料喂对']},

{id:'vibe',shot:'vibe',term:'Vibe Coding',full:'Vibe Coding',cn:'氛围编程',zone:'ai',lv:1,new:true,

 ana:'像<b>跟装修师傅说「我要个温馨的客厅」</b>——你不管水电怎么走、瓷砖怎么贴，只看最后效果。不满意就说「再暖一点」。',
 scn:'这就是你现在用 Codex、WorkBuddy 的方式。这个词 2025 年由 Karpathy 造出来，年底被《柯林斯词典》评为年度词汇。<b>副作用：你因此撞到一堆看不懂的名词——所以才有了这个工具。</b>',
 demo:null,rel:['agent','llm'],al:['氛围编程','vibe coding','凭感觉写','不看懂代码','让AI写'],one:'不看代码，只管说需求、能跑就行',cf:'适合做小玩具；要长期维护的项目不能这么干',dlg:['甲：你看懂它写的代码了吗？','乙：没看，能跑就行，vibe coding']},

{id:'plugin',shot:'plugin',term:'插件',full:'Plugin / Extension',cn:'插件 / 扩展',zone:'misc',lv:1,

 demo:null,rel:['mcp','sdk'],al:['插件','扩展','plugin','addon','外挂','Extension','浏览器扩展'],one:'给软件额外加功能的小模块',cf:'插件依赖主程序，独立软件能单独运行',dlg:['甲：想加个功能','乙：装个插件就行'],quiz:{q:'浏览器插件装太多会怎样？',o:['吃内存、拖慢启动，甚至互相冲突','会自动互相合并，越用越快','插件之间永远不会冲突','浏览器会自动禁用所有插件'],a:0,why:'插件是「能力外挂」，按需装、常清理。'}},

{id:'llms',term:'llms.txt',full:'llms.txt / llm-wiki',cn:'给 AI 看的说明书',zone:'misc',lv:2,new:true,

 ana:'网页是<b>给人看的带图带排版的页面</b>；llms.txt 是<b>给 AI 看的纯文字版摘要</b>，没花哨东西，方便它快速消化。',
 scn:'你在技术文档里看到「我们提供 llms.txt」，指的就是这个文件。<b>看到这类自造缩写别慌：先查有没有标准定义，没有就当它是小圈子黑话。</b>',
 demo:null,rel:['geo','rag'],al:['llms.txt','给AI看的说明书','AI说明书','llms'],one:'放网站根目录、专门写给 AI 看的介绍文件',cf:'robots.txt 管爬虫能否抓取，llms.txt 告诉 AI 你是谁',dlg:['甲：怎么让 AI 了解我站？','乙：放个 llms.txt']},

/* ---------- 缩写速查区（独有词条） ---------- */
{id:'mcp',term:'MCP',full:'Model Context Protocol',cn:'模型上下文协议',zone:'abbr',lv:2,abbr:true,
 tl:'AI 连接外部工具的<b>统一插头标准</b>。以前每个工具各接各的，有了它就像 USB-C，一个口通吃。',
 ana:'以前 AI 连飞书、连数据库、连网盘，每个都得<b>单独写一套线</b>（各种奇形怪状的充电口）。MCP 就是<b>统一成 Type-C</b>，插上就能用。',
 scn:'你在 Claude Code / Codex 里装 MCP，装完 AI 就能直接读你的飞书多维表格、直接搜网页，<b>不用你复制粘贴</b>。',
 demo:null,
 quiz:{q:'MCP 解决的是什么问题？',o:['让模型更聪明','让 API 更便宜','让 AI 回答更快','让 AI 能用统一方式连接各种外部工具和数据'],a:3,
 why:'MCP 不管模型聪不聪明，它管的是「接得上」：一个标准接口，接文件、数据库、飞书、浏览器都行，不用每个都单独开发。'},
 rel:['api','tool','agent','a2a'],al:['mcp','模型上下文协议','AI接口标准','AI的usb'],one:'AI 连接外部工具的统一插口标准',cf:'它是接口标准不是工具；装了 MCP server 才有能力',dlg:['甲：怎么让 AI 读我表格？','乙：接个 MCP server']},

{id:'agi',term:'AGI',full:'Artificial General Intelligence',cn:'通用人工智能',zone:'abbr',lv:2,abbr:true,
 tl:'<b>在所有领域都达到人类水平</b>的 AI。现在的 AI 都是「偏科生」，AGI 是「全科学霸」。',
 ana:'现在的 AI <b>下棋超强但不会做饭</b>；AGI 是<b>什么都能干到人类水平</b>。目前还没实现。',
 scn:'看到有人说「AGI 已经实现了」，<b>基本可以打个问号</b>。到 2026 年，业内对此仍有巨大分歧。',
 demo:null,rel:['world','embodied','pdoom'],al:['agi','通用人工智能','强人工智能','通用AI'],one:'什么活都能干、跟人一样通用的 AI',cf:'现在所有模型都是专用型，AGI 还没实现',dlg:['甲：现在到 AGI 了吗？','乙：差得远，还在专用阶段']},

{id:'lora',term:'LoRA',full:'Low-Rank Adaptation',cn:'低秩适配（省钱微调法）',zone:'abbr',lv:3,abbr:true,
 tl:'一种<b>省钱的微调方法</b>：不改动原模型，只训练一个很小的「附加模块」。',
 ana:'不是<b>重写整本书</b>，而是<b>在书里夹几页便签</b>——效果接近，成本低几十倍，便签还能随时换。',
 scn:'AI 绘画圈的「风格模型」（比如某个画风 LoRA），就是这么来的：<b>文件只有几十 MB，插上就能换风格。</b>',
 demo:null,rel:['ft','param'],al:['lora','低秩适配','轻量微调','画风模型','lora模型'],one:'只训练一小部分参数，便宜快速地改模型',cf:'LoRA 是省钱的微调法，效果略逊于全量微调',dlg:['甲：想换个画风','乙：挂个 LoRA，不用重训'],quiz:{q:'个人想微调一个模型，一般推荐什么方式？',o:['LoRA：一张消费级显卡就能跑','全量微调，效果最稳','自己重新预训练一个新模型','换一个更大的模型就行'],a:0,why:'LoRA 是「外挂式」微调，成本只要全量的零头。'}},

{id:'rlhf',term:'RLHF',full:'Reinforcement Learning from Human Feedback',cn:'人类反馈强化学习',zone:'abbr',lv:3,abbr:true,
 tl:'让 AI 变「懂礼貌、像人话」的关键一步：<b>请人来给回答打分，好答案加分，模型照着改</b>。',
 ana:'像<b>老师批改作文</b>：指出哪句好哪句差，学生反复修改，慢慢就摸准了老师的口味。',
 scn:'为什么现在的 AI 说话不像个搜索引擎，而像个助理？<b>主要就是 RLHF 的功劳。</b>',
 demo:null,rel:['ft','llm'],al:['rlhf','人类反馈','强化学习','对齐','打分训练'],one:'靠人类打分教 AI 什么叫「答得好」',cf:'它让 AI 更听话，但不增加知识量',dlg:['甲：它怎么这么会说话？','乙：RLHF 调过的，更合人偏好']},

{id:'a2a',term:'A2A',full:'Agent-to-Agent Protocol',cn:'智能体间通信协议',zone:'abbr',lv:3,abbr:true,new:true,

 ana:'MCP 管「AI 接工具」，A2A 管「AI 和 AI 组队」——一个是<b>接外设的 USB</b>，一个是<b>同事之间的群聊</b>。',
 scn:'文章里说「多智能体协同」，背后的协议就是这个。<b>两个协议是互补的，不是竞争关系。</b>',
 demo:null,rel:['mcp','agent'],al:['a2a','智能体通信','agent互通','多智能体协议','Agent-to-Agent','Agent 间协议'],one:'让不同 AI 智能体之间能互相派活的规矩',cf:'MCP 连工具，A2A 连智能体，对象不同',dlg:['甲：两个 AI 能协作吗？','乙：走 A2A 协议就行'],quiz:{q:'为什么需要 A2A 这样的协议？',o:['你家的助手要请别家的助手帮忙，得有统一的通信规则','把所有助手合并成一个大模型','防止助手之间互相聊天','把助手说的话翻译成英语'],a:0,why:'A2A 是 Agent 之间的「通话标准」。'}},

{id:'gpu',shot:'gpu',term:'GPU',full:'Graphics Processing Unit',cn:'显卡 / 图形处理器',zone:'abbr',lv:1,abbr:true,
 tl:'<b>训练和大模型跑起来靠的那块芯片</b>。AI 热潮把英伟达送上天的那个东西。',
 ana:'CPU 是<b>一个老教授</b>，什么都会但一次只能做一件事；GPU 是<b>一万个小学生</b>，每人算一道简单题，一起算就飞快。',
 scn:'文章里说「算力」「卡」「H100」「4090」，说的都是 GPU。<b>你本地跑模型跑不动，多半卡在它身上。</b>',
 demo:null,rel:['local','param'],al:['gpu','显卡','图形处理器','显存','算力卡'],one:'专门并行算数的芯片，训练和跑模型靠它',cf:'显存不够，再强的 GPU 也跑不动大模型',dlg:['甲：为什么这么慢？','乙：你用 CPU 跑的，得用 GPU']},

{id:'nlp',term:'NLP',full:'Natural Language Processing',cn:'自然语言处理',zone:'abbr',lv:2,abbr:true,

 demo:null,rel:['llm','aigc'],al:['nlp','自然语言处理','文本处理','语言技术'],one:'让计算机读懂、生成人类语言的技术',cf:'分词、翻译、摘要都算 NLP，不只是聊天机器人',dlg:['甲：这算 AI 哪块？','乙：NLP，处理文字的']},

{id:'sota',term:'SOTA',full:'State of the Art',cn:'当前最强水平',zone:'abbr',lv:2,abbr:true,

 demo:null,rel:['scaling','param'],al:['sota','最强','当前最好','state of the art','业界最佳'],one:'某项指标上目前公开的最好成绩',cf:'SOTA 常指某个榜单，不代表你用起来最好',dlg:['甲：这模型厉害吗？','乙：榜单 SOTA，但很贵']},

{id:'xai',term:'XAI',full:'Explainable AI',cn:'可解释 AI',zone:'abbr',lv:3,abbr:true,

 scn:'医疗、金融、法律场景里必须有它——<b>不能给个黑箱结果就完事</b>。这也是 AI 落地的合规门槛之一。',
 demo:null,rel:['hallu','agi'],al:['xai','可解释AI','模型解释','黑盒解释','可解释性'],one:'研究怎么把 AI 的决策讲明白',cf:'大模型目前大多还是黑盒，可解释性很有限',dlg:['甲：为什么拒我？','乙：说不清，可解释性还不行']},

{id:'tts',term:'TTS / STT',full:'Text-to-Speech / Speech-to-Text',cn:'语音合成 / 语音转文字',zone:'abbr',lv:1,abbr:true,

 ana:'TTS 是<b>朗读员</b>，STT 是<b>速记员</b>。方向相反，都是「打通声音和文字」的翻译。',
 scn:'你把网课录音转成逐字稿，用的就是 STT；把文章读成音频发到公众号上，用的是 TTS。',
 demo:null,rel:['aigc','multi'],al:['tts','stt','语音合成','语音转文字','文字转语音','朗读','Speech Synthesis'],one:'TTS 文字变语音，STT 语音变文字',cf:'别搞反：T 在前是输出语音，S 在前是识别语音',dlg:['甲：让它读出来','乙：接个 TTS 就行'],quiz:{q:'现在的语音合成（TTS）能做到多自然？',o:['几秒样本就能克隆音色，接近真人、带情绪','永远是一听就假的机器人腔','只能读英文，读不了中文','必须真人把每句话都录一遍'],a:0,why:'TTS 是机器的「嘴巴」，进化很快。'}},

{id:'vlm',term:'VLM',full:'Vision-Language Model',cn:'视觉语言模型',zone:'abbr',lv:2,abbr:true,

 ana:'普通 LLM 是<b>只会读书的文员</b>；VLM 是<b>能看照片还能跟你聊照片的人</b>。',
 scn:'你把群聊截图丢给我让我统计发言——<b>背后干活的就是 VLM。</b>',
 demo:null,rel:['multi','llm'],al:['vlm','视觉语言模型','能看懂图的模型','图文模型'],one:'既能看图又能聊天的模型',cf:'VLM 指模型能力，多模态是更大的范畴',dlg:['甲：能识图吗？','乙：VLM，可以']},

{id:'slm',term:'SLM',full:'Small Language Model',cn:'小语言模型',zone:'abbr',lv:2,abbr:true,

 scn:'文章里说「端侧 AI」「手机本地跑模型」，跑的就是 SLM。<b>2026 年的一个大趋势。</b>',

{id:'benchmark',term:'Benchmark',full:'Benchmark',cn:'基准测试 / 跑分',zone:'abbr',lv:2,abbr:true,
 tl:'<b>给模型出的标准化考卷</b>，用来比较谁强谁弱。',
 ana:'就是 AI 界的<b>高考 + 大学排行榜</b>。数学卷、代码卷、常识卷，各考各的。',
 scn:'发布会上的柱状图全来自 Benchmark。<b>但记住：榜单第一不等于你的活它干得最好。</b>',
 demo:null,rel:['sota','llm'],al:['benchmark','跑分','基准测试','评测','榜单','benchmark测试'],one:'用统一考题给模型打分的测试',cf:'跑分高不等于你的场景好用，容易被针对性优化',dlg:['甲：哪个模型强？','乙：看 benchmark 榜单']},

{id:'ref',shot:'ref',term:'reference',full:'Reference / Reference Documentation',cn:'参考资料（给 AI 看的说明书）',zone:'misc',lv:1,new:true,
 tl:'技能包（Skill）里的 <b>references/ 文件夹</b>，装的是「主文件放不下、又不必一上来就全读」的详细资料。AI 平时只记文件名，<b>用到了才去翻那一本</b>。',
 ana:'就像<b>菜谱书后面的附录</b>：正文只写「盐适量」，具体选什么盐、不同盐差在哪，全在附录里，做菜时才翻。',
 scn:'一个大型技能包里可能有 <b>39 个 reference</b>（错误账本、阶段导航、事故复盘……）。AI 先只记名字，碰到具体活才去读对应那份。',
 demo:null,rel:['agent','context'],
 quiz:{q:'技能包里的 references/ 是干嘛的？',o:['每次启用都全部读一遍','技能的运行日志','给用户看的产品说明书','把详细资料分开存，AI 用到了才读那一本'],a:3,
 why:'AI 的「记性」（上下文窗口）有容量，一次全读会挤爆。所以详细资料分开存，用到哪本翻哪本。'},al:['reference','参考资料','引用','参考文献','给AI看的资料'],one:'给 AI 参考的背景材料，不是让它执行的命令',cf:'reference 只读不改；命令才是让它动手',dlg:['甲：这些文件干啥的？','乙：reference，当资料给 AI 看']},

{id:'tpl',shot:'tpl',term:'templates',full:'Templates / File Templates',cn:'模板（填空就能用的半成品）',zone:'misc',lv:1,new:true,
 tl:'技能包里的 <b>templates/ 文件夹</b>，装的是现成的文件骨架。要用时复制一份，<b>把里面的占位符换成真内容</b>，就直接变成你的文件。',
 ana:'就像<b>印刷好的合同范本</b>：格式和条款都印好了，你只要填名字、金额、日期。',
 scn:'一个项目模板包里可能有 <b>9 个模板</b>（进度表、规范、检查脚本……）。开新项目时复制一套、把项目名一填，框架立刻就位。',
 demo:null,rel:['workflow','git'],
 quiz:{q:'templates/ 和 references/ 最大的区别是什么？',o:['templates 是填空的半成品，复制一份填上就变成真文件','两个是同一个东西的不同叫法','templates 是给 AI 读的说明书，references 才会被复制出去','templates 每次都必须读，references 不用'],a:0,
 why:'templates 是「骨架」（合同范本），会被复制出去变成你的文件；references 是「资料」（附录），只给 AI 查，不会变成你的东西。'},al:['templates','模板','样板','填空模板','模版'],one:'填空就能用的半成品',cf:'模板是起手式，scaffold 会生成一整套文件',dlg:['甲：从哪开始写？','乙：拿模板改']},

{id:'prog',shot:'prog',term:'progress',full:'Progress',cn:'进度（做到哪一步了）',zone:'misc',lv:1,new:true,
 tl:'项目里的<b>进度表文件</b>是进度枢纽：记着<b>现在到第几步、下一步做什么、做完的标志是什么</b>。AI 每次开工先读它，收工更新它。',
 ana:'就像<b>装修时贴在门上的施工进度表</b>：水电 → 贴砖 → 刷墙，今天划到哪、明天该谁进场，一目了然。',
 scn:'某个项目的进度表里写着「当前阶段、当前版本、最大缺口是词库扩充」。你问「下一步做什么」，AI 读它就能答。',
 demo:null,rel:['workflow','git'],al:['progress','进度','做到哪了','进展','进度表'],one:'记录活干到哪一步了',cf:'进度文件是快照，不是流水账日志',dlg:['甲：上次做到哪了？','乙：看 progress 文件']},


{id:'skill',shot:'skill',term:'Skill',full:'Agent Skill',cn:'技能包 / 技能',zone:'misc',lv:1,new:true,

{id:'hook',term:'hook',full:'Hook',cn:'钩子 / 自动开关',zone:'code',lv:2,new:true,
 tl:'给 AI 的行为<b>挂一个自动开关</b>：只要发生某件事（它要改文件、要跑命令），就<b>必然</b>触发另一个动作。',

 scn:'可以设「AI 每次改完文件自动跑一遍格式化」，也可以设「禁止改体检脚本这种关键文件」。跟技能包的区别：钩子是<b>必定执行</b>的硬规则，技能包是 AI 自己看着办的软建议。',

{id:'subagent',shot:'subagent',term:'subagent',full:'Subagent',cn:'子代理 / 分身',zone:'ai',lv:2,new:true,

 scn:'我说「去把项目文件扫一遍找线索」时，派出去的就是只读的探索型子代理 —— 它不会乱改你的文件，只把结果带回来。最大的好处：<b>查来的大量内容不占主对话的记忆</b>。',
 demo:null,rel:['agent','context','tool'],
 quiz:{q:'为什么要把活派给子代理，而不是主 AI 自己干？',

 why:'子代理有独立的上下文窗口，查资料的海量内容不会污染主对话；几个子代理还能同时干活。它并不比主 AI 更聪明，也不免费。'},al:['子代理','subagent','分身','子智能体','小弟','派出去的AI'],one:'主 AI 派出去单独干活的小弟，干完回来汇报',cf:'子代理看不到主对话全过程，只拿到派给它的任务',dlg:['甲：它自己又开了一个？','乙：嗯，派了个 subagent 去查']},

{id:'toolcall',term:'tool use',full:'Tool Use / Function Calling',cn:'工具调用',zone:'ai',lv:2,
 tl:'AI 不只会聊天，它能<b>主动调用外部工具</b>：读文件、跑命令、搜网页、写表格。模型负责决定「用哪个工具、传什么参数」，程序负责真的去执行。',
 ana:'像<b>电话客服帮你下单</b>：他（模型）负责听懂你要什么、决定点哪个按钮，真正下单的动作由系统（工具）完成。',
 scn:'你让我「把这篇文章的阅读数填进飞书表格」，我先调抓数据的工具、再调写表格的工具 —— 这一整串动作就是工具调用。',
 demo:null,rel:['agent','api','mcp','tool'],al:['tool use','工具使用','function calling','函数调用','调工具'],one:'AI 决定用哪个工具、传什么参数',cf:'跟 skill 区分：工具是动手的，技能是看的',dlg:['甲：它自己会去搜吗？','乙：会，tool use 开着']},

{id:'distill',term:'distillation',full:'Knowledge Distillation',cn:'知识蒸馏',zone:'ai',lv:3,
 tl:'把<b>大模型的本事压缩进小模型</b>：让小模型学着模仿大模型的输出，个头小得多，能力保留大半。',
 ana:'像<b>老师傅带徒弟</b>：徒弟背不下师傅几十年的经验，但跟着看了几万个案例后，出手也有七八分像。',
 scn:'这个词在圈里还有个引申用法：把一本书、一门课<b>蒸馏成一套技能包</b>（你做的「拆书」就是），意思一样 —— 从一大坨里提炼出能反复用的精华。',
 demo:null,rel:['slm','ft','param','quant'],al:['蒸馏','知识蒸馏','distillation','模型压缩','老师教学生'],one:'大模型教小模型，把本事压缩到小身板里',cf:'蒸馏会损失一部分能力，不是原样照搬',dlg:['甲：小的怎么也会？','乙：从大模型蒸馏来的']},

{id:'infer',term:'inference',full:'Inference',cn:'推理 / 跑模型',zone:'ai',lv:2,

 ana:'训练是<b>上学</b>（好几年、花大钱），推理是<b>上班</b>（每天干活、按次算钱）。',
 scn:'你调 API 按字数（token）计费，付的就是推理的钱；训练的钱厂商已经替你花过了，跟你无关。',

{id:'zeroshot',term:'zero-shot / few-shot',full:'Zero-shot / Few-shot',cn:'零样本 / 少样本',zone:'ai',lv:2,

 demo:null,rel:['prompt','sysprompt','cot'],al:['零样本','少样本','zero-shot','few-shot','不给例子','给几个例子'],one:'零样本不给例子，少样本给几个例子',cf:'例子不是越多越好，3-5 个通常就够',dlg:['甲：要不要给例子？','乙：给 3 个，few-shot 更稳']},

{id:'cloud',term:'云计算 / 云端',full:'Cloud Computing',cn:'云计算',zone:'misc',lv:1,

 ana:'像<b>从自家水井换成自来水</b>：水厂统一供水，你拧开龙头就用，不用自己打井维护。',
 scn:'「文件在云端」「AI 跑在云端」「多设备同步」，背后都是云。名词小抄是少数派：数据在你手机本地，断网也能用。',
 demo:null,rel:['clouddisk','server'],quiz:{q:'「数据在云端」指的是？',o:['数据存在天上','存储和计算在远方机房','数据在 SIM 卡里','数据在别人手机上'],a:1,why:'云端 = 远方大机房；好处是多设备同步，代价是断网就抓瞎。'},al:['云计算','云端','cloud','云服务','上云'],one:'把存储和计算放到远方机房，设备只是窗口',cf:'云端好处是多设备同步，代价是断网就抓瞎',dlg:['甲：数据在手机里还是云上？','乙：在云端，登录就同步'],new:true},


{id:'syc',term:'Sycophancy',full:'Sycophancy',cn:'拍马屁 / 谄媚',zone:'ai',lv:2,tl:'AI 一味附和你，你说啥它都说对。<b>它是在讨好你，不是在讲真话</b>。',ana:'像那种永远说「您说得对」的下属——听着舒服，其实没帮你把关。',scn:'你问「我这个方案是不是没问题」，它回「非常完善」，其实漏洞一堆。想听真话就把问题改成「请找出这个方案的三个问题」。',al:['拍马屁','谄媚','马屁精','附和','讨好','说好话','一味赞同','老说我对'],one:'它一味说你对，其实是在讨好你',cf:'跟幻觉不同：幻觉是瞎编，这是明知也不反驳',dlg:['甲：它说我方案完美','乙：拍马屁呢，让它挑毛病试试'],rel:['hallu','rlhf','prompt'],new:true},
{id:'compact',term:'Compaction',full:'Context compaction / /clear',cn:'压缩 / 清空',zone:'ai',lv:2,tl:'把长对话压成一段摘要，腾出空间继续干。<b>相当于给 AI 做一次「划重点」</b>。',ana:'像会议纪要：两小时讨论压成一页纸，重点还在，废话没了。',scn:'Claude Code 里打 /compact 或 /clear 就是在干这个。长任务干到一半感觉它开始糊了，压一下再继续，比硬撑着强。',al:['清空','压缩','上下文压缩','划重点','清会话','重开','compact','clear'],one:'把长对话压成摘要，腾地方继续干',cf:'压缩会丢细节；清空是从零开始，两者不一样',dlg:['甲：它越聊越糊','乙：/compact 压一下'],rel:['context','rot','token'],new:true},
{id:'quota',term:'Quota / Rate limit',full:'Quota / Rate limit',cn:'额度 / 限流',zone:'code',lv:1,tl:'服务商给你定的用量上限。<b>用完就停，不是坏了</b>。',ana:'像手机流量包：用完就断网，或者给你限速到能聊但很慢。',scn:'Codex 报错「You have exceeded your quota」、调数据 API 返回 429，都是这个。看一眼重置时间，或者换个模型、换把 Key。',al:['额度','限流','配额','超额','429','用超了','用完','rate limit','超了','没额度'],one:'服务商给的用量上限，用完就停',cf:'限流是短时间太快；额度用完是总量没了',dlg:['甲：怎么突然不干了？','乙：额度用完，看下重置时间'],rel:['apikey','token','api'],new:true},
{id:'hitl',term:'Human-in-the-loop',full:'Human-in-the-loop',cn:'人在环内 / 人工把关',zone:'ai',lv:2,tl:'关键步骤必须由人点头，AI 才能往下走。<b>你不点头，它就停在那儿等你</b>。',ana:'像审批流：机器能干活，但签字这一步得人来。',scn:'Codex 要改你 Obsidian 里的笔记前弹一句「确认要改吗」，这就是人在环内。涉及删文件、花钱、对外发布的操作，一定要开着。',al:['人在环内','人工确认','需要审批','人工把关','要我点头','human in the loop','确认一下'],one:'关键步骤必须你点头，AI 才继续',cf:'不等于「全自动」的反面，是自动跑但关键处卡一下',dlg:['甲：它怎么老问我？','乙：开着人在环内，重要操作要你确认'],rel:['agent','guardrail','orchestr'],new:true},
{id:'handoff',term:'Handoff',full:'Session handoff',cn:'交接 / 换班',zone:'ai',lv:2,tl:'一个 AI 干到一半，把进度交代给下一个接着干。<b>不交接，就得从头讲一遍</b>。',ana:'像换班：交班的人得把「干到哪、坑在哪」写给接班的人。',scn:'你上午用 Codex 写到一半关了，下午开新会话它啥都不记得——这时候该让它先写一份交接说明，你下次贴给新会话，一秒接上。',al:['交接','换班','换会话','交班','接着干','继续上次','handoff','接着做'],one:'把进度交代清楚，换一个 AI 接着干',cf:'记忆是系统自动存；交接是你主动让它写下来',dlg:['甲：昨天那个活接着做','乙：先让它写份交接说明'],rel:['memory','context','subagent'],new:true},
{id:'nondet',term:'Non-determinism',full:'Non-determinism',cn:'非确定性 / 每次不一样',zone:'ai',lv:3,tl:'同一个问题问两遍，答案不一样。<b>这是 AI 的天性，不是 bug</b>。',ana:'像同一个厨师炒两次同一道菜，味道总有点差别。',scn:'你让 AI 生成公众号标题，每次给的都不一样。想要稳定结果，就把要求写死（格式、字数、风格），再把温度调低。',al:['非确定性','每次不一样','不稳定','随机性','结果不一样','时好时坏','两次不一样'],one:'同样的问题，两次答案不一样',cf:'不是出错了，是模型本来就带随机采样',dlg:['甲：刚才还好好的，这次又变了','乙：非确定性，把要求写死点'],rel:['temp','infer','benchmark'],new:true},
{id:'spec',term:'Spec',full:'Specification',cn:'需求说明 / 先说清楚',zone:'ai',lv:1,tl:'动手之前，先把「要做成什么样」写清楚。<b>写给 AI 看，也写给自己看</b>。',ana:'像装修前的设计图：没图纸就开工，返工的是你自己。',scn:'让 Codex 做东西前，先让它出一份 spec：要做什么、不做什么、怎么算做完。你确认后它再动手，返工能少一大半。',al:['需求说明','规格','设计方案','验收标准','先说清楚','spec','需求文档','要做成啥样'],one:'动手前先把要做成啥样写清楚',cf:'spec 说「做成什么样」，prompt 是「这一句怎么问」',dlg:['甲：直接让它写吧','乙：先出个 spec 你确认再动手'],rel:['prompt','ctxeng','vibe'],new:true},
{id:'grill',term:'Grilling',full:'Grilling',cn:'烤问 / 先反问你',zone:'misc',lv:2,tl:'不让 AI 直接开干，先反过来追问你一堆问题。<b>问清楚再动手，返工少</b>。',ana:'像老中医问诊：不先问清楚就开方子，多半不对症。',scn:'你说「帮我做个名词词典」，它先问：给谁用？手机上还是电脑上？要不要离线？——问完再干，比直接开写靠谱得多。',al:['烤问','反问','先问我','追问','问清楚','grilling','先别动手'],one:'先反过来问你一堆，问清楚再干',cf:'不是它在偷懒，问得越细后面返工越少',dlg:['甲：它怎么老问我问题？','乙：在烤问你，问清了才动手'],rel:['spec','prompt','agent'],new:true},
{id:'dryrun',term:'Dry run',full:'Dry run',cn:'预演 / 先别真改',zone:'code',lv:2,tl:'先跑一遍看看会做什么，但<b>不真的动手改</b>。',ana:'像消防演习：流程走一遍，但不真放火。',scn:'让 Codex 批量改你飞书多维表格的字段前，先说一句「先别改，把你要改的清单列给我看」——这就是预演。',al:['预演','试运行','先别改','dry run','演练','先看不改','模拟执行','列个清单'],one:'先跑一遍看看会改啥，但不真改',cf:'预演不改任何东西；真跑会直接落盘',dlg:['甲：怕它改错','乙：让它先 dry run，列清单给你看'],rel:['hitl','rollback','sandbox'],new:true},

{id:'workslop',term:'Workslop',full:'Workslop',cn:'AI 敷衍活 / 工作泔水',zone:'misc',lv:2,

 tl:'2026 年初火起来的词：<b>模型是发动机，Harness 是把它装进车里、能安全上路的那整套装备</b>——工具、记忆、权限、检查都归它管。圈内说法：Agent = 模型 + Harness。',
 ana:'同一个骑手换不同的马具，跑出来的成绩能差一大截。<b>模型是租来的，Harness 才是你自己的东西。</b>',
 scn:'你给 Codex / Claude Code 配的 CLAUDE.md、hooks、权限白名单、跑完自动过一遍检查脚本，<b>合起来就是你的 Harness</b>。同一个模型换套 Harness，跑分能差十来分。',
 rel:['agent','ctxeng','guardrail','hook'],al:['harness','驾驭工程','缰绳','运行支架','马具','harness engineering','套在模型外面','agent外壳'],one:'套在模型外面的那套装备，让它能真干活',cf:'不是提示词工程：它管整个运行环境，不是一句话',dlg:['甲：同一个模型，他用的咋比我稳','乙：他的 Harness 攒了半年'],new:true},
