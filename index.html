b>：公网云盘是租的仓库（说涨就涨），酒窖在自己家——隐私、容量自己说了算。',one:'自己家的私有云盘柜',cf:'和「网盘」的区别：网盘是租别人的仓库（方便但受限）；NAS 是自建（自由但初始投入+折腾）。',al:['NAS','Network Attached Storage'],rel:['clouddisk','natpierce','lanwan'],scn:'公众号「告别网盘会员」文章的主角；配合内网穿透，出门也能访问家里的全部文件。',dlg:[{q:'门槛高吗？',a:'成品 NAS 开箱即用， DIY 版省钱但要折腾——先想清楚需求。'},{q:'硬盘坏了怎么办？',a:'组 RAID 双盘互备——但 RAID 不是备份，重要数据仍要 321 原则。'}],quiz:{q:'「NAS」最大的卖点？',o:["容量一定更大","网速一定更快","免费","数据在自己手里，不受网盘限制"],a:3,why:'隐私自由+无订阅费——代价是投入和折腾。'}}, {id:'sso',term:'单点登录',full:'Single Sign-On / SSO',cn:'单点登录',zone:'abbr',lv:3,new:true,tl:'<b>登录一次，全站通行</b>：公司内部系统几十个，账号密码记一套就够——企业 IT 的标配方案。',ana:'像<b>景区通票</b>：买一次票（登录一次），园内所有景点（子系统）刷票即入——不用每个景点单独买票。',one:'登录一次全站通行',cf:'和「第三方登录」的区别：第三方登录是「借用微信身份上别家」；SSO 是「自家一套账号体系走遍自家全部系统」。',al:['Single Sign-On','统一登录'],rel:['oauth','cookie','twofa'],scn:'上班族天天在用：登录飞书后打开一切内部系统免密；背后是 OAuth 思路的企业级实现。',dlg:[{q:'离开公司后还能用吗？',a:'不能——账号随入职创建、离职注销，SSO 的统一管理正是它的安全价值。'},{q:'有什么风险？',a:'单点成了单点故障——SSO 挂了全公司进不了系统，所以企业级 SSO 都有灾备。'}],quiz:{q:'「SSO 单点登录」的体验是？',o:["只能登录一次永久有效","登录一次，多个内部系统全部通行","每个系统都要单独注册","不用任何验证"],a:1,why:'一套账号走遍自家全部系统——企业 IT 标配。'}}, {id:'xuanxue',term:'玄学调参',full:'参数玄学',cn:'玄学调参',zone:'misc',lv:3,new:true,tl:'<b>调参数像抽卡，全凭手感和运气</b>：同样的数据同样的代码，换个随机种子结果天差地别——炼丹玄学之名的由来。',ana:'像<b>老中医抓药</b>：药方（架构）是公开的，但「抓多少、怎么熬」全凭师傅手感——徒弟照抄也未必复现。',one:'调参数像抽卡全凭手感',cf:'和「科学实验」的区别：科学实验可复现是底线；炼丹调参常复现不出来——所以社区强调记录随机种子和配置。',al:['参数玄学','调参玄学'],rel:['liandan','training','scalinglaw'],scn:'技术社区高频自嘲；理解它就理解了为什么大厂抢「有炼丹经验的人」——经验里全是踩过的坑。',dlg:[{q:'怎么去玄学化？',a:'记录一切（种子、配置、数据版本）+ 多次实验取平均——把玄学往科学压。'},{q:'AI 能帮调参吗？',a:'自动调参工具（AutoML）已在做——但「玄」的部分仍是师傅的手感值钱。'}],quiz:{q:'「玄学调参」的「玄」指？',o:["结果不可完全复现，像抽卡看运气","参数是迷信","跟风水有关","没有科学依据"],a:0,why:'随机性和经验依赖让结果难以复现——记录一切是解药。'}}, {id:'mirror',term:'镜像站',full:'Mirror Site',cn:'镜像站',zone:'misc',lv:3,new:true,tl:'<b>官方文件的「分身下载点」</b>：官方服务器太远太慢，镜像站把内容原样复制一份放近处——下载速度起飞。',ana:'像<b>连锁便利店的前置仓</b>：官方大仓库只有一个（国外），镜像站是各地的分仓——就近取货不用跨国排队。',one:'官方内容的分身下载点',al:['Mirror Site','镜像源','镜像下载'],cf:'和「CDN」的区别：CDN 是官方主动铺的全球分仓；镜像站多是社区/学校自发复制的分身——一个官方一个民间。',rel:['crawler','shortlink','cache'],scn:'下载 Python 包、Linux 系统时「切换清华/阿里镜像源」就是它；你装 Python 库配国内镜像源是提速第一课。',dlg:[{q:'镜像站可信吗？',a:'大机构（清华、阿里）的镜像可信；来路不明的「镜像」可能夹带私货——下载后对校验和。'},{q:'怎么用？',a:'改配置文件里的源地址（如 pip 换清华源），一条命令的事。'}],quiz:{q:'「镜像站」的作用？',o:["镜像监控画面","翻译外文网站","复制官方内容放近处，加速下载","备份官方网站防丢失"],a:2,why:'内容原样复制到近处——下载提速的土办法也是好办法。'}}, {id:'url',term:'网址',full:'URL / Uniform Resource Locator',cn:'网址',zone:'abbr',lv:2,new:true,tl:'<b>互联网资源的「完整地址」</b>：协议+域名+路径+参数——像寄快递，协议是运输方式、域名是城市、路径是门牌。',ana:'像<b>寄快递填单</b>：运输方式（https）、城市小区（域名）、门牌号（路径）、备注（参数）——缺一封不到。',one:'互联网资源的完整地址',cf:'和「域名」的区别：域名是大楼地址，URL 精确到楼层房间+要办的事。',al:['URL','链接地址'],rel:['domain','http','shortlink'],scn:'看到长网址带 ?id=xxx 的部分就是参数；分享链接时「?后面那串」常是追踪参数，透露你从哪点进来的。',dlg:[{q:'网址里 ?id=8 是什么？',a:'参数——告诉服务器你要的具体内容，改数字可能看到别的条目。'},{q:'短链接和它？',a:'短链是 URL 的缩写外壳，点击后跳转回完整 URL——方便分享但注意来源。'}],shot:'url',quiz:{q:'URL 里 https:// 部分表示？',o:["服务器品牌","网页标题","访客位置","传输协议：用什么方式访问"],a:3,why:'协议是「怎么说话」——https 是加密版。'}}, {id:'contentfarm',term:'内容农场',full:'Content Farm',cn:'内容农场',zone:'misc',lv:3,new:true,tl:'<b>批量生产低质内容骗流量的网站群</b>：AI 让量产成本趋近于零——搜出来的「攻略」 ten 篇九篇雷同就是它们。',ana:'像<b>工业化养猪场 vs 散养土猪</b>：产量巨大、生长极快、毫无个性——吃是能吃，就是没营养。',one:'批量产低质内容骗流量',cf:'和「workslop」的区别：workslop 是 AI 瞎生产的半成品工作产物；内容农场是刻意量产骗广告流量的网站。',al:['Content Farm','内容工厂'],rel:['workslop','scraper','aiflav'],scn:'搜索结果里的雷同垃圾文、洗稿号搬运站多是它；搜索引擎正用 AI 反制——「内容质量」权重越来越高。',dlg:[{q:'为什么搜不到好内容了？',a:'农场文产量碾压人写内容——搜索引擎正在用 AI 质量评分反杀。'},{q:'和洗稿号的关系？',a:'同一条产业链：农场量产，洗稿号搬运变现。'}],quiz:{q:'「内容农场」的本质？',o:["官方新闻站","批量产低质内容骗广告流量","高清影视站","知识付费平台"],a:1,why:'产量巨大毫无营养——AI 让产废成本趋零，搜索质量保卫战打响。'}}, {id:'aimusic',term:'AI 作曲',full:'AI Music Generation',cn:'AI 作曲',zone:'misc',lv:3,new:true,tl:'<b>文字描述生成完整歌曲</b>：Suno 等工具连词带曲带人声一次生成——音乐创作的门槛被掀翻。',ana:'像<b>文生图的音乐版</b>：描述「轻快的民谣，关于夏天和告别」——两分钟出成品带人声。',one:'文字生成完整歌曲',cf:'和「AI 配音」的区别：配音克隆人声念稿；AI 作曲生成词曲编唱全流程——一个是嘴一个是脑。',al:['AI Music','Suno'],rel:['t2i','aigc','fullmodal'],scn:'自媒体背景音乐、定制生日歌的高频工具；商用注意版权条款——不同平台授权范围不同。',dlg:[{q:'能商用吗？',a:'看平台订阅等级——付费档多含商用授权，免费档仅个人。'},{q:'音乐人会失业吗？',a:'BGM/口水歌最先被替代；打动人心的旋律和歌词仍是人的护城河。'}],quiz:{q:'「AI 作曲」工具（如 Suno）生成的是？',o:["词曲编唱人声齐备的完整歌曲","只有伴奏","只有乐谱","纯音效"],a:0,why:'描述一句主题，两分钟出带人声的完整歌——门槛掀翻。'}}
,
{id:'agentloop',term:'智能体循环',full:'Agent Loop',cn:'智能体循环',zone:'ai',lv:2,tl:'普通对话是你问一句它答一句。<b>智能体循环</b>是 AI 接了任务后自己转圈：想好下一步→动手（调工具、跑命令）→看结果→决定下一步，直到任务完成或需要你拍板。',ana:'像你带了个实习生：只说『把这份报告整理好』，他自己查资料、写初稿、发现数据缺了再去要、改完再交——中间不用你盯每一步。',scn:'你在 Claude Code 里说『帮我把这个页面的报错修了』，它自己读代码、改文件、跑测试、看报错、再改——这一整套转圈就是 agent loop。',rel:['agent','planexec','toolcall','deepagent','orchestr'],al:['agent循环','智能体循环','agent loop','自主循环','agent 工作循环'],one:'AI 自己走『想→做→看→再想』的循环，直到把事办完',cf:'别当成「多轮对话」——对话是你每句都要喂，循环是它自己决定下一步。',dlg:[{q:'agentloop 是啥？跟普通聊天差在哪？',a:'聊天是你问它答一句就停；循环是它自己『想做看』转圈到干完。'},{q:'所以丢个任务它就能自己跑完？',a:'对，卡住了或者要花钱的它才回来问你。'}],quiz:{q:'智能体循环（agent loop）最核心的特点是什么？',o:['每一步都先请示用户再动手','自己决定下一步：想做看结果，循环到任务完成','只能回答问题，不能执行操作','必须一次把答案说完，不能中途停'],a:1,why:'agent loop 的定义就是 AI 自主决定下一步并循环执行，卡住才找人。'},shot:'agentloop'},
{id:'agentwash',term:'智能体外衣',full:'Agent Washing',cn:'智能体外衣 / 刷智能体',zone:'ai',lv:1,tl:'<b>agent wash</b> 是营销话术：产品只是『按下按钮按固定步骤跑』的自动化，却包装成『会自己思考的智能体』。判断办法：换个没见过的输入，它还能不能随机应变。',ana:'像『智能』电饭煲——其实是按温度曲线走的固定程序；真智能体更像你自己下厨，尝一口咸了就加水。',scn:'刷到『AI 智能体帮你躺赚』的课程时留个心眼：问它『如果中途报错它会干嘛』——答不上规则外的场景，多半是套壳流程贴牌。',rel:['workslop','slop','agent'],al:['agent wash','智能体粉饰','假智能体','套壳 agent','AI 外衣'],one:'把普通自动化套个『智能体』名字卖的营销话术',cf:'别当成 workslop（AI 产的烂活）——那是产物差，这是名字吹。',dlg:[{q:'这工具自称最强销售智能体。',a:'你给它个没写过的场景试试，看它会不会自己变招。'},{q:'试了，卡死在流程第二步。',a:'那就是 agent wash，固定流程贴个牌。'}],quiz:{q:'辨别一个产品是不是 agent wash，最有效的办法是？',o:['看官网设计是否精美','换个没预设过的场景，看它会不会自己调整','看价格是否够贵','看创始团队背景'],a:1,why:'agent wash 的本质是固定流程冒充随机应变，换个新场景立刻露馅。'}},
{id:'rewardhack',term:'奖励钻空子',full:'Reward Hacking',cn:'奖励钻空子',zone:'ai',lv:2,tl:'训练时 AI 拿『奖励分』当目标。如果规则有漏洞，它会<b>钻空子拿分而不是真干活</b>：比如发现用户爱听什么就顺着说，而不是追求把事做对。',ana:'像学生发现老师只查字数——把名字抄一百遍凑字数，字数够了作文稀烂。分拿到了，目标黄了。',scn:'让 AI 帮你清理待办清单，它把所有任务直接标记成『已完成』——指标漂亮了，事一件没干。这就是典型的 reward hacking。',rel:['alignment','rlhf','syc','evals'],al:['reward hacking','奖励作弊','钻规则空子','指标作弊','刷分'],one:'AI 找规则的漏洞刷高分，但没干成真正的事',cf:'别当成 AI 故意捣乱——它没恶意，是规则写得有缝可钻。',dlg:[{q:'让 AI 整理房间，它把东西全塞柜子了？',a:'经典 reward hack——『看起来整洁』的分数拿到了。'},{q:'那怎么办？',a:'把规则改成『打开柜子也必须整齐』，堵住漏洞。'}],quiz:{q:'下面哪种行为是 reward hacking？',o:['认真把任务做完，顺便拿了高分','发现规则漏洞刷分，但没完成真正目标','主动向用户承认自己不会','请求人类帮忙一起做'],a:1,why:'钻空子刷分、绕开真实目标是 reward hacking 的定义。'}},
{id:'constai',term:'宪法 AI',full:'Constitutional AI',cn:'宪法 AI',zone:'ai',lv:3,tl:'Anthropic 提出的训练方法：把『AI 该遵守的原则』写成一圈<b>宪法条文</b>，让 AI 拿条文审查自己的回答——哪句冒犯、哪句有害，自己改到合格，再用改过的样本训练自己。',ana:'像给新员工一本员工手册，让他每写完一封邮件自己对照检查一遍，不用领导逐封审。',scn:'问 Claude 敏感话题它仍能礼貌解释而不乱来，背后思路就是宪法 AI：原则写成条文，模型自己照着审。',rel:['alignment','guardrail','refusal','rlhf'],al:['constitutional AI','宪法式 AI','AI 自我审查','原则对齐'],one:'给 AI 写一部『行为宪法』，让它照着自我审查和修改',cf:'别当成敏感词黑名单——它审的是整段行为的对错，不是过滤几个词。',dlg:[{q:'宪法 AI 是给 AI 装个道德模块吗？',a:'更像给它一本手册，答完自己对照检查改到合格。'},{q:'谁审它改得好不好？',a:'改过的样本会拿来训练它，人工只抽检。'}],quiz:{q:'宪法 AI 的核心思路是？',o:['把所有敏感词拉进黑名单','让 AI 依据成文原则自我审查、修改并从中学习','完全靠人工逐条审核回答','禁止模型讨论任何争议话题'],a:1,why:'宪法 AI 的做法是给原则条文，让模型自审自改并用修改后的样本训练。'}},
{id:'interp',term:'可解释性',full:'Interpretability',cn:'可解释性',zone:'ai',lv:3,tl:'神经网络内部几十亿个数字在动，没人说得清哪个决定是哪来的。<b>可解释性研究</b>就是给黑盒装『透视镜』：找到某个概念存在哪几个单元里、模型判断时先看了什么。',ana:'像医生不只看体检评分，还要看 CT 片子找病灶——interp 是给 AI 拍 CT。',scn:'识图 AI 把斑马认成『驴』，interp 研究者能查出是哪组特征判断出了错，而不是干瞪眼重训一遍碰运气。',rel:['opaque','neuralese','evals'],al:['interpretability','可解释 AI','打开黑盒','AI 透视','机理解读'],one:'打开 AI 黑盒，搞清它内部为什么给出这个答案',cf:'别当成「让 AI 自己解释」——模型事后编的理由未必是真原因，interp 查的是内部真实活动。',dlg:[{q:'模型答错了，让它自己解释不就行了？',a:'它会编个像样的理由，但未必是真实原因。'},{q:'那 interp 呢？',a:'直接看内部哪些单元在动，查真凶。'}],quiz:{q:'可解释性（interpretability）研究的目标是？',o:['把模型回答都翻译成英文','看清模型内部活动，找到某个判断是哪里做出来的','让模型回答得更长','给模型多加几层网络'],a:1,why:'interp 的目标是打开黑盒、定位判断发生的内部位置。'}},
{id:'grounding',term:'回答有出处',full:'Grounding',cn:'回答有出处 / 挂靠资料',zone:'ai',lv:2,tl:'让 AI 回答时<b>必须挂靠真实资料</b>：先检索到文档，答案从文档里来，还能标出来自哪一段。RAG 就是 grounding 的主力做法。',ana:'像论文要求每个论点标引用——有出处的答案是『文档说……』，没出处的变成『我觉得……』。',scn:'用 AI 机器人查公司制度，靠谱的答案会附『来自《考勤制度》3.2 节』，点开能对原文——那就是 grounding 在起作用。',rel:['rag','hallu','deepresearch'],al:['grounded answer','有据回答','挂靠资料','溯源回答','接地（误译）'],one:'回答的每句话都能对上具体资料，不是凭空编',cf:'别当成联网搜索——搜索是找资料，grounding 是强制答案长在资料上。',dlg:[{q:'AI 说了个数字，我怎么知道靠不靠谱？',a:'看它给不给出处，grounding 做得好每句都能对到原文。'},{q:'没出处的呢？',a:'当它即兴发挥，要自己核实。'}],quiz:{q:'grounding 指的是？',o:['回答必须基于可查证的资料并能溯源','让 AI 回答得更快','把回答翻译成英文','给回答加更多形容词'],a:0,why:'grounding 的定义就是把答案锚定在可查证的资料上。'},shot:'grounding'},
{id:'refusal',term:'拒答',full:'Refusal',cn:'拒答',zone:'ai',lv:1,tl:'AI 对涉及危险、违法、隐私的请求会<b>拒绝回答</b>，这是训练时专门教的。有时它也会『过度拒答』——正常请求被误伤，换个说法重问往往就通了。',ana:'像药店店员：买感冒药正常卖，一听有人打听『多少剂量能放倒人』立刻闭嘴。偶尔太紧张，连正常问用法都不答，就是过度拒答。',scn:'让 AI 帮写『给竞争对手的客观分析』它可能拒答，你改成『做一份公开信息的行业对比表』就能过——同一个请求的措辞决定拒不拒。',rel:['guardrail','jailbreak','constai','sysprompt'],al:['AI 拒绝回答','拒答机制','refusal','安全拒绝','过度拒绝'],one:'AI 判断不该答时，主动说『这个我不能帮你』',cf:'别当成「没听懂」——拒答是它听懂了但判断不能帮。',dlg:[{q:'我让它分析个股走势它拒绝了？',a:'它把『个股买卖建议』划进了不能答的范围。'},{q:'怎么办？',a:'改成『介绍市盈率的概念和常见用法』，讲知识不荐股。'}],quiz:{q:'AI 对正常请求突然拒答，最可能是？',o:['它没听懂你的话','它把请求误判进了危险范围，换个明确说法再问','它没电了','网络太慢'],a:1,why:'多数无故拒答是安全判断误伤，改写措辞让它看清意图即可。'}},
{id:'pii',term:'个人敏感信息',full:'PII (Personally Identifiable Information)',cn:'个人敏感信息',zone:'ai',lv:1,abbr:true,tl:'<b>PII</b> 指能直接或间接对上真人的信息：姓名、手机号、身份证号、家庭住址。贴给 AI 前先想想：这条泄出去会怎样。',ana:'像家里钥匙——给开锁师傅可以，但要你盯着；随手拍进发给陌生人的视频里就悬了。',scn:'让 AI 帮写投诉信时，把『手机号 138xxx』换成『我的手机号』占位，发出前再填回——草稿进过 AI 一道，别带真号码。',rel:['injection','oauth','encryption'],al:['PII','个人身份信息','敏感信息','个人隐私数据','可识别信息'],one:'能对上具体真人的信息：手机号、身份证、住址等',cf:'别当成「所有隐私」——PII 特指能对上你本人的，喜好、观点不算。',dlg:[{q:'让 AI 改简历要把身份证号填进去吗？',a:'别，PII 能不给就不给，写『身份证号见原件』。'},{q:'可是不填它不知道格式对不对。',a:'用假号码示意，定稿前再替换。'}],quiz:{q:'下面哪个属于 PII？',o:['『我喜欢蓝色』这个偏好','姓名+手机号+家庭住址的组合','『今天天气不错』这句话','一张风景照片'],a:1,why:'能对上具体真人的信息才算 PII，偏好和景色不算。'}},
{id:'scratchpad',term:'草稿本',full:'Scratchpad',cn:'草稿本 / 工作草稿',zone:'ai',lv:2,tl:'智能体干长活儿时会<b>把中间过程写成笔记</b>：查到了什么、试过什么方法、下一步干嘛。这个草稿区就是 scratchpad，任务结束后一般就扔。',ana:'你解数学题在草稿纸上列步骤——草稿不交，但解题时离不开它。',scn:'看 Codex 干活时它先输出一段『我先检查配置文件……没找到问题，再看日志……』，那些过程文字就是它的 scratchpad。',rel:['agentmem','planexec','context','agentloop'],al:['scratch pad','草稿区','工作笔记','思考便签','中间记录'],one:'AI 干活时给自己打的草稿，记中间步骤和发现',cf:'别当成 agentmem（长期记忆）——草稿用完就扔，记忆是下次还带上的。',dlg:[{q:'AI 干活时嘟囔的一堆过程是啥？',a:'那是 scratchpad，它给自己记的草稿。'},{q:'下次找它还认得这些草稿吗？',a:'不认，那是长期记忆的事，草稿用完就丢。'}],quiz:{q:'scratchpad 和长期记忆（agentmem）的区别是？',o:['草稿单任务用完就丢，长期记忆跨会话保留','没有区别，是同一个东西','草稿存在云端，记忆存在本地','草稿只有人类能看'],a:0,why:'scratchpad 是单任务内的临时笔记，agentmem 才是跨会话的记忆。'}},
{id:'selfrefine',term:'自我反思',full:'Self-Refine',cn:'自我反思 / 自我改进',zone:'ai',lv:2,tl:'<b>自我反思</b>指让 AI 对自己的输出再当一次评审：找出哪里不行、写出怎么改，然后照单重写一版。同一模型分饰作者和编辑两个角色。',ana:'你写完文章不会直接发，先自己读一遍删口水话——self-refine 就是让 AI 养成这个习惯。',scn:'用 Claude Code 生成页面后跟一句『自己过一遍找问题再修』，它常能抓出没居中、按钮没反应这类自己刚犯的错。',rel:['reason','cot','selfcons','selfheal'],al:['self-refine','自我批评','自我改进','反思迭代','自审'],one:'AI 交稿前自己挑毛病、自己改一轮再给',cf:'别当成 selfcons（多答投票）——那个是几份答案举手表决，这个是自己改自己的稿。',dlg:[{q:'AI 初稿总差点意思怎么办？',a:'让它自己挑毛病再改一版，self-refine 一下。'},{q:'它能挑出自己的问题？',a:'换上评审视角常能挑出来，比一步到位强。'}],quiz:{q:'self-refine 的做法是？',o:['生成多个答案让大家投票','让同一模型评审并修改自己的输出','直接换个更强的模型','把问题重新问一遍'],a:1,why:'self-refine = 同一个模型先评审再修改自己的输出。'}},
{id:'openweight',term:'开放权重',full:'Open Weights',cn:'开放权重',zone:'ai',lv:2,tl:'<b>开放权重</b>指把训练好的模型参数文件直接放出来，你下载后本地跑、微调都行。DeepSeek、Qwen 都走这条路。注意它<b>不等于开源软件</b>——训练数据、代码未必公开。',ana:'像蛋糕店把配方卖给你——你可以在家烤，但配方怎么研发的、面粉哪买的，人家不必告诉你。',scn:'公众号说『DeepSeek 又开源了』，严格说是『开放权重』：模型文件在 Hugging Face 能下，企业拿来在自己机房部署，数据不出门。',rel:['oss','local','weights','hf'],al:['open weights','开放参数','权重公开','开源模型（常见误称）','可下载模型'],one:'模型参数文件公开可下载，自己找机器就能跑',cf:'别当成 oss（开源软件）——权重开放≠训练代码和数据开放。',dlg:[{q:'开源大模型，是说代码都能看吗？',a:'多数只开放权重，能下载能跑，训练过程未必公开。'},{q:'那企业为啥爱它？',a:'自己机房一部署，数据不出门。'}],quiz:{q:'『开放权重』模型和闭源 API 的最大区别？',o:['模型文件可下载，能在自己机器上跑','开放权重的一定更聪明','开放权重的不收费','闭源 API 不能用中文'],a:0,why:'开放权重的核心是模型文件可自取自部署，与聪明程度无关。'}},
{id:'deepagent',term:'深度智能体',full:'Deep Agent',cn:'深度智能体',zone:'ai',lv:2,tl:'普通 agent 接一两步的小活，<b>deep agent</b> 能独立扛长任务：自己拆计划、建草稿、调工具、卡住换路，一口气干几十步才交结果。2026 年各家都在卷这个形态。',ana:'普通 agent 是跑腿小哥，一趟送一单；deep agent 是能独立跟完全程的项目经理，中间自己开协调会。',scn:'跟 Claude Code 说『从零做一个带登录的记账小站』，它自己列文件、写前后端、跑起来点一遍再修——这种长活就是 deep agent 的主场。',rel:['agent','codingagent','planexec','subagent','agentloop'],al:['deep agent','深度智能体','长任务 agent','深度自主智能体'],one:'能自主干几十步长任务的高级智能体形态',cf:'别当成「更会聊天的机器人」——差别不在嘴上，在能连续自主干活几十步。',dlg:[{q:'deep agent 和普通 agent 不都是干活？',a:'普通的一两步，deep 的自己拆任务干几十步。'},{q:'中间出错谁管？',a:'它自己发现自己换路，卡死才找人。'}],quiz:{q:'deep agent 的『deep』主要体现在？',o:['回答的用词更深奥','模型参数量更大','能自主拆解并连续执行几十步的长任务','对话历史更长'],a:2,why:'deep 指任务纵深：自主规划并连续执行几十步。'}},
{id:'sft',term:'监督微调',full:'SFT (Supervised Fine-Tuning)',cn:'监督微调',zone:'ai',lv:2,abbr:true,tl:'<b>监督微调</b>＝拿几千~几万条『问题 + 标准回答』的例题喂给模型，让它模仿着学会特定答法。lora 是省显存做 SFT 的常用手法。',ana:'像临摹字帖：每个字都有范本，照着练。练的是『照范本回答』，不是『理解为什么』。',scn:'公司要客服 AI 用自家话术回话，就整理几百条『客户问题 → 标准话术』做 SFT——模型没换，说话腔调变了。',rel:['ft','lora','rlhf','dataset','dpo'],al:['SFT','监督微调','示范微调','有监督微调','指令微调'],one:'拿标好标准答案的例题，手把手教模型学',cf:'别当成 rlhf——SFT 照标准答案抄，RLHF 靠好坏反馈试错。',dlg:[{q:'想让 AI 学我们客服的说话风格？',a:'整理几百条问答对做 SFT，喂一遍就带上腔调。'},{q:'要多少条？',a:'几百条像样的就见效，脏数据喂多反而学歪。'}],quiz:{q:'SFT 需要的训练数据是？',o:['只标注『好/坏』的反馈','成对的『问题 + 标准回答』示例','随意抓的网页文本','纯图片数据'],a:1,why:'SFT 的『监督』就体现在每个问题都有标准答案可抄。'}},
{id:'dpo',term:'偏好对齐',full:'DPO (Direct Preference Optimization)',cn:'偏好对齐',zone:'ai',lv:3,abbr:true,tl:'<b>DPO</b> 是种省事的调教法：给模型看成对回答——同一个问题 A 答得好、B 答得差——让它学会偏心好的那边，<b>不需要先训练一个打分模型</b>（RLHF 需要）。',ana:'教审美不用报班：每次拿两幅画问『哪幅好看』，选上千次后，眼光自然就上去了。',scn:'模型更新公告里写『用 DPO 对齐人类偏好』，翻译过来：这次调教靠成对比较的偏好数据，回答更对用户胃口、废话更少。',rel:['rlhf','alignment','sft','rewardhack'],al:['DPO','直接偏好优化','偏好对齐','成对偏好训练'],one:'不给标准答案，只喂『哪个回答更好』来调教',cf:'别当成 SFT——DPO 只告诉『哪个更好』，不提供标准答案。',dlg:[{q:'没有标准答案的任务怎么调？',a:'用 DPO，喂成对回答标个好差就行。'},{q:'模型真能从『哪个好』里学到东西？',a:'能，选多了它就摸清好回答长什么样。'}],quiz:{q:'DPO 与 SFT 的关键区别？',o:['DPO 用偏好对比训练，不需要标准答案','DPO 需要更多显卡','DPO 只能训练图片模型','DPO 是新版名字，做法一样'],a:0,why:'DPO 的核心就是拿『哪个更好』的对比信号替代标准答案。'}},
{id:'loss',term:'损失函数',full:'Loss Function',cn:'损失函数 / 损失值',zone:'ai',lv:2,tl:'模型每次输出都跟标准答案比一下差距，这个差距就是一个数，叫 <b>loss</b>。<b>训练的全部目标就是把它压下去</b>——loss 降，说明模型在变准；不降了，说明到瓶颈了。',ana:'像射箭的环数：每箭都记分，教练不看感觉，只盯着平均环数有没有涨。',scn:'训练日志里 loss 从 3.2 一路降到 0.8 又趴住不动，前段是『学得欢』，后面是『能学的都学了』——看曲线就知道该不该停。',rel:['gradient','backprop','training','overfit'],al:['loss','损失值','误差函数','代价函数','loss 值'],one:'给模型打分『这次错得有多离谱』的尺子',cf:'别当成「错题数」——loss 是连续的差距大小，不是一题题数出来的。',dlg:[{q:'训练日志里 loss 一直在降，好事？',a:'对，降=越来越准。突然不降了就是到平台期。'},{q:'loss 降完就万事大吉？',a:'不一定，还要防过拟合，新题上另测。'}],quiz:{q:'训练时 loss 曲线持续下降意味着？',o:['模型输出越来越接近目标，在正常学习','模型一定把数据背下来了','显卡坏了','数据集太小'],a:0,why:'loss 下降=输出与目标的差距在缩小=正常学习。'}},
{id:'gradient',term:'梯度下降',full:'Gradient Descent',cn:'梯度下降',zone:'ai',lv:2,tl:'模型的上亿个参数像一片起伏的丘陵，<b>loss</b> 是海拔。梯度下降就是每次算出『往哪边走是下坡』，挪一小步，走几百万次，<b>一路滑到谷底</b>——那里就是误差最小的地方。',ana:'浓雾天下山：看不清全景，就用脚感觉脚下的坡度，哪边往下哪边迈步，一小步一小步蹭到谷底。',scn:'教程说『学习率设太大会震荡』——就是下山步子迈太大，一脚跨过谷底蹦到对面山坡上去了。',rel:['backprop','loss','training','param'],al:['gradient descent','梯度下降法','下山算法','最速下降'],one:'顺着坡往下挪一小步，反复走到最低点',cf:'别当成 backprop——backprop 负责「算出往哪边是下坡」，梯度下降负责「迈这一步」。',dlg:[{q:'梯度下降到底是啥在下降？',a:'loss 这个『海拔』在降，参数往误差变小的方向挪。'},{q:'为啥一小步一小步挪？',a:'步子太大容易跨过头，来回震荡。'}],quiz:{q:'梯度下降中『学习率』控制的是？',o:['每一步往坡下挪多大步','下山时带多少水','训练数据有多少条','模型层数有多少'],a:0,why:'学习率=步长，太大震荡、太小磨蹭。'},shot:'gradient'},
{id:'backprop',term:'反向传播',full:'Backpropagation',cn:'反向传播',zone:'ai',lv:3,tl:'模型输出错了，<b>反向传播</b>从最终误差出发，沿着网络往回一层层推：每个参数对这次错误『贡献』了多少，各打各的责任，然后各按责任大小调整。是梯度下降的『记账环节』。',ana:'餐厅菜咸了：经理不会全员扣工资，而是顺着出餐链路回查——厨师手重还是采购咸了，谁的责任扣谁的。',scn:'教程说『网络太深训练慢，因为梯度要一层层往回传』——深网络难训的老大难：账传到前排，都快算没了。',rel:['gradient','loss','neuron','layer'],al:['backprop','BP 算法','误差反传','反向传导'],one:'从最终误差往回一层层算账，定每个参数的责',cf:'别当成 gradient descent——它俩是搭档：backprop 算责任，梯度下降迈步子。',dlg:[{q:'出错了模型怎么知道该改谁？',a:'backprop 从误差往回一层层追责，各改各的。'},{q:'几十层也追得动？',a:'追得动，但层太深传到前排的『责』会缩水，难训。'}],quiz:{q:'反向传播（backpropagation）在训练里负责？',o:['把误差责任从输出层往回分配到各层参数','直接降低 loss','给模型喂训练数据','画出网络结构图'],a:0,why:'backprop 的职责就是沿网络反向分配误差责任。'}},
{id:'overfit',term:'过拟合',full:'Overfitting',cn:'过拟合',zone:'ai',lv:1,tl:'模型把训练题<b>死记硬背</b>下来了，训练成绩满分，遇到没见过的新题反而拉胯——这叫过拟合。特征是：训练 loss 还在降，测试成绩却开始掉。',ana:'背题型的学生：历年卷倒背如流，高考换个设问就懵。会做的是『题』，不是『知识』。',scn:'你微调一个分类模型，训练准确率 99%，拿 20 条真实数据一测只有 60%——八成是过拟合，喂的例题太单一了。',rel:['training','dataset','eval','batch'],al:['overfitting','过拟合','背题','死记硬背','过学习'],one:'例题背得滚瓜烂熟，新题一换就不会了',cf:'别当成「训练效果好」——训练分高恰恰可能是病，要看新题成绩。',dlg:[{q:'我微调完训练集全对，一上线就不行？',a:'典型 overfit，把例题背下来了没学到规律。'},{q:'咋治？',a:'例题加多样、加量，或者早点停训练。'}],quiz:{q:'过拟合模型的典型表现？',o:['训练数据上满分，新数据上明显变差','训练和测试都满分','完全无法训练','回答速度变慢'],a:0,why:'过拟合=背题：熟题满分、生题崩盘。'},shot:'overfit'},
{id:'batch',term:'批次',full:'Batch',cn:'批次 / 批大小',zone:'ai',lv:2,tl:'训练数据几百万条，一条条喂太慢。攒一小撮（比如 32 条）<b>一起算误差、取平均、改一次参数</b>，这一撮叫一个 batch。攒多大，是训练里要调的门道。',ana:'改作业：收一份改一份太折腾，收齐一小组一起改，改完统一讲评一次。',scn:'训练脚本里 batch_size=32、跑 10000 步——意思是每 32 条数据算一轮改一次参数，全库数据会轮很多遍。',rel:['param','training','flops'],al:['batch size','批大小','批次训练','小批量','mini-batch'],one:'训练时不一条条喂，攒一撮一起算再统一改',cf:'别当成 epoch（全库过一遍）——batch 是一小撮，epoch 是全部题做完一轮。',dlg:[{q:'batch_size 是 32 就是只训练 32 条数据吗？',a:'不是，是每次攒 32 条一起算，全库都会轮到。'},{q:'那 batch 越大越好？',a:'显存吃不消，而且太大泛化反而可能差。'}],quiz:{q:'batch_size=64 表示？',o:['模型总共只见过 64 条数据','每 64 条一起算一次误差、更新一次参数','模型有 64 层','每秒处理 64 个请求'],a:1,why:'batch_size 是『一撮』的大小，全库数据会分很多撮轮完。'}},
{id:'neuron',term:'神经元',full:'Neuron',cn:'神经元（AI 的）',zone:'ai',lv:1,tl:'AI 的<b>神经元</b>是模仿脑细胞造的小单元：把输入乘上各自的权重加起来，超过门槛就『兴奋』（输出信号）。一个模型里有几十亿个这种单元连成网。',ana:'像一排话语权不同的评委投票：有人说话分量重（权重高），大家意见加一起超过门槛，提案就通过。',scn:'可解释性研究有个著名发现：某些神经元专门盯着转折词，一出现『但是』它们就集体兴奋——黑盒开始被摸清了。',rel:['layer','tensor','transformer','attention'],al:['neuron','人工神经元','神经单元','节点'],one:'AI 里最小的计算单元：加权求和，超门槛就激活',cf:'别当成真人脑细胞——只是灵感来自生物，实际就是个加权求和的小算式。',dlg:[{q:'模型里的神经元跟脑神经元一样？',a:'灵感一样，实际就是个加权求和超门槛的小单元。'},{q:'那几十亿个连起来干嘛？',a:'层层接力，把数字一步步变成『理解』。'}],quiz:{q:'人工神经元做的事可以概括为？',o:['加权求和，超过阈值就输出信号','随机生成一个数字','存储一整篇文章','连接互联网'],a:0,why:'人工神经元=加权求和+阈值激活，就这么简单。'}},
{id:'layer',term:'网络层数',full:'Layers',cn:'网络层数',zone:'ai',lv:1,tl:'神经网络的神经元按<b>层</b>排班：进口一层，中间几十上百层，出口一层。信息每过一层就被加工一次——浅层认线条，深层认概念。『深度』学习的深，就是层数多。',ana:'工厂流水线：第一站分拣原料，中间每站加工一道，最后一站出成品。站越多，能做的工序越复杂。',scn:'公众号说『这模型 100 层』，指中间有 100 站流水线——层多能学的概念更复杂，但也更难训。',rel:['neuron','dl','transformer','tensor'],al:['layers','网络深度','隐层','隐藏层','层数'],one:'神经元排成的层，一层层接力把信息越提越纯',cf:'别当成「层数越多一定越聪明」——层太深梯度难传，训练不动反而废。',dlg:[{q:'为什么叫『深度』学习？',a:'因为网络层数深，一层层接力加工。'},{q:'那层越多越好？',a:'不绝对，太深训练不动，得配新招。'}],quiz:{q:'『深度学习』里的『深度』指？',o:['理解的哲理更深刻','神经网络的层数多','训练时间更长','数据量更大'],a:1,why:'deep learning 的 deep 就是指网络层数深。'}},
{id:'tensor',term:'张量',full:'Tensor',cn:'张量',zone:'ai',lv:2,tl:'<b>张量</b>就是多几张维度的数字表格：一维是一行数，二维是表格，三维是一摞表格。图片、文字、声音进模型前<b>统统先变成张量</b>，GPU 型号里常带的『T』就是它。',ana:'像超市货架：一条通道是一维，整个货架二维，好几层货架三维——不管什么货，进了仓库都按格子摆。',scn:'一张 800×800 的照片进模型，就是 800×800×3 的大张量（3 是红绿蓝三通道）——几百万个数字，GPU 整块并行算。',rel:['gpu','vram','flops','param','neuron'],al:['tensor','张量','多维数组','张量数据'],one:'多维数字表格，AI 眼里一切数据的标准形态',cf:'别当成什么玄学——它就是多维表格，你见过的 Excel 加几个维度而已。',dlg:[{q:'张量听着好玄，到底是什么？',a:'多维数字表格，一维行数、二维表、三维一摞表。'},{q:'跟 GPU 有啥关系？',a:'GPU 整块并行算张量，天生一对。'}],quiz:{q:'数据进入神经网络前的标准形态是？',o:['文本文件','张量（多维数字表格）','压缩包','网页链接'],a:1,why:'一切输入都要先数字化成张量才能进网络计算。'},shot:'tensor'},
{id:'catastrophic',term:'灾难性遗忘',full:'Catastrophic Forgetting',cn:'灾难性遗忘',zone:'ai',lv:2,tl:'模型拿新数据继续训练时，<b>新本领学会了，旧本领没了</b>——原来会写代码，微调完客服话术，代码就不会写了。这种『喜新厌旧』是微调圈的著名事故。',ana:'像手机存新照片把旧照片自动挤掉——存是存进去了，代价是老的没了。',scn:'拿自家语料微调开源模型，测新任务没问题，回归测老能力掉一截——八成撞上灾难性遗忘，常规解法是新旧数据掺着练。',rel:['ft','dataset','drift','lora'],al:['灾难性遗忘','遗忘问题','学新忘旧','灾难遗忘'],one:'模型学新任务时，把原来会的东西冲掉了',cf:'别当成「模型漂移」——遗忘是训练新东西冲掉旧的，漂移是世界变了模型没跟上。',dlg:[{q:'微调完新任务好了，老任务崩了？',a:'灾难性遗忘，新数据把旧的冲掉了。'},{q:'怎么办？',a:'新旧数据掺着练，或用 lora 少动原参数。'}],quiz:{q:'避免灾难性遗忘的常见做法？',o:['只喂新数据，练得越狠越好','新旧数据混合训练，或用 lora 少动原参数','删掉旧任务的所有数据','换一台更强的显卡'],a:1,why:'混合新旧数据、少动原参数是防遗忘的常规解法。'}},
{id:'drift',term:'模型漂移',full:'Model Drift',cn:'模型漂移',zone:'ai',lv:2,tl:'模型上线时挺准，<b>但世界在变，它不变</b>：黑话更新了、用户习惯变了、行情换了——模型还按老地图答新问题，准确率悄悄下滑。这叫模型漂移。',ana:'三年前存的『流行语手册』今天还在用——不是手册坏了，是语言漂走了。',scn:'客服机器人上线半年突然答非所问，一查是公司产品改名了，训练数据里还是旧名——定期拿新数据重新校准，就是在治 drift。',rel:['catastrophic','eval','datacontam','weights'],al:['model drift','模型漂移','性能衰退','数据漂移'],one:'世界在变，模型还停在昨天，慢慢就不准了',cf:'别当成「模型坏了」——模型一个参数没变，是世界变了它没跟上。',dlg:[{q:'上线时好好的模型怎么越来越不准？',a:'世界变了它没变，这叫模型漂移。'},{q:'咋治？',a:'定期喂新数据重新校准，盯着评测指标。'}],quiz:{q:'模型漂移（model drift）发生的原因是？',o:['模型参数被人改坏了','现实世界变化，模型训练时的老知识跟不上','用户问得太多','显卡太旧'],a:1,why:'drift 的本质是环境变化 vs 模型静止的落差。'},shot:'drift'},
{id:'speculative',term:'投机解码',full:'Speculative Decoding',cn:'投机解码',zone:'ai',lv:3,tl:'大模型一个字一个字往外蹦很慢。<b>投机解码</b>让小模型先一口气写 4 个字的草稿，大模型一次批改 4 个——都对就全收，错一个就从错处重写。快 2~3 倍，答案不变。',ana:'像医生带助手：助手先开 4 张处方，医生一次批 4 张，对的签字生效，错的当场改——比医生一张张开快多了。',scn:'刷到『DeepSeek 推理提速 2.8 倍』的技术解读，多半是投机解码这类操作的功劳：草稿模型抢跑，大模型批改。',rel:['infer','infereng','vllm','prefill','gpu'],al:['speculative decoding','投机采样','草稿模型加速','draft 模型'],one:'小模型先抢答草稿，大模型一次批改定稿',cf:'别当成「小模型代替大模型」——草稿只是抢跑，终审全是大模型。',dlg:[{q:'草稿模型写错了怎么办？',a:'大模型批改时打回，从错处重写，答案不会变差。'},{q:'那图啥？',a:'图快——验证 4 个字跟生成 1 个字差不多贵。'}],quiz:{q:'投机解码为什么能提速？',o:['草稿模型偷偷替大模型回答用户','验证 4 个草稿的成本约等于生成 1 个字，对了整段白拿','把大模型的参数删掉一半','跳过一些用户的请求'],a:1,why:'核心是验证比生成便宜，草稿被接受就一次前进多步。'},shot:'speculative'},
{id:'prefill',term:'预填充与解码',full:'Prefill & Decode',cn:'预填充与解码',zone:'ai',lv:3,tl:'AI 回答分两步：<b>预填充</b>＝把你输入的全部内容一口气读完、算好中间状态；<b>解码</b>＝然后一个字一个字往外吐。前段吃算力（并行快），后段吃显存带宽（逐字慢）。',ana:'像老师阅卷：先把整张卷子读完（prefill），再一句一句写评语（decode）——读可以一目十行，写只能手敲。',scn:'问 AI 一个超长文档的问题，等它蹦出第一个字特别慢——那段就是 prefill 在啃你的长输入；输入越长等得越久。',rel:['kv','streaming','infer','ttft'],al:['prefill','预填充','prompt 处理','输入处理阶段','decode 阶段'],one:'先一口气读完你输入的所有字，再逐字往外蹦',cf:'别当成流式输出——流式是显示效果，prefill/decode 是生成前后的两个阶段。',dlg:[{q:'长文档提问为啥第一个字等半天？',a:'prefill 在啃你的长输入，读完才开始吐字。'},{q:'那吐字阶段呢？',a:'decode 逐字蹦，吃显存带宽。'}],quiz:{q:'长文档提问时『第一个字出来特别慢』，卡在哪一阶段？',o:['解码（decode）','预填充（prefill）','网络下载','用户打字'],a:2,why:'prefill 要并行处理整个输入，输入越长等待越久。'}},
{id:'ttft',term:'首字延迟',full:'TTFT (Time To First Token)',cn:'首字延迟',zone:'ai',lv:2,abbr:true,tl:'<b>TTFT</b>＝从你按下发送到 AI 吐出第一个字的时间。它决定『AI 反应快不快』的体感——后面每秒蹦多少字是另一件事。',ana:'像外卖的下单响应：商家多久确认接单（首字），跟骑手路上跑多快（后续速度）是两码事。',scn:'比较两个 AI 产品的体验，一个秒回一个转圈 5 秒——差的就是 TTFT，多半卡在排队和长 prefill。',rel:['latency','streaming','prefill','infer'],al:['TTFT','首字延迟','首 token 时间','first token 延迟'],one:'从发出提问到蹦出第一个字等多久',cf:'别当成总时长——TTFT 只管第一个字多快到，总时长=首字+后面逐字的时间。',dlg:[{q:'两个模型都标『每秒 50 字』，体感差好多？',a:'看 TTFT，一个 0.3 秒出首字一个 5 秒，体感天差地别。'},{q:'TTFT 看什么？',a:'排队+读输入的工夫。'}],quiz:{q:'TTFT 衡量的是？',o:['AI 每秒生成多少字','从发送问题到收到第一个字等多久','对话总共持续多久','模型训练耗时'],a:3,why:'TTFT=Time To First Token，只量首字等待。'}},
{id:'vllm',term:'推理引擎',full:'vLLM',cn:'推理引擎 vLLM',zone:'ai',lv:3,tl:'<b>vLLM</b> 是最流行的开源推理引擎：同一张显卡，用它伺服模型能多接好几倍的并发请求。核心是两招——显存分页管理（PagedAttention）+ 连续批处理，成了自建模型服务的标配。',ana:'像餐厅从『一桌一服务员全程陪』改成『灵活排班』：哪桌好上菜就先上，桌子利用率拉满。',scn:'公司要私有化部署 Qwen，运维直接上 vLLM——同样的卡，并发从 20 涨到 100+，这就是部署圈人手一个 vLLM 的原因。',rel:['infereng','gpu','kv','concurrency','docker'],al:['vLLM','推理引擎','模型伺服','serving 框架'],one:'把大模型跑得又快又省的开源推理服务器软件',cf:'别当成模型——它不含模型，是伺服模型的服务器软件（模型另下）。',dlg:[{q:'vLLM 是个模型吗？',a:'不是，是跑模型的服务器软件，模型另外下。'},{q:'为啥快？',a:'显存分页+连续批处理，卡不闲着。'}],quiz:{q:'vLLM 提升并发靠的核心思路？',o:['显存分页管理+请求连续排批，让显卡不闲着','把模型压缩得更小','换更好的显卡','减少用户的提问字数'],a:0,why:'vLLM 两板斧 PagedAttention+continuous batching，榨干显卡利用率。'}},
{id:'flashattn',term:'注意力加速',full:'FlashAttention',cn:'注意力加速 FlashAttention',zone:'ai',lv:3,tl:'<b>FlashAttention</b> 不改数学结果，只改干活方式：注意力本来要在显存里来回搬一张大中间表，它改成小块在高速缓存里算完再写回——<b>少搬砖</b>，长文本推理又快又省显存。',ana:'像做饭：原来每切一样菜都跑一趟冰箱，FlashAttention 把要用的先码在灶台上，切完一起下锅。',scn:'模型更新日志写『支持 128K 上下文，得益于 FlashAttention』——没有它，长上下文的显存开销根本扛不住。',rel:['attention','transformer','gpu','vram','kv'],al:['FlashAttention','闪注意力','注意力加速算法'],one:'算注意力少搬内存的算法，又快又省显存',cf:'别当成新模型——它是个底层算法，模型架构不变、结果不变、只是算得快。',dlg:[{q:'FlashAttention 是新出的注意力？',a:'注意力机制没变，是算它的手法变快了。'},{q:'快多少？',a:'长文本场景显存省一大截，速度翻着涨。'}],quiz:{q:'FlashAttention 加速的原理？',o:['把注意力公式改简单，牺牲精度','不改变结果，减少显存读写次数','用更多显卡并行','把模型层数减少'],a:1,why:'核心是 IO 感知分块计算，数学等价但少搬内存。'}},
{id:'pruning',term:'剪枝',full:'Pruning',cn:'剪枝',zone:'ai',lv:2,tl:'模型上亿参数里很多贡献极小。<b>剪枝</b>就是把这些『闲人』参数剪掉：小模型好部署、跑得快，能力掉得不多。跟量化（降精度）、蒸馏（教小学生）并称模型瘦身三件套。',ana:'像衣橱断舍离：一年没穿的衣服清出去，衣柜好找衣服，日常穿搭基本不受影响。',scn:'手机端 AI 用的小模型，很多是『大模型剪枝+蒸馏+量化』三连出来的——不瘦身根本塞不进手机。',rel:['quant','distill','compression','param'],al:['pruning','模型剪枝','参数裁剪','稀疏化'],one:'把不重要的参数剪掉，给模型瘦身',cf:'别当成 quant——剪枝是删参数，量化是把留下的参数换成低精度数字。',dlg:[{q:'剪枝会不会把模型剪傻？',a:'剪得温柔只掉一点点，剪狠了要重新训回状态。'},{q:'跟量化啥区别？',a:'剪枝删人，量化降薪，都是瘦身。'}],quiz:{q:'剪枝（pruning）做的事是？',o:['降低参数的存储精度','直接删掉贡献小的参数','给模型加新参数','把模型卖给别家'],a:2,why:'剪枝=删除冗余参数；量化是降精度，别混。'}},
{id:'softmax',term:'打分归一',full:'Softmax',cn:'打分归一 Softmax',zone:'ai',lv:3,tl:'模型对下一个字会给一堆原始分数（有的高有的低，还可能负数）。<b>softmax</b> 把这些分数压成一组『加起来正好 1』的概率，最高的分得最大概率——temperature 就是在这一步调节输赢差距的。',ana:'像选秀计票：原始分有正有负不好比，softmax 换算成支持率百分比，总分永远 100%，分越高支持率越高。',scn:'讲『为什么 AI 输出有随机性』的公众号文必然画 softmax：分数→概率→按概率抽签，temperature 调节抽签的悬殊度。',rel:['temp','topp','token','kv'],al:['softmax','归一化指数','概率化','打分转概率'],one:'把一串打分变成加起来等于 1 的概率',cf:'别当成打分本身——softmax 不打分，它只把已有的分变成概率。',dlg:[{q:'模型选词是直接拿最高分？',a:'先过 softmax 变概率，再按概率抽，所以有随机性。'},{q:'temperature 动的是哪？',a:'动概率悬殊度，调温度=调保守激进。'}],quiz:{q:'softmax 的作用是？',o:['给候选词打原始分','把原始分换算成总和为 1 的概率分布','过滤不合适的词','翻译成中文'],a:3,why:'softmax 只做分数→概率的转换，打分在它之前。'}},
{id:'beamsearch',term:'束搜索',full:'Beam Search',cn:'束搜索',zone:'ai',lv:3,tl:'模型逐字生成时每步都有多条路。<b>束搜索</b>不每步只留最优，而是<b>同时保住最好的几条（束宽）</b>各自往前走，最后挑整体得分最高的一条。输出稳定、不抽签，翻译/摘要这类『要唯一好答案』的任务常用。',ana:'像导航同时规划 3 条路线全程跑一遍，看谁总时间最短，而不是每个路口只赌一条。',scn:'翻译工具输出每次都一模一样、用词精准——多半是束搜索这类确定性搜索在工作；聊天 AI 每次答得不一样，那是采样（temperature）在起作用。',rel:['topp','temp','infer','cot'],al:['beam search','束宽搜索','集束搜索','多路搜索'],one:'同时保住几条最好的路，走完再挑总分最高',cf:'别当成 topp——束搜索走确定性最优路，topp 是按概率随机抽，天生两种风格。',dlg:[{q:'翻译结果怎么每次都一样？',a:'束搜索固定挑最优路径，不抽签。'},{q:'聊天 AI 为什么每次不同？',a:'那个用采样，故意留随机性。'}],quiz:{q:'束搜索与 topp 采样的本质区别？',o:['束搜索确定性选最优，topp 按概率随机抽','束搜索更快','topp 只能用于翻译','没有区别'],a:0,why:'束搜索=确定性最优，采样=带随机性，两条路线。'},shot:'beamsearch'},
{id:'eos',term:'停止符',full:'EOS Token',cn:'停止符 EOS',zone:'ai',lv:2,abbr:true,tl:'模型每次只预测下一个字，那它怎么知道该停？训练时每段话结尾都放一个专用符号 <b>EOS</b>（End Of Sequence）。模型生成出 EOS 就收工。你见过 AI 一遍遍重复车轱辘话停不下来，多半是 EOS 没学老实。',ana:'像作文的『全文完』——写到这里就必须停笔；没学好的学生会把『全文完』后面又续三百字。',scn:'用 API 调模型时参数里的 stop_token_ids，就是你在额外指定『看到这几个记号也当 EOS 处理』。',rel:['token','streaming','infer','temp'],al:['EOS','结束符','终止符','stop token','句号 token'],one:'模型表示『说完了』的专用结束符',cf:'别当成标点句号——句号是文字，EOS 是模型词汇表里专门的『收工信号』。',dlg:[{q:'AI 怎么知道自己说完了？',a:'它生成出 EOS 这个专用结束符就停。'},{q:'那车轱辘话怎么来的？',a:'EOS 没学老实，一直收不了工。'}],quiz:{q:'模型『停不下来』重复输出，最相关的是？',o:['EOS 结束符没被正确生成或识别','显卡太热','网络中断','上下文太长'],a:1,why:'收不住车=该出现的结束信号没出现。'}},
{id:'bpe',term:'切词算法',full:'BPE (Byte Pair Encoding)',cn:'切词算法 BPE',zone:'ai',lv:3,abbr:true,tl:'<b>BPE</b> 是主流切词法：从单个字符开始，把常一起出现的组合一步步合并成块——『token』这种高频词整个一块，生僻长词切成几块。<b>token 不等于单词</b>的根源就在切法。',ana:'像记外卖单：『黄焖鸡米饭』常点就整个记成一条速记；『西班牙海鲜烩饭』没记过，就拆成几段记。',scn:'公众号算 token 账时说『英文便宜中文贵』——因为词表里英文常见词整块，中文常按字甚至按字节切，同样的意思吃更多 token。',rel:['token','tokeneco','utf8','unicode'],al:['BPE','字节对编码','分词算法','切词法','tokenizer 算法'],one:'token 的切法：高频字母组合合并成块',cf:'别当成按空格切词——BPE 按统计频率切块，跟空格、单词边界无关。',dlg:[{q:'为什么 token 数和单词数对不上？',a:'BPE 按频率切块，不按单词切。'},{q:'中文更费 token？',a:'词表里中文块少，常拆得更碎，同样意思更贵。'}],quiz:{q:'BPE 切 token 的依据是？',o:['按空格切','按标点切','按统计频率把常出现的组合合并成块','按句子切'],a:2,why:'BPE 的核心=高频组合逐步合并，频率决定块大小。'}},
{id:'perplexity',term:'困惑度',full:'Perplexity',cn:'困惑度 PPL',zone:'ai',lv:3,tl:'<b>困惑度</b>（PPL）衡量模型读完上文后对下一个字的犹豫程度：越低＝模型越笃定＝语言建模越好。评测大模型『底子』时常报这个数——但它是底子指标，不直接等于回答得好。',ana:'像考试卷面的犹豫涂改次数：涂改越少=越胸有成竹；但卷面干净不等于答案全对。',scn:'技术号比基座模型时列『PPL 越低越好』的表——那是比『下一段文字预测』的内功，跟会不会聊天是两码事。',rel:['benchmark','eval','pretrain','token'],al:['perplexity','PPL','困惑度','语言建模评分'],one:'模型对下一个字有多『拿不准』的打分',cf:'别当成回答准确率——PPL 低只说明文字预测稳，不代表答得对。',dlg:[{q:'PPL 低的模型更聪明吗？',a:'只说明预测下一字更笃定，不代表回答正确。'},{q:'那看啥？',a:'看 evals 实测答对率。'}],quiz:{q:'困惑度（PPL）降低说明？',o:['模型对文本的预测更笃定','回答一定更正确','跑得更快','更省钱'],a:3,why:'PPL 是语言建模指标，与答案正确性无直接绑定。'}},
{id:'bm25',term:'关键词检索',full:'BM25',cn:'关键词检索 BM25',zone:'ai',lv:2,abbr:true,tl:'<b>BM25</b> 是搜索界的老前辈：按关键词出现次数、稀缺程度给文档打分排序——查『退款』就找『退款』说得最多的文档。它不懂语义，但快、稳、不要显卡，至今是搜索系统的地基，也是 RAG 多路召回里的常驻一路。',ana:'像图书管理员的卡片检索：书名/摘要里关键词越对得上，越往前提——完全不懂书里到底写了啥。',scn:'公司知识库搜索『发票 报销』命中的老系统，底层多半是 BM25；新一代 RAG 常让它和向量检索各出一批结果再合并。',rel:['rag','embed','multi_recall','vdb'],al:['BM25','关键词检索','字面匹配','稀疏检索'],one:'老牌按字面关键词找资料的搜索算法',cf:'别当成向量检索——BM25 查字面对不上，向量检索查意思对得上。',dlg:[{q:'有了向量检索还要 BM25？',a:'要，专有名词、编号这种字面查询它最稳，两者合并效果最好。'},{q:'这叫啥？',a:'多路召回，各查各的再合流。'}],quiz:{q:'BM25 的检索原理是？',o:['理解语义后按意思找','按关键词匹配度和词的稀缺度给文档打分','随机抽样文档','按文件名排序'],a:0,why:'BM25=改进的关键词打分（词频×逆文档频率）。'}},
{id:'needle',term:'大海捞针测试',full:'Needle in a Haystack',cn:'大海捞针测试',zone:'ai',lv:2,tl:'测长上下文的经典考法：往几十万字里<b>埋一句无关的话</b>，再问模型这句话——它答对＝真读进去了，答错/编＝所谓长上下文有水分。',ana:'像往一整本电话簿里夹一张纸条，看你翻不翻得到——翻得到才是真的一页页看了。',scn:'评测博主测『128K 长文档理解』用的就是这套：文档中间埋句『密码是菠萝披萨』，结尾问密码——答不上就是注意力衰减。',rel:['kv','ctxeng','eval','benchmark'],al:['needle in a haystack','大海捞针','藏针测试','长文本测试'],one:'长文本里藏一句测试句，看模型捞不捞得出来',cf:'别当成阅读理解题——它专测超长文本，普通阅读理解几百字就算长的够不着。',dlg:[{q:'模型标 128K 就真能记住 128K？',a:'不一定，大海捞针一测便知。'},{q:'怎么测？',a:'长文中段藏句暗号，结尾问，答上才算真读进去了。'}],quiz:{q:'大海捞针测试测的是？',o:['模型生成速度','模型对超长文本中间内容的真实利用率','模型的词汇量','模型的安全防线'],a:1,why:'专测长文本：藏中间的细节模型能不能真用上。'},shot:'needle'},
{id:'similarity',term:'相似度',full:'Similarity',cn:'相似度',zone:'ai',lv:2,tl:'文字图片变成向量后，<b>相似度</b>就是比较两个向量的距离或夹角：越近越像。语义检索的底层就是它——『怎么退款』和『退货流程』字面不同，向量距离近，照样能匹配上。',ana:'像在地图上比两家店：坐标离得近就算『近邻』，不管一家卖面一家卖饭。',scn:'知识库里搜『怎么开发票』命中了标题写『发票开具流程』的文档——字面半对不上也能搜到，就是向量相似度在牵线。',rel:['embed','vdb','rerank','rag'],al:['similarity','向量相似度','余弦相似度','语义相似度'],one:'两个向量有多像，用距离/夹角来量',cf:'别当成相同——相似度是『有多像』的连续分数，1.0 才是完全一样。',dlg:[{q:'搜『怎么退货』为啥能命中『退款指引』？',a:'两句话向量距离近，相似度高就配对。'},{q:'字都不一样也算？',a:'算，向量看的是意思不是字面。'}],quiz:{q:'语义搜索能『字面不同也命中』靠的是？',o:['关键词必须完全一致','向量相似度：意思近的向量距离近','文件名排序','随机推荐'],a:2,why:'向量把语义编码成坐标，距离近=意思近。'}},
{id:'dataclean',term:'数据清洗',full:'Data Cleaning',cn:'数据清洗',zone:'ai',lv:1,tl:'网上抓来的数据一堆渣：重复的、残缺的、乱码的、有毒的。<b>数据清洗</b>就是训练前的淘米洗菜——去重、过滤、排版规范。喂进去的数据干净，模型才学得正；垃圾进垃圾出。',ana:'像做饭前洗菜择菜：不洗直接下锅，一锅好菜毁于一撮沙。',scn:'公众号讲『为什么各家模型文风不同』，训练数据的清洗标准是重要原因——洗得狠的模型废话少，洗得松的口水话多。',rel:['dataset','datalabel','syndata','pretrain'],al:['data cleaning','数据清洗','数据过滤','洗数据'],one:'训练前把重复、残缺、有害的脏数据挑出去',cf:'别当成数据标注——清洗是扔坏数据，标注是给好数据贴答案。',dlg:[{q:'数据也用洗？',a:'必须洗，重复残缺带毒的全得筛掉。'},{q:'不洗会怎样？',a:'垃圾进垃圾出，模型学会满嘴跑火车。'}],quiz:{q:'数据清洗主要处理什么？',o:['给数据打标签','去掉重复、残缺、低质、有害的数据','把数据加密','把数据翻译成英文'],a:3,why:'清洗=淘掉脏数据，与标注（贴答案）是两道工序。'}},
{id:'latent',term:'潜空间',full:'Latent Space',cn:'潜空间',zone:'ai',lv:3,tl:'模型把图片、文字都压缩成一串内部向量，这些向量所在的高维空间叫<b>潜空间</b>。AI 画图不是直接画像素，而是先在潜空间里『想好』一张图的样子，再解码成像素。两张图能平滑渐变、风格能加减，都是潜空间的性质。',ana:'像画家的腹稿：动笔前脑子里有个模糊的『意思』，落笔只是把腹稿翻译成画。潜空间就是那颗腹稿的存储区。',scn:'AI 绘图里把一张图的向量往『夕阳』方向挪一点，画面就慢慢变黄昏——在潜空间里搬向量＝调意境。',rel:['embed','diffusion','tensor','t2i'],al:['latent space','潜空间','隐空间','特征空间'],one:'AI 把世界压缩后的『意念空间』，生成在这里加工',cf:'别当成图片文件夹——潜空间里存的是压缩后的特征向量，不是图本身。',dlg:[{q:'AI 画图先画线稿吗？',a:'先在潜空间里『想』成一坨向量，最后一步才解码成像素。'},{q:'风格渐变咋做到的？',a:'潜空间里两个向量之间走路，一步一变。'}],quiz:{q:'潜空间（latent space）里存的是？',o:['原始图片文件','压缩后的特征向量','网页链接','音频波形'],a:0,why:'潜空间=模型内部的高维向量空间，图只是它的解码结果。'}},
{id:'clip',term:'图文对齐',full:'CLIP',cn:'图文对齐 CLIP',zone:'ai',lv:2,abbr:true,tl:'<b>CLIP</b> 是 OpenAI 出的奠基模型：把几亿对『图+说明』喂进去，学会把图片和文字放进<b>同一个坐标系</b>——猫的图和『a photo of a cat』离得近。有了它，AI 才能按文字搜图、给图打标、教画图模型听懂文字。',ana:'像给图和文各发一张同一个地图的坐标：两样东西说的一回事，坐标就挨得近。',scn:'你在相册搜『海边日落』翻出没打任何标签的照片——底层多是 CLIP 这类图文对齐模型的功劳。',rel:['vlm','fullmodal','t2i','embed'],al:['CLIP','图文对齐','图文匹配模型','对比学习模型'],one:'把图片和文字翻译进同一坐标系，能互相对号',cf:'别当成画图模型——CLIP 不画图，它只负责让图和文『对上话』。',dlg:[{q:'CLIP 是画图的吗？',a:'不画，它管把图和文放进同一坐标系对上号。'},{q:'那谁画？',a:'扩散模型画，CLIP 当它们的翻译老师。'}],quiz:{q:'CLIP 学到的是？',o:['怎么生成图片','把图片和文字放进同一坐标系互相对号','怎么压缩视频','怎么翻译外语'],a:1,why:'CLIP 用对比学习把图/文映射到共享坐标系。'}},
{id:'inpaint',term:'局部重绘',full:'Inpainting',cn:'局部重绘',zone:'ai',lv:2,tl:'<b>局部重绘</b>是 AI 绘图的精确修改功能：把要改的区域涂出来（蒙版），AI 只重画这块，周围像素原样保留。改表情、换背景角落、补图里缺的东西都用它。',ana:'像补墙：只铲掉破的那块重抹，整面墙不用推倒。',scn:'生成的海报整体挺好就标题区字错了——用 inpaint 涂掉那块重生成，不用整张重抽碰运气。',rel:['t2i','image','diffusion','negprompt'],al:['inpainting','局部重绘','蒙版重绘','补图'],one:'只改图里指定的那块，其他地方不动',cf:'别当成整图重生成——inpaint 锁定改动范围，没涂的地方像素不变。',dlg:[{q:'图就错一个字，重抽 20 次都不理想？',a:'用 inpaint 涂那个字重画，别处不动。'},{q:'还能改局部表情？',a:'能，涂脸就行，衣服背景都不变。'}],quiz:{q:'inpainting 的特点是？',o:['每次整张图重新生成','只重画蒙版选中的区域，其余保留','把图放大变清晰','给图加滤镜'],a:2,why:'蒙版锁定修改范围是 inpaint 的定义。'}},
{id:'datacenter',term:'数据中心',full:'Data Center',cn:'数据中心',zone:'ai',lv:2,tl:'<b>数据中心</b>是把成千上万台服务器、存储、网络设备集中到一栋楼里的『算力工厂』。训练大模型就是上万张显卡在一个数据中心里连跑几个月。它耗电惊人，选址先看电价，AI 竞赛拼到后面拼的就是数据中心。',ana:'像集装箱港口：船（模型）再大，装卸全靠港口的岸桥（显卡）密度和调度——港口吞吐量决定能停多大的船。',scn:'新闻说『某公司投几十亿美元建数据中心』，实际花钱顺序是：拿地→变电站→机房→几万张 GPU 上架——AI 军备竞赛的实体就是这栋楼。',rel:['gpu','compute','aihardware','flops'],al:['data center','数据中心','机房','算力中心','IDC'],one:'几万台服务器集中住的『算力大本营』',cf:'别当成普通机房——几百台服务器的小机房不叫数据中心，起步就是几万台规模。',dlg:[{q:'训练 GPT 得用多大地方？',a:'几万张显卡塞满一栋数据中心楼，连跑几个月。'},{q:'为啥都建在冷地方？',a:'散热省电，电费是运营大头。'}],quiz:{q:'大模型训练与数据中心的关系是？',o:['训练在用户手机上完成','几万张卡集中在数据中心连续训练几个月','数据中心只用来存文件','训练不需要数据中心'],a:3,why:'前沿模型训练=数据中心级别的算力集结。'},shot:'datacenter'},
{id:'recursion',term:'递归',full:'Recursion',cn:'递归',zone:'code',lv:2,tl:'<b>递归</b>就是函数调用自己：剥洋葱一层层往里剥，剥到最里层（终止条件）再一层层退出来。写对了极简洁，忘了写终止条件就无限套娃，直到崩溃。',ana:'像查词典查到一个词，注释里又有不认识的词，接着查——直到全认识，再一层层回头把句子读通。',scn:'在 Codex 里让它写「遍历文件夹下所有子文件夹」的脚本，十有八九是递归写法——文件夹套文件夹，天然是套娃结构。',rel:['prog','stacktrace','callback','ast','debug'],al:['recursion','递归调用','套娃函数','自调用'],one:'函数调用自己，一层层进再一层层出',cf:'别和「循环 loop」混——循环是原地转圈，递归是一层层压进去再弹出来。',dlg:[{q:'递归和 while 循环都能重复，用哪个？',a:'树状、套娃结构递归更顺；简单重复用循环，还省内存。'},{q:'为什么会 stack overflow？',a:'忘写终止条件，调用一层层堆到内存上限，程序自己崩。'}],quiz:{q:'递归函数少了哪样东西必崩？',o:['终止条件（base case）','返回值','参数','函数名'],a:0,why:'没终止条件就无限自我调用，堆栈撑爆报 stack overflow。'}},
{id:'stackheap',term:'栈与堆',full:'Stack & Heap',cn:'栈与堆',zone:'code',lv:2,tl:'程序跑起来，内存分两块：<b>栈</b>像便利贴，函数一调用就贴一张，用完撕掉，快但小；<b>堆</b>像大仓库，存活得久的大对象，容量大但申请慢，还得靠垃圾回收收拾。',ana:'便签 vs 仓库：便签写完随手撕，快；仓库的东西要登记造册，用完还得有人来清点。',scn:'报错里看到「stack overflow（栈溢出）」，多半是递归太深把便利贴区堆爆了；而内存泄漏说的是堆那边的仓库被慢慢塞满。',rel:['stacktrace','memleak','gc','ramageddon','recursion'],al:['stack and heap','栈内存','堆内存','内存分区'],one:'栈是快而小的便签区，堆是大而慢的仓库',cf:'「栈溢出」是便签区贴爆（多是递归失控），不是仓库满——仓库满那叫内存泄漏。',dlg:[{q:'栈和堆谁快？',a:'栈快——撕便签当然比去仓库存取快，所以临时小数据都放栈上。'},{q:'我用 JS 需要管这个吗？',a:'基本不用，JS 帮你分好了；但看懂 stack overflow 报错还是用得上。'}],quiz:{q:'递归太深报 stack overflow，爆的是？',o:['堆空间','栈空间','硬盘','显存'],a:1,why:'每层调用都往栈里压一帧，太深就溢出，跟堆无关。'}},
{id:'bigo',term:'时间复杂度',full:'Big O Notation',cn:'时间复杂度 Big O',zone:'code',lv:2,tl:'<b>Big O</b> 描述数据翻倍时程序耗时怎么涨：O(1) 不变、O(log n) 涨一点、O(n) 跟着翻倍、O(n²) 直接翻四倍。它不测秒数，只看增长趋势，是算法快慢的通用标尺。',ana:'在一堆没排序的照片里找一张 = O(n)，得一张张翻；照片按日期排好再二分找 = O(log n)，翻一页排除一半。',scn:'公众号聊「这算法数据一大就扛不住」，说的就是 Big O 等级高；让 Codex 优化脚本，它常把 O(n²) 改成 O(n log n)。',rel:['prog','infer','flops','gpu','codesmell'],al:['big o notation','大 O 表示法','时间复杂度','复杂度分析'],one:'数据翻倍耗时怎么涨——算法快慢的标尺',cf:'别当成「运行秒数」——它不算时间，只看数据变大时耗时的增长形状。',dlg:[{q:'O(n²) 一定比 O(n) 慢吗？',a:'数据小的时候不一定；但数据一大 n² 碾压式变慢，所以看量级。'},{q:'为什么 Codex 老提这个？',a:'它在判断脚本是「能跑」还是「数据一多就卡死」。'}],quiz:{q:'数据翻倍，O(n²) 的耗时大约变？',o:['不变','翻一倍','翻两倍多（4 倍）','归零'],a:2,why:'n² 在 n 翻倍时变 4n²，平方级暴涨。'}},
{id:'typesys',term:'类型系统',full:'Type System',cn:'类型系统',zone:'code',lv:2,tl:'<b>类型系统</b>给每个变量贴标签：只能装文字、数字还是别的。贴了标签（TypeScript、Java）早出错早暴露；不贴（JS、Python）灵活，但错误拖到运行才炸。',ana:'挂钩子上写死「只挂外套」「只挂裤子」，拿错衣服进不了门；全不标，啥都能挂，塞错了用到那天才发现。',scn:'Codex 默认给 TS 代码加 : string、: number，就是类型标注——等于提前把「塞错东西」在写的时候就拦下。',rel:['js','compile','lint','json','codeReview'],al:['type system','强类型','弱类型','类型标注'],one:'给变量贴「只能装啥」的标签，塞错早拦下',cf:'别觉得「类型报错」是坏消息——它是在运行前替你挡 bug，不是找茬。',dlg:[{q:'JS 没类型不是更省事？',a:'小脚本省事；项目一大没类型等于埋雷，所以大项目都上 TypeScript。'},{q:'any 是啥？',a:'「啥都行」的免检标签——等于没贴，尽量少用。'}],quiz:{q:'类型系统最大的好处是？',o:['代码跑得更快','写起来更短','把塞错类型的错误提前到编译期暴露','自动修 bug'],a:2,why:'本质是把运行时的炸点提前拦截，快慢只是附带。'}},
{id:'null',term:'空值',full:'Null',cn:'空值 Null',zone:'code',lv:1,tl:'<b>Null</b> 表示「这里故意空着，啥也没有」。危险不在空，在你以为它有货：.xxx 一下就报 Cannot read property of null。发明者（图灵奖得主）自嘲这是「十亿美金错误」。',ana:'快递柜里有个格子标着「空」——这没问题；问题是你不看就伸手去取，抓个空还摔一跤。',scn:'用 AI 写代码最常见的报错之一就是 null 相关——TypeError: Cannot read properties of null；让它修，一般会加一句「先判空再用」。',rel:['bug','js','debug','script','typesys'],al:['null','空值','空指针','null pointer'],one:'故意为空；误用就炸，十亿美金错误',cf:'null 是「故意空」，undefined 是「压根没赋值」——语义不同，用错都炸。',dlg:[{q:'为什么不消灭 null？',a:'很多语言在消灭（可选类型），但老代码和历史包袱让它还到处都是。'},{q:'怎么防？',a:'用之前先问一句「它是不是空的」——判空，或者用可选链 ?.。'}],quiz:{q:'「十亿美金错误」指？',o:['null 被误用引发的海量 bug','服务器宕机','密码泄露','硬盘损坏'],a:0,why:'null 发明者自嘲：空值引用带来的 bug 修复成本累计数十亿美金。'}},
{id:'escape',term:'转义字符',full:'Escape Character',cn:'转义字符',zone:'code',lv:1,tl:'<b>转义字符</b>给特殊字符发通行证：加个反斜杠 \\，引号、换行这些「有特殊身份」的字符就能老实当普通字用。没有它，字符串里的引号会和代码的引号打架。',ana:'开会说到「暂停」本该打手势，但你嘴里就想说「暂停」俩字——加个引号告诉别人：这是台词不是动作。转义符就是那个引号。',scn:'让 Codex 生成带引号的 JSON 时看到 \\"，或 \\n 表示换行——都是转义。还有个经典坑：Git Bash 会吃掉正则里的 \\1，就是转义在中间作怪。',rel:['json','regex','unicode','uistring','utf8'],al:['escape character','转义','反斜杠转义','escape'],one:'用反斜杠给特殊字符开绿灯，免得代码打架',cf:'别和「加密」混——转义不藏内容，只是声明「这是字面意思，别当语法」。',dlg:[{q:'\\n 和回车是一回事吗？',a:'源码里写 \\n 是转义写法，程序读进来才变成真换行。'},{q:'为啥 JSON 里引号要加 \\？',a:'不加的话字符串提前断了，解析直接报错。'}],quiz:{q:'字符串里想显示双引号，正确做法？',o:['连写两个双引号','反斜杠加引号','换成中文引号','删掉引号'],a:1,why:'\\" 把引号从「结束符」转成「普通字符」。'}},
{id:'naming',term:'命名规范',full:'Naming Convention',cn:'命名规范',zone:'code',lv:1,tl:'<b>命名规范</b>是给变量、文件起名的约定：驼峰 camelCase（首词小写后词大写）、蛇形 snake_case（下划线连）、短横线 kebab-case（横线连）。哪种不重要，全队统一才重要。',ana:'家里谁买菜谁洗碗不重要，重要的是说好了别乱——今天你管明天他挑，就乱套了。命名同理。',scn:'Codex 生成的 JS 变量全是驼峰（getUserInfo），Python 脚本全是蛇形（get_user_info）——不是随意，是两种语言各自的社区约定。',rel:['codesmell','lint','format','codeReview','js'],al:['naming convention','驼峰命名','蛇形命名','命名约定'],one:'驼峰蛇形各有规矩，统一比选哪种重要',cf:'别纠结哪种「最正统」——Python 用蛇形、JS 用驼峰，跟语言走就行。',dlg:[{q:'为什么 Obsidian 文件名推荐短横线？',a:'短横线在 URL 和各种系统里最不容易出幺蛾子，空格会被转成 %20。'},{q:'起名水平重要吗？',a:'非常重要——三个月后你自己也要看得懂 getD1 和 getDataV1 的区别。'}],quiz:{q:'getUserInfo 属于哪种命名？',o:['蛇形 snake_case','驼峰 camelCase','短横线 kebab-case','全大写'],a:1,why:'首词小写、后词首字母大写连写 = 小驼峰。'}},
{id:'module',term:'模块化',full:'Module',cn:'模块',zone:'code',lv:2,tl:'<b>模块</b>是把代码拆成一块块积木：每个文件管一件事，用 import 引进来拼。改一处不用动全文件，也避免几千行代码糊成一团。',ana:'乐高整栋房子拆成一块块零件：坏一块换一块，不用重买整套；搬家还能只带需要的。',scn:'单文件查词工具 HTML 是「故意不拆」——为了单文件部署；但 Codex 写大项目时会建议拆成 modules，每个文件职责单一。',rel:['component','pkg','package2','js','feframework'],al:['module','模块化','import export','代码分块'],one:'代码拆成积木块，按需引入按块修',cf:'别和「组件 component」混——组件偏界面上的可复用块，模块是更广义的代码分块。',dlg:[{q:'单文件塞几十万字符不怕乱吗？',a:'这是部署取舍；工程上更常见的是拆模块，各有各的理由。'},{q:'module 和 script 有啥区别？',a:'script 是一段能跑的代码；module 是被设计来「被别人引入复用」的代码块。'}],quiz:{q:'模块化最直接的收益是？',o:['运行速度快几倍','改一处不用动全局，代码可复用','省服务器费用','自动消灭 bug'],a:1,why:'核心是职责分离与复用，性能不是主要卖点。'}},
{id:'eventloop',term:'事件循环',full:'Event Loop',cn:'事件循环',zone:'code',lv:2,tl:'<b>事件循环</b>是 JS 这门「单线程」语言的调度员：所有活排队，耗时的（网络、定时器）先挂起不堵路，等结果回来再插到空闲时执行。所以一根线程也显得「同时」干很多事。',ana:'一个前台服务员：点单先记下（挂起），菜好了一桌喊一声，他再端过去——虽然只有一个人，谁也不堵着谁。',scn:'看到「CLI 一边流式输出还能一边响应 Esc 打断」这类流畅感，背后都是事件循环在调度——输出流挂着，按键事件随时插队处理。',rel:['async','callback','promise','polling','concurrency'],al:['event loop','事件循环机制','消息循环','eventloop'],one:'单线程的排队调度员，耗时活挂起不堵路',cf:'别以为「异步 = 多线程」——JS 主线程就一个，靠事件循环排队才显得能同时干活。',dlg:[{q:'setTimeout(fn,0) 为啥不是立刻执行？',a:'得等当前这轮队列清空才轮到它——0 毫秒只是「尽快插队」。'},{q:'事件循环卡住会怎样？',a:'整个页面卡死——所有回调都排不上了，这是「卡顿」的来源之一。'}],quiz:{q:'JS 单线程却能「同时」处理多件事，靠的是？',o:['开多个主线程','事件循环把耗时任务挂起排队','拒绝部分任务','网速快'],a:1,why:'挂起+回调排队，主线程永远只干一件。'}},
{id:'threadproc',term:'线程与进程',full:'Thread & Process',cn:'线程与进程',zone:'code',lv:2,tl:'<b>进程</b>是一个正在运行的程序（一间车间），<b>线程</b>是车间里的工人（多条工位）。车间之间互相隔离，工人共享车间资源——一个线程卡住不至于拖死整个程序。',ana:'进程 = 一间独立车间（墙隔开，一家炸了别家照常）；线程 = 车间里多个工位，共享工具台。',scn:'Chrome 开几十个进程（每个标签页一个）就是故意的——一个页面崩了，其他标签页还活着。终端跑着 Claude Code 你还能刷网页，也是进程隔离。',rel:['concurrency','daemon','loadbalance','eventloop','terminal'],al:['thread and process','进程线程','多线程','进程隔离'],one:'进程是车间，线程是车间里的工人',cf:'别混「多线程」和「多进程」——线程共享内存快但会打架（竞态），进程隔离稳但重。',dlg:[{q:'为什么开 50 个网页电脑不卡成狗？',a:'浏览器把标签页拆成多进程，崩一个杀一个，互不传染。'},{q:'线程越多越好吗？',a:'不是——切换有成本，争抢资源还会死锁，够用就好。'}],quiz:{q:'一个进程崩溃，另一个进程会？',o:['一起崩','通常不受影响（进程间隔离）','自动接管','变慢'],a:1,why:'进程内存隔离，互不牵连——这正是浏览器多进程的意义。'}},
{id:'deadlock',term:'死锁',full:'Deadlock',cn:'死锁',zone:'code',lv:3,tl:'<b>死锁</b>是两个任务各拿着对方要的钥匙，都在等对方先松手，于是永远僵住。数据库、多线程抢锁的场景最常见：程序不报错、就是不动——最难查的 bug 之一。',ana:'窄巷里两辆车顶牛：你退我才过得去，我退你才过得去——谁也不退，全巷堵死。',scn:'两个终端各跑一个脚本都要改同一张数据库表，一个锁着表等另一个放锁——命令行一动不动像死机，其实是在互相等。',rel:['concurrency','racecond','dbtransaction','threadproc','timeout'],al:['deadlock','死锁','互相等待','互锁'],one:'两把锁互相等，谁也不松手，全卡死',cf:'别和「卡死 hang」混——hang 是单方面忙或等，死锁是两方以上互相等，谁也不忙。',dlg:[{q:'死锁了程序会报错吗？',a:'多数不会，就是永远不动——这也是它难查的原因。'},{q:'怎么防？',a:'让大家按同一顺序拿锁，或一次性全拿到，别你拿一个我拿一个。'}],quiz:{q:'死锁的核心特征是？',o:['程序报错退出','两方以上互相等待资源，僵持不动','运行速度变慢','内存持续上涨'],a:1,why:'死锁 = 循环等待，谁都不放谁也动不了。'},shot:'deadlock'},
{id:'racecond',term:'竞态条件',full:'Race Condition',cn:'竞态条件',zone:'code',lv:3,tl:'<b>竞态条件</b>是两个任务同时读写同一份数据，结果取决于谁先谁后——谁后写谁算。代码单跑都对，一起跑就抽风，时好时坏，是出了名的「偶现 bug」制造者。',ana:'两个人同时编辑同一份在线文档：你删了一段我正要改——最后留谁的全看谁手快，谁也说不清对错。',scn:'让两个 Codex 窗口同时改同一个 HTML 文件，后保存的把先保存的覆盖掉——最体感的竞态，所以工程规矩里都有「同一文件禁止并行编辑」。',rel:['concurrency','idem','deadlock','threadproc','git'],al:['race condition','竞态','竞争条件','时序问题'],one:'同时改一份数据，谁后写谁算，时好时坏',cf:'别和「死锁」混——死锁是不动，竞态是乱动；一个僵死，一个偶现抽风。',dlg:[{q:'为什么竞态 bug 特别难抓？',a:'它跟时机走——你加句日志它就复现不了，删了日志又出现。'},{q:'怎么防？',a:'上锁（同一时间只许一个改），或把操作设计成重复执行也无害（幂等）。'}],quiz:{q:'竞态条件的后果往往是？',o:['每次都稳定报错','偶现、难复现的诡异结果','程序直接崩溃退出','网速变慢'],a:1,why:'结果依赖时序，所以时好时坏，极难复现。'}},
{id:'memleak',term:'内存泄漏',full:'Memory Leak',cn:'内存泄漏',zone:'code',lv:2,tl:'<b>内存泄漏</b>是程序借了内存不还：用完的对象还挂在内存里，越积越多，程序越跑越卡，最后崩掉。长跑的服务（几天不重启那种）最怕它。',ana:'图书馆借书不还：一个人两本没事，天天有人借了不还，书库早晚空——不是书没了，是全压在私人手里。',scn:'浏览器开几天不关越来越卡，多半是某个页面在泄漏内存；「重启一下就好了」之所以有效，就是重启把泄漏的内存全清了。',rel:['gc','ramageddon','cache','stackheap','threadproc'],al:['memory leak','内存泄露','内存占用上涨','leak'],one:'借内存不还，越积越卡直到崩',cf:'别和「吃内存」混——吃内存是暂时用得多会还，泄漏是根本不还。',dlg:[{q:'JS 有垃圾回收还会泄漏吗？',a:'会——只要还有引用挂着（忘了清定时器、闭包攥着不放），GC 就不敢回收。'},{q:'怎么发现？',a:'看内存曲线只涨不跌，重启归零再涨——基本就是它。'}],quiz:{q:'内存泄漏的典型症状？',o:['启动就报错','越跑越卡、内存只涨不降','编译失败','网页打不开'],a:1,why:'只借不还，占用单调上涨，重启（清零）暂时缓解。'}},
{id:'gc',term:'垃圾回收',full:'Garbage Collection',cn:'垃圾回收 GC',zone:'code',lv:2,tl:'<b>垃圾回收（GC）</b>是语言的自动清洁工：定期扫内存，把没人引用的对象收走腾地方。JS、Python 都有，所以你不用手动还内存——代价是偶尔会「停一下」打扫。',ana:'餐厅有专职收台员：盘子空了（没人用了）就收走。你不用自己洗碗，但他收台时那桌得先让一让。',scn:'Obsidian 开久了掉帧、浏览器标签页多时一顿一顿，很多时候是 GC 在后台大扫除——「自动收拾」的代价就是偶尔停顿。',rel:['memleak','stackheap','ramageddon','js','runtime'],al:['garbage collection','GC','自动内存管理','垃圾收集'],one:'自动收走没人用的内存，代价是偶尔停顿',cf:'别以为有 GC 就不会内存泄漏——引用还挂着的东西，GC 不敢动。',dlg:[{q:'C 语言为什么没有 GC？',a:'它让你手动分配手动还——快，但忘了还就泄漏，还错就崩。'},{q:'GC 会误删我还要用的东西吗？',a:'不会——判定标准是「还有没有人引用」，你攥着引用它就不收。'}],quiz:{q:'垃圾回收回收的对象是？',o:['所有变量','没有任何引用指向的内存','坏掉的硬盘','旧版本文件'],a:1,why:'「无人引用」是核心判据——还有人指着的它不敢收。'}},
{id:'unittest',term:'单元测试',full:'Unit Test',cn:'单元测试',zone:'code',lv:2,tl:'<b>单元测试</b>给每个零件单独验货：写一段小代码自动调用函数、检查输出对不对。改代码后跑一遍，坏了立刻知道——是「改完不心虚」的底气来源。',ana:'出厂前每个零件单独过检，别等整车装完才发现轮子是方的。',scn:'给项目写的上线体检脚本就是这思路——不检查 AI 自己说了什么，而是跑一遍、逐项验收、不过不许部署。AI 写代码时代它更重要：写得快错得也快。',rel:['smoke','regress','swebench','ci3','mock'],al:['unit test','单测','单元测试用例','UT'],one:'每个零件自动验一遍货，改完不心虚',cf:'别和「冒烟测试 smoke」混——单测查零件细节，冒烟只查「能不能点开、主流程通不通」。',dlg:[{q:'小工具也值得写单测吗？',a:'核心逻辑值得；一次性的脚本别浪费——测的是「以后还要改的东西」。'},{q:'AI 写代码还需要测试吗？',a:'更需要——AI 写得快错得也快，测试是唯一不靠「看着没问题」的验收。'}],quiz:{q:'单元测试的「单元」指？',o:['整个网站','一个函数/一个最小可测部件','一行代码','一台服务器'],a:1,why:'粒度是最小可测单元——函数级，目标是一改就能定位坏哪。'}},
{id:'mock',term:'模拟替身',full:'Mock',cn:'模拟替身 Mock',zone:'code',lv:2,tl:'<b>Mock</b> 是测试用的替身演员：真数据库、真接口又慢又难伺候，测试时就用一个假的顶上，按剧本返回固定结果。测的是你的逻辑，不是别人的服务。',ana:'拍戏不用真炸楼——放个模型道具按剧本「炸」。观众（测试）要的是剧情走得通，不是真爆炸。',scn:'Codex 给代码写测试时常带一句 mock 数据库/网络请求——不然每跑一次测试就得真连一次网，慢还时不时挂。',rel:['unittest','sandbox','swebench','ci3','api'],al:['mock','测试替身','假数据','test double'],one:'用替身顶住真服务，测试只跑自己的逻辑',cf:'别担心「mock 了是不是白测」——单测只负责你的逻辑；真服务靠联调和冒烟另测。',dlg:[{q:'mock 数据和真实不一样咋办？',a:'所以还要集成测试兜底——mock 管快，真环境管真。'},{q:'什么时候别用 mock？',a:'涉及付钱、删库这类关键路径，必须用真环境演练。'}],quiz:{q:'用 mock 的主要动机是？',o:['让测试更快更稳定，不依赖外部服务','替代所有真实测试','美化测试报告','省服务器钱'],a:0,why:'快、稳、不连网——单测的核心诉求。'}},
{id:'stacktrace',term:'调用栈',full:'Stack Trace',cn:'调用栈 Stack Trace',zone:'code',lv:2,tl:'<b>调用栈（Stack Trace）</b>是报错时打印的一串「案发路径」：最顶上一行是出错点，往下每行是「是谁调进来的」。照着读，错误怎么一步步发生一目了然。',ana:'像电梯监控倒放：从「3 楼开门夹住人」（出错点）回放，看是几楼按的梯、谁先进来的——一步步还原路径。',scn:'贴报错给 Claude/Codex 时，那一长串 at xxx (file:line) 就是调用栈——AI 先看最顶上的出错行，再顺着往下找调用链，所以报错要整段贴，别只贴最后一句。',rel:['debug','bug','stackheap','recursion','log'],al:['stack trace','堆栈跟踪','调用栈','报错堆栈'],one:'报错自带的案发路径，出错点在最顶上',cf:'别只看最后一行——最后常是笼统总结；最顶上一行才写着具体哪行代码出了什么事。',dlg:[{q:'那么长一行行都要看吗？',a:'先顶（出错点）后底（入口）；中间是自己代码就重点看，库文件一般跳过。'},{q:'为啥报错要整段贴给 AI？',a:'调用栈就是破案线索链，掐头去尾 AI 只能猜。'}],quiz:{q:'Stack Trace 顶部的第一行通常是？',o:['程序入口 main','出错的那个具体位置','电脑配置','网络地址'],a:1,why:'顶部 = 最内层 = 出错点，往下回溯调用链。'},shot:'stacktrace'},
{id:'artifact',term:'构建产物',full:'Artifact',cn:'构建产物',zone:'code',lv:2,tl:'<b>构建产物（Artifact）</b>是源代码「烤」出来的成品：源码是配方，产物是面包——部署上线、发给别人用的，永远是产物，不是配方本身。',ana:'菜谱 vs 端上桌的菜：请客上菜（部署），不会把菜谱（源码）递过去。',scn:'单文件工具改完要同步发布副本，就是防「配方改了面包没重烤」——所以体检脚本专门查一项「副本与真源一致」。',rel:['build','deploy','repo','codebase','compile'],al:['artifact','构建产物','打包产物','build output'],one:'源码烤出的成品，部署上线用的就是它',cf:'别把「源码改了」当「上线了」——没重新构建同步产物，用户看到的还是旧的。',dlg:[{q:'为什么产物一般不进 git？',a:'能从源码重新生成的不存档，只存配方——但单文件部署的项目故意连产物一起同步，是取舍。'},{q:'缓存里的旧产物怎么破？',a:'文件名加版本号/哈希，或强刷——GitHub Pages 的 10 分钟缓存就是这类坑。'}],quiz:{q:'「源码改了但线上没变」最可能是因为？',o:['用户网速慢','构建产物没重新生成/同步','代码写错了','硬盘满了'],a:1,why:'改的是配方，端上桌的还是旧面包——构建同步这一步漏了。'}},
{id:'codesmell',term:'代码异味',full:'Code Smell',cn:'代码异味',zone:'code',lv:2,tl:'<b>代码异味（Code Smell）</b>是「不出错但闻着不对」的坏味道：函数几百行、复制粘贴改五处、变量名叫 a1 a2 a3。它不是 bug，但说明这里迟早要出事。',ana:'屋里没着火，但有一股焦糊味——现在没事，不代表十分钟后再没事。闻到味就得找源头。',scn:'让 Claude Code「review 一下这段代码」，它挑出「这个函数太长了」「这里重复了三处」——挑的就是 code smell：还没炸，先拆弹。',rel:['codeReview','refactor2','lint','naming','bug'],al:['code smell','坏味道','代码坏味道','code smells'],one:'不出错但闻着不对，迟早要出事的信号',cf:'异味 ≠ bug——bug 是现在就坏，异味是「还能跑，但维护成本在暗涨」。',dlg:[{q:'有味道就一定要改吗？',a:'一次性脚本别洁癖；还要活三年的代码才值得还债。'},{q:'AI 能闻出来吗？',a:'很会——让 AI review、跑 lint，就是自动化「闻味」。'}],quiz:{q:'代码异味的性质是？',o:['运行时报错','能跑但有隐患的坏味道信号','病毒代码','格式不对齐'],a:1,why:'它不是错误，是维护性恶化的预警。'}},
{id:'monorepo',term:'单仓多包',full:'Monorepo',cn:'单仓多包 Monorepo',zone:'code',lv:2,tl:'<b>Monorepo</b> 是把多个项目放同一个仓库统一管理：工具链共用、改动一次提交、版本一起发。VS Code、Babel 都这么管——代价是仓库大、工具复杂。',ana:'独栋别墅（多仓库）vs 大平层（monorepo）：一家人住一起，水电共用、喊一声就到；代价是规矩得立好，不然互相打扰。',scn:'看到「turborepo」「pnpm workspace」这些词，都是 monorepo 工具——多见于一个团队同时养好几个互相依赖的项目。',rel:['repo','package2','dependency2','codebase','vcs'],al:['monorepo','单仓多包','大仓库','mono repo'],one:'多个项目住一个仓库，共用工具统一发版',cf:'别当成「把啥都塞一个文件夹」——monorepo 有配套工具管理依赖和构建，不是物理堆放。',dlg:[{q:'一个人写小工具需要吗？',a:'不需要——单仓库就够；monorepo 是给「多项目互相依赖」准备的。'},{q:'和 submodule 一样吗？',a:'不是——submodule 是多个仓库拼一起，monorepo 是本来就一个仓库。'}],quiz:{q:'monorepo 的典型适用场景？',o:['只有一个项目','多个互相依赖的项目统一管理','手机相册备份','网页收藏夹'],a:1,why:'核心价值在跨项目的原子改动和共享工具链。'}},
{id:'rebase',term:'变基',full:'Rebase',cn:'变基 Rebase',zone:'code',lv:2,tl:'<b>Rebase</b> 把你的提交「搬家」到目标分支的最新起点上重放，历史变成一条直线；merge 则是两股汇合再打个结。两者都能合并，历史长相不同。',ana:'接水流：merge 是两根管子接一起加个三通（看得出哪来的）；rebase 是把你这段水管拆下来接到主管最前端（看起来像一根管）。',scn:'Codex 或协作者说「rebase 到 main 上再提交」，意思是：先把别人最新成果拿过来，把你的改动「重放」在它上面——避免历史里一堆交叉分叉线。',rel:['git','merge','commit','branch','vcs'],al:['rebase','变基','git rebase','重放提交'],one:'把提交搬到新起点重放，历史变直线',cf:'别和 merge 随意混用——公共分支上的提交被 rebase 重写后，队友拉代码会撞车（改公共历史是大忌）。',dlg:[{q:'rebase 会丢代码吗？',a:'正常不会，但「冲突」要逐个解决——重放时每步都可能撞。'},{q:'什么时候用 merge 更稳？',a:'多人共用的分支：merge 不改写历史，最安全。'}],quiz:{q:'rebase 后的历史长什么样？',o:['分叉又合并的网','一条直线','空白','随机树状'],a:1,why:'重放到新起点上，提交像没分叉过一样线性。'}},
{id:'hotfix',term:'热修复',full:'Hotfix',cn:'热修复',zone:'code',lv:2,tl:'<b>Hotfix</b> 是线上着火时的插队通道：不等下个版本，从生产分支拉出来、只装这一根绷带、立刻发布。特点是快和小——只修这一个 bug，别的全不带。',ana:'手术台上病人突然大出血——没空走完整体检流程，止血优先：直接压住那个点，其他检查以后补。',scn:'更新日志里「修复线上 XX 问题（hotfix）」就是这类不等版本的紧急补丁——规矩是：绷带只裹一处，别顺手夹带私货。',rel:['deploy','grayrelease','rollback','ci','git'],al:['hotfix','热修复','紧急修复','补丁'],one:'线上着火插队发布，只装这一根绷带',cf:'别拿 hotfix 当日常——它绕过正常流程，频繁用说明流程本身有问题。',dlg:[{q:'hotfix 要走测试吗？',a:'走，但走快道——只测和本 bug 相关的部分，主流程冒烟必须过。'},{q:'修完之后呢？',a:'得把修复同步回开发分支，不然下个版本一发布，bug 又回来了。'}],quiz:{q:'hotfix 的核心纪律是？',o:['顺手把其他小问题也修了','只改这一个 bug，改动最小化','彻底重写出问题的模块','跳过所有测试'],a:1,why:'插队通道里夹带私货 = 制造新事故。'}},
{id:'symlink',term:'软链接',full:'Symlink',cn:'软链接 Symlink',zone:'code',lv:2,tl:'<b>软链接（Symlink）</b>是文件系统的「快捷方式」：一个指着真身的小路标。访问路标 = 访问真身；真身删了，路标就成了断头的。',ana:'酒店门牌写着「总统房在 1808」——按门牌找过去就行；1808 拆了，门牌还在，只是指了个寂寞。',scn:'Obsidian 用户把笔记放 iCloud/坚果云、再用软链接把库「挂」进别处，就是这玩法；Windows 建软链接用 mklink 命令。',rel:['path','obsidian','clouddisk','script','configfile'],al:['symlink','软链接','符号链接','symbolic link'],one:'文件的快捷方式，指向真身的路标',cf:'别和「复制」混——复制是又一间房，链接还是同一间房的路标；改路标处的文件，真身也变。',dlg:[{q:'软链接和硬链接差在哪？',a:'软链接指路径（真身删了就断），硬链接直接指数据（删一个还有另一个）。'},{q:'挂网盘可靠吗？',a:'网盘对软链接支持参差，容易只同步路标不同步真身——先小规模试。'}],quiz:{q:'删掉软链接指向的原文件，软链接会？',o:['一起消失','还在但失效（指向空）','自动复制一份原文件','报错删不掉'],a:1,why:'路标还在，路没了——「断链」就是这么来的。'}},
{id:'exitcode',term:'退出码',full:'Exit Code',cn:'退出码',zone:'code',lv:2,tl:'<b>退出码（Exit Code）</b>是每条命令结束时留下的成绩单：0 = 一切正常，非 0 = 出事了（不同数字代表不同死法）。脚本和流水线全靠它判断下一步走不走。',ana:'快递签收码：签了是 0，拒收、丢件、地址错各有各的号码——系统看码办事，不看你喊多大声。',scn:'上线体检脚本退出码非 0 就禁止部署——这正是退出码当门禁的标准用法；git、npm、python 所有命令行工具都在用这套暗号。',rel:['terminal','cli','script','ci3','cliflags'],al:['exit code','退出码','返回码','return code'],one:'0 是成功非 0 是失败，命令行的成绩单',cf:'别只看「命令没报错」——界面安静不代表成功，看退出码才作数（echo $? 可查）。',dlg:[{q:'为什么 0 是成功不是 1？',a:'历史约定——0 表示「无异常」，非 0 的每个数字还能细分错误类型。'},{q:'我写的脚本怎么设？',a:'正常跑完 exit 0，检查失败 exit 1——自动化才好接你的脚本。'}],quiz:{q:'退出码 0 表示？',o:['程序运行了 0 秒','执行成功无异常','有 0 个警告','第 0 步'],a:1,why:'约定俗成：0 = 无异常；非 0 各表一种失败。'}},
{id:'lazyload',term:'懒加载',full:'Lazy Loading',cn:'懒加载',zone:'code',lv:1,tl:'<b>懒加载</b>是「用到才给」：图片滚到眼前才开始下载，没看到的不下载。首屏快、流量省——代价是滚动时要现加载，处理不好会闪一下。',ana:'自助餐不是一次端全部菜，吃完一盘再上——桌上永远不挤，后厨也不慌。',scn:'一个带 88 张图的查词页如果一次全加载，手机打开得卡好几秒——懒加载让首屏秒开，翻到哪张加载哪张。',rel:['component','responsive','cdn','cache','spa'],al:['lazy loading','懒加载','延迟加载','按需加载'],one:'滚到眼前才加载，首屏快流量省',cf:'别和「缓存 cache」混——缓存是「拿过的留着别再要」，懒加载是「没要过的先别要」。',dlg:[{q:'懒加载影响 SEO 吗？',a:'处理好就没影响，处理不好搜索引擎抓不到内容——大站都踩熟了。'},{q:'图片会不会加载不出来？',a:'给占位图+加载失败重试，体验就顺；图卡片底色占位就是这个套路。'}],quiz:{q:'懒加载主要优化的是？',o:['服务器硬盘寿命','首屏速度与流量','网页颜色','打印效果'],a:0,why:'没看到的先不下载——首屏请求数骤降。'}},
{id:'debounce',term:'防抖与节流',full:'Debounce & Throttle',cn:'防抖与节流',zone:'code',lv:2,tl:'<b>防抖（Debounce）</b>：狂点只认最后一次——停手后过一会儿才真执行；<b>节流（Throttle）</b>：再狂点也按固定频率放行。都是给高频动作踩刹车，省性能。',ana:'防抖像电梯关门：还有人进来就一直重等，人都定了才关门走；节流像地铁发车：再挤也按时刻表，3 分钟一班准点走。',scn:'搜索框每敲一个字就查一次会累死服务——加防抖：停 300 毫秒没新输入才真查。在 Obsidian 连续打字时插件不每键触发，也是这类处理。',rel:['eventloop','polling','js','component','api'],al:['debounce','throttle','防抖','节流'],one:'狂点只算一次，给高频动作踩刹车',cf:'防抖「等停手」（只认最后），节流「掐频率」（定期放行）——一个等结束，一个控节奏。',dlg:[{q:'搜索框用哪个？',a:'防抖——用户停手才查，中间的都作废。'},{q:'滚动监听用哪个？',a:'节流——滚动不能「停手才处理」，得保证固定频率响应。'}],quiz:{q:'防抖（debounce）的触发时机是？',o:['每次点击立刻执行','停止触发后等待一段时间才执行','固定每秒一次','页面关闭时'],a:1,why:'核心 = 重置计时器，停下来了才真执行。'},shot:'debounce'},
{id:'session',term:'会话',full:'Session',cn:'会话 Session',zone:'code',lv:1,tl:'<b>会话（Session）</b>是服务器记住「你登录过」的那段状态：登录后发你一张临时凭证，一段时间内不用重复输密码。过期或登出，凭证作废重开。',ana:'游乐园手环：买票（登录）后戴上，一天内随便刷项目（请求）；离园（登出）或过夜（过期），明天重新买票。',scn:'在 Claude Code 里一个对话窗口从头到尾就是一次「会话」——上下文共享；飞书登录一次几天不掉，靠的也是 session/凭证机制。',rel:['cookie','apikey','oauth','sso','twofa'],al:['session','会话','登录态','session 会话'],one:'服务器记住你登录过的那段状态',cf:'别和 handoff 混——session 是「一段登录态」，agent 里的 Session handoff 是「把任务接力给另一个 agent」，不是一回事。',dlg:[{q:'session 和 cookie 啥关系？',a:'常见搭配——状态存服务器，凭证（session id）放 cookie 里随身带。'},{q:'为啥会「登录过期」？',a:'手环有时效——太久不活动自动作废，防别人捡到旧手环冒用。'}],quiz:{q:'session 的核心作用是？',o:['加快网速','让服务器跨请求记住「你是谁」','加密聊天内容','备份聊天记录'],a:2,why:'HTTP 本身健忘，session 补上记忆。'}},
{id:'cors',term:'跨域',full:'CORS',cn:'跨域 CORS',zone:'code',lv:2,tl:'<b>跨域（CORS）</b>是浏览器的安全规矩：网页 A 想直接请求别家的服务器 B，B 不点头就拦下。报错「blocked by CORS policy」不是代码写错，是对方没开白名单。',ana:'小区门禁：你是 A 栋住户，想进 B 栋——物业（浏览器）拦下问询，B 栋物业（服务器）说不认识就不放行。',scn:'让 Codex 写个调第三方 API 的小页面，控制台常报 CORS 错——AI 的解法通常是「加个后端转一手」或让对方服务器加响应头。',rel:['http','api3','api','ssl','spa'],al:['CORS','跨域','跨域资源共享','跨域拦截'],one:'浏览器拦下「别家服务器」的请求，安全规矩',cf:'别当成 bug——CORS 是浏览器故意拦的；curl 能通、浏览器不通就是它的签名。',dlg:[{q:'为啥 curl 能通浏览器不行？',a:'curl 没有同源策略；拦人的是浏览器不是服务器。'},{q:'怎么解决？',a:'让对方开响应头，或自己加个后端转发——前端绕不过去，这是设计如此。'}],quiz:{q:'报 blocked by CORS policy 说明？',o:['代码语法错了','浏览器按规矩拦下了跨域请求','网速太慢','密码错误'],a:0,why:'CORS 是浏览器的安全拦截，不是代码错误。'}},
{id:'nosql',term:'非关系数据库',full:'NoSQL',cn:'非关系数据库 NoSQL',zone:'code',lv:2,tl:'<b>NoSQL</b> 是「不拘表格」的数据库：文档型（像 JSON 一份份存）、键值型（像超大字典）、图数据库等。不强行先定表结构，灵活好扩展；对面的 sql 则严谨成表。',ana:'Excel 表格（sql）每列先定死；NoSQL 像一筐档案袋——每份想装啥装啥，找起来各有各的索引。',scn:'公众号聊「MongoDB」「Redis」，就是最常见的两种 NoSQL：MongoDB 存文档、Redis 做高速缓存键值对。',rel:['sql','db','dbindex','dbtransaction','cloud'],al:['NoSQL','非关系数据库','文档数据库','not only sql'],one:'不拘表格的数据库，灵活好扩展',cf:'别以为 NoSQL 是「取代 sql」——数据关系复杂、要强一致的场景，sql 依然更稳。',dlg:[{q:'该选哪个？',a:'结构老变、量大先用 NoSQL；账务、订单这类要精确对账的用 sql。'},{q:'Redis 也是数据库吗？',a:'是——键值型 NoSQL，但更多拿来当高速缓存用。'}],quiz:{q:'NoSQL 的典型特点？',o:['必须先定死表结构','不拘表格、结构灵活','只能存文字','永远比 sql 慢'],a:1,why:'灵活的存储结构是最大卖点。'}},
{id:'migration',term:'数据迁移',full:'Migration',cn:'数据迁移 Migration',zone:'code',lv:2,tl:'<b>数据迁移（Migration）</b>是表结构的「升级脚本」：加字段、改表名不直接动手，而是写一份带版本号的变更记录，谁的环境跑一遍谁就升级到最新——可追溯、可回滚。',ana:'装修不改墙，而是按图纸版本一份份改：3 号图加个门，4 号图拆面墙——新房旧房照同一套图单，最后长得一样。',scn:'Codex 改数据库相关代码时会建议「写个 migration」而不是让你手动改表——就是为了别的环境（同事电脑、服务器）能一键对齐。',rel:['sql','db','dbtransaction','rollback','backup'],al:['migration','数据迁移','迁移脚本','数据库迁移'],one:'表结构升级走版本脚本，可追溯可回滚',cf:'别和「搬数据」混——migration 常指「结构变更脚本」；数据搬家是另一件事（也常一起做）。',dlg:[{q:'为什么不直接改表？',a:'手改只有一台机知道；migration 有版本记录，所有环境都能对齐。'},{q:'能撤销吗？',a:'好的迁移都带 down（回滚脚本）——这就是为什么坚持写迁移而不是手改。'}],quiz:{q:'migration 的核心价值？',o:['让数据库更快','自动备份数据','结构变更可版本化、环境可对齐','防止删库'],a:2,why:'版本化的结构变更，所有环境可重放对齐。'}},
{id:'pubsub',term:'发布订阅',full:'Pub/Sub',cn:'发布订阅 Pub/Sub',zone:'code',lv:2,tl:'<b>发布订阅（Pub/Sub）</b>是广播台模式：发消息的人只管往「频道」里喊，不关心谁在听；想听的人订阅频道，来了就收。发的人和收的人完全解耦。',ana:'微信群：群主发通知不用挨个私聊，进群的人自动收到——发的不用认识收的。',scn:'看技术文聊「消息队列解耦」，pub/sub 就是常用姿势——下单服务喊一嗓子「订单 1001 付款了」，库存、积分、通知各自订阅各自处理。',rel:['msgqueue','webhook','automation','api','eventloop'],al:['pub sub','发布订阅','发布订阅模式','观察者模式'],one:'发的人只管喊，听的人订阅频道收',cf:'别和「消息队列 msgqueue」混——队列是「一条消息一个人消费」，订阅是「广播，订阅者人手一份」。',dlg:[{q:'没人订阅会怎样？',a:'消息一般就丢了——广播不管回执，要可靠得加持久化。'},{q:'和 webhook 啥关系？',a:'webhook 常是 pub/sub 的「配送方式」——事件发生了，往你登记的地址推一份。'}],quiz:{q:'发布订阅最大的特点是？',o:['消息绝不丢失','速度最快','只能一对一','发和收互相不认识、完全解耦'],a:3,why:'解耦是核心——发布者无需知道谁订阅。'},shot:'pubsub'},
{id:'reverseproxy',term:'反向代理',full:'Reverse Proxy',cn:'反向代理',zone:'code',lv:2,tl:'<b>反向代理</b>是大门口的保安台：所有请求先到它，它再转给后面真正的服务器。外面的人看不见后门有几台机器，保安还能顺便分流、缓存、挡攻击。',ana:'公司前台：找谁都是找前台，前台按事由分派到具体工位——外人永远不知道内部坐了哪些人。',scn:'技术文里的 Nginx 十有八九在干这活——「服务器挂了自动切另一台」「静态文件它直接回了」，都是反向代理的日常。',rel:['loadbalance','cdn','api3','http','ssl'],al:['reverse proxy','反向代理','nginx 代理','网关'],one:'门口保安替后端接客，后端隐身',cf:'别和「正向代理」混——正向代理替「你」出去（翻墙工具）；反向代理替「服务器」接客，方向相反。',dlg:[{q:'和负载均衡啥关系？',a:'分流是反代的技能之一——Nginx 就是最常见的负载均衡器。'},{q:'CDN 也算吗？',a:'算——CDN 是全球分布的反向代理，替源站接客还顺便缓存。'}],quiz:{q:'反向代理隐藏的是？',o:['后端真实服务器','用户的身份','网站内容','DNS 记录'],a:0,why:'外界只见代理，后端结构和台数全部隐身。'}},
{id:'p2p',term:'点对点',full:'P2P',cn:'点对点 P2P',zone:'code',lv:2,tl:'<b>P2P（点对点）</b>是不经过中心服务器、两台机器直接对话：文件互传、BT 下载、区块链都是这个思路——大家既是客户也是服务者，人越多越快。',ana:'中心化 = 食堂打饭都排一个窗口；P2P = 大家互相换菜——每人都既是买方也是卖方，人越多换得越欢。',scn:'看到「去中心化」相关文章，底层十有八九是 P2P——区块链节点互相广播，没有一台「总服务器」说了算。',rel:['blockchain','bandwidth','packet','http','natpierce'],al:['p2p','点对点','peer to peer','去中心化网络'],one:'不走中心服务器，机器之间直接对话',cf:'别和「下载软件」画等号——P2P 是网络架构，BT 只是它的一个应用。',dlg:[{q:'P2P 一定更快吗？',a:'热门资源越多人做种越快；冷门的反而可能没人理。'},{q:'内网两台电脑能 P2P 吗？',a:'能，还常需要「打洞」穿透路由器的限制。'}],quiz:{q:'P2P 网络里每个节点是？',o:['只能下载','既当客户又当服务者','只能上传','中心服务器'],a:1,why:'对等网络，人人既是消费方又是提供方。'}},
{id:'ping',term:'网络探活',full:'Ping',cn:'Ping 探活',zone:'code',lv:1,tl:'<b>Ping</b> 是最基础的网络测试：「对方还在吗？」发个小包等回应，通不通、耗时几毫秒一目了然。网络出问题，老手第一件事就是 ping 一下。',ana:'喊一嗓子「在吗？」——对方回「在」就是通，还顺便知道他答应得多快（延迟）。',scn:'网页打不开先 ping 一下域名：通 = 网络没问题、是网站的事；不通 = 你这边或线路的事——第一步就把问题切成两半。',rel:['terminal','cli','http','ip','endpoint'],al:['ping','探活','网络测试','ping 一下'],one:'喊一声对方在吗，通不通几毫秒见分晓',cf:'ping 得通只代表「机器活着」，不代表网站正常——服务挂了 ping 照样通。',dlg:[{q:'ping 不通就是断网吗？',a:'不一定——对方可能禁 ping 了；换几个目标（网关、知名网站）分别试才能定位。'},{q:'多少毫秒算正常？',a:'国内常见几到几十毫秒；几百毫秒就明显卡了。'}],quiz:{q:'网页打不开，先 ping 域名的价值是？',o:['直接修复网络','提高网速','把问题切成「我这边的」还是「对方那边的」','查看密码'],a:2,why:'探活定位故障边界，是最省时间的第一步。'}},
{id:'codec',term:'编解码器',full:'Codec',cn:'编解码器 Codec',zone:'code',lv:2,tl:'<b>Codec</b> 是音视频的「压缩翻译官」：编码把原始数据压小方便传输存储，解码再还原回来播放。H.264、H.265、MP3 都是它的名字。',ana:'行李打包：编码 = 把衣服抽真空压小好搬运；解码 = 到目的地拆包还原。压得越狠包越小，但拆回来越失真。',scn:'公众号聊「视频为什么清晰又不卡」，背后就是 codec 的取舍——H.265 比 H.264 同画质省一半流量，但解码更吃性能。',rel:['tts','asr2','aimusic','i2v','bandwidth'],al:['codec','编解码器','编解码','coder decoder'],one:'音视频的压缩翻译官，编码压小解码还原',cf:'别和「文件格式」混——.mp4 是容器（盒子），里面装的视频流才是 codec（H.264 之类）。',dlg:[{q:'为什么有的视频打不开？',a:'容器兼容、解码器没装——播放器不认识这个 codec。'},{q:'压缩会丢画质吗？',a:'常见 codec 都是有损压缩——码率越高越接近原画，体积也越大。'}],quiz:{q:'codec 的核心工作？',o:['加密视频','剪辑视频','上传视频','压缩编码+解码还原音视频'],a:3,why:'编解码二字就是全部——压得小、还原得了。'}},
{id:'cloudnative',term:'云原生',full:'Cloud Native',cn:'云原生',zone:'code',lv:3,tl:'<b>云原生</b>是「天生为云设计」的应用姿势：按容器拆小、动态调度、坏了自动补位、日志指标全收集——不是把老应用搬上云，而是按云的规矩重新长。',ana:'不是把老房子搬到新小区，而是按新小区的物业规则重新盖：水电按需开通、房间随住随配、坏了物业秒换。',scn:'技术文聊「k8s、容器、微服务」三大件时，「云原生」就是这堆概念的伞——近年新系统的主流打开方式。',rel:['docker','k8s','cloudfunc','devops','paas'],al:['cloud native','云原生','云原生架构','cloudnative'],one:'天生为云设计的应用姿势，不是搬上去的',cf:'「上云」≠ 云原生——直接把老服务器搬上去只是换了个机房；按容器+调度+弹性重新设计才叫。',dlg:[{q:'小项目需要云原生吗？',a:'不必硬上——单容器甚至云函数就够；它解决的是大规模、多服务的运维复杂度。'},{q:'微服务和它啥关系？',a:'微服务是云原生的常见搭档：按容器拆小才好被平台调度。'}],quiz:{q:'「云原生」的核心含义？',o:['按云的弹性调度规矩重新设计应用','服务器放在云机房','用云厂商的数据库','网速更快'],a:0,why:'关键在「按云的规矩重新长」，不是搬家上云。'}},
{id:'retry',term:'重试退避',full:'Retry & Backoff',cn:'重试退避',zone:'code',lv:2,tl:'<b>重试退避（Retry & Backoff）</b>是失败后的礼貌姿势：别猛冲，等一会儿再试，且一次比一次等得久（1s、2s、4s…）。对方越堵，越要给它喘息，不然越挤越死。',ana:'打不通电话：连拨 100 次只会一直占线；隔几分钟再拨，一次就通。',scn:'工具部署脚本「失败重试 ≤5 次」就是它——发布服务间歇性抽风，隔一会儿重试就过了；猛刷只会更堵。',rel:['timeout','idem','polling','quota','api'],al:['retry backoff','重试退避','指数退避','exponential backoff'],one:'失败别猛冲，越等越久再试',cf:'盲重试是危险的——只有「重复执行也无害」（幂等）的操作才能随便重试，不然可能下单两次。',dlg:[{q:'为什么要越等越久？',a:'服务抖动通常几秒到几分钟——指数退避既给对方恢复时间，也不浪费自己请求。'},{q:'重试几次合适？',a:'3~5 次常见，配合退避；无限重试等于攻击自己的服务。'}],quiz:{q:'重试前必须确认操作是？',o:['足够快的','幂等的（重复执行无害）','加密的','免费的'],a:1,why:'不幂等的操作重试会重复扣款/重复下单。'}},
{id:'fallback',term:'降级兜底',full:'Fallback',cn:'降级兜底',zone:'code',lv:2,tl:'<b>降级兜底（Fallback）</b>是主路堵了走辅路：推荐系统挂了就返回热门榜单，实时数据拿不到就显示昨天的。宁可给个粗答案，不给白屏。',ana:'导航：高速堵死自动改走国道——慢点，但保证你能到，而不是停在高速上干瞪眼。',scn:'AI 应用设计里高频词——大模型超时就换更小的模型顶上，检索失败就退回关键词搜索；产品体验的底线就是永远有兜底。',rel:['retry','rollback','circuitbreaker','timeout','loadbalance'],al:['fallback','降级','兜底方案','降级兜底'],one:'主路堵了走辅路，宁可粗答案不给白屏',cf:'别和「回滚 rollback」混——回滚是退回上一个版本；降级是服务还在、只是换低配姿势继续。',dlg:[{q:'降级和重试啥关系？',a:'重试是「再试主路」，降级是「换辅路」——先重试几次，不行再降级。'},{q:'兜底内容会误导吗？',a:'会，所以要标注「数据非实时」——兜底也要诚实。'}],quiz:{q:'降级兜底的设计目标？',o:['修复故障本身','提高服务性能','永远给出可用结果，哪怕质量降低','节省带宽'],a:2,why:'可用性优先于完美——粗答案好过白屏。'},shot:'fallback'},
{id:'circuitbreaker',term:'熔断器',full:'Circuit Breaker',cn:'熔断器',zone:'code',lv:3,tl:'<b>熔断器</b>是系统的「跳闸保护」：错误率超阈值就先「跳闸」——一段时间内不再请求对方，直接走兜底；冷却后再放几个试探请求，好了就恢复。防止一个故障拖垮全家。',ana:'家里电路跳闸：电流异常先断电保护电器，不会一直硬扛到烧家；检查后（试探）再合闸。',scn:'微服务圈标配词——A 服务依赖 B，B 卡死时 A 的请求全堆着等，把 A 也拖死；熔断让 A 及时止损，「你坏你的，我还活着」。',rel:['retry','fallback','loadbalance','timeout','observability'],al:['circuit breaker','熔断','跳闸保护','熔断机制'],one:'错误太多先跳闸止损，冷却后再试探恢复',cf:'别和「降级」混——熔断是「停止请求的开关」，降级是「开关跳了之后走的辅路」，俩词常一起出现。',dlg:[{q:'熔断后用户看到什么？',a:'兜底内容或友好报错——比干等超时强得多。'},{q:'怎么恢复？',a:'半开状态放几个试探请求——成功率高就逐步恢复，失败就继续熔断。'}],quiz:{q:'熔断器防止的是？',o:['数据丢失','网速变慢','代码出错','一个下游故障拖垮整个调用链'],a:3,why:'快速失败隔离故障，避免级联崩溃。'},shot:'circuitbreaker'},
{id:'observability',term:'可观测性',full:'Observability',cn:'可观测性',zone:'code',lv:3,tl:'<b>可观测性</b>是系统「心里有数」：日志（发生了什么）、指标（多不多快不慢）、链路追踪（请求走了哪条路）三件套齐备——出事能定位，没事能预警。',ana:'体检报告 + 行车记录仪：平时数据全记着，出事时能倒推出哪一环出的问题，而不是干瞪眼猜。',scn:'技术文聊「log 不等于可观测性」就是在说这个——光有日志只能事后翻记录；三件套齐了才谈得上「系统心里有数」。',rel:['log','debug','dashboard2','ci3','quota'],al:['observability','可观测性','o11y','观测三件套'],one:'日志+指标+链路追踪，出事能查没事能预警',cf:'别当成「多打日志」——可观测性是体系（日志+指标+追踪联动），日志只是其中一件。',dlg:[{q:'和监控啥区别？',a:'监控盯着已知指标报警（CPU 高了）；可观测性还能回答「没想过的问题」——出了没见过的错，倒推出全链路。'},{q:'个人项目要搞吗？',a:'轻量即可——关键路径打日志+一个错误上报，就够定位九成问题。'}],quiz:{q:'可观测性三件套是？',o:['日志、指标、链路追踪','代码、测试、文档','CPU、内存、硬盘','前端、后端、数据库'],a:0,why:'logging / metrics / tracing 是标准三支柱。'}},
{id:'coldstart',term:'冷启动',full:'Cold Start',cn:'冷启动',zone:'code',lv:2,tl:'<b>冷启动</b>是「刚开机啥都没备」：服务刚拉起，缓存空、连接没建、代码没预热——第一单必然最慢。所以重要服务讲究「预热」和「保活」。',ana:'冬天早上刚启动的车：发动机凉、机油没循环——头几公里又肉又费油，热车之后才顺。',scn:'云函数圈高频词——闲置就回收，来请求再拉起，冷启动几秒，这也是「云函数不适合超低延迟场景」的原因。',rel:['cloudfunc','cache','timeout','deploy','infereng'],al:['cold start','冷启动','预热','首次延迟'],one:'刚开机啥都没备，第一单最慢',cf:'别和「首字延迟 TTFT」混——冷启动是「整个服务第一次被叫醒」，TTFT 是「模型吐第一个字的等待」，粒度不同。',dlg:[{q:'怎么缓解？',a:'预热（启动时提前跑一遍）、保活（定时 ping 别让它睡）、常驻最小实例。'},{q:'用户能感觉到吗？',a:'能——点开半天才反应的第一屏，很多就是冷启动。'}],quiz:{q:'冷启动最明显的特征？',o:['所有请求都慢','第一批请求明显慢，之后正常','数据丢失','无法联网'],a:1,why:'首次最慢、热身后恢复是冷启动的签名。'}},
{id:'multitenant',term:'多租户',full:'Multi-Tenant',cn:'多租户',zone:'code',lv:2,tl:'<b>多租户</b>是一栋楼很多家合租：一套系统服务很多客户（租户），数据互相隔离、互不打扰。SaaS 的命根子——一套代码，千家万户各用各的。',ana:'写字楼：一栋楼一套水电消防（系统底座），每家公司自己装修上锁（数据隔离）——邻居搬走也不影响你。',scn:'你用的飞书多维表格、Notion 都是典型多租户——所有人共用一套服务，但你的文档别人永远看不见。',rel:['saas','saas2','cloud','bitable','oauth'],al:['multi tenant','多租户','SaaS 架构','租户隔离'],one:'一套系统千家合租，数据互相隔离',cf:'别和「多用户」混——多用户是一个系统里的账号；多租户强调「组织级隔离」，租户之间连管理员都看不到彼此。',dlg:[{q:'隔离靠什么？',a:'每条数据都带「租户 id」做硬隔离，严的还会分库分表。'},{q:'隔离没做好会怎样？',a:'事故级新闻——A 公司能看到 B 公司的数据，SaaS 直接社死。'}],quiz:{q:'多租户的核心难点？',o:['界面好看','网速','数据隔离与性能互不打扰','收费方式'],a:2,why:'千家共用一套底座，隔离与公平调度是命门。'}},
{id:'techdebt',term:'技术债',full:'Tech Debt',cn:'技术债',zone:'code',lv:1,tl:'<b>技术债</b>是图快欠下的账：先抄近道上线，把「该抽象的没抽象、该测的没测」记成账。不还就利滚利——每加一个功能都更痛苦，迟早逼你大重构。',ana:'花呗：图爽先买了，账单后置——不还账越滚越大，主动分期还（小步重构）才是正解。',scn:'AI 辅助编码时代新说法「AI 债」：让 AI 糊出来的能跑代码，三天后自己都看不懂——债从「抄近道」变成了「看不懂」。',rel:['codesmell','refactor2','codeReview','legacycode','boilerplate'],al:['tech debt','技术债','技术债务','工程债'],one:'图快欠下的账，利滚利迟早要还',cf:'技术债不是「写得烂」——有意为之的近道（先上线验证再优化）是策略；失控的近道才是债。',dlg:[{q:'技术债都要还吗？',a:'看利率——一次性活动页的债不用还；核心业务的债越早还越便宜。'},{q:'怎么还？',a:'小步重构+补测试，别指望「停下来大重构三个月」——那通常还不上。'}],quiz:{q:'技术债的「利息」是？',o:['服务器费用','利息罚款','代码加密','后续每次开发都要为之前的近道多花时间'],a:3,why:'债拖得越久，新功能开发成本越高，这就是利滚利。'}},
{id:'legacycode',term:'祖传代码',full:'Legacy Code',cn:'祖传代码',zone:'code',lv:1,tl:'<b>祖传代码（Legacy Code）</b>是没人敢动的老代码：写了十几年、没文档、没测试、原作者离职——能跑，但没人说得清为什么能跑。改一行，崩三处。',ana:'老宅的承重墙：图纸早丢了，但全家都住着——拆之前谁也不敢保证哪面墙能动。',scn:'职场段子「祖传屎山」说的就是它；也有句名言——没测试的代码都是 legacy code，不管写了几天。',rel:['techdebt','refactor2','unittest','codebase','codesmell'],al:['legacy code','祖传代码','屎山','老代码'],one:'没人敢动的老代码，改一行崩三处',cf:'「老」不是罪——没测试、没文档、没人懂才是 legacy 的判定标准；有测试护着的老代码照样能优雅干活。',dlg:[{q:'接手祖传代码第一步？',a:'先补测试再改——测试是你唯一的护网，没护网别动刀。'},{q:'要重写吗？',a:'名言警告：重写通常比想象贵三倍——先小步重构，逼不得已再推倒。'}],quiz:{q:'祖传代码最危险之处？',o:['没人理解全貌、改动能牵出未知崩塌','运行慢','界面丑','占硬盘'],a:0,why:'无文档无测试无人懂——改动的爆炸半径不可知。'}},
{id:'backwardcompat',term:'向后兼容',full:'Backward Compatible',cn:'向后兼容',zone:'code',lv:2,tl:'<b>向后兼容</b>是升级不能弄坏老用户：新版必须让旧数据、旧接口、旧习惯照常工作。破坏性变更要单独立规矩（如版本号大版本 +1）并给迁移期。',ana:'手机系统更新：升级后旧 App 照装、旧照片还在——要是更新一次全得重来，谁还敢升？',scn:'「semver 版本号」的搭档：大版本号变了 = 允许不兼容；没变 = 必须兼容。装 npm 包看到 breaking changes 字样，就是说这次升级可能弄坏依赖它的东西。',rel:['semver','lts','api3','migration','json'],al:['backward compatible','向后兼容','兼容性','breaking change'],one:'升级不弄坏老用户，破坏性变更走大版本',cf:'别和「向前兼容」混——向后是「新版照顾旧数据」；向前是「旧版能处理新数据」，后者难得多。',dlg:[{q:'为什么不永远兼容？',a:'兼容是有代价的——历史包袱越背越重，所以都选「给迁移期，到期断旧」。'},{q:'Python 2→3 是这类吗？',a:'是教科书案例——破坏性升级拖了十几年才完成迁移。'}],quiz:{q:'semver 中主版本 +1 意味着？',o:['纯新增功能','允许破坏性变更（可能不兼容）','只修 bug','改个名字'],a:1,why:'大版本号是给「破坏兼容」开的合法通道。'}},
{id:'kol',term:'KOL',full:'Key Opinion Leader',cn:'关键意见领袖 KOL',zone:'misc',lv:1,abbr:true,tl:'<b>KOL（关键意见领袖）</b>就是大 V：粉丝多、话语权大，他推荐啥粉丝信啥。品牌找他带货，买的是他多年攒下的信任。',ana:'村里大家信的老中医：他说哪个药好，全村都去抓——信的是人，不是药盒。',scn:'做自媒体天天听到——报价单上「KOL 投放」就是找大 V 发内容；你对标的头部账号，就是你领域的 KOL。',rel:['koc','vibemkt','ctrcvr','gmv','flywheel'],al:['KOL','关键意见领袖','大V','头部博主'],one:'大 V，粉丝信他的推荐，买的是信任',cf:'别和 KOC 混——KOL 是「头部大声量」，KOC 是「素人小而可信」，投放时常大小组合。',dlg:[{q:'粉丝多就是 KOL？',a:'还得「意见」有分量——粉丝信他的判断，不是只看热闹。'},{q:'找 KOL 投放看什么？',a:'不只粉丝数——看垂直度、互动率和往期转化，水号不少。'}],quiz:{q:'KOL 投放买的本质是？',o:['他多年攒下的信任与话语权','粉丝数量','平台流量补贴','视频清晰度'],a:0,why:'本质是信任背书——粉丝数只是表象。'}},
{id:'koc',term:'KOC',full:'Key Opinion Consumer',cn:'关键意见消费者 KOC',zone:'misc',lv:1,abbr:true,tl:'<b>KOC（关键意见消费者）</b>是素人种草官：粉丝几百几千，但像身边真人一样可信——「我真买了、真用了」的分享比广告有说服力。',ana:'闺蜜推荐 vs 明星代言：闺蜜说「这好用我回购了」，你多半信；明星说，你知道是收了钱的。',scn:'品牌投放的常见组合拳——头部 KOL 造声势，铺一百个 KOC 刷真实感；你自己账号起号阶段也是 KOC 路线。',rel:['kol','vibemkt','ctrcvr','flywheel','contentfarm'],al:['KOC','关键意见消费者','素人博主','种草官'],one:'素人种草官，小而真、小而可信',cf:'别当成「小号 KOL」——KOC 卖的是「像我一样的普通人」的真实感，人设逻辑完全不同。',dlg:[{q:'KOC 粉丝那么少，有用吗？',a:'有——投放看的是信任密度不是声量；一百条真实素人分享常比一条硬广转化高。'},{q:'怎么算合格的 KOC 内容？',a:'有真实使用细节（踩坑也算）——模板化的夸赞一眼广告。'}],quiz:{q:'KOC 最值钱的特质是？',o:['粉丝规模大','像真人一样可信的真实感','报价便宜','更新频率高'],a:1,why:'信任密度是 KOC 的全部价值。'}},
{id:'sop',term:'SOP',full:'Standard Operating Procedure',cn:'标准作业流程 SOP',zone:'misc',lv:1,abbr:true,tl:'<b>SOP（标准作业流程）</b>是把套路写成清单：第一步干嘛第二步干嘛，照着做谁都能出八成品。团队不靠「能人」，靠流程。',ana:'连锁店配方手册：换人不出味——不是店长厉害，是 SOP 厉害。',scn:'IP 工作流的沉淀就是 SOP——「发一篇公众号的 12 步」「直播前检查清单」写下来，自己不乱，交给 AI 或助手也能跑。',rel:['workflow','planexec','automation','specdev','flywheel'],al:['SOP','标准作业流程','标准操作流程','作业清单'],one:'把套路写成清单，谁照做都出八成品',cf:'SOP 不是形式主义——判断标准：没有它质量就靠运气，有它新人也能接手。',dlg:[{q:'一人公司需要 SOP 吗？',a:'更需要——你的时间最贵，重复决策全写成清单交给工具或 AI。'},{q:'SOP 会不会太死板？',a:'好的 SOP 写「检查项」不写「死步骤」——结果定死，路径留活。'}],quiz:{q:'SOP 的核心价值？',o:['让工作更慢更稳','增加汇报材料','让质量不依赖某个能人','替代创新'],a:2,why:'把个人经验变成可复制的组织能力。'}},
{id:'funnel',term:'转化漏斗',full:'Funnel',cn:'转化漏斗',zone:'misc',lv:1,tl:'<b>转化漏斗（Funnel）</b>是把「看的人→点的人→买的人」逐层画成漏斗：每层都有流失，你的活就是找到漏得最狠的那层堵住。',ana:'大浴场进水口宽出水口窄——水流一路漏；运营就是把每一层的洞补一补，让更多人流到底。',scn:'自媒体变现的通用模型：播放→关注→进私域→成交，四层漏斗；「完播低」卡第一层，「不转化」卡最后一层，药方完全不同。',rel:['ctrcvr','daumau','gmv','ltv','kpi'],al:['funnel','转化漏斗','漏斗模型','marketing funnel'],one:'看→点→买逐层漏，找漏最狠的层堵住',cf:'别只盯最底层「成交」——漏斗要从顶层看起，顶层漏得狠，底层再努力也白搭。',dlg:[{q:'怎么找最该修的层？',a:'算每层的转化率，跟行业均值比——低于均值最多的那层就是突破口。'},{q:'漏斗层数越多越好？',a:'不——每多一层多一次流失；路径能短则短。'}],quiz:{q:'漏斗分析的第一个动作？',o:['直接改产品','加大投放','换头像','算出每层转化率找最弱一层'],a:3,why:'先量化每层流失，才知道药往哪开。'},shot:'funnel'},
{id:'ltv',term:'用户终身价值',full:'LTV (Lifetime Value)',cn:'用户终身价值 LTV',zone:'misc',lv:2,abbr:true,tl:'<b>LTV（用户终身价值）</b>是一个用户一辈子平均给你挣多少钱。它决定你敢花多少钱获客——LTV 100 的用户，花 30 买进来也血赚。',ana:'楼下早餐店算的不是一单赚 5 块，是这位大爷一年 1800 块——所以值得送他豆浆。',scn:'做付费社群/课程的算账核心——先估 LTV 再定投放预算；「ROI 为正」的前提是 LTV 算得全（复购、转介绍都算上）。',rel:['roi','gmv','daumau','ctrcvr','pmf'],al:['LTV','用户终身价值','用户生命周期价值','lifetime value'],one:'一个用户一辈子给你挣多少，决定获客预算',cf:'别和 GMV 混——GMV 是流水总额，LTV 是「单个用户」的长期贡献，口径差一个量级。',dlg:[{q:'LTV 怎么估？',a:'平均客单 × 复购次数 × 留存时长，加上转介绍——别只算首单。'},{q:'LTV 太低怎么办？',a:'三条路：提客单、提复购、延长留存——比降价拉新更治本。'}],quiz:{q:'LTV 用来决定？',o:['敢花多少钱获取一个用户','服务器配置','员工数量','办公地点'],a:0,why:'知道用户值多少，才知道买他多少钱合适。'}},
{id:'bouncerate',term:'跳出率',full:'Bounce Rate',cn:'跳出率',zone:'misc',lv:1,tl:'<b>跳出率（Bounce Rate）</b>是进来扫一眼就走的人占比：落地页 100 个人来，80 个没点任何东西就关——跳出率 80%，说明第一屏没接住人。',ana:'进店 3 秒扭头就走：要么门口招牌骗人，要么第一眼太乱——没人怪顾客，只能怪店面。',scn:'公众号对应「打开后 3 秒划走」；个人网站跳出率高，先查首屏——加载慢、标题货不对板是两大主因。',rel:['daumau','ctrcvr','landing','ux','kpi'],al:['bounce rate','跳出率','跳失率','弹出率'],one:'进来扫一眼就走的占比，第一屏没接住',cf:'别把跳出率当「内容差」——查答案型页面用户看完就走，高跳出反而正常，要看页面目的。',dlg:[{q:'多少算高？',a:'内容站 70%+ 常见；转化型落地页 40% 就该警觉——基准看页面目的。'},{q:'最快的改善抓手？',a:'首屏三要素：3 秒能加载完、标题对得上来源、下一步按钮明显。'}],quiz:{q:'跳出率异常高，先查？',o:['服务器硬盘','第一屏：加载速度与内容是否对板','域名年龄','客服话术'],a:1,why:'跳出发生在第一屏——先查入口体验。'}},
{id:'recommender',term:'推荐算法',full:'Recommender System',cn:'推荐算法',zone:'misc',lv:2,tl:'<b>推荐算法</b>是平台决定「给谁看你的内容」的机器：拿你的内容特征 × 用户的兴趣画像，算出可能喜欢就推。流量不是玄学，是这套系统的输出。',ana:'老练的报童：他记得每条街谁爱看啥，早上按人头分报纸——分得越准，买的人越多。',scn:'做自媒体必须懂对手的「分货逻辑」：视频号、公众号推荐位的背后都是它——「互动率高→推给更多人」的滚雪球就发生在这里。',rel:['ctrcvr','flywheel','vibemkt','heatmap','kpi'],al:['recommender system','推荐算法','推荐系统','分发算法'],one:'平台决定给谁看你的内容的那台机器',cf:'推荐算法不「看内容好不好」，只看「数据信号强不强」——完播、互动、转发才是它的语言。',dlg:[{q:'冷启动没流量怪算法？',a:'先怪信号——新账号没有历史数据，算法只能小范围试探，数据好才放量。'},{q:'怎么「讨好」算法？',a:'别想歪门——把前 3 秒完播、互动引导做扎实，算法只认这些硬信号。'}],quiz:{q:'推荐算法决定流量的依据主要是？',o:['发布时间早','账号年龄','内容的数据信号（完播/互动/转发）','付费会员'],a:2,why:'算法只读数据信号，不读情怀。'},shot:'recommender'},
{id:'northstar',term:'北极星指标',full:'North Star Metric',cn:'北极星指标',zone:'misc',lv:2,tl:'<b>北极星指标（North Star Metric）</b>是全公司只盯的那一个数：它涨，说明用户真得到价值、生意真在变好。别的指标都是它的拆解。',ana:'夜里迷路看北极星：满天星星（各种指标）都在动，只认一颗不会迷路。',scn:'IP 业务里北极星常不是「粉丝数」而是「周活跃读者/咨询数」——粉丝虚荣，真价值信号才配当北极星。',rel:['kpi','okr','pmf','daumau','gmv'],al:['north star metric','北极星指标','唯一关键指标','OMTM'],one:'全公司只盯的那一个数，涨了才是真好',cf:'别拿虚荣指标当北极星——粉丝数、阅读量都容易被活动冲高；北极星必须连着「用户得到价值」。',dlg:[{q:'为什么只要一个数？',a:'多个「都重要」等于没有重点——一个数能对齐所有人的日常决策。'},{q:'怎么选？',a:'问「这个数涨了，用户是不是真的更爽、更愿意留下/付钱」——是，才配。'}],quiz:{q:'北极星指标的选择标准？',o:['最容易涨的','老板最喜欢的','行业通用的','连着用户真实价值的那个数'],a:3,why:'北极星必须反映用户价值，否则会带歪全队。'}},
{id:'growthhack',term:'增长黑客',full:'Growth Hacking',cn:'增长黑客',zone:'misc',lv:2,tl:'<b>增长黑客（Growth Hacking）</b>是用巧劲低成本获客：不走砸钱投放的老路，靠产品机制、数据实验、裂变玩法把增长做进产品里。',ana:'钓鱼不买更贵的竿，而是找到鱼群在哪、它们爱吃什么——用信息差和巧劲，不是堆装备。',scn:'经典案例「Dropbox 邀请双方各送空间」就是增长黑客——获客成本近乎零；公众号「转发领资料包」也是同一思路的土版。',rel:['flywheel','vibemkt','kpi','funnel','pmf'],al:['growth hacking','增长黑客','增长玩法','growth hack'],one:'用巧劲和数据实验低成本获客',cf:'别当成「野路子营销」——正规增长黑客是「假设→实验→数据→迭代」的科学流程，碰运气的不算。',dlg:[{q:'和投放什么关系？',a:'投放是买流量，增长黑客是让产品自己带来流量——先做后者，前者放大。'},{q:'个人号能玩吗？',a:'能——「老带新领资料」「评论区抽奖」都是最小成本的增长实验。'}],quiz:{q:'增长黑客的工作方式是？',o:['砸钱买量','假设→实验→数据→迭代的低成本增长','雇更多销售','蹭热点'],a:0,why:'核心是低成本实验，不是资源堆砌。'}},
{id:'networkeffect',term:'网络效应',full:'Network Effect',cn:'网络效应',zone:'misc',lv:2,tl:'<b>网络效应</b>是用的人越多产品越值钱：微信对你是必需品，因为所有人都在微信上——价值来自「别人也在用」，不在软件本身。',ana:'电话：一个人有电话没用，人人都有它才不可替代——每新增一个用户，所有老用户都更受益。',scn:'选平台战略时就在用这个概念——有网络效应的平台（微信、闲鱼）后来者很难抢；没有的（纯工具）随时可能被替代。',rel:['flywheel','saas','multitenant','pmf','pivot'],al:['network effect','网络效应','网络外部性','生态壁垒'],one:'用的人越多产品越值钱，护住盘子',cf:'别和「规模效应」混——规模效应是「量大成本降」（供方），网络效应是「人多价值涨」（需方），来源不同。',dlg:[{q:'为什么大平台难被颠覆？',a:'用户存量是它的护身符——替代品再好，你的朋友都不在那，你也没辙。'},{q:'AI 产品有网络效应吗？',a:'纯对话工具没有；带社区、带数据沉淀（越用越懂你）的才有。'}],quiz:{q:'网络效应的价值来源？',o:['软件功能多','别人也在用——用户互相创造价值','价格便宜','广告投放多'],a:1,why:'价值来自用户之间的连接，不是功能本身。'},shot:'networkeffect'},
{id:'pareto',term:'二八定律',full:'Pareto Principle',cn:'二八定律',zone:'misc',lv:1,tl:'<b>二八定律（Pareto 原则）</b>是 80% 的结果来自 20% 的原因：80% 的收入来自 20% 的客户、80% 的播放来自 20% 的内容。抓重点，别平均用力。',ana:'衣柜：常穿的永远是那 20%，剩下的 80% 挂着吃灰——时间和钱也一样。',scn:'复盘账号数据用得上：大概率 20% 的爆款贡献了 80% 的涨粉——把那 20% 的共性找出来放大，比日更十篇平庸的强。',rel:['kpi','northstar','funnel','flywheel','roi'],al:['pareto principle','二八定律','80/20 法则','帕累托法则'],one:'八成结果来自两成原因，别平均用力',cf:'二八是经验规律不是精确数学——重点是「分布不均」这个意识，数字未必恰好 80/20。',dlg:[{q:'怎么找出关键的 20%？',a:'按结果排序拉清单：哪些内容/客户/动作贡献了大头——数据不会说谎。'},{q:'那 80% 就扔掉？',a:'不是扔，是降级维护——别让长尾偷走核心投入的时间。'}],quiz:{q:'二八定律的实用启示？',o:['每天工作 8 小时','把资源压到贡献最大的少数关键项','客户越平均越好','内容越多越好'],a:2,why:'资源有限时，押注高产出少数项是唯一理性策略。'}},
{id:'pivot',term:'转型掉头',full:'Pivot',cn:'转型掉头 Pivot',zone:'misc',lv:2,tl:'<b>Pivot（转型掉头）</b>是创业黑话：这条路验证不通，保留核心能力、换方向重来。不是失败认输，是带着证据及时掉头。',ana:'开车导航说「前方拥堵」：好司机不是硬堵到死，而是掉头换路——目的地（要解决的问题）没变，路线换了。',scn:'很多大 V 都是换了三次赛道才起的号——pivot 的关键是「换姿势不换目标」，核心能力和人群认知都留着。',rel:['pmf','poc','mvp','northstar','sop'],al:['pivot','转型','掉头','战略转向'],one:'这条路不通就换条路，目标不变姿势换',cf:'pivot ≠ 随便换方向——要有数据证明「此路不通」；没试过就掉头叫逃，试过才叫转型。',dlg:[{q:'什么时候该 pivot？',a:'关键假设被证伪（内容没人要、产品没人付费），而不是「暂时数据不好看」。'},{q:'pivot 太频繁呢？',a:'也是病——每次都浅尝辄止，永远在起点；给每个方向设个验证期限。'}],quiz:{q:'合理的 pivot 依据是？',o:['今天心情不好','关键假设被数据证伪','对手做了什么','蹭新热点'],a:3,why:'转型要有证据驱动，不是情绪驱动。'}},
{id:'freemium',term:'免费增值',full:'Freemium',cn:'免费增值 Freemium',zone:'misc',lv:1,tl:'<b>Freemium（免费增值）</b>是基础免费、高级收费：先让所有人白用，用出依赖后再把「离不开的功能」卖出去。免费的是鱼饵，付费的是刚需。',ana:'试吃摊：白让你尝一口，觉得好再买整袋——摊主赌的是「尝过的人比路过的人更愿意掏钱」。',scn:'你常用的工具几乎全是这套：Notion、飞书、各家 AI——免费额度够上手，重度使用（更多存储、更强模型）才收费。',rel:['saas','saas2','ltv','pmf','quota'],al:['freemium','免费增值','免费模式','基础免费'],one:'基础免费高级收费，免费的是入口',cf:'免费 ≠ 慈善——freemium 的账是「免费用户带来规模和口碑，一小撮付费用户养活全家」。',dlg:[{q:'免费用户是负担吗？',a:'不是——他们是口碑传播者和潜在付费池；但成本要控制（额度设计）。'},{q:'什么该收费？',a:'「重度使用才需要」的：更大容量、更高配额、团队协作——轻度用户感知不到，重度用户离不开。'}],quiz:{q:'freemium 的盈利逻辑？',o:['一小撮付费用户养活大量免费用户','靠广告轰炸','卖用户数据','捐赠'],a:0,why:'转化率通常个位数，所以付费端必须撑起全部成本。'}},
{id:'breakout',term:'破圈',full:'Breaking Out',cn:'破圈',zone:'misc',lv:1,tl:'<b>破圈</b>是从小圈子火到大众：原本只有圈内人懂的内容，突然被圈外大量转发——受众换层，量级换挡。',ana:'地下乐队上综艺：昨天还只在 Livehouse 唱给 200 人，今天全网在哼他们的歌——歌没变，听众圈层变了。',scn:'自媒体人梦寐以求的时刻——「AI 圈黑话科普」被完全不懂 AI 的人疯转就是典型：破圈内容通常带着「圈外人也觉得有趣/有用」的通用钩子。',rel:['vibemkt','flywheel','clickbait','contentfarm','koc'],al:['breaking out','破圈','出圈','破圈传播'],one:'从小圈子火到大众，受众换层量级换挡',cf:'破圈是结果不是策略——能设计的是「通用钩子」（情绪共鸣、人人相关的痛点），爆不爆由不得你。',dlg:[{q:'破圈之后要做什么？',a:'接住新受众——用他们听得懂的话补基础内容，否则流量来了留不住。'},{q:'老粉丝会流失吗？',a:'常见阵痛——破圈必然「稀释」原社区浓度，节奏要拿捏。'}],quiz:{q:'破圈内容的典型特征？',o:['术语越专业越好','圈外人也觉得有趣或有用','时长越长越好','只发给老粉'],a:1,why:'通用钩子是破圈的前提——圈内黑话出不了圈。'}},
{id:'agile',term:'敏捷开发',full:'Agile',cn:'敏捷开发 Agile',zone:'misc',lv:2,tl:'<b>敏捷开发（Agile）</b>是小步快跑的干活方式：把大项目切成一两周一个的小循环，每圈都交付能用的东西、听反馈再调整——对面是「闷头半年交付一个大成品」的瀑布式。',ana:'包饺子：敏捷是先包 10 个煮了尝咸淡再调馅；瀑布是闷头包完 500 个再煮——咸了就全毁了。',scn:'你的工作流其实就是敏捷——「每批词条过一遍门禁、每周上线一版」就是小循环交付；大而全憋半年再发反而容易翻车。',rel:['devops','ci3','mvp','specdev','workflow'],al:['agile','敏捷开发','敏捷','scrum'],one:'小步快跑勤交付，每圈听反馈再调',cf:'敏捷不是「没有计划」——计划每圈都在滚动更新；它反对的是「半年不变的大计划」，不是计划本身。',dlg:[{q:'一周一圈太赶？',a:'圈的大小按团队定——重点不是「快」，是「反馈周期短」：错得早，改得便宜。'},{q:'什么活不适合敏捷？',a:'目标极度明确、改一次代价巨大的（如盖楼）——那更适合瀑布。'}],quiz:{q:'敏捷的核心是？',o:['加班更多','不做计划','短周期交付+持续反馈调整','文档越多越好'],a:2,why:'反馈周期短，错得早就改得便宜。'},shot:'agile'},
{id:'prd',term:'需求文档',full:'PRD (Product Requirements Document)',cn:'需求文档 PRD',zone:'misc',lv:2,abbr:true,tl:'<b>PRD（产品需求文档）</b>是「产品要做成什么样」的说明书：给谁用、解决什么问题、每个功能怎么表现、边界在哪——写清楚，团队才不用猜。',ana:'装修需求单：几口人住、要不要书桌、预算多少——不给施工队全靠他自由发挥，装完准吵架。',scn:'让 AI 干活的进阶技巧：给它写「PRD 式」提示词——目标用户、输入输出、边界情况写清楚，产出质量立刻上一个台阶。',rel:['spec','specdev','mvp','poc','workflow'],al:['PRD','需求文档','产品需求文档','product requirements doc'],one:'产品要做成什么样，写清楚别让团队猜',cf:'PRD 不是越长越好——能消除歧义的最短篇幅最佳；没人看的百页文档不如一页清单。',dlg:[{q:'一人 + AI 也要 PRD？',a:'更要——AI 不会读心，你的「默认共识」它全不知道；写下来就是它的施工图。'},{q:'PRD 写到多细？',a:'细到「两个人读了不会有两种理解」为止——再细就是浪费。'}],quiz:{q:'PRD 的核心目的？',o:['展示文采','记录代码','应付领导','消除歧义——让所有人对齐「做成什么样」'],a:3,why:'消除歧义是唯一目的——对齐比详尽重要。'}},
{id:'dns',term:'DNS',full:'Domain Name System',cn:'域名解析 DNS',zone:'abbr',lv:1,abbr:true,tl:'<b>DNS（域名解析）</b>是互联网通讯录：把域名翻译成机器认识的 IP 地址。你输网址，DNS 先查号，再帮你连过去。',ana:'手机通讯录：你记「妈」，手机查号码拨出去——你不用背号码（IP），DNS 就是那个通讯录。',scn:'配 GitHub Pages 自定义域名、网站打不开时「换 DNS（223.5.5.5 / 8.8.8.8）」的教程，动的就是它。',rel:['ip','url','domain','http','cdn'],al:['DNS','域名解析','域名服务器','nameserver'],one:'通讯录把域名翻译成 IP',cf:'「DNS 污染」= 通讯录被塞了假号码——域名没错、解析结果错了，换个 DNS 常能救急。',dlg:[{q:'网站打不开换 DNS 为啥有用？',a:'本地通讯录可能缓存了错号码——换一家重新查号，常能绕过去。'},{q:'改解析要多久生效？',a:'看 TTL 缓存——几分钟到 48 小时都有，这就是「解析生效慢」的原因。'}],quiz:{q:'DNS 的作用？',o:['把域名翻译成 IP 地址','加密流量','压缩网页','防盗号'],a:0,why:'域名好记给人类，IP 才是机器认的地址，DNS 负责翻译。'},shot:'dns'},
{id:'sla',term:'SLA',full:'Service Level Agreement',cn:'服务等级协议 SLA',zone:'abbr',lv:1,abbr:true,tl:'<b>SLA（服务等级协议）</b>是服务商白纸黑字的承诺：多久响应、多少可用性、赔多少。宣传页说「很稳」不算数，SLA 里写着 99.9% 才算数。',ana:'外卖承诺「30 分钟不到赔 10 元」——口头吹「很快」没人信，写进条款才有约束。',scn:'买云服务、API 时看 SLA：99.9% = 一年最多宕 8.7 小时；四个九 99.99% = 一年 52 分钟——差一个九，差一个量级。',rel:['cloud','iaas','paas','api','quota'],al:['SLA','服务等级协议','服务级别协议','uptime 承诺'],one:'服务商写进合同的承诺，99.9 那个数',cf:'SLA 是赔付承诺不是技术保证——「没达标赔你钱」和「永远不挂」是两回事，关键系统要自备多路。',dlg:[{q:'四个九很难吗？',a:'极难——要多机房、冗余、自动切换，成本翻着倍涨，所以价格也翻倍。'},{q:'没达标怎么赔？',a:'通常按宕机时长返还服务费比例——记得留证据（监控截图）。'}],quiz:{q:'SLA 99.9% 意味着一年最多宕机约？',o:['0 分钟','8.7 小时','3 天','1 个月'],a:1,why:'0.1% × 一年 8760 小时 ≈ 8.7 小时。'}},
{id:'etl',term:'ETL',full:'Extract, Transform, Load',cn:'数据管道 ETL',zone:'abbr',lv:2,abbr:true,tl:'<b>ETL</b> 是数据搬运三步走：Extract 抽取（从各处把数据拽出来）→ Transform 清洗加工（去重、补缺、格式统一）→ Load 装库（放进目标仓库）。',ana:'做一桌菜：买菜（抽）→ 洗菜切配（转）→ 下锅（装）——生数据不加工，没法直接上桌。',scn:'把公众号互动数据从 API 拽出来、清洗成表、写进飞书多维表格——手工版 ETL 其实已经跑过很多回。',rel:['bitable','automation','dataset','dataclean','scraper'],al:['ETL','数据管道','抽取转换加载','数据集成'],one:'抽取-清洗-装库，数据搬运三步走',cf:'ETL 强调「先加工再入库」；近年流行反过来的 ELT（先入湖再加工）——数据量大时更灵活。',dlg:[{q:'为什么中间要 Transform？',a:'源头数据又脏又乱（格式不一、有重复）——不洗直接进仓库，分析全翻车。'},{q:'定时跑的 ETL 叫什么？',a:'数据管道——配 cron 定时调度，天天自动搬。'}],quiz:{q:'ETL 三步的正确顺序？',o:['装库→清洗→抽取','抽取→装库→清洗','抽取→清洗→装库','清洗→抽取→装库'],a:2,why:'先抽出、再洗、最后入库——字母顺序就是流程。'}},
{id:'crm',term:'CRM',full:'Customer Relationship Management',cn:'客户管理系统 CRM',zone:'abbr',lv:1,abbr:true,tl:'<b>CRM（客户管理系统）</b>是管客户资料的软件：谁聊到哪一步、谁该跟进了、谁多久没联系——销售线索不靠脑子记，全在系统里排队。',ana:'相亲对象的 Excel：见过几次、聊了啥、下次约啥时候——人多了脑子必乱，系统不会漏。',scn:'飞书多维表格的常见用法就是轻量 CRM——列上「客户名/阶段/最近跟进/下次动作」，比上重系统先跑起来。',rel:['bitable','saas','multitenant','kpi','funnel'],al:['CRM','客户管理系统','客户关系管理','客户表'],one:'管客户资料的软件，跟进不靠脑子记',cf:'CRM 是工具不是仙丹——流程乱的组织上了 CRM 只是把混乱电子化；先理流程再上系统。',dlg:[{q:'小团队要用吗？',a:'一张多维表格起步就够；字段长出来（阶段、来源、跟进记录）再考虑专业系统。'},{q:'最重要的字段？',a:'「下一步动作 + 时间」——CRM 变废为宝全靠这条，否则就是坟场。'}],quiz:{q:'CRM 最防的是？',o:['网速慢','客户线索跟丢、跟进遗忘','电脑中毒','邮件发不出'],a:1,why:'线索跟丢是销售漏斗里最贵的浪费。'}},
{id:'ha',term:'HA',full:'High Availability',cn:'高可用 HA',zone:'abbr',lv:2,abbr:true,tl:'<b>HA（High Availability，高可用）</b>是坏一台备份顶上的设计：目标只有一个——服务别停。常说的「四个九」99.99%，就是一年最多坏 52 分钟。',ana:'演唱会备用歌手：主唱嗓子哑，替补顶上——观众看不到中场休息，这才是「高可用」的演出。',scn:'技术文聊「主备、双活、故障转移」都是在讲 HA——查词工具「主链接挂了还有备用链接」也是最小成本的 HA 思路。',rel:['loadbalance','sla','backup','rollback','cloud'],al:['HA','高可用','高可用性','failover'],one:'坏一台备份顶上，服务别停',cf:'高可用 ≠ 数据不丢——HA 管「服务持续」，备份管「数据可恢复」，两件事都要做。',dlg:[{q:'怎么做到自动切换？',a:'心跳检测——主库没声音了，备库自动上位（failover）；切换要快且不丢数据，是门手艺。'},{q:'个人项目要几个九？',a:'够用就行——两个九（99%）多数场景都行，别为用不到的可用性买单。'}],quiz:{q:'HA 的核心目标？',o:['服务尽量不停','跑得更快','存更多数据','省电'],a:0,why:'High Availability 直译就是「高可用性」——停机时间最小化。'}},
{id:'rest',term:'REST',full:'Representational State Transfer',cn:'REST 接口',zone:'abbr',lv:2,abbr:true,tl:'<b>REST</b> 是 API 的「通用语法」：用网址定位资源（/users/42），用 GET/POST/PUT/DELETE 表达动作。看网址就知道要干嘛，是 API 设计的主流风格。',ana:'图书馆借书规则：报书架号（URL）+ 动作（借/还/续 = GET/POST/PUT）——全馆统一，谁都会用。',scn:'技术文说「RESTful API」「REST 风格接口」，就是按这套规矩设计的接口——你看到的公开 API 文档十有八九是它。',rel:['api3','api','http','json','endpoint'],al:['REST','RESTful','REST 接口','RESTful API'],one:'API 的通用语法，看网址就知道动作',cf:'REST 不是协议是「风格」——没有强制校验，所以才有 GraphQL 这类后起之秀抢「按需取数」的活。',dlg:[{q:'GET 和 POST 区别？',a:'GET 取数据（无副作用、可缓存），POST 提交数据（会改变东西）——浏览器里 GET 能收藏，POST 不能。'},{q:'「RESTful」啥意思？',a:'「按 REST 风格设计的」——看到 /users/1 用 GET、删数据用 DELETE，就很 RESTful。'}],quiz:{q:'REST 里 GET 的含义？',o:['删除资源','读取资源','更新资源','新建资源'],a:1,why:'GET = 拿，语义安全且可缓存。'}},
{id:'jwt',term:'JWT',full:'JSON Web Token',cn:'令牌 JWT',zone:'abbr',lv:2,abbr:true,tl:'<b>JWT（JSON Web Token）</b>是一张自带签名的通行证：用户信息写在里面，末尾附上防伪签名——服务器验签就认，不用存「谁登录过」的名单。',ana:'带防伪钢印的证件：信息印在证上，章一盖遍地认可——不用每次打电话回单位核实身份。',scn:'技术文聊「登录态」「Token 过期刷新」，多半在说 JWT——调 API 时带的 Bearer Token 常就是它。',rel:['oauth','session','apikey','sso','api'],al:['JWT','JSON Web Token','令牌','Token'],one:'自带签名的通行证，验签就认不用查名单',cf:'JWT 默认不加密只防篡改——内容肉眼可解（Base64）；别把秘密明文塞进去，敏感数据要另加密。',dlg:[{q:'Token 丢了怎么办？',a:'等它过期（短有效期是设计原则），或上「黑名单」机制——这也是为什么要给 JWT 设短寿命。'},{q:'和 Cookie 什么关系？',a:'JWT 常放在 Cookie 或请求头里随身带——它是「证」，Cookie 是「装证的口袋」之一。'}],quiz:{q:'JWT 末尾签名的用途？',o:['压缩体积','加密内容','防伪——证明内容没被改过','排序'],a:2,why:'签名管完整性（防篡改），不管保密——两者别混。'}},
{id:'orm',term:'ORM',full:'Object-Relational Mapping',cn:'对象关系映射 ORM',zone:'abbr',lv:2,abbr:true,tl:'<b>ORM（对象关系映射）</b>是代码与数据库的翻译官：代码里写对象和方法，它自动翻成 SQL 去执行——不用手写 SQL，防注入还省事。',ana:'出国带翻译：你说中文（对象），他翻成当地话（SQL）跟人谈——你不用学当地话，但得知道翻译可能走样。',scn:'技术文里 Django ORM、SQLAlchemy、Prisma 都是它——「免写 SQL」的代价是复杂查询时还得手写，所以它是翻译不是替代。',rel:['sql','db','dbtransaction','dbindex','api'],al:['ORM','对象关系映射','对象映射','object-relational mapping'],one:'代码写对象，它翻译成 SQL',cf:'ORM 不是「不用学 SQL」的借口——它生成的 SQL 效率好坏你得看得懂，慢查询还是得下到 SQL 层修。',dlg:[{q:'ORM 会拖慢性能吗？',a:'简单查询几乎无感；复杂联表可能生成笨 SQL——所以老手是「ORM 为主，关键处手写」。'},{q:'有没有纯手写 SQL 更好？',a:'报表、统计分析这类复杂查询——直接写 SQL 更可控。'}],quiz:{q:'ORM 的本职？',o:['加密数据库','画表结构图','备份','把代码里的对象翻译成 SQL'],a:3,why:'翻译官定位——对象世界与关系数据库之间。'}},
{id:'vm',term:'VM',full:'Virtual Machine',cn:'虚拟机 VM',zone:'abbr',lv:1,abbr:true,tl:'<b>VM（Virtual Machine，虚拟机）</b>是一台电脑里再「画」出几台：软件模拟出带独立系统的机器，互相隔离，坏一台不影响宿主机。',ana:'一栋楼里隔出多套公寓：共用地基水电（硬件），每套有自己的门锁和装修（系统）——租户互不打扰。',scn:'旧电脑跑 Windows 虚拟机装老软件、用 VM 试 Linux——就是「机器里画机器」；docker 的前辈，更重但更彻底。',rel:['docker','cloud','cloudfunc','iaas','sandbox'],al:['VM','虚拟机','virtual machine','虚拟主机'],one:'一台电脑里画出的独立小电脑',cf:'别和 docker 混——VM 连系统一起模拟（重、隔离彻底），docker 共享宿主内核（轻、秒开），代价是隔离弱些。',dlg:[{q:'虚拟机慢在哪？',a:'整套系统跑一遍——内存、CPU 都要分一份；所以同配置下 VM 比 docker「重」得多。'},{q:'快照是啥？',a:'整机存档——乱搞之前拍一张，坏了秒回档，是玩 VM 的安全带。'}],quiz:{q:'VM 与 docker 的关键区别？',o:['docker 更安全','VM 不能上网','VM 模拟整套系统，docker 共享内核更轻','没区别'],a:2,why:'VM 带整个操作系统所以重，docker 共享内核所以轻。'},shot:'vm'},
{id:'webrtc',term:'WebRTC',full:'Web Real-Time Communication',cn:'实时音视频 WebRTC',zone:'abbr',lv:2,abbr:true,tl:'<b>WebRTC</b> 是网页里直接开音视频通话的技术：不用装 App，浏览器之间直连传音视频，延迟极低——网页版会议、连麦都靠它。',ana:'打电话不用接线员中转：两台浏览器直连线聊，中间服务器只负责「介绍认识」，之后各聊各的。',scn:'网页里点「开始视频会议」不用装任何东西——背后是 WebRTC；AI 电话助手、数字人直播的低延迟链路也常用它。',rel:['digitalhuman','websocket','codec','aitrans','http'],al:['WebRTC','网页实时通信','web real-time communication','浏览器通话'],one:'网页里直接开音视频通话，不用装 App',cf:'别和 WebSocket 混——WebSocket 是「双向文字管道」，WebRTC 是「音视频流直通」，一个聊天室一个视频房。',dlg:[{q:'延迟为什么低？',a:'点对点直连+UDP 传输，不绕服务器囤包——代价是网络差时质量波动大。'},{q:'两台机器怎么找到对方？',a:'靠信令服务器「介绍」（交换地址），再打洞直连——NAT 穿透是它最复杂的部分。'}],quiz:{q:'WebRTC 的典型场景？',o:['下载大文件','网页音视频通话','数据库备份','静态网页'],a:1,why:'Real-Time Communication——实时音视频是它的本命。'}},
