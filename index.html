{id:'scalinglaw',term:'Scaling Law',full:'规模法则',cn:'Scaling Law',tl:'<b>把模型堆大，能力就跟着涨</b>——这条曾百试百灵的规律，近两年开始「涨不动」了。',ana:'像<b>往汤里加盐</b>：越加越咸，但咸到一定程度再多加只会齁——「堆料换能力」也有这条咸度曲线，所以全行业在找新抓手。',zone:'ai',lv:3,one:'模型越大能力越强的行业规律，近年开始变缓。',cf:'和「过拟合」无关；它描述的是能力随规模增长的整体规律，不是单个模型的问题。',al:["规模效应", "规模定律"],rel:['param','moe','compute'],scn:'公众号吵「Scaling Law 撞墙了没」「还该不该堆算力」，说的就是它；看到「损失随规模下降」这种术语，也是同一件事。',dlg:[{q:'Scaling Law 失效是什么意思？',a:'指继续堆参数，能力提升越来越小，性价比下降。'},{q:'那现在靠什么提升模型？',a:'靠更好的架构（如 MoE）、更高质量的数据，而不是单纯变大。'}],new:true,quiz:{q:'Scaling Law 失效是什么意思？',o:["指参数堆得越多模型必然越聪明，没有上限","指训练数据被用完，模型开始退步","指继续堆参数，能力提升越来越小，性价比下降。","指只有缩小模型才值得继续训练"],a:2,why:'「堆料有没有用」的行业规律。'}},


{id:'latency',term:'延迟',full:'Latency',cn:'延迟',tl:'<b>按下回车到 AI 吐出第一个字</b>的那段时间。延迟高就是等得久，体验直接变差。',ana:'像<b>外卖从下单到敲门</b>：商家做菜再快，路上也要时间——「接单快」不等于「送达快」，你体感的是全程。',zone:'ai',lv:1,one:'从你按下回车到 AI 吐出第一个字的时间。延迟高=等得久。',cf:'和「吞吐量」不同：延迟是「多快响应你一个人」，吞吐是「一秒能服务多少人」。',al:["响应时间", "首字延迟"],rel:['throughput','token','gpu'],scn:'AI 聊天时字一个个蹦得慢吞吞、语音助手半天才应一声，都是延迟在作怪；买模型 API 时商家爱晒「首字延迟」，看的就是这个。',dlg:[{q:'为什么有的 AI 回复一个字一个字蹦？',a:'为了降体感延迟——先出字比全等完体验好。'},{q:'延迟多少算好？',a:'首字 1 秒内体感就不错，超过 3 秒就明显卡。'}],new:true,quiz:{q:'为什么有的 AI 回复一个字一个字蹦？',o:["因为网速慢，字是逐个从服务器下载的","为了降体感延迟——先出字比全等完体验好。","服务器为省流量，故意少发几个字","模型在炫技，一字一顿显得有气势"],a:1,why:'等 AI 响应的时间。'}},
{id:'topp',term:'Top-p 采样',full:'核采样',cn:'Top-p 采样',tl:'<b>管 AI 敢不敢猜的旋钮</b>：调低只从最有把握的词里挑，调高连冷门词也敢往外蹦。',ana:'像<b>点菜只看热门榜</b>：调低等于只在前三名里选，顿顿安全没惊喜；调高是把榜单扩到前二十，偶尔踩雷但常有新花样。',zone:'ai',lv:3,one:'控制 AI 发散度的旋钮：越低越稳，越高越敢猜。',cf:'和「温度」是兄弟参数：温度管整体随机度，Top-p 管候选词池的大小。',al:["核采样", "nucleus sampling"],rel:['temp','llm','param'],scn:'要答案稳（写代码、抽数据）就调低，要文案有花样就调高；很多 AI 应用设置页那个「创造性」滑杆，背后就是它和温度这对兄弟。',dlg:[{q:'写文案要把 Top-p 调高还是低？',a:'调高些更有机灵劲儿；要严谨答案就调低。'},{q:'和温度冲突吗？',a:'不冲突，两个一起调，通常改一个就够。'}],new:true,quiz:{q:'写文案要把 Top-p 调高还是低？',o:["永远调到最高，越高越聪明","调高调低没区别，纯心理安慰","写严谨文档调高，闲聊时调低（正好反了）","调高些更有机灵劲儿；要严谨答案就调低。"],a:3,why:'控制 AI 发散程度的参数。'}},
{id:'kv',term:'KV 缓存',full:'KV Cache',cn:'KV 缓存',tl:'<b>模型的课堂笔记</b>：把读过的内容记成速查表，回答时不用从头重读，又快又省。',ana:'像<b>读长合同做了批注</b>：问第 10 条，你翻批注直接答，不用整份重读——笔记越厚（上下文越长），本子（显存）占得越多。',zone:'ai',lv:3,one:'模型的「笔记术」：记住处理过的内容，回复更快。',cf:'和「上下文」相关：上下文越长，KV 缓存占的显存越多。',al:["KV Cache", "键值缓存"],rel:['context','token','gpu'],scn:'贴一大段代码、聊一整本书还能秒回，就是 KV 缓存在扛；公众号聊「长文本又贵又慢」，根子也在它身上。',dlg:[{q:'为什么长对话越聊越慢？',a:'上下文变长，KV 缓存变大，计算量增加。'},{q:'这是软件还是硬件技术？',a:'是推理引擎里的软件优化技术。'}],new:true,quiz:{q:'为什么长对话越聊越慢？',o:["上下文变长，KV 缓存变大，计算量增加。","聊久了模型会累，反应自然变慢","聊天记录太多，手机内存不够了","模型故意变慢，逼你开新会话"],a:0,why:'模型提速省钱的「笔记」机制。'}},
{id:'structured',term:'结构化输出',full:'Structured Output',cn:'结构化输出',tl:'<b>让 AI 按你给定的格式交作业</b>：输出直接是程序能读的数据表格，不是一篇自由发挥的作文。',ana:'像<b>报销只收固定栏目的表格</b>：金额、日期、事由各归各位，系统直接录入；作文写得再好，机器也没法自动过账。',zone:'ai',lv:2,one:'让 AI 严格按指定格式（JSON）作答，程序能直接读。',cf:'和普通回答的区别：普通回答是给人看的段落，结构化输出是给程序看的数据。',al:["JSON Mode", "格式化输出"],rel:['json','api','llm'],scn:'让 AI 往飞书多维表格填字段、抓公众号按固定栏目出摘要，都得靠它——不然光解析小作文就能把你逼疯。',dlg:[{q:'为什么程序调 AI 都要 JSON？',a:'程序能直接解析字段，不用从一段话里「猜」答案在哪。'},{q:'AI 会格式错乱吗？',a:'早期会，现在主流 API 都支持强制 JSON 模式。'}],new:true,quiz:{q:'为什么程序调 AI 都要 JSON？',o:["JSON 更省流量，传输速度更快","JSON 是行业规定，不用就违规","程序能直接解析字段，不用从一段话里「猜」答案在哪。","AI 只认识 JSON，其他格式一律不回"],a:2,why:'让 AI 按表格格式交作业。'}},
{id:'tos',term:'思维树',full:'Tree-of-Thoughts',cn:'思维树',tl:'<b>AI 碰到难题先岔开几条路各想一遍</b>，比比哪条走得通，再挑最好的一条交卷。',ana:'像<b>下棋时在脑内真摆几步</b>：这步被将、那步吃车，摆完再定招——而不是一条道走到黑，错了才发现。',zone:'ai',lv:3,one:'AI 分叉多条思路比较后选优的思考法。',cf:'和「思维链」的区别：思维链是单线推理，思维树是多线并行再择优。',al:["Tree-of-Thoughts", "ToT"],rel:['cot','reason','selfcons'],scn:'让 AI 做数学、出方案时，开了「深度思考」的模型会先自己列草稿再答；公众号说推理模型「会分叉试错」，就是这类玩法。',dlg:[{q:'什么时候用思维树？',a:'数学、谜题这类有多种解法路径的复杂问题。'},{q:'日常问答需要吗？',a:'不需要，简单问题用思维树反而浪费。'}],new:true,quiz:{q:'什么时候用思维树？',o:["查「今天天气」这类简单事实时用","数学、谜题这类有多种解法路径的复杂问题。","任何问题都用，分支越多越好","只在模型出 bug 时拿来调试"],a:1,why:'AI 的「多方案比选」思考法。'}},
{id:'selfcons',term:'自洽性',full:'Self-Consistency',cn:'自洽性',tl:'<b>同一道题让 AI 独立答好几遍，投票取多数</b>：多数一致的结果，翻车的概率小得多。',ana:'像<b>问路连问五个人</b>：三个都说往东，那往东基本错不了；只问一个，赶上他记岔了你就完了。',zone:'ai',lv:3,one:'同一题让 AI 答多次投票取众数，降低错误率。',cf:'和「思维树」的区别：树是思考时分叉，自洽是答完后投票。',al:["Self-Consistency", "多数投票"],rel:['tos','temp','eval'],scn:'对准确性敏感的活（抽数据、做判断）可以这么干：同一提示跑 3-5 遍取一致结果；评测模型「稳不稳」也常用这招。',dlg:[{q:'为什么要答多次？',a:'每次推理路径略不同，多次投票能滤掉偶然错误。'},{q:'成本会变高吗？',a:'会，答 5 次就是 5 倍推理费，适合难题。'}],new:true,quiz:{q:'为什么要答多次？',o:["答得越多，模型记得越牢","为了绕过模型的回答次数限制","多次回答会自动拼成更长的答案","每次推理路径略不同，多次投票能滤掉偶然错误。"],a:3,why:'AI 答案的「多数表决」机制。'}},

{id:'agentops',term:'AgentOps',full:'智能体运维',cn:'AgentOps',tl:'<b>给 AI 员工装考勤和监控</b>：它每步干了什么、花了多少钱、卡在哪，一屏看全。',ana:'像<b>外卖平台盯骑手</b>：接单、取餐、送达步步有轨迹，超时卡单立刻知道——Agent 不装这层，「悄悄跑偏」你都没处看。',zone:'ai',lv:3,one:'像管员工一样管 AI Agent：盯步骤、看花费、找错处。',cf:'和「LLMOps」的区别：LLMOps 管模型服务，AgentOps 管会干活的智能体。',al:["智能体运维", "Agent 运维"],rel:['agent','llmops','harness'],scn:'你跑 Codex、自动化 Agent 批量干活时，看它调了哪些工具、烧了多少 token、哪步失败，用的就是这类面板；「Agent 落地难」一大半难在这。',dlg:[{q:'为什么要监控 Agent？',a:'它一跑几十步，不盯着手，错了都不知道错在哪步。'},{q:'小团队需要吗？',a:'Agent 进生产流程就需要，哪怕就两三个 Agent。'}],new:true,quiz:{q:'为什么要监控 Agent？',o:["它一跑几十步，不盯着手，错了都不知道错在哪步。","统计 Agent 每天说了多少废话","防止 Agent 半夜偷偷自己运行","监控能让 Agent 智商变高"],a:0,why:'Agent 的「工作日志+绩效考核」。'}},
{id:'llmops',term:'LLMOps',full:'大模型运维',cn:'LLMOps',tl:'<b>LLMOps</b>——把大模型服务稳定跑在生产环境的整套运维工程。',ana:'像<b>餐厅后厨的标准化管理</b>：菜谱（模型）再好，采购、出品、卫生没章法照样关门——它管的就是这条「开门店管线」。',zone:'ai',lv:3,one:'让大模型服务在生产环境稳定运行的整套工程实践。',cf:'和「AgentOps」的区别：LLMOps 偏模型层，AgentOps 偏任务执行层。',al:["大模型运维", "LLM 运营"],rel:['deploy','agentops','eval'],scn:'公司把模型接进自家产品，要管版本、限流、监控、出问题降级，这套活就叫 LLMOps；公众号聊「企业落地大模型」，多半在聊它。',dlg:[{q:'个人用户需要 LLMOps 吗？',a:'基本不需要，它是给「AI 服务要上线给很多人用」的团队准备的。'},{q:'核心解决什么问题？',a:'模型不是发出去就完了，要持续盯着质量和成本。'}],new:true,quiz:{q:'个人用户需要 LLMOps 吗？',o:["需要，每个用户都得配一套","需要，它是给模型充电用的","基本不需要，它是给「AI 服务要上线给很多人用」的团队准备的。","只有不用 API 的人士才需要"],a:2,why:'大模型服务的「运维手册」。'}},
{id:'eval',term:'评估集',full:'Evaluation Set',cn:'评估集',tl:'<b>评估集</b>——给模型出的「标准考卷」：固定题目+答案，客观比高下。',ana:'像<b>驾校的标准科目考</b>：倒库、侧方各打多少分，谁过谁挂有据可依——不用凭感觉说「这学员开得还行」。',zone:'ai',lv:2,one:'给模型出的标准考卷，用来客观比较模型好坏。',cf:'和「SWE-bench」的区别：SWE-bench 是特化考卷，专门考写代码改 bug。',al:["Eval", "模型评测"],rel:['swebench','benchmark','llmops'],scn:'新模型发布爱晒「XX 基准跑分」，那套题就是评估集；你想挑个合用的模型，也可以自建一小套「自家业务真题」来考它们。',dlg:[{q:'为什么发模型都要晒跑分？',a:'评估集提供统一比较标准，不然各说各话。'},{q:'跑分高就一定好用吗？',a:'不一定，考卷可能偏科，实际体验还要自己试。'}],new:true,quiz:{q:'为什么发模型都要晒跑分？',o:["跑分高说明模型没有任何短板","评估集提供统一比较标准，不然各说各话。","晒分是行业仪式，和实力无关","跑分是为了引导用户多充值"],a:1,why:'模型的「标准化考试」。'}},
{id:'swebench',term:'SWE-bench',full:'代码基准测试',cn:'SWE-bench',tl:'<b>SWE-bench</b>——考 AI「修真实开源项目 bug」的最硬代码基准。',ana:'像<b>拉真实事故现场考修车师傅</b>：不是给你拆好的教学车，而是拖来一台真坏的——修得好才算数。',zone:'ai',lv:3,one:'考 AI 修真实开源项目 bug 能力的硬核基准测试。',cf:'和一般评估集的区别：题目是真实 GitHub issue，不是玩具题，难度高得多。',al:["SWE-bench", "软件工程基准"],rel:['eval','codegen','benchmark'],scn:'AI 编程工具宣传「SWE-bench 得分百分之几十」，意思是被真实 GitHub bug 考倒一片后它还剩几成；比谁家编程 AI 强，这是硬指标之一。',dlg:[{q:'为什么常听 SWE-bench 跑分？',a:'它是检验编程 Agent 实力的最硬指标之一。'},{q:'分数怎么读？',a:'解决率百分比，目前顶尖模型在 70%+。'}],new:true,quiz:{q:'为什么常听 SWE-bench 跑分？',o:["它是给程序员考驾照的题库","它是 GitHub 官方的下载量排行","分数越高，写出的代码越长","它是检验编程 Agent 实力的最硬指标之一。"],a:3,why:'编程 AI 的「真实难度考试」。'}},
{id:'guitraining',term:'GUI 自动化',full:'界面操作代理',cn:'GUI 自动化',tl:'<b>GUI 自动化</b>——AI 像人一样看屏幕点鼠标，替你操作软件。',ana:'像<b>教新员工用公司那套祖传老系统</b>：不给接口文档，让他看着屏幕自己点——他能学会，就能替你点。',zone:'ai',lv:2,one:'AI 像人一样看屏幕点鼠标，替你操作软件。',cf:'和「工具调用」的区别：工具调用走接口，GUI 自动化走界面——没接口的软件也能操作。',al:["界面操作", "Computer Use"],rel:['agent','toolcall','planexec'],scn:'税务申报、ERP、单位内部系统这些没接口的软件，AI 想替你操作只能「看屏幕点鼠标」；公众号聊「数字员工」「电脑 Agent」，核心技术就是它。',dlg:[{q:'什么场景最有用？',a:'老系统没 API、只能人工点的软件，AI 替你点。'},{q:'会点错吗？',a:'会，所以重要操作要人在旁边盯着。'}],new:true,quiz:{q:'什么场景最有用？',o:["老系统没 API、只能人工点的软件，AI 替你点。","给最新版软件补写 API 接口","帮手机刷机解锁系统","给游戏外挂做自动连点"],a:0,why:'AI 的「替你点鼠标」。'}},
{id:'fullmodal',term:'全模态',full:'Omni Model',cn:'全模态',tl:'<b>一个模型同时懂文字、图、声音、视频</b>：进什么懂什么，出什么行什么，不用几个模型拼积木。',ana:'像<b>全能翻译官</b>：听得懂方言、看得懂图表、写得出文案，一个人全包——而不是问图找一位、问声音再请一位。',zone:'ai',lv:2,one:'一个模型搞定文字图片声音视频的输入输出。',cf:'和「多模态」的区别：多模态可能是拼装的，全模态强调原生统一处理。',al:["Omni", "原生多模态"],rel:['vlm','multi','t2i'],scn:'新模型发布会常说「原生全模态」：对着它说话、扔视频它能直接懂；公众号聊最新版 GPT、Gemini 时这是高频词。',dlg:[{q:'全模态有什么实际好处？',a:'看视频直接问答、语音带情绪理解，不用在多个工具间倒手。'},{q:'和 GPT-4o 是一回事吗？',a:'o 就是 omni（全）的意思，它是早的代表。'}],new:true,quiz:{q:'全模态有什么实际好处？',o:["让手机更省电，待机更久","模型体积变小，下载更快","看视频直接问答、语音带情绪理解，不用在多个工具间倒手。","打字速度提升十倍"],a:2,why:'AI 的「眼耳口鼻一体的模型」。'}},
{id:'compression',term:'模型压缩',full:'Model Compression',cn:'模型压缩',tl:'<b>给大模型瘦身</b>：砍冗余、降精度，让它塞得进手机和家用电脑，能力留个大头。',ana:'像<b>把行李箱真空压缩</b>：体积小一大半，衣服还是那些衣服；代价是细节有损失，用之前得「回弹」一下（重新校准）。',zone:'ai',lv:2,one:'把大模型「瘦身」到手机能跑，能力留大半。',cf:'和「量化」的区别：量化是压缩的一种（降数字精度），压缩还包括砍结构。',al:["模型瘦身", "Model Compression"],rel:['quant','local','slm'],scn:'想在本地跑 AI（图隐私、图省钱），靠的就是压缩后的小模型；公众号聊「手机上跑大模型」「端侧 AI」，背后全是它和量化。',dlg:[{q:'为什么手机也能跑 AI 了？',a:'压缩技术+专用芯片一起进步，百亿参数模型塞进手机。'},{q:'压缩后能力掉多少？',a:'好的压缩能留 90%+ 能力，体积小一个量级。'}],new:true,quiz:{q:'为什么手机也能跑 AI 了？',o:["手机内存现在比电脑还大","压缩技术+专用芯片一起进步，百亿参数模型塞进手机。","手机版 AI 其实是远程服务器在算","模型变小后智商反而更高"],a:1,why:'大模型的「减肥术」。'}},
{id:'codegen',term:'代码生成',full:'Code Generation',cn:'代码生成',tl:'<b>你说人话，AI 直接写出能跑的代码</b>：小到一行公式，大到整个网页。',ana:'像<b>跟装修队说「我要日式原木风」</b>，对方直接交出能住的房子——而不是甩给你一本施工规范让你自己砌墙。',zone:'ai',lv:1,one:'你描述需求，AI 直接写代码，小到公式大到页面。',cf:'和「代码补全」的区别：补全是你写一半它猜下文，生成是你开口它全写。',al:["Code Generation", "AI 写代码"],rel:['vibe','scaffold','cli'],scn:'你用 Codex、WorkBuddy 生成脚本和页面，天天在用它；「vibe coding 敲自然语言就能出软件」的底座就是代码生成。',dlg:[{q:'生成的代码能直接用吗？',a:'简单脚本可以；正经项目要审，AI 会写错、埋雷。'},{q:'和 Codex 什么关系？',a:'Codex 就是专门的代码生成/编程 Agent。'}],new:true,quiz:{q:'生成的代码能直接用吗？',o:["能，AI 写的代码从不出错","不能，AI 写的代码全都跑不起来","只有付费模型写的才能直接用","简单脚本可以；正经项目要审，AI 会写错、埋雷。"],a:3,why:'AI 替你写代码。'}},
{id:'ast',term:'AST',full:'抽象语法树',cn:'AST',tl:'<b>代码的「骨架 X 光片」</b>：把一坨文字拆成「这是函数、那是循环、谁调用谁」的树状结构。',ana:'像<b>把文章拆成提纲</b>：段落、句子、主谓宾各归各位——要动「结构」时按提纲改，比在原文里大海捞针稳得多。',zone:'ai',lv:3,one:'代码的「结构骨架图」，编译器和 AI 靠它理解代码。',cf:'和普通文本的区别：AST 记录了「这是函数、那是循环、谁调用谁」的结构。',al:["Abstract Syntax Tree", "语法树"],rel:['codegen','debug','lint'],scn:'AI 改代码前常先把代码解析成 AST 再动手（你项目的 check 脚本校验词条也是这思路）；编辑器的「转到定义、一键重命名」也靠它。',dlg:[{q:'AI 改代码为什么要 AST？',a:'按结构改才不会改坏，比如精准替换某个函数体。'},{q:'用户需要懂它吗？',a:'不需要，它是工具内部的「理解方式」。'}],new:true,quiz:{q:'AI 改代码为什么要 AST？',o:["按结构改才不会改坏，比如精准替换某个函数体。","AST 能让代码运行速度翻倍","AST 是代码压缩加密的格式","没有 AST，AI 连代码都读不了"],a:0,why:'代码的「结构透视图」。'}},
{id:'pull',term:'Pull Request',full:'PR 提交',cn:'Pull Request',tl:'<b>把你的改动打包，申请并进主线</b>：负责人和同事先审，点头了才收——不是想进就进。',ana:'像<b>给杂志投稿走审稿</b>：稿子交上去，编辑批注、你修改、主编拍板才登刊；直接往正式版塞稿子，谁都不敢收。',zone:'code',lv:2,one:'把你的代码改动「申请合并」进主项目的正式流程，别人先审再收。',cf:'和「提交 commit」的区别：commit 是记一笔账，PR 是申请把一批账并入主线。',al:["PR", "合并请求"],rel:['merge','commit','repo'],scn:'GitHub 上常见的「PR」就是它：给开源项目提修复、公司里合并代码全走这套；看到「PR 已合并」就是审过了、收进主线了。',dlg:[{q:'为什么要有 PR？',a:'改动先给人/AI 审一眼，防「改崩主线」，协作必备。'},{q:'AI 写的代码也走 PR 吗？',a:'是，Code Review Agent 就常挂在 PR 上自动审。'}],new:true,quiz:{q:'为什么要有 PR？',o:["PR 是程序员的绩效考核表","防止别人偷看你的代码","改动先给人/AI 审一眼，防「改崩主线」，协作必备。","PR 能让代码自动变快"],a:2,why:'代码改动的「审批流」。'}},
{id:'merge',term:'Merge',full:'合并分支',cn:'Merge',tl:'<b>把两条分支上的活儿汇成一条</b>：各自开发的改动合到一起，撞车了当场「劝架」。',ana:'像<b>两条支流汇进干流</b>：水都收下；要是同一处两人改得不一样（冲突），就得有人拍板听谁的。',zone:'code',lv:2,one:'把两条分支上的改动汇合成一条，像两条小路并成一条大路。',cf:'和「PR」的关系：PR 被批准后执行的动作就是 merge。',al:["合并", "git merge"],rel:['pull','branch','diff'],scn:'协作写代码你改 A 文件我改 B 文件，最后 merge 一次收齐；公众号聊「合并冲突」「分支管理」，说的都是这步的喜怒哀乐。',dlg:[{q:'合并冲突是什么？',a:'两条分支改了同一处，程序不知道听谁的，要人工裁决。'},{q:'怎么减少冲突？',a:'小步快合，别让分支分叉太久。'}],new:true,quiz:{q:'合并冲突是什么？',o:["两条分支都写得太长，塞不下了","两条分支改了同一处，程序不知道听谁的，要人工裁决。","合并时网断了，传输不完整","两个程序员的工位挨得太近"],a:1,why:'分支的「汇流」。'}},

{id:'compile',term:'编译',full:'Compile',cn:'编译',tl:'<b>把人写的代码整体翻译成机器能跑的文件</b>：翻译这步报错叫编译失败，程序根本出不来。',ana:'像<b>把整本中文书一次性译成英文再出版</b>：译错了整批退回；而「解释执行」是同声传译，说一句译一句（Python/JS）。',zone:'code',lv:2,one:'把人写的代码翻译成机器能执行的文件。翻译这一步出错=编译…',cf:'和「解释执行」的区别：编译一次性翻译完再跑（C/Java），解释型边翻译边跑（Python/JS）。',al:["Compile", "构建"],rel:['runtime','debug','codegen'],scn:'公众号聊「Rust 编译报错劝退新人」「Go 编译秒完成」，聊的都是这一步；装软件时看到 build、compile，就是它在工作。',dlg:[{q:'编译报错和运行报错哪个好？',a:'编译报错好——上线前就暴露了，运行报错可能用户先踩到。'},{q:'AI 能帮修编译错误吗？',a:'编译器报错信息喂给 AI，修起来很快。'}],new:true,quiz:{q:'编译报错和运行报错哪个好？',o:["运行报错好，说明程序至少跑起来了","都一样，报错就是坏消息","编译报错说明代码写得太烂","编译报错好——上线前就暴露了，运行报错可能用户先踩到。"],a:3,why:'代码的「翻译成机器码」。'}},

{id:'dependency2',term:'依赖管理',full:'Dependencies',cn:'依赖管理',tl:'<b>你的项目用了别人写好的成百上千个现成零件</b>，依赖管理就是管好这些零件的版本和来源。',ana:'像<b>装修房子的水电瓷砖全是买现成的</b>：省事，但每样都绑着一个版本——哪家涨价、停产、有质量问题，你都得跟着应对。',zone:'code',lv:2,one:'你的项目用了别人写的成百上千个现成组件',cf:'和「包管理器」的关系：包管理器（npm/pip）是管依赖的工具。',al:["依赖", "Dependencies"],rel:['package2','pkg','deploy'],scn:'项目里那个 package.json、requirements.txt 就是依赖清单；公众号聊「供应链投毒」「一个开源包删库全网瘫痪」，聊的就是它的风险。',dlg:[{q:'为什么项目动辄几百个依赖？',a:'站在巨人肩膀上——日期处理、网络请求都不用自己写。'},{q:'依赖有什么风险？',a:'某个依赖出漏洞或停更，你的项目跟着遭殃（供应链风险）。'}],new:true,quiz:{q:'为什么项目动辄几百个依赖？',o:["站在巨人肩膀上——日期处理、网络请求都不用自己写。","依赖越多，项目显得越专业","是开发工具凑数营销的手段","依赖少了程序会主动报错"],a:0,why:'项目借来的「零件清单」。'}},
{id:'package2',term:'包管理器',full:'Package Manager',cn:'包管理器',tl:'<b>自动下载、安装、更新「别人写好的代码包」的工具</b>，各编程语言都有自己的一家。',ana:'像<b>手机的应用商店</b>：想要什么功能搜一下、一条命令装好，还能一键升级——npm、pip 就是程序员的应用商店。',zone:'code',lv:1,one:'自动下载、安装、更新「别人写好的代码包」的工具',cf:'常见有 npm（JS）、pip（Python）、apt（Linux）——各语言一个。',al:["npm", "pip"],rel:['dependency2','pkg','cli'],scn:'你在 Codex 里装包、看教程里「npm install」「pip install」，用的都是它；装完项目里多出一堆依赖，就是上一条「依赖管理」的活。',dlg:[{q:'和手动下载比好在哪？',a:'一条命令装好，连带的子依赖自动处理。'},{q:'会装到恶意包吗？',a:'有此风险（ typosquatting），用主流包、看清名字。'}],new:true,quiz:{q:'和手动下载比好在哪？',o:["包管理器里的软件全部免费","手动下载的包都带病毒","一条命令装好，连带的子依赖自动处理。","它能让下载速度突破物理极限"],a:2,why:'代码世界的「应用商店」。'}},
{id:'gitignore',term:'Gitignore',full:'忽略清单',cn:'Gitignore',tl:'<b>一份「这些文件别记进版本历史」的清单</b>：日志、缓存、带密钥的配置，全靠它挡在外面。',ana:'像<b>搬家打包时的「不带清单」</b>：写在上面的东西留在旧家——没写进去的钥匙（密码），丢了大门就被人拿了。',zone:'code',lv:2,one:'一份「别把这些文件记进版本历史」的清单',cf:'常见忽略对象：日志、缓存、含密钥的配置——推到公开仓库=泄密。',al:[".gitignore", "忽略文件"],rel:['git','repo','commit'],scn:'项目里那个 .gitignore 文件就是它；「程序员的钥匙（密码）推上 GitHub 被扫走」，九成是清单没写对。',dlg:[{q:'忘了配 gitignore 会怎样？',a:'密码、大文件被推上 GitHub，删了历史也留着。'},{q:'放哪？',a:'项目根目录的 .gitignore 文件，一行一条规则。'}],new:true,quiz:{q:'忘了配 gitignore 会怎样？',o:["git 会自动帮你补一个默认的","密码、大文件被推上 GitHub，删了历史也留着。","项目会因缺文件而无法启动","只是界面显示乱码，无实际影响"],a:1,why:'git 的「别拍这些」。'}},
{id:'fork',term:'Fork',full:'复刻仓库',cn:'Fork',tl:'<b>在平台上把别人的项目整套复制一份到自己账号下</b>：随便改，不影响原作者。',ana:'像<b>把别人公开的菜谱复印一份回家改</b>：你加辣减盐随便折腾，原菜谱一个字没动；改得好可以「申请」并回原版（PR）。',zone:'code',lv:2,one:'在 GitHub 上把别人的项目完整复制一份到自己账号下',cf:'和 clone 的区别：clone 是下载到本地，fork 是在平台上复制一份归属你。',al:["复刻", "fork 仓库"],rel:['repo','pull','diff'],scn:'你看到的开源项目页面右上角「Fork」按钮就是它；想拿开源项目二开、或给原作者提修改，第一步都是 fork。',dlg:[{q:'什么时候要 fork？',a:'想改别人的开源项目（提 PR 前提），或想基于它做自己的版本。'},{q:'fork 了就要维护吗？',a:'看你用途，提完 PR 删掉也行。'}],new:true,quiz:{q:'什么时候要 fork？',o:["每次拉取代码前都要先 fork","fork 会把对方仓库据为己有","只有付过费的项目才能 fork","想改别人的开源项目（提 PR 前提），或想基于它做自己的版本。"],a:3,why:'开源项目的「一键复制」。'}},
{id:'codebase',term:'代码库',full:'Codebase',cn:'代码库',tl:'<b>一个项目全部代码的总称</b>：「读懂整个 codebase」就是吃透这个项目的所有代码。',ana:'像<b>一栋楼的全部图纸</b>：承重、水电、管线的总集；盖新房间（加功能）前得先知道墙上哪儿能开洞。',zone:'code',lv:1,one:'一个项目全部代码的总称。「读懂整个 codebase」=…',cf:'和「仓库」几乎同义：仓库强调 git 存储形态，代码库强调内容本身。',al:["代码仓库", "项目代码"],rel:['repo','git','refactor2'],scn:'让 AI「通读 codebase 再改」是提升改码质量的常用招；公众号说「维护祖传 codebase 像考古」，就是吐槽历史代码又多又乱。',dlg:[{q:'AI 说「扫描你的 codebase」是什么意思？',a:'它把项目全部文件读一遍，建立整体理解再干活。'},{q:'大 codebase 有什么难？',a:'文件几万个，牵一发动全身，没人能全记住。'}],new:true,quiz:{q:'AI 说「扫描你的 codebase」是什么意思？',o:["它把项目全部文件读一遍，建立整体理解再干活。","用杀毒软件把项目扫一遍","把项目打包上传云盘备份","统计代码行数好按行收费"],a:0,why:'一个项目的「全部代码」。'}},
{id:'refactor2',term:'重构',full:'Refactoring',cn:'重构',tl:'<b>不改功能，只把代码内部整理干净</b>：外面的表现一点没变，里面的结构焕然一新。',ana:'像<b>不换菜品只重排厨房</b>：客人吃到的味道不变，但师傅做菜更快、更少切到手——这就是重构的价值。',zone:'code',lv:2,one:'不改功能，只把代码内部整理干净——像不换菜品只重排厨房。',cf:'和重写的区别：重构小步走、随时可用；重写是推倒重来，风险大。',al:["重构", "代码整理"],rel:['codebase','smoke','lint'],scn:'「先重构再加功能」是工程习惯；AI 编程时代重构变便宜了，一句「把这段拆成函数」就干完，但每次重构后必须跑测试。',dlg:[{q:'为什么要重构？',a:'代码能跑但越堆越乱，重构让它以后改起来不头疼。'},{q:'AI 擅长重构吗？',a:'擅长，给它明确「不改行为只整理」的约束效果很好。'}],new:true,quiz:{q:'为什么要重构？',o:["重构能让程序功能变多","代码太慢时重构必然提速十倍","代码能跑但越堆越乱，重构让它以后改起来不头疼。","重构是为了删掉同事写的代码"],a:2,why:'代码的「厨房大扫除」。'}},
{id:'codeReview',term:'代码评审',full:'Code Review',cn:'代码评审',tl:'<b>代码合入前被人通读挑错</b>：bug、安全漏洞、写法规范，都在这一步拦。',ana:'像<b>作文交前让同桌读一遍</b>：自己看了八遍没发现的错别字，别人一眼就指出来——写代码也一样，盲区自己看不见。',zone:'code',lv:2,one:'代码合入前被通读挑错：bug、安全、规范。',cf:'和「测试」的区别：测试验「跑起来对不对」，评审看「写得有没有坑」。',al:["CR", "代码审查"],rel:['pull','lint','smoke'],scn:'GitHub 的 PR 里那些评论、批注就是代码评审；AI 时代变成「AI 先审一遍人再审」，你交给 Codex 的代码也值得让它自己复查。',dlg:[{q:'AI 能做 Code Review 吗？',a:'能且已是标配，但重要代码仍要人把关。'},{q:'评审被挑刺是坏事吗？',a:'是好事——问题在上线前被发现，成本最低。'}],new:true,quiz:{q:'AI 能做 Code Review 吗？',o:["不能，AI 根本看不懂人类代码","能且已是标配，但重要代码仍要人把关。","能，AI 审过就绝对没问题","只有大厂才有资格用 AI 审查"],a:1,why:'代码合入前的「体检」。'}},
{id:'pair',term:'结对编程',full:'Pair Programming',cn:'结对编程',tl:'<b>两个人挤一台电脑写代码</b>：一个写、一个盯，出错当场抓；现在常见的是 AI 当那个「副驾」。',ana:'像<b>驾校教练坐副驾</b>：你开他看，错在萌芽就喊停——比事后看录像（评审）更早发现问题。',zone:'code',lv:3,one:'两个人挤一台电脑写代码',cf:'和 AI 结对的形式：你写它补全，或它写你审——本质还是「一双眼睛盯着」。',al:["Pair Programming", "双人编程"],rel:['copilot2','codeReview','vibe'],scn:'Codex、Copilot 的本质就是「跟 AI 结对」：它补全你审、它写你改；公众号说「AI 结对编程改变工作流」，就是这个老概念的新搭档。',dlg:[{q:'AI 时代还需要人结对吗？',a:'AI 补全+人审的组合就是新型结对，效率更高。'},{q:'传统结对有什么好处？',a:'实时互纠、知识传递，bug 在写的时候就死了。'}],new:true,quiz:{q:'AI 时代还需要人结对吗？',o:["不需要了，AI 全自动写更省人力","还是老样子，必须两人挤一台电脑","结对编程已被各大公司明令禁止","AI 补全+人审的组合就是新型结对，效率更高。"],a:3,why:'写代码的「双人四眼」。'}},
{id:'boilerplate',term:'样板代码',full:'Boilerplate',cn:'样板代码',tl:'<b>每个项目都要抄一遍的「开场白代码」</b>：配置、目录、固定写法，跟你的业务没关系但缺了跑不起来。',ana:'像<b>开会前摆好的桌牌茶水投影</b>：跟会议内容无关，但每次都得有；聪明人做了模板（脚手架）一键生成，不每次手写。',zone:'code',lv:2,one:'每个项目都要抄一遍的「开场白代码」',cf:'和「脚手架」的区别：脚手架是自动生成样板代码的工具。',al:["模板代码", "样板文件"],rel:['scaffold','tpl','configfile'],scn:'新起一个网页、插件、机器人项目，开头那堆固定文件就是 boilerplate；AI 编程最强场景之一就是「帮我把样板代码写了」。',dlg:[{q:'为什么会有样板代码？',a:'框架要求的固定格式，不写跑不起来。'},{q:'AI 对样板代码意味着什么？',a:'一句话生成，从此不用手抄——最先被 AI 消灭的体力活。'}],new:true,quiz:{q:'为什么会有样板代码？',o:["框架要求的固定格式，不写跑不起来。","是程序员偷懒复制粘贴的产物","是编译器自动生成又忘了删的","样板代码写得越多性能越好"],a:0,why:'项目的「开场套话」。'}},
{id:'harden',term:'代码加固',full:'Hardening',cn:'代码加固',tl:'<b>功能没坏也主动上防御</b>：输入校验、权限收紧、防滥用，把「不设防的口子」提前焊死。',ana:'像<b>门锁没坏也加装监控</b>：不是现在有贼，是小偷专挑没防备的那家；代码的漏洞也是专挑你没校验的入口进。',zone:'code',lv:3,one:'主动给代码上「防御工事」',cf:'和「修 bug」的区别：修 bug 是功能坏了，加固是功能没坏但有不设防的口子。',al:["安全加固", "Security Hardening"],rel:['guardrail','twofa','bug'],scn:'你做的网页表单、API 最容易被恶意输入打穿（填个负数、传个超大文件），加固就是把这些口子提前堵上；「安全加固」常跟上线前检查一起做。',dlg:[{q:'常见的加固动作？',a:'输入校验、最小权限、关默认端口、加密敏感数据。'},{q:'什么时候做？',a:'上线前必做一轮；「先上线再说」=裸奔。'}],new:true,quiz:{q:'常见的加固动作？',o:["把代码全注释掉防止被读","给服务器贴防尘罩防黑客","输入校验、最小权限、关默认端口、加密敏感数据。","把项目改名成「安全版」"],a:2,why:'代码的「装防盗门」。'}},
{id:'uistring',term:'UI 字符串',full:'界面文案',cn:'UI 字符串',tl:'<b>界面上用户看到的所有文字</b>：按钮、提示、报错、确认框，一句一句都是独立管理的字符串。',ana:'像<b>餐厅菜单单独印一张</b>：改菜名、出英文版，换张纸就行，不用重砌灶台——文字和功能分开管，改起来互不牵连。',zone:'code',lv:2,one:'界面上用户看到的所有文字（按钮、提示、报错）',cf:'为什么不说死在代码里？',al:["文案", "界面文本"],rel:['html','configfile','md'],scn:'你想把应用界面改成中文/英文、或改个按钮文案，改的就是 UI 字符串；做国际化（i18n）第一步就是把它们从代码里抽出来。',dlg:[{q:'改文案要发版=灾难；集中放，运营自己就能改。',a:'和国际化什么关系？'},{q:'UI 字符串集中存放是多语言（i18n）的前提。',a:'因为它被集中管理，改文案不用改代码。'}],new:true,quiz:{q:'为什么要集中管理 UI 字符串？',o:["字符串集中后 App 体积会变小","改文案不用发版——集中放，运营自己改配置就能生效。","是为了防止程序员偷看文案","分散放置会让手机发热"],a:1,why:'界面上的「所有字」。'}},
{id:'breakpoint',term:'调试断点',full:'Breakpoint',cn:'调试断点',tl:'<b>在代码某行下个标记，程序跑到这就「定格」</b>：所有变量的值、执行到哪一步，全摊开给你看。',ana:'像<b>比赛录像逐帧暂停</b>：裁判拿不准谁犯规，就停在这一帧看每人的站位——断点就是程序的暂停键。',zone:'code',lv:2,one:'查 bug 利器',cf:'和 print 调试的区别：断点不用改代码，随时看所有变量的值。',al:["断点", "Debug 断点"],rel:['debug','console','log'],scn:'AI 生成的代码不对劲时，与其瞎猜，不如下断点看「变量在这一步到底是什么」；浏览器按 F12 也能给网页下断点。',dlg:[{q:'为什么比 print 高级？',a:'print 只能看你想看的，断点能看一切还能单步走。'},{q:'AI 时代还用吗？',a:'用，AI 给的修复方案也要断点验证。'}],new:true,quiz:{q:'为什么比 print 高级？',o:["断点能让程序跑得更快","print 语句已被所有语言废弃","断点是 AI 自动加的，不用学","print 只能看你想看的，断点能看一切还能单步走。"],a:3,why:'代码里的「暂停键」。'}},
{id:'lint',term:'Lint',full:'代码静态检查',cn:'Lint',tl:'<b>不运行代码就挑毛病</b>：没用的变量、会出事的写法、危险函数，写完立刻报给你。',ana:'像<b>作文的自动批改</b>：不看内容好不好，先挑错别字和病句——低级错误当场拦下，好习惯慢慢养出来。',zone:'code',lv:2,one:'不运行代码就挑毛病',cf:'和「格式化」的区别：格式化管好不好看，Lint 管有没有坑。',al:["ESLint", "静态检查"],rel:['format','debug','smoke'],scn:'保存代码时飘的黄线红线就是 Lint 在说话；你项目里那个「上线前体检脚本」干的也是同类活——发布前先挑毛病，不许带病上线。',dlg:[{q:'为什么要装 Lint？',a:'低级错误在写的时候就拦下，比测试发现的成本低。'},{q:'报错都要修吗？',a:'规则可配置，团队约定「哪些必须修哪些警告」。'}],new:true,quiz:{q:'为什么要装 Lint？',o:["低级错误在写的时候就拦下，比测试发现的成本低。","Lint 能自动修好所有 bug","不装 Lint 代码无法编译","Lint 会让代码自动变快"],a:0,why:'代码的「语法警察」。'}},
{id:'format',term:'代码格式化',full:'Formatter',cn:'代码格式化',tl:'<b>一键把代码排整齐</b>：缩进、空格、换行按统一风格来，只动排版不动逻辑。',ana:'像<b>全办公室统一字体字号</b>：内容一个字没变，但谁接手看着都舒服；省下的「他在用几个空格」之争，全是不值得吵的架。',zone:'code',lv:1,one:'一键把代码排整齐',cf:'和 Lint 的区别：格式化只管排版不动逻辑；Lint 查逻辑隐患。',al:["Prettier", "格式化工具"],rel:['lint','codeReview','md'],scn:'「保存时自动格式化」是程序员标配；多人项目里先统一格式，代码评审才不用把时间浪费在「缩进是 2 格还是 4 格」上。',dlg:[{q:'为什么要统一格式？',a:'省下「这缩进怎么回事」的争论，评审只看逻辑。'},{q:'主流工具？',a:'Prettier（JS）、Black（Python），保存自动格式化。'}],new:true,quiz:{q:'为什么要统一格式？',o:["格式统一后运行速度更快","纯粹为了好看，公司规定而已","省下「这缩进怎么回事」的争论，评审只看逻辑。","不统一格式程序直接报错"],a:2,why:'代码的「自动排版」。'}},
{id:'configfile',term:'配置文件',full:'Config File',cn:'配置文件',tl:'<b>程序「可调参数」集中存放的文件</b>：改配置不动代码，改完重启就生效。',ana:'像<b>洗衣机面板上的旋钮</b>：水温、转速随手调，不用拆机改线路；程序行为想换，改配置文件就行，代码一行不动。',zone:'code',lv:1,one:'程序「可调参数」集中存放的文件',cf:'常见格式：JSON、YAML、TOML——都是「键=值」的纯文本。',al:["Config", "配置"],rel:['json','yaml','toml'],scn:'你见过的 manifest.json、.gitignore、各种 .yaml 都是配置文件；接 API 时的 key 也放这里（再进 .gitignore 防泄露）。',dlg:[{q:'为什么不写死在代码里？',a:'换环境（测试/正式）只换配置不动代码，安全且快。'},{q:'配置文件有什么风险？',a:'里面常有密码，进 git 前必须确认 gitignore 配好。'}],new:true,quiz:{q:'为什么不写死在代码里？',o:["写死在代码里会导致内存泄漏","换环境（测试/正式）只换配置不动代码，安全且快。","配置文件运行速度比代码快","代码里不允许出现数字和中文"],a:1,why:'程序的「设置面板」。'}},
{id:'singleton',term:'单例模式',full:'Singleton',cn:'单例模式',tl:'<b>保证某个东西全局只有一份</b>：谁都用同一个，不各建各的——省资源、状态也一致。',ana:'像<b>一个公司只有一个公章</b>：谁盖章都用同一枚，记录才对得上；要是每个部门私刻一枚，账目马上乱套。',zone:'code',lv:3,one:'保证一个东西全局只有一份',cf:'设计模式的一种：解决「重复创建浪费/状态不一致」的问题。',al:["单例", "Singleton Pattern"],rel:['env','codebase','runtime'],scn:'数据库连接、全局配置、日志器通常做成单例；面试常考、面试常考，实际写代码时你用 AI 生成的配置管理多半就是它。',dlg:[{q:'滥用会怎样？',a:'全局状态互相干扰，测试难做——它也是「反模式」常客。'},{q:'什么场景合适？',a:'日志器、全局配置这类「天然只该有一份」的东西。'}],new:true,quiz:{q:'滥用会怎样？',o:["程序会自动复制出多个实例","滥用会让程序无法联网","类名太长会影响编译速度","全局状态互相干扰，测试难做——它也是「反模式」常客。"],a:3,why:'全局「只此一份」的模式。'}},
{id:'callback',term:'回调函数',full:'Callback',cn:'回调函数',tl:'<b>「完事了打这个电话」</b>：你把一个函数交给别人，事情办完后它替你调用——这就是回调。',ana:'像<b>餐厅说「好了叫你」留个手机号</b>：你不用站柜台傻等；那个号码就是回调函数，叫你就是「调用」。',zone:'code',lv:2,one:'「完事了打这个电话」',cf:'和「异步」的关系：异步操作完成后靠回调通知你结果。',al:["Callback", "回调"],rel:['async','promise','js'],scn:'按钮「点击后干什么」、定时器「到点干什么」、请求「回来后干什么」，全是回调；老代码里回调套回调能套成金字塔，后来才有 Promise 救场。',dlg:[{q:'回调地狱是什么？',a:'回调套回调套回调，缩进深得像楼梯——被 Promise/async 治好了。'},{q:'还用回调吗？',a:'底层到处是，业务代码基本被 async/await 替代。'}],new:true,quiz:{q:'回调地狱是什么？',o:["回调套回调套回调，缩进深得像楼梯——被 Promise/async 治好了。","回调写错导致程序当场崩溃","回调太多把 CPU 烧坏了","回调的返回值全是 null"],a:0,why:'「办完事打给我」的函数。'}},
{id:'async',term:'异步',full:'Async / Await',cn:'异步',tl:'<b>发出任务后不等结果，先去干别的</b>：结果好了再回来处理——界面不卡、效率不减。',ana:'像<b>奶茶店点了拿号</b>：同步是站柜台前干等；异步是拿号坐下刷手机，叫号了再去取。',zone:'code',lv:2,one:'「等结果时先去干别的」',cf:'和同步的区别：同步是傻等（界面卡死），异步是先干别的、好了叫我。',al:["异步编程", "async await"],rel:['promise','callback','js'],scn:'你在 Codex 里丢一个长任务还能继续打字，就是异步在工作；页面一点按钮就转圈卡死，多半是被写成了同步。',dlg:[{q:'async/await 是什么？',a:'让异步代码写起来像同步一样直白，消灭回调地狱。'},{q:'什么时候必须异步？',a:'网络请求、读文件、任何「要等」的操作。'}],new:true,quiz:{q:'async/await 是什么？',o:["让代码自动多线程并行加速","把同步代码自动改成异步","让异步代码写起来像同步一样直白，消灭回调地狱。","是一种新的数据库查询语法"],a:2,why:'不傻等的「边等边干」。'}},
{id:'promise',term:'Promise',full:'异步承诺',cn:'Promise',tl:'<b>异步任务的「欠条」</b>：现在没结果，但承诺将来给你——到时兑现（成功）或拒付（失败）。',ana:'像<b>取餐小票上的取餐码</b>：小票在手说明餐「在路上」；凭码取餐是兑现，告知售罄是拒付，你都能凭码处理。',zone:'code',lv:3,one:'异步操作的「欠条」',cf:'和回调的关系：Promise 是回调的规范化升级，链式调用不再嵌套成山。',al:["Promise", "承诺对象"],rel:['async','callback','js'],scn:'代码里看到 .then()、await 就是在等这张「欠条」兑现；它把回调套回调的金字塔拉直成一条链，是现代 JS 的标配。',dlg:[{q:'三种状态是什么？',a:'进行中（pending）、成功（fulfilled）、失败（rejected）——定了就不能改。'},{q:'和 async 什么关系？',a:'await 就是「等这张欠条兑现」的语法糖。'}],new:true,quiz:{q:'三种状态是什么？',o:["开始、暂停、结束——可以来回切换","进行中（pending）、成功（fulfilled）、失败（rejected）——定了就不能改。","加载中、已读、已忽略","排队中、处理中、已完成——能反复进入"],a:1,why:'异步结果的「欠条」。'}},
{id:'scope',term:'作用域',full:'Scope',cn:'作用域',tl:'<b>变量的「有效期 + 活动范围」</b>：出了这层花括号，它就查无此人——这是大量「变量未定义」报错的根源。',ana:'像<b>工牌的通行范围</b>：本部门楼层随便走，出了门就刷不开闸机；变量也一样，出了自己那层「楼」，谁都不认识它。',zone:'code',lv:2,one:'变量的「有效期+活动范围」：出了这个花括号，它就不存在了。',cf:'为什么重要：作用域搞混=「变量未定义」或「值莫名被改」两大经典 bug。',al:["作用域", "变量作用域"],rel:['closure','bug','debug'],scn:'「变量明明定义了却报未定义」「两个地方的同名变量互相打架」，全是作用域问题；AI 生成的代码出错，也常是它把变量用出了自己的范围。',dlg:[{q:'全局变量为什么少用？',a:'谁都能改、活整个程序生命周期，出问题查不到源头。'},{q:'块级作用域是什么？',a:'let/const 只在自己所在的花括号内有效——比老 var 安全。'}],new:true,quiz:{q:'全局变量为什么少用？',o:["全局变量占用硬盘空间","全局变量会让编译变慢","全局变量不能存数字类型","谁都能改、活整个程序生命周期，出问题查不到源头。"],a:3,why:'变量的「户口和寿命」。'}},
{id:'closure',term:'闭包',full:'Closure',cn:'闭包',tl:'<b>函数「记住」了自己出生地 variables 的本事</b>：哪怕老家已经执行完了，它还带着那份记忆到处跑。',ana:'像<b>离家发展的你仍记得老家门牌</b>：房子可能拆了（函数执行完了），但地址（变量）你还随身带着、随时能「寄东西回去」。',zone:'code',lv:3,one:'哪怕那个地方已经执行完了，它还带着',cf:'经典用途：计数器（每次调用+1）、数据私有化（外部改不了内部变量）。',al:["闭包", "Closure"],rel:['scope','js','callback'],scn:'计数器「每点一次加一」、给按钮绑「各自专属的编号」，靠的都是闭包；JS 面试必考，实际是很多自动保存、防抖功能的底层机制。',dlg:[{q:'为什么难懂？',a:'它打破「函数执行完变量就销毁」的直觉——变量被函数「包」走了。'},{q:'实际用过吗？',a:'用过，AI 工具的记忆钩子、防抖节流都是闭包。'}],new:true,quiz:{q:'为什么难懂？',o:["它打破「函数执行完变量就销毁」的直觉——变量被函数「包」走了。","闭包必须配合数据库才能用","闭包是加密函数的别称","闭包只存在于 Python 语言里"],a:0,why:'函数带走的「随身行李」。'}},
{id:'openclaw',term:'OpenClaw',full:'开源智能体「龙虾」',cn:'OpenClaw',tl:'<b>开源的「龙虾」智能体</b>：能操作浏览器、填表、抓数据的 AI 助手，朋友圈刷屏的那种。',ana:'像<b>请了个远程实习生</b>：你说「帮我把这 50 个网页的信息整理成表」，它自己开浏览器自己点，你只管验收。',zone:'misc',lv:2,one:'能操作浏览器、填表、抓数据',cf:'和传统聊天 AI 的区别：它直接「动手」完成多步任务，不只是回答问题。',al:["龙虾", "OpenClaw 智能体"],rel:['agent','scraper','mcp'],scn:'2026 年公众号刷屏的 OpenClaw 就是它：装上后让 AI 替你爬数据、批量填表；火的原因是把「AI 会干活」从概念变成了几十块能装上的现实。',dlg:[{q:'为什么突然火了？',a:'开源免费+真能干活，各大厂迅速跟进出类似产品。'},{q:'和 Claude 什么关系？',a:'独立开源项目；关系类似于「浏览器之于互联网」的入口地位。'}],new:true,quiz:{q:'为什么突然火了？',o:["因为创始人是最火的科技网红","因为改名叫「龙虾」自带流量","开源免费+真能干活，各大厂迅速跟进出类似产品。","它被某大厂高价收购上了热搜"],a:2,why:'2026 最火的「龙虾」Agent。'}},
{id:'copilot2',term:'Copilot 类产品',full:'AI 副驾驶',cn:'Copilot 类产品',tl:'<b>「AI 副驾驶」类产品</b>：不抢方向盘，辅助你干活——写代码补全、写文档起稿、做表给建议。',ana:'像<b>飞机副驾驶</b>：观测、提醒、递仪表，但按下决策的是机长你；跟「自动驾驶」（Agent）是两回事。',zone:'misc',lv:1,one:'「Copilot=副驾驶」成了产品命名公式',cf:'和 Agent 的区别：副驾辅助人做决定；Agent 自己做决定。',al:["AI 副驾驶", "Copilot"],rel:['agent','pair','codegen'],scn:'GitHub Copilot、微软全家桶的 Copilot、各家「助手」都是这个命名公式；判断一个产品是副驾还是 Agent，就问「最后拍板的是谁」。',dlg:[{q:'这类产品的共同点？',a:'嵌在你已有的工作流里（写代码/写文档），随叫随到。'},{q:'为什么都叫 Copilot？',a:'蹭微软的概念红利，一词说明「辅助而非替代」。'}],new:true,quiz:{q:'这类产品的共同点？',o:["都要另外下载独立的 App","嵌在你已有的工作流里（写代码/写文档），随叫随到。","都必须全程联网才能用","都按对话条数收费"],a:1,why:'AI 辅助产品的「通用名」。'}},
{id:'heatmap',term:'热力图',full:'Heatmap',cn:'热力图',tl:'<b>用颜色深浅标出「哪里密集」的图</b>：红的地方热闹，绿的地方冷清，一眼看出重点在哪。',ana:'像<b>天气预报的降水云图</b>：不用看数字，红得发紫的地方准下雨——把一堆数字翻译成一眼能懂的颜色。',zone:'misc',lv:1,one:'用颜色深浅展示「哪里密集」的图',cf:'运营常用：用户根本不看你以为重要的位置——热力图一眼戳破。',al:["Heatmap", "热区图"],rel:['dashboard2','kpi','seo2'],scn:'公众号运营看「读者都在哪一段划走」、网页看「用户都点哪里」，用的都是热力图；你自己看后台「阅读轨迹」的数据图，同款原理。',dlg:[{q:'常见类型？',a:'点击热力图、滚动深度图、视线追踪图。'},{q:'怎么看懂？',a:'越红（暖色）= 关注越集中；大片冷色=没人看。'}],new:true,quiz:{q:'常见类型？',o:["气温分布图、降雨量分布图","CPU 温度图、显卡功耗图","红绿蓝三原色叠加图","点击热力图、滚动深度图、视线追踪图。"],a:3,why:'用颜色画「注意力地图」。'}},
{id:'dashboard2',term:'仪表盘',full:'Dashboard',cn:'仪表盘',tl:'<b>把一堆关键数据汇成一屏图表</b>：像汽车仪表盘，扫一眼就知道速度快不快、油够不够。',ana:'像<b>汽车仪表盘</b>：不用拆开发动机看，车速、油量、水温全在眼前——开车的专注开车，异常了自己会亮灯。',zone:'misc',lv:1,one:'把一堆关键数据汇成一屏图表，像汽车仪表盘一样一眼看全局。',cf:'和报表的区别：报表是定期发的静态文件，仪表盘是实时刷新的交互页面。',al:["数据看板", "Dashboard"],rel:['heatmap','kpi','bitable'],scn:'公众号后台的「数据中心」、飞书多维表格的图表视图、公司大屏，全是仪表盘；盯项目先看盘，别陷进一张张明细表。',dlg:[{q:'常见工具？',a:'飞书多维表格视图、Tableau、各种自建数据大屏。'},{q:'什么算好的仪表盘？',a:'一屏回答「现在正常吗」——堆满图表的等于没有仪表盘。'}],new:true,quiz:{q:'常见工具？',o:["飞书多维表格视图、Tableau、各种自建数据大屏。","Photoshop、美图秀秀","Word、PPT、记事本","微信、QQ、钉钉"],a:0,why:'数据的「驾驶舱」。'}},
{id:'landing',term:'落地页',full:'Landing Page',cn:'落地页',tl:'<b>广告点进来落地的第一屏</b>：只干一件事——让你完成注册/购买/关注，不放多余出口。',ana:'像<b>机场到达口的接机举牌</b>：你一出站就看到「跟 A 走」——目标唯一、路径最短；而不是把你领进一座商场自己逛。',zone:'misc',lv:1,one:'推广链接点进来的第一屏页面',cf:'和官网首页的区别：首页是门面什么都展示，落地页是单刀直入的转化页。',al:["Landing Page", "转化页"],rel:['seo2','saas','abtest'],scn:'公众号点「阅读原文」、课程广告点进去的那个页面，多半是落地页；以后自己做产品推广，第一件事就是打磨它。',dlg:[{q:'好落地页的共性？',a:'一句话说清价值 + 一个醒目按钮 + 社会证明，没有多余菜单。'},{q:'为什么叫「落地」？',a:'广告流量「降落」的地方——降落得好不好直接影响转化。'}],new:true,quiz:{q:'好落地页的共性？',o:["菜单越多越好，显得功能丰富","必须放创始人的创业故事","一句话说清价值 + 一个醒目按钮 + 社会证明，没有多余菜单。","文字越详细越长，转化率越高"],a:2,why:'为转化而生的「专接广告页」。'}},
{id:'seo2',term:'SEO 优化',full:'搜索引擎优化',cn:'SEO 优化',tl:'<b>让网页在搜索结果里排前面</b>的手艺：选对关键词、内容对路、网站结构清晰，搜索引擎自然把你往前放。',ana:'像<b>开店选址+招牌醒目</b>：东西好（内容好）是根本，但店开在没人走的巷子、招牌糊着，客人照样找不到你。',zone:'misc',lv:1,one:'让网页在搜索结果里排前面的技术',cf:'和 GEO 的区别：SEO 优化给传统搜索排名；GEO 优化「让 AI 搜索引用你」。',al:["搜索引擎优化", "Search Optimization"],rel:['geo','aioverview','landing'],scn:'公众号标题怎么起、文章怎么被微信搜一搜收录，都是它的变体；现在还多了个新对手——AI 搜索摘要直接给答案，点击更金贵了。',dlg:[{q:'现在还重要吗？',a:'重要但战场在变——AI Overview 吃掉了大量点击。'},{q:'新手第一步做什么？',a:'想清楚目标用户搜什么词，再围绕词做内容。'}],new:true,quiz:{q:'现在还重要吗？',o:["不重要了，搜索引擎早就没人用了","重要但战场在变——AI Overview 这类 AI 搜索摘要吃掉了大量点击。","比十年前更重要，一招吃遍天","只对大公司有意义，小站做了也白做"],a:1,why:'让搜索引擎「优先展示你」的排名术。'}},
{id:'aso',term:'ASO',full:'应用商店优化',cn:'ASO',tl:'<b>App 版的 SEO</b>：优化名称、关键词、截图、评分，让你在应用商店搜索时排前面。',ana:'像<b>求职简历+面试第一印象</b>：名称和关键词是简历上的硬技能，前两张截图是面试官前十秒看到的样子——都不过关，连聊的机会都没有。',zone:'misc',lv:3,one:'App 版的 SEO',cf:'和 SEO 的区别：战场在应用商店而非网页搜索。',al:["应用商店优化", "App Store Optimization"],rel:['seo2','abtest','landing'],scn:'在小米应用商店搜「记账」「笔记」，看到的排序就是各家 ASO 较量的结果；下载前那几张截图，全是精心设计的。',dlg:[{q:'最有效的一招？',a:'关键词覆盖+截图前两张——下载按钮前用户只看这些。'},{q:'为什么要做？',a:'商店搜索是 App 免费流量最大来源。'}],new:true,quiz:{q:'最有效的一招？',o:["把 App 名字改成热门游戏名","找水军把竞品刷差评","把安装包压到 1MB 以内","关键词覆盖+截图前两张——下载按钮前用户只看这些。"],a:3,why:'App 的「商店排名术」。'}},
{id:'abtest',term:'A/B 测试',full:'对照实验',cn:'A/B 测试',tl:'<b>一半用户看 A 版、一半看 B 版，用真实数据定胜负</b>：谁转化高用谁，不靠会议室里吵架。',ana:'像<b>两家奶茶店各发一半传单</b>：一周后看哪边带来的客人多——顾客用脚投票，比开十次会都准。',zone:'misc',lv:2,one:'不吵架，用转化率定',cf:'和「投票讨论」的区别：投票问的是「你觉得哪个好」，A/B 测试看的是「用户实际选了哪个」——行为比嘴诚实。',al:["A/B Test", "对照实验"],rel:['landing','heatmap','kpi'],scn:'公众号改标题、落地页换按钮颜色、App 改图标，正经团队都先跑 A/B；你拿飞书多维表格手动记录两组数据对比，也算土法 A/B。',dlg:[{q:'为什么比「投票讨论」靠谱？',a:'用户用行为投票， eliminate 了「我觉得」的主观争论。'},{q:'流量小能做吗？',a:'流量太小没有统计意义，先攒流量或拉长周期。'}],new:true,quiz:{q:'为什么比「投票讨论」靠谱？',o:["用户用行为投票，消除了「我觉得」的主观争论。","投票的人不专业，AB 测试有专家把关","AB 测试用的是实验室精密仪器","投票样本太少，AB 测试能问到每个人"],a:0,why:'用数据裁决「哪个好」。'}},
{id:'kpi',term:'KPI',full:'关键绩效指标',cn:'KPI',tl:'<b>考核的核心数字</b>：Key Performance Indicator，把「干得好不好」压缩成一个可比的数。',ana:'像<b>只看体重秤减肥</b>：数字最直观，但只盯它，有人会节食脱水凑数——数字达标了，健康反而垮了。',zone:'misc',lv:1,one:'Key Performance Indicator',cf:'和 OKR 的区别：KPI 是考核指标（要达成），OKR 是目标管理法（要挑战）。',al:["绩效考核", "关键指标"],rel:['okr','saas2','abtest'],scn:'公众号运营圈常说的「阅读量 KPI」「涨粉 KPI」，逼出过不少标题党；看别人晒数据时，先想想这数字是怎么来的。',dlg:[{q:'KPI 的坑？',a:'一旦变成唯一目标，人会为数字动作变形（为凑量发垃圾内容）。'},{q:'怎么定才健康？',a:'可衡量、能影响、控制在少数几个。'}],new:true,quiz:{q:'KPI 的坑？',o:["KPI 数字越大公司越危险","KPI 必须每月更换否则失效","一旦变成唯一目标，人会为数字动作变形（为凑量发垃圾内容）。","KPI 只能考核销售，不能考核技术"],a:2,why:'考核的「核心数字」。'}},
{id:'okr',term:'OKR',full:'目标与关键结果',cn:'OKR',tl:'<b>目标管理公式</b>：O 是「要往哪去」（定方向），KR 是「怎么知道到了」（可量化的关键结果）。',ana:'像<b>自驾导航</b>：O 是「今晚到青岛」，KR 是「19 点上高速、21 点过济南服务区」——每个 KR 能打勾，方向就没跑偏。',zone:'misc',lv:2,one:'Objectives and Key Results',cf:'和 KPI 的区别：OKR 通常不直接挂钩考核，鼓励定「跳一跳才够到」的目标。',al:["目标与关键结果", "OKR"],rel:['kpi','bitable','saas2'],scn:'飞书里那套 OKR 功能就是它；科技圈谈「对齐目标」时的高频词，听懂它开会就不懵。',dlg:[{q:'Google 和它什么关系？',a:'英特尔发明、Google 发扬光大，科技圈标配。'},{q:'个人能用吗？',a:'能，个人年度 OKR 是很好的自我管理工具。'}],new:true,quiz:{q:'Google 和它什么关系？',o:["Google 发明并注册了商标","英特尔发明、Google 发扬光大，科技圈标配。","Google 明令禁止内部使用 OKR","OKR 是 Google 的付费云产品"],a:1,why:'目标管理的「O+KR 公式」。'}},
{id:'paas',term:'PaaS',full:'平台即服务',cn:'PaaS',tl:'<b>拎包写代码的云服务层</b>：服务器、数据库、部署平台都替你配好，你只管推代码。',ana:'像<b>精装修公寓</b>：IaaS 是毛坯房（水电自己接），PaaS 是带家具拎包入住，SaaS 是酒店（连住都不用管，直接用）。',zone:'misc',lv:3,one:'Platform as a Service',cf:'和 IaaS 的区别：IaaS 给毛坯（虚拟机）自己装修；PaaS 给精装房，拎包写代码。',al:["平台即服务", "PaaS 平台"],rel:['iaas','saas','deploy'],scn:'你听说过的 Vercel、云函数平台都是 PaaS——AI 做出来的网页能一键发上线，背后就是这类服务在托底。',dlg:[{q:'例子？',a:'Vercel、Heroku、各种云函数平台。'},{q:'代价是什么？',a:'灵活度低、被平台锁定——迁移成本高。'}],new:true,quiz:{q:'例子？',o:["Windows、macOS、Linux","微信、支付宝、抖音","Word、Excel、PowerPoint","Vercel、Heroku、各种云函数平台。"],a:3,why:'「拎包写代码」的云服务层。'}},
{id:'iaas',term:'IaaS',full:'基础设施即服务',cn:'IaaS',tl:'<b>云服务的毛坯房层</b>：虚拟机、硬盘、网络按需租，装什么系统、跑什么全自己折腾。',ana:'像<b>租毛坯厂房</b>：面积随你隔、水电自己接——自由度最大，但服务器重启都得自己管；图省事的会去楼上「精装修公寓」（PaaS）。',zone:'misc',lv:3,one:'Infrastructure as a Service',cf:'和 PaaS 的区别：IaaS 给毛坯房全自己装修，自由度高但活多。',al:["基础设施即服务", "IaaS 云"],rel:['paas','gpu','compute'],scn:'阿里云 ECS、AWS EC2 就是典型；公众号聊「大厂自建机房」「算力军备竞赛」，底层买的就是这类资源。',dlg:[{q:'例子？',a:'阿里云 ECS、AWS EC2。'},{q:'什么时候选 IaaS？',a:'需要特殊环境、完整控制权，或成本敏感的大规模部署。'}],new:true,quiz:{q:'例子？',o:["阿里云 ECS、AWS EC2。","iPhone、小米、华为手机","QQ 空间、微博、朋友圈","Steam、Epic、WeGame"],a:0,why:'云服务的「毛坯房层」。'}},
{id:'lowcode',term:'低代码',full:'Low-Code',cn:'低代码',tl:'<b>拖拖拽拽出应用</b>：界面和逻辑都给你配好了，只填关键部分，能省八成代码量。',ana:'像<b>预制菜半成品</b>：洗好切好配好料，你只管下锅调味——出餐快，但要做满汉全席就力不从心。',zone:'misc',lv:1,one:'让懂业务的人自己做出能用的工具',cf:'和无代码的区别：低代码保留写代码的口子（复杂逻辑），无代码完全可视化。',al:["Low-Code", "低代码平台"],rel:['nocode','bitable','citizen'],scn:'飞书多维表格的自动化流、审批流就是典型低代码；它最适合内部工具、表单、看板这类「标准件」需求。',dlg:[{q:'适合什么场景？',a:'内部工具、表单流程、数据看板——标准模式化的东西。'},{q:'天花板在哪？',a:'复杂定制需求一碰壁，还是要程序员接手。'}],new:true,quiz:{q:'适合什么场景？',o:["高并发秒杀系统的核心开发","操作系统内核的编写","内部工具、表单流程、数据看板——标准模式化的东西。","3A 游戏引擎开发"],a:2,why:'「拖拽出应用」的开发方式。'}},
{id:'nocode',term:'无代码',full:'No-Code',cn:'无代码',tl:'<b>完全不写代码做产品</b>：全靠图形界面拼装，业务人员自己就能上线一个能用的工具。',ana:'像<b>乐高积木</b>：零基础也能拼出城堡——但积木没给的造型（特殊定制功能）你拼不出来。',zone:'misc',lv:1,one:'完全不写代码做产品',cf:'和低代码的区别：无代码零代码门槛，但也因此天花板更低。',al:["No-Code", "零代码"],rel:['lowcode','citizen','bitable'],scn:'Airtable、Notion 数据库都是代表；你用飞书多维表格搭「爆款文章追踪库」，本质上已经是一次无代码开发了。',dlg:[{q:'代表产品？',a:'Airtable、Notion Database、各种表单工具。'},{q:'能做正经产品吗？',a:'轻量级的完全可以；重逻辑的还是得找开发。'}],new:true,quiz:{q:'代表产品？',o:["VS Code、Vim、Emacs","Airtable、Notion Database、各种表单工具。","Docker、Kubernetes","MySQL、Redis、MongoDB"],a:1,why:'零代码的「拼装式开发」。'}},
{id:'citizen',term:'公民开发者',full:'Citizen Developer',cn:'公民开发者',tl:'<b>不写代码为生、但会用低代码工具造应用的人</b>：财务搭报表系统、运营搭审批流，都算。',ana:'像<b>家用面包机的普及</b>：从前和面得学手艺，现在一按就行——「做面包」从厨师专利变成人人可试。',zone:'misc',lv:3,one:'不正经写代码、但用低代码/无代码工具做出可用应用的业务人员。',cf:'和程序员的关系：不是替代——他们解决「程序员顾不上的长尾小需求」。',al:["Citizen Developer", "业务开发者"],rel:['lowcode','nocode','vibe'],scn:'AI 加持后这词越来越热：用自然语言做出查词工具、用飞书多维表格搭数据流，都是活例子——公民开发者不问出身。',dlg:[{q:'为什么这个概念在涨？',a:'AI 加持后，业务人员造工具的能力暴涨。'},{q:'有什么风险？',a:'数据安全：业务人员不懂权限和合规，容易埋雷。'}],new:true,quiz:{q:'为什么这个概念在涨？',o:["因为程序员大量失业转行了","是猎头编出来抬价的概念","公司想省社保所以换了个称呼","AI 加持后，业务人员造工具的能力暴涨。"],a:3,why:'用工具造应用「的普通人」。'}},
{id:'userscript',term:'油猴脚本',full:'UserScript',cn:'油猴脚本',tl:'<b>网页的私人订制补丁</b>：装在油猴插件里的小段脚本，能给指定网站加功能、去广告、改样式。',ana:'像<b>给租来的房子偷偷加装</b>：房子（网站）是房东的，但门后挂钩、遮光帘随你加——搬家（网站改版）就可能失效，得重调。',zone:'misc',lv:2,one:'Tampermonkey（油猴）浏览器插件里跑的小脚本',cf:'和普通插件的区别：脚本是单文件的轻量改造，插件是完整产品。',al:["Tampermonkey", "用户脚本"],rel:['js','plugin','scraper'],scn:'「网页端读书笔记导出」「跳过视频广告」都靠它；配合 AI 写脚本，懂需求就能改网页，不用等官方。',dlg:[{q:'为什么叫油猴？',a:'Tampermonkey 直译，最流行的用户脚本管理器。'},{q:'有什么风险？',a:'脚本能读写网页内容，装来路不明的脚本=把钥匙给陌生人。'}],new:true,quiz:{q:'为什么叫油猴？',o:["Tampermonkey 直译，最流行的用户脚本管理器。","最早作者的网名叫「油猴」","脚本能让网页像抹了油一样顺滑","源自黑客黑话，专指小工具"],a:0,why:'网页的「私人订制补丁」。'}},
{id:'emulator',term:'模拟器',full:'Emulator',cn:'模拟器',tl:'<b>用软件假装成另一台设备</b>：电脑上模拟安卓手机、老游戏机，行为几乎一样。',ana:'像<b>驾校模拟器</b>：不是真车上路，但方向盘、油门反应都仿真——练熟了再上真车，撞的就不是真车了。',zone:'misc',lv:2,one:'用软件模拟另一台设备/系统',cf:'和模拟器相对的是「真机」：模拟器方便但不完全等同，上架前要真机验证。',al:["Emulator", "模拟机"],rel:['firmware','deploy','sandbox'],scn:'开发者不插手机就能测 App 各机型表现；你听说的「电脑玩手游」，靠的也是模拟器。',dlg:[{q:'开发者用它干嘛？',a:'不插手机就能测试 App 的各种机型表现。'},{q:'合法吗？',a:'模拟器本身合法；里面的系统和游戏 ROM 版权要自己注意。'}],new:true,quiz:{q:'开发者用它干嘛？',o:["把旧手机性能提升一倍","在电脑上永久免费玩手机游戏","不插手机就能测试 App 的各种机型表现。","把安卓 App 一键转成 iOS 版"],a:2,why:'软件假装成的「另一台设备」。'}},
{id:'firmware',term:'固件',full:'Firmware',cn:'固件',tl:'<b>硬件身体里的「底层魂」</b>：烧在芯片里的小程序，开机第一步先跑它，管着这台设备怎么基本运作。',ana:'像<b>人的本能反应</b>：心跳呼吸不用你操心，出厂自带——但它也能「更新」：装个起搏器，本能就升级了。',zone:'misc',lv:3,one:'硬件身体里的「魂」',cf:'和普通软件的区别：固件烧在硬件里，刷失败设备可能变砖。',al:["固件", "Firmware"],rel:['router','brick','deploy'],scn:'路由器、耳机、扫地机器人推的「固件更新」就是给它换魂——修漏洞、加功能；提醒你别嫌烦，安全补丁多在这里。',dlg:[{q:'为什么厂商推固件更新？',a:'修安全漏洞、加新功能——你的旧设备「变好」了。'},{q:'固件更新有风险吗？',a:'更新中断电=变砖，所以更新时别断电。'}],new:true,quiz:{q:'为什么厂商推固件更新？',o:["让你尽快换新机，旧机越更越卡","修安全漏洞、加新功能——你的旧设备「变好」了。","固件更新主要是换主题外观","为了消耗你的电量和流量"],a:1,why:'硬件里的「底层魂」。'}},
{id:'root',term:'Root / 越狱',full:'获取最高权限',cn:'Root / 越狱设备',tl:'<b>拿到设备的最高权限</b>：安卓叫 Root，iPhone 叫越狱——厂商锁着的「机房大门」被你打开了。',ana:'像<b>拿到小区所有门禁卡</b>：配电房、天台随便进（删预装、深度定制）；但手一滑拉了总电闸（删系统文件），全楼瘫痪。',zone:'misc',lv:3,one:'厂商不希望你动的地方随便动',cf:'Root（安卓）和越狱（iOS）是一回事的不同叫法。',al:["Root", "越狱"],rel:['brick','firmware','jailbreak'],scn:'想删手机预装的用不上 App、装特殊工具，是老玩家 Root 的主因；代价通常是失去保修和安全防护，日用党不建议。',dlg:[{q:'为什么要 Root？',a:'删预装、深度定制、装特殊工具。'},{q:'代价是什么？',a:'失去保修、安全防线洞开、部分银行 App 拒运行。'}],new:true,quiz:{q:'为什么要 Root？',o:["Root 后手机信号增强一倍","为了获得官方售后优先权","Root 是所有手机出厂必做步骤","删预装、深度定制、装特殊工具。"],a:3,why:'设备的「破解最高权限」。'}},
{id:'brick',term:'变砖',full:'Brick',cn:'变砖',tl:'<b>刷机/升级失败把设备搞成「一块砖」</b>：开不了机、连不上电脑，只能当镇纸。',ana:'像<b>给心脏做手术时断了电</b>：本来是治病的，中途断电人就没了——设备更新就是给它做手术，最忌断电断线。',zone:'misc',lv:3,one:'刷机/升级失败把设备搞成「一块砖」：开不了机、毫无反应。',cf:'软砖 vs 硬砖：软砖能进恢复模式救回来；硬砖基本只能拆机。',al:["Brick", "设备变砖"],rel:['firmware','root','backup'],scn:'手贱刷了来路不明的固件、升级到一半拔了电源，是最常见的变砖姿势；「路由器更新时别断电」说的就是防这个。',dlg:[{q:'怎么避免？',a:'别乱刷来路不明的固件；更新时保证电量、别断电。'},{q:'和「变板砖」梗的关系？',a:'就从这个场景来的——真成板砖了。'}],new:true,quiz:{q:'怎么避免？',o:["别乱刷来路不明的固件；更新时保证电量、别断电。","每天重启一次手机来预防","贴防蓝光膜保护主板","只用原装充电器就不会变砖"],a:0,why:'设备刷坏的「悲剧形态」。'}},
{id:'asi',term:'ASI',full:'超级人工智能',cn:'ASI',tl:'<b>理论上的「AI 天花板」</b>：全面超越全人类智慧的超级智能，现在只存在于推演和科幻里。',ana:'像<b>讨论「人类移民银河系」</b>：方向上说得通、值得想，但眼下连火星登陆都还没成——它是路线图的尽头，不是明天的新闻。',zone:'abbr',lv:2,one:'Artificial Superintelligence',cf:'和 AGI 的区别：AGI 追平人类，ASI 是远超人类——AGI 是门槛，ASI 是天花板。',al:["超级人工智能", "Artificial Superintelligence"],rel:['agi','pdoom','xai'],scn:'公众号聊「AGI 之后呢」「奇点临近」时，ASI 是终点站名词；听到有人说「ASI 明年就到」，先想想他是不是在卖课。',dlg:[{q:'为什么现在老提？',a:'AGI 讨论热了，ASI 作为「再往后会怎样」的思想实验。'},{q:'会来吗？',a:'没人知道，但安全研究者主张「趁没来先想好」。'}],new:true,quiz:{q:'为什么现在老提？',o:["因为 ASI 模型已经发布上市","是某公司新产品的发布会主题","AGI 讨论热了，ASI 作为「再往后会怎样」的思想实验。","ASI 是一门新的编程语言"],a:2,why:'理论上的「AI 天花板」。'}},
{id:'ann',term:'神经网络',full:'Neural Network',cn:'神经网络',tl:'<b>现代 AI 的地基</b>：模仿神经元连接方式的数学结构，所有大模型都建在它上面。',ana:'像<b>一锅蚂蚁军团</b>：单只蚂蚁没什么想法，几百万只按规则联动，就能搬动一整只甲虫——智能是「连接」里涌现的。',zone:'abbr',lv:1,one:'现代 AI 的地基，所有大模型都建在它上面',cf:'和大脑的关系：只是「模仿连接方式」，实际运算和真脑差异很大。',al:["Neural Network", "神经网络"],rel:['transformer','ml','param'],scn:'公众号文章里「神经网络」「深度学习」出现率极高，说的都是这套东西；不用怕术语，记住「地基」二字就够用。',dlg:[{q:'为什么 2012 年后爆发？',a:'数据+算力+算法三要素齐了，深度神经网络开始碾压传统方法。'},{q:'「深度」学习深在哪？',a:'神经网络的层数多（几十上百层），所以叫深度学习。'}],new:true,quiz:{q:'为什么 2012 年后爆发？',o:["2012 年才发明神经网络这个概念","数据+算力+算法三要素齐了，深度神经网络开始碾压传统方法。","因为那一年出了特别好的教材","之前的网络只能连局域网"],a:1,why:'AI 的「大脑地基」。'}},
{id:'cnn',term:'CNN',full:'卷积神经网络',cn:'CNN',tl:'<b>看图的专用网络</b>：用一小块一小块「扫描」的方式找局部特征，从边缘看到纹理再看到整张脸。',ana:'像<b>验钞时的紫光灯扫过</b>：不是一眼看全张，而是分区扫、抓特征——水印纹理对上了，才判定是真钞。',zone:'abbr',lv:2,one:'Convolutional Neural Network',cf:'和普通网络的区别：CNN 会「扫视」图片提取局部特征，参数少、懂空间关系。',al:["卷积网络", "Convolutional"],rel:['ann','vlm','ocr'],scn:'手机相册能搜「猫」、人脸解锁、工地安全帽检测，背后常是 CNN；偶尔也客串处理音频，但主场始终是图像。',dlg:[{q:'CNN 只能处理图吗？',a:'图像是主场，音频、文本也有用。'},{q:'被 Transformer 取代了吗？',a:'视觉领域 Transformer（ViT）在抢地盘，但 CNN 因轻量仍在端侧广泛使用。'}],new:true,quiz:{q:'CNN 只能处理图吗？',o:["只能处理图片，别的完全不行","专门转播美国有线电视新闻","只能处理 3D 模型和视频","图像是主场，音频、文本也有用。"],a:3,why:'看图的「扫描式网络」。'}},
{id:'rnn',term:'RNN',full:'循环神经网络',cn:'RNN',tl:'<b>Transformer 的前辈</b>：像人读书一样一个字一个字顺着读、带着记忆，长文读到后面会「忘前面」。',ana:'像<b>传话游戏</b>：一句话排着队往后传，传到第十个人已经走样——链条越长，最早的信息丢得越多。',zone:'abbr',lv:3,one:'Transformer 出现前是文本 AI 的主流',cf:'和 Transformer 的区别：RNN 一个字一个字顺次处理（慢、长文记不住），Transformer 一次看全文（并行、注意力机制）。',al:["循环网络", "Recurrent Network"],rel:['transformer','ann','asr2'],scn:'2017 年前的翻译、语音识别都是它撑着；现在主流文本任务已被 Transformer 全面接棒，见到它多半是在讲「AI 编年史」。',dlg:[{q:'还被使用吗？',a:'小场景有，主流文本任务已被 Transformer 全面替代。'},{q:'它的大 bug？',a:'长文本「前面学的后面忘」，梯度消失问题。'}],new:true,quiz:{q:'还被使用吗？',o:["小场景有，主流文本任务已被 Transformer 全面替代。","已被彻底淘汰，一个都不剩","仍是当前大模型的主流架构","只用于军事和航天领域"],a:0,why:'Transformer 的「前辈」。'}},
{id:'bert',term:'BERT',full:'预训练语言模型',cn:'BERT',tl:'<b>「只读不写」的理解模型</b>：Google 2018 年出品，擅长读懂文本含义，不擅长接着往下写。',ana:'像<b>资深审稿人</b>：一眼看出文章在说什么、情绪是正是负；但让他提笔续写，反而不如专职作家（GPT 类）。',zone:'abbr',lv:3,one:'Google 2018 年的模型',cf:'和 GPT 的区别：BERT 只做理解（读），GPT 主攻生成（写）——两条技术路线。',al:["BERT 模型", "Bidirectional Encoder"],rel:['transformer','ann','nlp'],scn:'你搜东西时搜索引擎猜你意图、客服系统自动分类你的问题，背后常是 BERT 这类模型——存在感强但从不署名。',dlg:[{q:'你在哪用过它？',a:'搜索引擎理解你的意图、客服系统分类你的问题，背后常是 BERT 类模型。'},{q:'现在还重要吗？',a:'生成式占头条，但理解类任务的性价比之选仍是它。'}],new:true,quiz:{q:'你在哪用过它？',o:["它是手机里的语音助手","它是专门写小说的 AI","搜索引擎理解你的意图、客服系统分类你的问题，背后常是 BERT 类模型。","它是浏览器的一款插件"],a:2,why:'「只读不写」的理解模型。'}},
{id:'cv2',term:'CV 计算机视觉',full:'Computer Vision',cn:'CV 计算机视觉',tl:'<b>机器的眼睛</b>：让计算机从图片、视频里认出「这是什么、在哪里、发生了什么」。',ana:'像<b>教外星人认猫</b>：它没有「猫」的概念，你得给它看十万张猫图，它自己总结出「尖耳朵+胡须+竖瞳」的判定套路。',zone:'abbr',lv:1,one:'Computer Vision',cf:'和图像处理（PS 那种）的区别：图像处理是人为改图，CV 是机器理解图。',al:["Computer Vision", "机器视觉"],rel:['ann','ocr','vlm'],scn:'人脸解锁、扫码、相册搜「猫」、开车道的辅助驾驶，全是 CV 在干活；公众号聊「AI 看片诊断」，主角也是它。',dlg:[{q:'身边的 CV？',a:'人脸解锁、扫码、相册搜索「猫」、工地安全帽检测。'},{q:'和多模态什么关系？',a:'CV 是「看」的能力，被吸收进多模态大模型成为其中一部分。'}],new:true,quiz:{q:'身边的 CV？',o:["个人简历、求职信、面试记录","人脸解锁、扫码、相册搜索「猫」、工地安全帽检测。","电视盒子、机顶盒遥控器","光缆、光纤、光猫设备"],a:1,why:'机器的「眼睛」。'}},
{id:'asr2',term:'ASR 语音识别',full:'Speech Recognition',cn:'ASR 语音识别',tl:'<b>机器的耳朵</b>：把你说的话实时转成文字，语音输入、字幕生成、语音助手全靠它。',ana:'像<b>同声传译员</b>：你边说边记，还得容忍口音和快语速——环境吵、方言重时，翻译（识别）就会出错。',zone:'abbr',lv:1,one:'Automatic Speech Recognition',cf:'和 NLP 的关系：ASR 先把声音变文字，NLP 再理解文字——流水线两道工序。',al:["语音识别", "Speech-to-Text"],rel:['tts','voiceclone','vlm'],scn:'微信「语音转文字」、飞书妙记自动生成会议纪要、剪映加字幕，都是 ASR；强口音和嘈杂环境仍是它的失手区。',dlg:[{q:'方言、口音能识别吗？',a:'主流引擎普通话很强，方言在快速进步，强口音仍会错。'},{q:'和 TTS 的关系？',a:'一对反向兄弟：ASR 听，TTS 说。'}],new:true,quiz:{q:'方言、口音能识别吗？',o:["所有方言都完美识别零错误","只支持英语，中文完全不行","方言识别需要额外付费开通","主流引擎普通话很强，方言在快速进步，强口音仍会错。"],a:3,why:'机器的「耳朵」。'}},

{id:'iot',term:'IoT',full:'物联网',cn:'IoT',tl:'<b>给万物装上网卡</b>：灯、门锁、空调、拖拉机都联网上报数据、听候指令，不再是不联网的「哑巴设备」。',ana:'像<b>全城外卖骑手都装了定位</b>：总部（你手机）随时知道谁在哪、状态如何，还能远程派单——设备从「各自为战」变成「听指挥的队伍」。',zone:'abbr',lv:1,one:'Internet of Things',cf:'和「物联网平台」的区别：IoT 是「万物联网」这件事本身，物联网平台是帮厂商管设备的云端系统——一个是趋势，一个是工具。',al:["物联网", "Internet of Things"],rel:['wifi','api','cloud'],scn:'家里智能音箱一喊「关灯」全屋响应，就是 IoT+AI 的日常形态；AI 是它的交互层——你不用学 App，说话就行。',dlg:[{q:'和 AI 的结合点？',a:'智能家居听懂自然语言（「把灯调暗点」），AI 是物联网的交互层。'},{q:'最大的坑？',a:'安全：摄像头、门锁被黑不是段子，弱密码设备是重灾区。'}],new:true,quiz:{q:'和 AI 的结合点？',o:["智能家居听懂自然语言（「把灯调暗点」），AI 是物联网的交互层。","IoT 就是 AI 的一个分支学科","两者毫无关系，互不干涉","AI 负责发电，IoT 负责用电"],a:0,why:'万物的「联网化」。'}},
{id:'api3',term:'REST API',full:'REST 接口',cn:'REST API',tl:'<b>接口设计的「普通话」</b>：网址+方法+固定结构返回，全网最通用的服务对接方式。',ana:'像<b>银行柜台的业务单</b>：填什么单（GET/POST）、交什么材料（参数）、回执长什么样（返回结构）全行统一——哪家网点都会办。',zone:'abbr',lv:2,one:'最主流的接口设计风格',cf:'拆开理解：GET（读取）/POST（创建）/PUT（更新）/DELETE（删除）——对资源的四种操作。',al:["RESTful", "RESTful API"],rel:['api','graphql','grpc'],scn:'你听说的「调接口」「API 报 401」，走的都是 REST 风格；公众号数据服务、天气查询，背后全是它在对接。',dlg:[{q:'和 GraphQL 的区别？',a:'REST 一个地址返回固定结构；GraphQL 你要什么字段自己点。'},{q:'为什么成为主流？',a:'简单直观，基于 HTTP 无需额外基础设施。'}],new:true,quiz:{q:'和 GraphQL 的区别？',o:["REST 是新的，GraphQL 已被淘汰","REST 只能内网用，GraphQL 才能上外网","REST 一个地址返回固定结构；GraphQL 你要什么字段自己点。","两者是同一个协议的两个名字"],a:2,why:'接口的「普通话」。'}},
{id:'graphql',term:'GraphQL',full:'图查询语言',cn:'GraphQL',tl:'<b>接口的「自选餐」</b>：你要哪几个字段自己点单，服务器照单给，不多给也不少给。',ana:'像<b>麻辣烫自选称重</b>：REST 是固定套餐（不要的丸子也给），GraphQL 是自己夹——只拿宽粉和牛肉，一分流量不浪费。',zone:'abbr',lv:3,one:'Facebook 发明的接口风格',cf:'和 REST 的区别：REST 多个地址各回各的；GraphQL 一个地址按需返回。',al:["GraphQL API", "图查询"],rel:['api','api3','json'],scn:'移动端省流量利器，GitHub 的接口就是 GraphQL；但门槛比 REST 高，小项目用 REST 更省心。',dlg:[{q:'好处？',a:'少请求、不拿冗余数据——移动端省流量利器。'},{q:'代价？',a:'服务端实现复杂、缓存难——小项目 REST 更省事。'}],new:true,quiz:{q:'好处？',o:["能让服务器运算速度翻倍","少请求、不拿冗余数据——移动端省流量利器。","彻底取代了所有数据库","不写代码就能直接使用"],a:1,why:'接口的「自选餐」。'}},
{id:'grpc',term:'gRPC',full:'远程过程调用',cn:'gRPC',tl:'<b>服务间的高速专线</b>：Google 出品的接口框架，比 REST 更快更省，但用起来更讲究。',ana:'像<b>公司内部的对讲机</b>：音频压缩、术语黑话（二进制协议）全定死，效率拉满；但对外接待客户（开放接口），还是普通话（REST）友好。',zone:'abbr',lv:3,one:'Google 的接口框架',cf:'和 REST 的区别：REST 传文本（JSON）人类可读；gRPC 传二进制机器高效——微服务内部首选。',al:["gRPC", "RPC 框架"],rel:['api3','api','websocket'],scn:'大厂微服务之间互调常用它；公众号聊「性能优化压榨到协议层」，指的多半是这类技术。对外做产品，REST 仍是默认。',dlg:[{q:'什么时候用？',a:'自己家服务之间的内部通信（性能敏感）；对外接口 REST 更友好。'},{q:'基于什么运行？',a:'HTTP/2 + Protocol Buffers（一种高效序列化格式）。'}],new:true,quiz:{q:'什么时候用？',o:["给外部用户开放 API 时的首选","网页前端加载数据时必用","只在跨国数据传输时使用","自己家服务之间的内部通信（性能敏感）；对外接口 REST 更友好。"],a:3,why:'服务间的「高速专线」。'}},
{id:'websocket',term:'WebSocket',full:'长连接',cn:'WebSocket',tl:'<b>网页的持久通话</b>：普通网页是「一问一答挂断」，WebSocket 是电话保持接通，服务器随时主动说话。',ana:'像<b>每次重新拨号 vs 语音一直连着</b>：普通网页问一句挂一次；WebSocket 是骑手一动身你立刻收到「已取餐」——不用你反复问。',zone:'abbr',lv:3,one:'让网页和服务器保持「电话不断线」',cf:'和普通 HTTP 的区别：HTTP 是「你问一次我答一次」，WebSocket 是「电话保持接通随时说话」。',al:["WebSocket", "WS 长连接"],rel:['api','spa','throughput'],scn:'股票行情页价格实时跳动、在线文档多人同时编辑、AI 聊天的流式输出，都是它在撑——「服务器主动推」的需求全归它管。',dlg:[{q:'什么场景必须用？',a:'聊天、股票行情、协同编辑——任何「服务器主动推送」的需求。'},{q:'AI 回复流式输出是它吗？',a:'常用它或同类技术（SSE）——逐字推送就是推的。'}],new:true,quiz:{q:'什么场景必须用？',o:["聊天、股票行情、协同编辑——任何「服务器主动推送」的需求。","只在上传大文件时使用","纯静态网页浏览的最佳选择","数据库备份的专用通道"],a:0,why:'网页的「持久通话」。'}},
{id:'cdn',term:'CDN',full:'内容分发网络',cn:'CDN',tl:'<b>内容的全球便利店</b>：把网站的视频、图片、文件提前铺到各地节点，用户就近取货，又快又稳。',ana:'像<b>连锁便利店的前置仓</b>：不让你渴了跑城郊大仓库（源站），楼下便利店直接拿——店越密，买水越快。',zone:'abbr',lv:2,one:'Content Delivery Network',cf:'原理：你访问的其实是离你最近的副本（北京用户取北京节点），不是绕到源站。',al:["内容分发网络", "CDN 加速"],rel:['cache','bandwidth','ci3'],scn:'GitHub Pages、视频网站、App 图标下载都快，背后是 CDN 分发；「网站突然卡成 PPT」也常是节点抽风。',dlg:[{q:'谁在用？',a:'所有正经网站——视频、图片、JS 文件都靠它加速。'},{q:'为什么有时访问慢？',a:'节点缓存过期回源取、或你被调度到了远节点。'}],new:true,quiz:{q:'谁在用？',o:["只有视频网站才需要","只有境外网站才能使用","所有正经网站——视频、图片、JS 文件都靠它加速。","个人博客用了 CDN 反而更慢"],a:2,why:'内容的「全球便利店」。'}},
{id:'ssl',term:'SSL/TLS',full:'加密证书',cn:'SSL/TLS',tl:'<b>网络传输的装甲车</b>：给浏览器和网站之间的数据上一把锁，路上谁也偷看不了、篡改不了。',ana:'像<b>寄身份证用的密封保价袋</b>：明信片（http）邮递员随手能看；密封袋（https）只有收件人能拆——中途被拆开立刻知道。',zone:'abbr',lv:2,one:'网址前面那把小锁',cf:'SSL 是旧名，TLS 是升级版——现在说的都是 TLS，但 SSL 叫法沿用了。',al:["TLS 证书", "HTTPS"],rel:['twofa','vpn','endtoend'],scn:'地址栏的小锁就是它；「只有 http:// 的网页别输密码」是铁律——等于把身份证写在明信片上寄出去。',dlg:[{q:'怎么判断网站有没有？',a:'地址栏 https:// 和锁图标；只有 http:// 的网站别输密码。'},{q:'证书过期会怎样？',a:'浏览器弹警告——正规站过期说明维护不当，警惕。'}],new:true,quiz:{q:'怎么判断网站有没有？',o:["看网站 logo 是不是盾牌形状","地址栏 https:// 和锁图标；只有 http:// 的网站别输密码。","看网页加载速度是否变快","让客服发一份安全证书复印件"],a:1,why:'网络传输的「装甲车」。'}},
{id:'ssr',term:'SSR 服务端渲染',full:'服务端渲染',cn:'SSR 服务端渲染',tl:'<b>网页的预制菜模式</b>：服务器把页面先组装成完整成品再发货，浏览器到手即显，不用现场加工。',ana:'像<b>中央厨房直送 vs 空厨房现做</b>：SPA 是下载 JS 再渲染（现场加工），SSR 是做好直送——上桌快，搜索引擎也看得懂。',zone:'abbr',lv:3,one:'网页在服务器上先组装好再发给浏览器——首屏快、搜索引擎友好。',cf:'和客户端渲染（CSR）的区别：SSR 服务器直接给成品页；CSR 发个空壳由浏览器现画。',al:["服务端渲染", "Server-Side Rendering"],rel:['spa','seo2','deploy'],scn:'公众号文章秒开、电商页利于被搜索收录，多半是 SSR 的功劳；静态网页想被搜索引擎收录，走的就是这个思路。',dlg:[{q:'为什么 SEO 要求 SSR？',a:'爬虫可能不执行 JS——空壳页在搜索引擎眼里是白页。'},{q:'Next.js 和它的关系？',a:'Next.js 是最流行的 SSR 框架。'}],new:true,quiz:{q:'为什么 SEO 要求 SSR？',o:["SSR 网页的加载动画更炫酷","搜索引擎只收录服务器在境外的站","SSR 能自动生成热门关键词","爬虫可能不执行 JS——空壳页在搜索引擎眼里是白页。"],a:3,why:'网页的「预制菜模式」。'}},
{id:'spa',term:'SPA 单页应用',full:'Single Page App',cn:'SPA 单页应用',tl:'<b>整个网站只有一张 HTML</b>：页面切换不刷新，靠 JS 在前台变戏法，用起来像原生 App。',ana:'像<b>一间可以变换功能的房间</b>：不用每次换房（刷新页面），推拉隔断就把客厅变卧室——顺滑，但第一次进场要搬全套家具（首屏慢）。',zone:'abbr',lv:3,one:'整个网站只有一个 HTML',cf:'和传统多页的区别：传统每次点链接整页刷新；SPA 只换局部像 App 一样流畅。',al:["Single Page Application", "单页应用"],rel:['ssr','pwa2','html'],scn:'你天天用的飞书网页版、各种在线工具几乎都是 SPA；代价是首屏慢、对 SEO 不友好，所以常和 SSR 搭配使用。',dlg:[{q:'代价？',a:'首屏慢（要下载整个 JS）、SEO 不友好（需配 SSR）。'},{q:'常见的 SPA？',a:'你用的多数现代 Web 应用都是——飞书网页版、各类 SaaS。'}],new:true,quiz:{q:'代价？',o:["首屏慢（要下载整个 JS）、SEO 不友好（需配 SSR）。","不能在手机浏览器里打开","必须每月支付高昂服务器费","无法实现任何用户登录功能"],a:0,why:'网页的「App 化」。'}},
{id:'pwa2',term:'PWA',full:'渐进式网页应用',cn:'PWA',tl:'<b>网页的准 App 化</b>：能添加到主屏幕、离线可用、有图标有全屏——不用应用商店，网址就是 App。',ana:'像<b>买房 vs 长租公寓</b>：App 是买房（下载安装占用大），PWA 是长租（首次打开后可离线住）——随时退租，成本还低。',zone:'abbr',lv:2,one:'Progressive Web App',cf:'和原生 App 的区别：PWA 本质是网页（免下载安装、自动更新），体验接近 App。',al:["渐进式 Web 应用", "PWA"],rel:['spa','html','deploy'],scn:'你的 AI 名词小抄就是标准 PWA——手机「添加到主屏幕」后断网也能查词；这就是「不装 App 也有 App 体验」的典型。',dlg:[{q:'本工具就是 PWA？',a:'是的——「添加到主屏幕」后离线可查，就是 PWA 能力。'},{q:'iOS 支持吗？',a:'支持核心功能，推送等能力近年才补齐，体验略逊安卓。'}],new:true,quiz:{q:'本工具就是 PWA？',o:["不是，PWA 必须从应用商店安装","只有苹果手机才支持 PWA","是的——「添加到主屏幕」后离线可查，就是 PWA 能力。","PWA 是一种编程语言的简称"],a:2,why:'网页的「准 App 化」。'}},
{id:'devops',term:'DevOps',full:'开发运维一体化',cn:'DevOps',tl:'<b>开发和运维从甩锅变一家</b>：谁写的代码谁负责部署和维护，出问题不再踢皮球。',ana:'像<b>厨师兼传菜</b>：从前厨师只管炒（开发），传菜的只管端（运维），菜洒了互相怪；合体后上菜快，砸自己手里也认账。',zone:'abbr',lv:2,one:'Development + Operations',cf:'和 CI 的区别：CI 是「每次提交自动体检」这道工序，DevOps 是「开发运维合体干活」这套理念——CI 常是 DevOps 落地的第一步。',al:["DevOps", "开发运维"],rel:['ci','deploy','rollback'],scn:'你的查词工具「改完→体检→发布→验证」一条龙，就是个人版 DevOps；公司里聊「CI/CD 流水线」，是它的工程化形态。',dlg:[{q:'解决什么问题？',a:'传统模式开发只管写、运维只管稳，互相甩锅；DevOps 让「谁开发谁运维」。'},{q:'和 CI/CD 的关系？',a:'CI/CD 是 DevOps 理念落地的核心工具链。'}],new:true,quiz:{q:'解决什么问题？',o:["解决服务器硬盘空间不足","传统模式开发只管写、运维只管稳，互相甩锅；DevOps 让「谁开发谁运维」。","解决程序员加班太多","解决用户投诉率高"],a:1,why:'开发运维「合体」。'}},
{id:'cli2',term:'REPL',full:'交互式解释器',cn:'REPL',tl:'<b>和代码即时对话的小窗口</b>：输入一行、回车立刻看结果，不用先写完整程序再运行。',ana:'像<b>和翻译随口问答</b>：说一句译一句，当场纠错；而写完整程序再运行，像把整篇稿子交过去隔天取——试错成本高。',zone:'abbr',lv:3,one:'Read-Eval-Print Loop',cf:'和写脚本的区别：脚本整篇执行，REPL 逐行即时反馈——试语法、算数值最快。',al:["交互式环境", "REPL"],rel:['terminal','cli','debug'],scn:'浏览器按 F12 的 Console 就是 JS 的 REPL；装了 Python 后敲 python 回车进入的「>>>」也是——调 API、试正则，先用它最顺手。',dlg:[{q:'在哪用过？',a:'浏览器按 F12 的 Console 就是 JS 的 REPL；Python 命令行输入 python 就进 REPL。'},{q:'学习编程有必要吗？',a:'非常——语法不确定时进去试一下，比查文档快。'}],new:true,quiz:{q:'在哪用过？',o:["只在大机房里才存在","手机拨号界面就是 REPL","REPL 是 Rust 语言专属功能","浏览器按 F12 的 Console 就是 JS 的 REPL；Python 命令行输入 python 就进 REPL。"],a:3,why:'和代码「即时对话」。'}},
{id:'ide2',term:'IDE',full:'集成开发环境',cn:'IDE',tl:'<b>程序员的全功能工位</b>：编辑、调试、运行、版本管理一应俱全，AI 时代还多了「会说话的助手」。',ana:'像<b>手术室的集成化</b>：无影灯、器械、监护仪围绕一台手术布置——工具围绕「写代码」高度集成，不用满屋子跑。',zone:'abbr',lv:1,one:'编辑、调试、运行一应俱全',cf:'和编辑器的区别：编辑器（VS Code）轻量靠插件扩展；IDE（JetBrains 系列）开箱即用但重。',al:["集成开发环境", "IDE"],rel:['cli','vibe','plugin'],scn:'VS Code 是当下主流；Cursor 把 AI 对话焊进编辑器，是「AI 时代 IDE」的代表——你用 Codex/Claude Code 配合它，就是这个组合。',dlg:[{q:'AI 时代 IDE 的变化？',a:'AI 补全/AI 对话成为标配——Cursor、Copilot 都在重构写代码的方式。'},{q:'新手选什么？',a:'VS Code + AI 插件，免费且生态最全。'}],new:true,quiz:{q:'AI 时代 IDE 的变化？',o:["AI 补全/AI 对话成为标配——Cursor、Copilot 都在重构写代码的方式。","IDE 全部转收费且涨价十倍","IDE 将彻底消失被命令行取代","IDE 界面从深色统一改成浅色"],a:0,why:'程序员的「全功能工位」。'}},
{id:'vcs',term:'版本控制',full:'Version Control',cn:'版本控制',tl:'<b>代码的时光机</b>：每次改动存档、可随时回滚、多人协作不互相覆盖——git 是事实标准。',ana:'像<b>游戏存档</b>：打 Boss 前先存档，死了读档重来；多人联机时每人进度分开记录，谁干了什么一查便知。',zone:'abbr',lv:1,one:'git 是事实标准，GitHub 是托管平台',cf:'三层概念：版本控制（能力）→ git（工具）→ GitHub（存 git 仓库的网站）。',al:["版本控制", "Git"],rel:['git','commit','branch'],scn:'你的查词项目用 git 存版本、打 tag、能回滚到旧版，就是在享受版本控制的红利——「改崩了不慌」全靠它。',dlg:[{q:'为什么说没版本控制等于裸奔？',a:'改坏了回不去、多人协作互相覆盖、谁改的说不清。'},{q:'AI 编程时代更重要了吗？',a:'更重要——AI 大改代码，出问题全靠 git 回退。'}],new:true,quiz:{q:'为什么说没版本控制等于裸奔？',o:["代码会因为没有编号而无法发布","没版本控制就申请不了软著","改坏了回不去、多人协作互相覆盖、谁改的说不清。","程序会自动删除历史记录"],a:2,why:'代码的「时光机」。'}},
{id:'toml',term:'TOML',full:'配置格式',cn:'TOML',tl:'<b>人类友好的配置格式</b>：比 JSON 好写、比 YAML 不易踩坑，一屏看懂、手写不出错。',ana:'像<b>表格化点菜单</b>：一行一项一目了然；YAML 像意面（缩进即含义，好看但改着翻车），JSON 像全引号填空题——TOML 居中讨好。',zone:'abbr',lv:3,one:'比 JSON 好写、比 YAML 不易踩坑',cf:'和 YAML 的区别：YAML 靠缩进（易错），TOML 靠明确的段落和等号。',al:["TOML", "配置语言"],rel:['yaml','json','fm'],scn:'Python 新项目的 pyproject.toml、Rust 的 Cargo.toml 都是它；用 Codex 搭项目时见到别慌，就是一份「设置清单」。',dlg:[{q:'在哪常见？',a:'Rust、Python（pyproject.toml）项目的标配配置格式。'},{q:'选哪个？',a:'新项目配置文件，TOML 是越来越主流的选择。'}],new:true,quiz:{q:'在哪常见？',o:["主要用在苹果 App Store","Rust、Python（pyproject.toml）项目的标配配置格式。","是微信小程序的专属格式","只在游戏存档文件里出现"],a:1,why:'「人类友好」的配置格式。'}},
{id:'csv',term:'CSV',full:'逗号分隔文件',cn:'CSV',tl:'<b>表格的通用语</b>：用逗号分隔字段的纯文本，Excel、飞书、数据库、程序全都认。',ana:'像<b>国际航班的英语广播</b>：不是最优雅，但全世界乘客都听得懂——四十年的老格式，反而是数据搬运的硬通货。',zone:'abbr',lv:1,one:'Comma-Separated Values',cf:'和 Excel 文件（.xlsx）的区别：xlsx 是带格式和公式的「精装工作簿」，CSV 是只有数据没有格式的「素文本」——跨系统搬运选 CSV。',al:["逗号分隔值", "CSV 文件"],rel:['bitable','json','unicode'],scn:'公众号数据服务导出的表格、股票软件导出的行情，十有八九是 CSV；往飞书多维表格导数据，第一站常是它。',dlg:[{q:'为什么无处不在？',a:'足够简单：任何工具都能打开，没有任何私有格式。'},{q:'坑在哪？',a:'内容里带逗号会错列（要用引号包裹）、编码不对中文乱码（用 UTF-8）。'}],new:true,quiz:{q:'为什么无处不在？',o:["因为它的加密性最好最安全","它是微软 Excel 的官方格式","它的文件体积比所有格式都小","足够简单：任何工具都能打开，没有任何私有格式。"],a:3,why:'表格的「通用语」。'}},
{id:'regex',term:'正则表达式',full:'Regular Expression',cn:'正则表达式',tl:'<b>文本的「模式搜索引擎」</b>：一串符号描述「要找什么样的字」，一键从百万字里精确捞出目标。',ana:'像<b>小区门口的画像盘查</b>：「男性、戴鸭舌帽、背双肩包」三个条件一卡，人海里秒锁目标——条件（正则）写得越巧，捞得越准。',zone:'abbr',lv:2,one:'用一串符号描述「文本模式」',cf:'和通配符（*、?）的区别：通配符是「土话」（*.jpg 只能匹配文件名），正则是「普通话十级」（能描述邮箱、日期这类复杂格式）——能力差一个量级。',al:["Regex", "正则"],rel:['csv','unicode','debug'],scn:'清洗导出数据、批量改文件名、写校验规则都用它；现在更省事的姿势是「描述需求让 AI 写正则，贴回来验证」。',dlg:[{q:'为什么程序员又爱又恨？',a:'爱：能力逆天；恨：写完的自己三天后也看不懂（\d{3}-\d{4} 这类天书）。'},{q:'AI 和正则？',a:'描述需求让 AI 写正则，效率翻倍——写完了贴进去验证。'}],new:true,quiz:{q:'为什么程序员又爱又恨？',o:["爱：能力逆天；恨：写完的自己三天后也看不懂（\\d{3}-\\d{4} 这类天书）。","爱：完全免费；恨：经常匹配失败","爱：速度飞快；恨：必须联网才能用","爱：语法简单；恨：功能太少"],a:0,why:'文本的「模式搜索引擎」。'}},
{id:'unicode',term:'Unicode',full:'统一字符集',cn:'Unicode',tl:'<b>全世界字符的户口本</b>：给每个文字、符号（含 emoji）发唯一编号，跨语言不乱码的根基。',ana:'像<b>全国身份证号</b>：不管你叫「李雷」还是「Li Lei」，一个号码走天下——字符有了唯一编号，到哪台设备都不会被认错。',zone:'abbr',lv:3,one:'没有它，跨语言显示就是乱码',cf:'和 UTF-8 的区别：Unicode 是「字典」（字符→编号），UTF-8 是「编码方案」（编号→存储字节）。',al:["Unicode", "万国码"],rel:['utf8','csv','api'],scn:'文件名里的中文、公众号文章里的 emoji 都靠它撑着；看到「锟斤拷」这类乱码，就是编码环节把户口对错了。',dlg:[{q:'为什么会出现乱码？',a:'编码方案不一致：A 用 UTF-8 存，B 用别的解码——对不上号。'},{q:'emoji 也有编号？',a:'有，😂 的 Unicode 编号是 U+1F602——它就是标准字符。'}],new:true,quiz:{q:'为什么会出现乱码？',o:["字符太多把屏幕像素挤坏了","Unicode 只支持英文不支持中文","编码方案不一致：A 用 UTF-8 存，B 用别的解码——对不上号。","网速太慢导致字符传输不完整"],a:2,why:'全世界字符的「户口本」。'}},
{id:'utf8',term:'UTF-8',full:'字符编码',cn:'UTF-8',tl:'<b>互联网的默认字符编码</b>：Unicode 户口本的「最省空间存放方案」，英文 1 字节、常用汉字 3 字节。',ana:'像<b>行李箱打包术</b>：T 恤卷起来省地方（英文 1 字节），羽绒服占大件（汉字 3 字节）——同一柜子（Unicode）里的东西，装法决定占位。',zone:'abbr',lv:3,one:'目前最主流的字符编码方案',cf:'和 GBK 的区别：GBK 是中文 Windows 的老编码（只管中文圈），UTF-8 是全球通用——导出文件乱码时，先查是不是 GBK/UTF-8 对不上。',al:["UTF-8 编码", "编码格式"],rel:['unicode','csv','js'],scn:'网页、JSON、Python 源码默认都是 UTF-8；你的查词工具中文显示正常，就是全链路都用了它——哪一环换了编码立刻乱码。',dlg:[{q:'为什么成为主流？',a:'对英文省空间、完全兼容老 ASCII、能表达全部 Unicode。'},{q:'中文乱码怎么办？',a:'确认全链路（文件/数据库/页面）统一 UTF-8，八成能解决。'}],new:true,quiz:{q:'为什么成为主流？',o:["因为它是压缩率最高的编码","对英文省空间、完全兼容老 ASCII、能表达全部 Unicode。","它是联合国指定的国际标准","只有它一个支持中文字符"],a:1,why:'互联网的「默认语言」。'}},
{id:'base64',term:'Base64',full:'编码格式',cn:'Base64',tl:'<b>数据的「文本变身术」</b>：把任意二进制（图片、文件）转成纯字母数字的安全字符串，结尾常见「=」。',ana:'像<b>把雕塑拍成照片寄出去</b>：实物（二进制）过不了只收文本的关卡，拍成平面照（Base64）就能走——到地方还能 1:1 还原，但照片谁都能看。',zone:'abbr',lv:2,one:'把任意数据转成纯字母数字的编码（结尾常有=）',cf:'和加密的区别：加密要钥匙、没钥匙解不开；Base64 是公开编码，人人可逆——它是「换装」不是「上锁」，拿它存密码等于裸奔。',al:["Base64", "Base64 编码"],rel:['hash','ssl','json'],scn:'网页把小图标直接内嵌进代码、邮件传附件，背后都是 Base64；看到一长串 A-Za-z0-9+/= 结尾的「乱码」，认出它就行。',dlg:[{q:'是加密吗？',a:'不是！Base64 是编码可逆，人人能解——只是「换装」不是「上锁」。'},{q:'哪里常见？',a:'图片转字符串嵌网页、邮件附件、JWT 令牌——结尾的 = 是它的胎记。'}],new:true,quiz:{q:'是加密吗？',o:["是最高级别的军用加密","只有付费用户才能解码","解码需要知道原始文件大小","不是！Base64 是编码可逆，人人能解——只是「换装」不是「上锁」。"],a:3,why:'数据的「文本变身」。'}},
{id:'hash',term:'哈希',full:'Hash',cn:'哈希',tl:'<b>数据的不可逆指纹</b>：任意大小的内容压成一串固定长度的「指纹」，改一个字指纹全变。',ana:'像<b>人的指纹</b>：能验证「是不是本人」（内容对不对），但没法从指纹反推回整个人（不可逆）；内容再像，指纹也不同。',zone:'abbr',lv:2,one:'把任意数据压成固定长度的「指纹」',cf:'核心特性：单向（能算指纹不能还原）、确定性（同内容必同指纹）、雪崩（改一字全变）。',al:["Hash", "散列"],rel:['base64','checksum','ssl'],scn:'网站存你的密码只存哈希不存原文（拖库也泄不出）；下载大文件时官方给的 MD5/SHA 就是让你本地对指纹。',dlg:[{q:'用在哪？',a:'密码存储（存指纹不存原文）、文件校验（下载是否被篡改）、git 提交号。'},{q:'和加密的区别？',a:'加密可逆（有钥匙能解），哈希不可逆——所以网站「无法告诉你原密码」是真的。'}],new:true,quiz:{q:'用在哪？',o:["密码存储（存指纹不存原文）、文件校验（下载是否被篡改）、git 提交号。","用来给文件压缩减小体积","把照片转换成漫画风格","统计一个项目的代码总行数"],a:0,why:'数据的「不可逆指纹」。'}},
{id:'checksum',term:'校验和',full:'Checksum',cn:'校验和',tl:'<b>文件的「对账单」</b>：下载完算一遍校验值，和官方公布的对上，才能确认没传坏没被篡改。',ana:'像<b>收快递先验封条</b>：卖家发货时贴了封条编号（校验值），你收货时核对——编号对不上，说明路上被动过。',zone:'abbr',lv:3,one:'数据的「完整性对账单」',cf:'和哈希的关系：校验和通常就是用哈希算法算出来的对比值。',al:["Checksum", "校验值"],rel:['hash','firmware','brick'],scn:'刷路由器固件、下载系统镜像前先对校验和是保命习惯——对不上还硬刷，等着变砖。',dlg:[{q:'什么时候用？',a:'下载大文件（镜像站）、传输重要数据——官方都公布校验值。'},{q:'不对上怎么办？',a:'文件损坏或被掉包，重新下载并检查下载源。'}],new:true,quiz:{q:'什么时候用？',o:["每次保存文档时自动触发","只在格式化硬盘前使用","下载大文件（镜像站）、传输重要数据——官方都公布校验值。","发微信消息前必须先计算"],a:2,why:'文件的「对账单」。'}},
{id:'endtoend',term:'端到端',full:'End-to-End',cn:'端到端',tl:'<b>「全程打通」的多义热词</b>：加密里指只有收发两端能解密；AI 里指一个模型直接从输入干到输出。',ana:'像<b>点对点专车</b>：加密语境是「专车直达、司机本人都不知你聊了啥」；AI 语境是「原来要换乘三趟（多道工序），现在一辆车门到门」。',zone:'ai',lv:2,one:'从起点到终点全流程打通',cf:'同词不同义：加密场景说「只有两端能解」，测试场景说「全链路走一遍」——看上下文。',al:["End-to-End", "全流程"],rel:['ssl','twofa','embodied'],scn:'聊天软件宣传的「端到端加密」说的是安全；自动驾驶圈说的「端到端模型」是另一个意思——同一个词，先看语境再理解。',dlg:[{q:'端到端加密为什么安全？',a:'数据只有收发两端能解密，连服务提供商都看不到内容。'},{q:'端到端测试测什么？',a:'从用户操作到数据库的整条链路，验「整个流程通不通」。'}],new:true,quiz:{q:'端到端加密为什么安全？',o:["因为密钥由国家安全部门保管","数据只有收发两端能解密，连服务提供商都看不到内容。","因为加密之后网速反而更快","因为数据只存在你自己的手机里"],a:1,why:'「全程打通」的多义热词。'}},
{id:'swarm',term:'群体智能',full:'Swarm Intelligence',cn:'群体智能',tl:'<b>蚁群式的 AI 协作</b>：不造一个全能巨无霸，而是一群便宜的小 Agent 分工协作，合起来又稳又省。',ana:'像<b>蚂蚁搬家</b>：单只蚂蚁弱鸡，但蚁群能修巢、觅食、打仗分工明确——「多而小」常常打赢「大而全」。',zone:'ai',lv:2,one:'多个简单个体协作涌现出复杂智慧——蚁群找路、鱼群避敌',cf:'和单个 Agent 的区别：单 Agent 独干，群体智能是多 Agent 协作+涌现。',al:["Swarm", "群体协作 AI"],rel:['agent','orchestr','a2a'],scn:'公众号聊「Agent 编排」「多智能体协作」就是它；你在 AI 工作台里同时派几个子任务给不同助手，已经是 swarm 的微缩版。',dlg:[{q:'为什么突然火了？',a:'单个 Agent 有上限，一群便宜的小 Agent 协作反而又稳又省。'},{q:'和神经网络什么关系？',a:'神经网络模仿大脑，群体智能模仿蚁群——都是仿生，层次不同。'}],new:true,quiz:{q:'为什么突然火了？',o:["因为养蜂行业开始用 AI 了","大模型公司发布了一款新产品","是科幻电影衍生的营销概念","单个 Agent 有上限，一群便宜的小 Agent 协作反而又稳又省。"],a:3,why:'「蚁群式」的 AI 协作。'}},
{id:'throughput',term:'吞吐量',full:'Throughput',cn:'吞吐量',tl:'<b>系统的总接待能力</b>：每秒能处理多少请求/生成多少字；延迟管「多快回应」，它管「一趟能接多少活」。',ana:'像<b>景区接待量 vs 排队速度</b>：吞吐量是「一天能进多少游客」，延迟是「你排了多久」——节假日吞吐量到顶，队伍（延迟）自然爆长。',zone:'ai',lv:2,one:'衡量「接待能力」，延迟衡量「响应多快」',cf:'和延迟的区别：延迟是你一个人的等待时间，吞吐是所有人的总处理量——两者常需权衡。',al:["并发量", "处理能力"],rel:['latency','quota','gpu'],scn:'模型 API 定价里的「每分钟 token 数」就是吞吐量配额；用 Codex 高峰期变慢、报 429，就是被限了吞吐。',dlg:[{q:'为什么高并发时延迟变高？',a:'接待能力到顶了，请求排队，排队自然等得久。'},{q:'怎么提升吞吐？',a:'加机器、优化算法、缓存——压测找到瓶颈再对症。'}],new:true,quiz:{q:'为什么高并发时延迟变高？',o:["接待能力到顶了，请求排队，排队自然等得久。","用户太多把网线挤坏了","服务器为求公平故意轮流变慢","并发一高数据包会自动变大"],a:0,why:'系统的「总接待能力」。'}},
{id:'ci',term:'CI',full:'持续集成',cn:'CI/CD',tl:'<b>提交即体检的自动门卫</b>：每次提交代码，机器自动跑一遍测试和检查，坏代码进不了主线。',ana:'像<b>地铁安检</b>：不管你是谁、多着急，进站一律过机——单次多花十秒，换来整条线的安全；跳过安检图快，出事就是大事。',zone:'code',lv:2,one:'Continuous Integration',cf:'CI/CD 里的 CI：自动测试+合并验证；CD 是后半段的自动部署。',al:["持续集成", "CI 流水线"],rel:['devops','smoke','regress'],scn:'你查词工具那个「不过不许部署」的上线前体检脚本，就是个人版 CI；公司里的 GitHub Actions 是它的云上形态。',dlg:[{q:'为什么说 CI 是质量门禁？',a:'每次提交都被同一套标准检验，坏代码进不了主线。'},{q:'不配 CI 会怎样？',a:'问题攒到上线才爆，排查成本指数上升。'}],new:true,quiz:{q:'为什么说 CI 是质量门禁？',o:["CI 会自动给代码打分排名","CI 能阻止程序员提交任何代码","每次提交都被同一套标准检验，坏代码进不了主线。","CI 是给运维人员考勤用的"],a:2,why:'提交即体检的「自动门卫」。'}},
{id:'lobster',term:'龙虾智能体',full:'OpenClaw 别称',cn:'龙虾智能体',tl:'<b>2026 年现象级出圈的红龙虾 Agent</b>：开源免费、能操作浏览器填表抓数据，普通人第一次觉得「Agent 真能干活」。',ana:'像<b>第一位走进大众视野的扫地机器人</b>：在此之前机器人是发布会 PPT；它一登场，「这东西真有用」的共识才形成。',zone:'misc',lv:1,one:'图标是红龙虾，2026 年现象级出圈',cf:'和 OpenClaw 的关系：同一个东西，「龙虾」是社区昵称，文章里两个名混用。',al:["OpenClaw 外号", "龙虾 Agent"],rel:['openclaw','agent','workflow'],scn:'公众号刷屏的「红龙虾」就是它，OpenClaw 是其开源底座；它证明同一件事：好用的 AI 工具会自己长腿传播。',dlg:[{q:'它凭什么现象级？',a:'开源免费+浏览器操作/填表/抓数据真能干活，普通人也能上手。'},{q:'怎么跟风用？',a:'去它的 GitHub 仓库看文档，本工具的「Codex」词条有配合玩法。'}],new:true,quiz:{q:'它凭什么现象级？',o:["因为它的龙虾图标特别可爱","开源免费+浏览器操作/填表/抓数据真能干活，普通人也能上手。","它的价格只有大模型的十分之一","它只在中国市场可以下载"],a:1,why:'2026 年的「红龙虾」Agent。'}},
{id:'saas2',term:'SaaS 产品',full:'订阅制软件',cn:'SaaS 订阅',tl:'<b>「开网页就用」的软件形态</b>：不用下载安装，订阅付费、数据在云端、更新自动推送。',ana:'像<b>从买 DVD 到开视频会员</b>：以前买断制拷回家（盗版满天飞），现在按月订阅随时看——厂商收入稳了，你也总能看最新的。',zone:'misc',lv:1,one:'Software as a Service',cf:'和买断制的区别：买断是一次付费永久用（老模式），SaaS 是订阅（停付就停用）。',al:["订阅软件", "SaaS"],rel:['paas','iaas','solopreneur'],scn:'飞书、Notion、剪映网页版都是 SaaS；判断标准很简单：打开浏览器就能用、按月付费的，基本就是它。',dlg:[{q:'为什么厂商都转 SaaS？',a:'收入稳定可预期、更新即时推送、盗版难——厂商三赢。'},{q:'用户的代价？',a:'长期订阅总花费可能超买断，且数据在厂商手里。'}],new:true,quiz:{q:'为什么厂商都转 SaaS？',o:["SaaS 不需要写任何代码","用户数据放在厂商那里更安全","SaaS 软件的运行速度一定更快","收入稳定可预期、更新即时推送、盗版难——厂商三赢。"],a:3,why:'「开网页就用」的软件形态。'}},

{id:'clipboard',term:'剪贴板',full:'Clipboard',cn:'剪贴板',tl:'<b>复制粘贴的中转仓库</b>：Ctrl+C 的内容暂存在系统这块「剪贴板」上，直到被下一次复制覆盖。',ana:'像<b>银行柜台的小托盘</b>：递东西先放托盘再转交——谁都可能路过瞟一眼（恶意 App 读剪贴板），敏感东西别在托盘上久放。',zone:'misc',lv:2,one:'系统级的「临时中转站」：复制的东西都暂存在这，粘贴时取出来。',cf:'进阶玩法：Win+V 打开剪贴板历史，最近复制的多条都在，不用来回切。',al:["Clipboard", "剪贴板历史"],rel:['screenshot','twofa','daemon'],scn:'复制验证码、密码、身份证号后，记得随手复制个空格覆盖掉；部分手机已有「剪贴板敏感信息提醒」，值得打开。',dlg:[{q:'安全注意什么？',a:'剪贴板里的密码、验证码会被某些恶意 App 读取——敏感内容复制后及时覆盖。'},{q:'跨设备同步吗？',a:'苹果/微软生态支持同一账号剪贴板互通。'}],new:true,quiz:{q:'安全注意什么？',o:["剪贴板里的密码、验证码会被某些恶意 App 读取——敏感内容复制后及时覆盖。","剪贴板会让手机电池加速老化","复制内容会自动同步给运营商","剪贴板最多只能存一条记录"],a:0,why:'复制粘贴的「中转仓库」。'}},
{id:'screenshot',term:'截屏',full:'Screenshot',cn:'截屏',tl:'<b>给屏幕拍照</b>：把当前画面定格成图片，求助、留证、记账的第一动作。',ana:'像<b>现场拍照留证</b>：报警时口说无凭，照片才是证据——报错弹窗一闪而过，截下来才不至于「回头就忘了报错内容」。',zone:'misc',lv:1,one:'把屏幕画面拍下来',cf:'和长截图的区别：普通截图截一屏，长截图（滚动截屏）把整个页面接成一张长图。',al:["Screenshot", "屏幕截图"],rel:['console','qr','clipboard'],scn:'向 AI 描述问题，贴截图永远比打字快；公众号拆解排版、股票 App 记录点位，你的相册里八成全是截图。',dlg:[{q:'为什么求助时都先要截图？',a:'一图胜千言：报错弹窗、设置位置，截图比文字描述准十倍。'},{q:'截图里的隐私？',a:'注意打码：地址、手机号、聊天记录发出去前遮一下。'}],new:true,quiz:{q:'为什么求助时都先要截图？',o:["截图能自动修复部分问题","没有截图客服就拒绝受理","一图胜千言：报错弹窗、设置位置，截图比文字描述准十倍。","截图能保存网页的登录状态"],a:2,why:'屏幕的「拍照」。'}},
{id:'qr',term:'二维码',full:'QR Code',cn:'二维码',tl:'<b>线下的网址传送门</b>：把网址/信息编码成方块图案，摄像头一扫即达，是线下流量的入口。',ana:'像<b>海报上装了一扇隐形门</b>：纸面上印的不是字，是「扫码即开」的门——门后是菜单、付款码还是钓鱼网站，扫码前看不出。',zone:'misc',lv:1,one:'把网址/信息编码成方块图案',cf:'和条形码的区别：条形码是一维的「商品身份证」（只能横向存几十个数字），二维码是二维的「小硬盘」（能存网址、名片甚至 WiFi 密码）。',al:["QR Code", "扫码"],rel:['shortlink','domain','scraper'],scn:'地推扫码领资料、公众号引流、饭店点单全是它；提醒：来路不明的二维码别扫——门后可能是钓鱼页。',dlg:[{q:'为什么有方有圆？',a:'QR 是标准方形码；微信/美团自有样式是美化变体——本质一样。'},{q:'扫码安全吗？',a:'码本身无害，但可能指向钓鱼网址——不明来路的码别扫，尤其「扫码领奖品」。'}],new:true,quiz:{q:'为什么有方有圆？',o:["圆形码比方形码安全级别更高","QR 是标准方形码；微信/美团自有样式是美化变体——本质一样。","方圆代表不同国家的强制标准","圆码是即将取代方码的新一代"],a:1,why:'线下的「网址传送门」。'}},
{id:'wifi',term:'Wi-Fi',full:'无线网络',cn:'Wi-Fi',tl:'<b>无线上网的「基础设施」</b>：路由器发出、设备无线接入的局域网，家庭上网的第一跳。',ana:'像<b>小区内部道路</b>：宽带是市政主路（进小区的总闸），Wi-Fi 是楼内小路——小路堵（路由器差、墙厚），主路再宽你也慢。',zone:'misc',lv:1,one:'无线局域网：路由器发出、设备无线连接的家庭/办公上网方式。',cf:'和移动数据的区别：Wi-Fi 走宽带（快、不计流量），流量走基站（方便、计流量）。',al:["无线网络", "WLAN"],rel:['router','bandwidth','hotspot'],scn:'网速慢先分清「Wi-Fi 弱」还是「宽带慢」：凑近路由器测速快了，是 Wi-Fi 的事；没变化，找运营商。',dlg:[{q:'Wi-Fi 6/7 是什么？',a:'新一代标准：速度更快、同时连更多设备不卡。'},{q:'怎么让 Wi-Fi 更快？',a:'路由器放房子中央、连 5GHz 频段、远离微波炉。'}],new:true,quiz:{q:'Wi-Fi 6/7 是什么？',o:["是第 6/7 代运营商通信套餐","要换 6/7 张 SIM 卡才能用","Wi-Fi 6 就是 6G 网络的前身","新一代标准：速度更快、同时连更多设备不卡。"],a:3,why:'无线上网的「基础设施」。'}},
{id:'bluetooth',term:'蓝牙',full:'Bluetooth',cn:'蓝牙',tl:'<b>近场设备的「无线数据线」</b>：短距离、低功耗的直连方式，耳机、手环、车载都靠它。',ana:'像<b>两个人在桌上递纸条</b>：距离近、不用网络、随写随传；缺点是隔了墙（距离/干扰）纸条就容易丢字。',zone:'misc',lv:1,one:'短距离无线连接',cf:'和 Wi-Fi 的区别：蓝牙近距离低速低功耗（耳机），Wi-Fi 远距离高速（上网）。',al:["Bluetooth", "蓝牙连接"],rel:['wifi','firmware','hotspot'],scn:'无线耳机连接不稳、手环同步失败，先怀疑蓝牙；新耳机音质提升，多半是蓝牙版本升级带来的带宽红利。',dlg:[{q:'蓝牙 5.x 好在哪？',a:'更远更稳更低延迟——无线耳机音质改善全靠它。'},{q:'连不上怎么办？',a:'两端都关蓝牙重开、删除配对重新配——万能两招。'}],new:true,quiz:{q:'蓝牙 5.x 好在哪？',o:["更远更稳更低延迟——无线耳机音质改善全靠它。","5.x 表示能同时连 5 台设备","蓝牙 5 传输距离可达 5 公里","5.x 版本不再需要配对码"],a:0,why:'近场设备的「无线数据线」。'}},
{id:'hotspot',term:'个人热点',full:'Mobile Hotspot',cn:'个人热点',tl:'<b>手机的「随身路由器」</b>：把手机的移动流量变成 Wi-Fi 信号发出去，电脑平板蹭着用。',ana:'像<b>自带水壶分水给同伴</b>：壶里的水（套餐流量）有限，自己喝都紧张时请人喝，很快见底——救急够用，长供肉疼。',zone:'misc',lv:1,one:'把手机的移动流量变 Wi-Fi 发出去',cf:'和 Wi-Fi 的区别：热点走手机流量（计流量），Wi-Fi 走宽带（不计）。',al:["Mobile Hotspot", "热点共享"],rel:['wifi','sim','bandwidth'],scn:'出差电脑没网时开热点救命；注意电脑看视频一小时能吃 1-2GB——套餐不够的话，追剧还是找 Wi-Fi。',dlg:[{q:'流量够用吗？',a:'电脑看视频一小时能吃 1-2GB——救急可以，追剧肉疼。'},{q:'省电技巧？',a:'插着电开热点；不用时及时关，又费电又耗流量。'}],new:true,quiz:{q:'流量够用吗？',o:["手机流量无限，随便用","热点流量不计入套餐额度","电脑看视频一小时能吃 1-2GB——救急可以，追剧肉疼。","电脑连热点走宽带，不耗手机流量"],a:2,why:'手机的「随身路由器」。'}},
{id:'sim',term:'SIM 卡',full:'SIM Card',cn:'SIM 卡',tl:'<b>手机号的实体身份证</b>：芯片里存着你的号码身份，插卡入网、换机不换号。',ana:'像<b>小区业主卡</b>：门禁认卡不认机——你搬进新房（换手机），卡插上就能开门，号码跟卡走。',zone:'misc',lv:1,one:'装在手机里的身份卡',cf:'和 eSIM 的区别：SIM 是实体小卡，eSIM 是写在手机里的虚拟卡。',al:["SIM Card", "电话卡"],rel:['esim','twofa','router'],scn:'换手机时拔卡插新机即可；但注意「补 SIM 卡」是骗子最爱的攻击入口——补卡时运营商核实身份那一步别嫌麻烦。',dlg:[{q:'换手机要换卡吗？',a:'不用，卡拔出来插新手机即可，号码跟卡走。'},{q:'卡被盗用怎么办？',a:'SIM 卡有 PIN 码可设——丢了立刻挂失，防短信验证码被盗。'}],new:true,quiz:{q:'换手机要换卡吗？',o:["要，每部手机绑定专属 SIM 卡","不用，卡拔出来插新手机即可，号码跟卡走。","要，新手机必须重新实名认证","看运气，有的手机会锁卡"],a:1,why:'手机号的「实体身份证」。'}},
{id:'esim',term:'eSIM',full:'虚拟 SIM',cn:'eSIM',tl:'<b>「隐形」的 SIM 卡</b>：不插实体卡，号码信息直接写进手机芯片里，扫码开通即用。',ana:'像<b>从实体会员卡到电子会员码</b>：卡还是那张卡，只是从兜里挪进了手机——不怕丢、不怕忘带，换设备也好「转移」。',zone:'misc',lv:2,one:'写入手机的虚拟 SIM 卡',cf:'和实体卡的差别：eSIM 切换运营商不用跑营业厅，出国扫码买当地流量包超方便。',al:["eSIM", "嵌入式 SIM"],rel:['sim','twofa','wifi'],scn:'国内手机端还在推进，手表、平板已普遍支持；出国旅游买当地 eSIM 流量包，下个码就上网，不用蹲机场柜台。',dlg:[{q:'国内支持吗？',a:'手机端国内还在推进，手表/平板已普遍支持。'},{q:'换手机 eSIM 怎么办？',a:'需要重新开通（比实体卡麻烦一点），删除前先确认转移方式。'}],new:true,quiz:{q:'国内支持吗？',o:["国内三大运营商早已全面普及","国内永久禁止使用 eSIM","只有进口手机才能开通","手机端国内还在推进，手表/平板已普遍支持。"],a:3,why:'「隐形」的 SIM 卡。'}},
{id:'ipv6',term:'IPv6',full:'新一代 IP 协议',cn:'IPv6',tl:'<b>互联网的第二代门牌系统</b>：地址从 32 位扩到 128 位，让每台设备都有独一无二的门牌。',ana:'像<b>老小区扩门牌</b>：老地址（IPv4 43 亿个）早不够分，新系统门牌多到「地球每粒沙都分得到」——一户一号不再挤。',zone:'abbr',lv:2,one:'下一代的「网络门牌号」',cf:'和 IPv4 的区别：IPv4 门牌号已用完（靠共享凑合），IPv6 管够且更快更安全。',al:["IPv6", "新一代 IP"],rel:['ip','router','domain'],scn:'对你日常感知不强——它是后台静默升级；部分新站点走 IPv6 反而更快，手机设置里看到「IPv6 已启用」是好事不是异常。',dlg:[{q:'对我有什么影响？',a:'感知不强——它是后台升级；新设备支持 IPv6 访问某些站点更快。'},{q:'怎么知道自己有没有？',a:'测速网站会显示；运营商近年的宽带/手机网默认都开了。'}],new:true,quiz:{q:'对我有什么影响？',o:["感知不强——它是后台升级；新设备支持 IPv6 访问某些站点更快。","IPv6 一出 IPv4 立即全部作废","所有网站都得手动改用 IPv6 访问","手机号会从 11 位变成 128 位"],a:0,why:'互联网的「第二代门牌系统」。'}},
{id:'router',term:'路由器',full:'Router',cn:'路由器',tl:'<b>家庭网络的「总调度」</b>：宽带进来第一站，负责给设备发门牌（IP）、指路、发 Wi-Fi。',ana:'像<b>小区物业前台</b>：快递（数据包）全从它手中分发到各家——前台卡了（路由器死机），全小区都收不到件。',zone:'misc',lv:1,one:'家庭网络的「总调度」',cf:'和光猫的区别：光猫负责光电信号转换，路由器负责发 Wi-Fi 和管理设备——现在常合体成一台。',al:["Router", "无线路由器"],rel:['wifi','modem','bandwidth'],scn:'「网卡了」第一步永远是重启路由器，能解决八成问题；还是慢再查宽带本身或光猫。',dlg:[{q:'卡顿先查什么？',a:'重启路由器（解决八成问题）；还是慢就查是不是宽带本身慢。'},{q:'放哪信号最好？',a:'房屋中心、高处、离金属和微波炉远点。'}],new:true,quiz:{q:'卡顿先查什么？',o:["先打运营商电话投诉","立刻买台更贵的路由器","重启路由器（解决八成问题）；还是慢就查是不是宽带本身慢。","把所有设备断网重连一遍"],a:2,why:'家庭网络的「交通枢纽」。'}},
{id:'modem',term:'光猫',full:'Modem',cn:'光猫',tl:'<b>光纤的「信号翻译官」</b>：把光纤里的光信号翻译成电信号给路由器，反向亦然。',ana:'像<b>港口的翻译官</b>：远洋货轮（光信号）说的是「光语」，市内货车（路由器）说的是「电语」——翻译官不在中间坐镇，两边对不上话。',zone:'misc',lv:2,one:'运营商装机送的「信号翻译官」',cf:'和路由器的分工：光猫管翻译，路由器管分发——有些光猫自带路由功能。',al:["光调制解调器", "光猫"],rel:['router','bandwidth','firmware'],scn:'家里断网先看光猫指示灯：闪红灯=光信号丢了（光纤断/没插紧），重启不行就报修；红灯之外的闪灯多半正常。',dlg:[{q:'闪红灯是什么意思？',a:'光信号丢失：光纤断了或没插紧——先重启，不行就报修。'},{q:'自己能换吗？',a:'运营商绑定设备，换/移机要报装，别自己拆。'}],new:true,quiz:{q:'闪红灯是什么意思？',o:["红灯表示有人盗用你的网络","光信号丢失：光纤断了或没插紧——先重启，不行就报修。","光猫过热自动进入保护模式","红灯说明宽带欠费被停了"],a:1,why:'光纤的「信号翻译官」。'}},
{id:'bandwidth',term:'带宽',full:'Bandwidth',cn:'带宽',tl:'<b>网速管道的「口径」</b>：带宽越粗，单位时间能过的数据越多——300M 宽带就是更粗的管子。',ana:'像<b>水管的粗细</b>：口径决定单位时间出水量；但拧开龙头水小，也可能是邻居家全在放水（高峰拥堵）或水厂限压（服务器限速）。',zone:'misc',lv:2,one:'网络管道的「粗细」',cf:'单位注意：运营商说的 100M 是 Mbps（兆比特），下载显示的是 MB/s（兆字节）——8 倍关系，100M 宽带下载峰值约 12.5MB/s。',al:["带宽", "网速"],rel:['wifi','throughput','cdn'],scn:'「办了千兆宽带为啥测速不到」：线路损耗、Wi-Fi 折损、对方服务器限速都在吃带宽——峰值是理论上限，不是保底。',dlg:[{q:'为什么实际达不到峰值？',a:'线路损耗、对方服务器限速、WiFi 损耗——峰值是理论上限。'},{q:'上行带宽是什么？',a:'上传方向的粗细——家用宽带上行通常只有下行的几分之一（传文件慢的主因）。'}],new:true,quiz:{q:'为什么实际达不到峰值？',o:["运营商偷偷限速克扣流量","带宽峰值纯属骗人的营销数字","测试软件不准确才测不出来","线路损耗、对方服务器限速、WiFi 损耗——峰值是理论上限。"],a:3,why:'网速管道的「口径」。'}},
{id:'packet',term:'数据包',full:'Packet',cn:'数据包',tl:'<b>网络传输的「集装箱」</b>：大数据切块封装、编号发货，到齐后按序拼装，丢件只补丢的那块。',ana:'像<b>搬家时的纸箱编号</b>：一车装不下就分箱标号（1/57、2/57……）——丢一个箱子补一箱，不用整批重来。',zone:'misc',lv:3,one:'网络传输的「集装箱」',cf:'和「带宽」的区别：带宽是管子多粗（一次能过多少），数据包是货物的打包方式（怎么切怎么运）——粗管子运碎箱子，才又快又稳。',al:["Packet", "网络数据包"],rel:['bandwidth','router','ddos'],scn:'视频卡顿、游戏延迟，背后常有「丢包」；测速工具里「丢包率 0%」就是健康信号。',dlg:[{q:'为什么切成包？',a:'一条大管道大家共享，切包让多个人「同时」传——丢一个包只需重传那一小包。'},{q:'丢包是什么？',a:'某些包在路上丢了——网速不稳、视频卡顿的主因。'}],new:true,quiz:{q:'为什么切成包？',o:["一条大管道大家共享，切包让多个人「同时」传——丢一个包只需重传那一小包。","网线一次只能传 1500 字节","数据包是收费单位，切小省钱","不切包防火墙会拦大文件"],a:0,why:'网络传输的「集装箱」。'}},
{id:'firewall2',term:'防火墙',full:'Firewall',cn:'防火墙',tl:'<b>网络的「门禁系统」</b>：按规则放行/拦截进出流量，没约的敲门、可疑的外联都被它挡。',ana:'像<b>小区门禁+监控</b>：快递员登记进（放行规则）、陌生人拦下（外部扫描）、有人半夜往外搬家电（程序异常外联）立刻报警。',zone:'misc',lv:2,one:'网络的「门卫」',cf:'和杀毒软件的区别：防火墙管「进出的门」（网络流量），杀毒管「屋里的东西」（文件里的病毒）——管的是不同环节，正经电脑两个都要。',al:["Firewall", "网络防火墙"],rel:['ddos','bot','twofa'],scn:'公司电脑常被 IT 的防火墙管着（有些网站进不去）；个人电脑的系统防火墙默认开着别关——它是第一道门。',dlg:[{q:'拦的是什么？',a:'外部未经邀请的连接尝试、程序异常外联——病毒常被它挡在门外或困在里面。'},{q:'和杀毒软件的区别？',a:'杀软查已经进来的毒，防火墙守门口不让进——互补，都要。'}],new:true,quiz:{q:'拦的是什么？',o:["拦截所有弹窗广告和垃圾短信","只拦截带毒的压缩文件","外部未经邀请的连接尝试、程序异常外联——病毒常被它挡在门外或困在里面。","拦截运营商的限速指令"],a:2,why:'网络的「门禁系统」。'}},
{id:'ddos',term:'DDoS 攻击',full:'分布式拒绝服务',cn:'DDoS 攻击',tl:'<b>「人海战术」的网络攻击</b>：不偷数据，就是让成千上万台被控机器同时涌向目标，把门挤爆让所有人用不了。',ana:'像<b>恶意占座</b>：雇一万人去餐厅各点一杯白开水坐着不走——不是抢劫，但正经客人一位也进不来，餐厅照样停摆。',zone:'misc',lv:3,one:'不是偷东西，是让所有人用不了',cf:'和黑客入侵的区别：入侵是「撬门进来偷东西」，DDoS 是「堵门让你做不成生意」——一个图财，一个搞瘫，防法也完全不同。',al:["DDoS", "拒绝服务攻击"],rel:['bot','firewall2','cdn'],scn:'「某某服务崩了」的官宣原因常见它；个人站点也能被小规模打瘫——套一层 CDN（如 Cloudflare）是最常见的护身符。',dlg:[{q:'分布式什么意思？',a:'攻击来自成千上万台被控制的机器（肉鸡），单靠封 IP 封不完。'},{q:'被打了怎么办？',a:'上高防 CDN/云防护——大站有自动清洗；小站靠云厂商。'}],new:true,quiz:{q:'分布式什么意思？',o:["攻击同时从多个机房发律师函","攻击来自成千上万台被控制的机器（肉鸡），单靠封 IP 封不完。","指攻击软件分布式存在云上","指受害者的服务器多台分布部署"],a:1,why:'「人海战术」的网络攻击。'}},
{id:'bot',term:'机器人流量',full:'Bot',cn:'机器人流量',tl:'<b>网上「非人类访客」</b>：自动化脚本模拟访问——爬内容的、抢票的、刷量的，都是它。',ana:'像<b>商场里的神秘客流</b>：有商场自己请的「气氛组」（搜索引擎爬虫，带客上门），也有黄牛雇的（秒杀脚本，专薅羊毛）——看着都「是人」，性质天差地别。',zone:'misc',lv:2,one:'不是真人的自动化访问',cf:'和病毒的区别：bot 是「自动化访问」本身（技术中性），病毒是「恶意代码」——同一段 bot 代码，抓公开数据是服务，抢单/刷量就是作恶。',al:["Bot", "机器人程序"],rel:['scraper','aioverview','firewall2'],scn:'你用第三方数据服务抓公众号阅读量，是「好 bot」的合规形态；反过来你的文章被批量搬运，坏 bot 就在薅你。',dlg:[{q:'为什么好坏并存？',a:'技术中性——同一段脚本，用于索引是服务，用于秒杀是薅羊毛。'},{q:'怎么区分真人和 Bot？',a:'验证码（人一眼认识，机器难识别）、行为分析（真人会乱动鼠标）。'}],new:true,quiz:{q:'为什么好坏并存？',o:["好机器人免费，坏机器人收费","白天是好的，晚上是坏的","机器人超过 1000 个就会变坏","技术中性——同一段脚本，用于索引是服务，用于秒杀是薅羊毛。"],a:3,why:'网上「非人类访客」。'}},
{id:'scraper',term:'网页抓取工具',full:'Scraper',cn:'网页抓取工具',tl:'<b>网页数据的「批量搬运工」</b>：自动把网页内容按结构抓下来存成表格/数据库，人不用一页页抄。',ana:'像<b>雇了个抄书先生</b>：一本本抄（手动复制粘贴）他一晚上抄完全馆——但抄什么、抄了干嘛用，规矩得先讲清楚。',zone:'misc',lv:2,one:'自动「抄网页」的工具',cf:'和爬虫的关系：爬虫是统称，scraper 常指针对特定页面的提取工具。',al:["Scraper", "数据采集"],rel:['bot','api','userscript'],scn:'公众号数据服务、电商比价工具，本质都是合规化后的「抓取」；抓公开数据自用一般没事，绕登录、高频猛抓、拿去商用就要掂量。',dlg:[{q:'合法吗？',a:'看抓什么和怎么用：公开数据自用一般没问题；绕过登录/大量请求/商用需谨慎。'},{q:'不用代码能抓吗？',a:'浏览器插件可视化抓取已很成熟，圈选字段就能导出表格。'}],new:true,quiz:{q:'合法吗？',o:["看抓什么和怎么用：公开数据自用一般没问题；绕过登录/大量请求/商用需谨慎。","一律违法，抓了就得进去","完全合法，网上的东西随便抓","只要不赚钱就绝对不违法"],a:0,why:'网页数据的「批量搬运工」。'}},
{id:'daemon',term:'后台进程',full:'Daemon',cn:'后台进程',tl:'<b>幕后的「隐形工作者」</b>：不弹窗口、默默在后台跑的服务——同步、推送、监控全靠它们值守。',ana:'像<b>酒店深夜的后勤</b>：客人睡了（你关了窗口），锅炉房、监控室、冷库照常运转（后台进程）——看不见，但停了早上就是灾难。',zone:'misc',lv:3,one:'默默在后台运行的服务程序',cf:'名字来源：发音同 demon（精灵），取「幕后默默干活」之意，Mac 系统尤其常用这个词。',al:["Daemon", "后台服务"],rel:['console','terminal','automation'],scn:'手机「后台耗电」榜单上的常客就是它们；有些关不掉是故意的——系统/安全服务被设计成自动重启，防被恶意关闭。',dlg:[{q:'为什么有些关不掉？',a:'系统/安全软件的核心服务被设计为自动重启——防止被恶意关闭。'},{q:'怎么管理？',a:'任务管理器/系统配置里看，不确定的别禁——先搜名字再动手。'}],new:true,quiz:{q:'为什么有些关不掉？',o:["因为程序有 bug 卡死了","关掉会触发硬件过热保护","系统/安全软件的核心服务被设计为自动重启——防止被恶意关闭。","它们是系统隐藏的付费服务"],a:2,why:'幕后的「隐形工作者」。'}},

{id:'console',term:'控制台',full:'Console',cn:'控制台',tl:'<b>网页的「仪表舱」</b>：浏览器 F12 打开的开发者窗口，报错、日志、网络请求一览无余。',ana:'像<b>飞机的驾驶舱</b>：乘客看舷窗（网页界面），机务看仪表舱（Console）——「网页坏了」这种描述没用，红色报错才是故障码。',zone:'misc',lv:2,one:'开发者窗口',cf:'和终端（Terminal）的区别：Console 是浏览器里看「网页自己说什么」，Terminal 是系统里向电脑「下命令」——一个是读仪表，一个是踩油门。',al:["Console", "浏览器控制台"],rel:['debug','terminal','screenshot'],scn:'反馈网页问题时，懂行的人先要 Console 截图：红色报错直接指出哪个文件哪行炸了——比「打不开了」有用一百倍。',dlg:[{q:'为什么反馈问题总被要 Console 截图？',a:'红色报错直接指出哪个文件哪行出问题——比「网页坏了」有用一百倍。'},{q:'普通人打开会看到报错正常吗？',a:'偶见黄色警告正常；满屏红色说明页面有问题（但不一定影响使用）。'}],new:true,quiz:{q:'为什么反馈问题总被要 Console 截图？',o:["为了收集你的个人信息","红色报错直接指出哪个文件哪行出问题——比「网页坏了」有用一百倍。","Console 能一键修复网页","这是开发者的职业仪式感"],a:1,why:'网页的「仪表舱」。'}},
{id:'terminal2',term:'终端模拟器',full:'Terminal Emulator',cn:'终端模拟器',tl:'<b>命令行的「现代窗口」</b>：图形界面里打开的「黑窗口」，里面可以跑 CMD、PowerShell 等不同命令环境。',ana:'像<b>剧场舞台</b>：终端是舞台（壳），CMD/PowerShell 是不同的剧团（语言环境）——同一个舞台，今晚京剧明晚话剧。',zone:'misc',lv:2,one:'图形界面里打开的「黑窗口」',cf:'名字里的「模拟器」：模拟早期的物理终端（大铁壳显示器）——现在是窗口程序。',al:["Terminal", "终端"],rel:['cli','console','shell2'],scn:'你用 Codex/Claude Code 的那个窗口就是终端；Windows Terminal 是微软出的现代终端，比老式黑框好用得多。',dlg:[{q:'和 CMD/PowerShell 的关系？',a:'Windows 的终端窗口里可以跑 CMD 或 PowerShell——终端是壳，里面跑的是语言。'},{q:'为什么开发者离不开？',a:'批量操作、远程服务器、AI 编程工具——图形界面覆盖不了的效率区。'}],new:true,quiz:{q:'和 CMD/PowerShell 的关系？',o:["三者是完全相同的东西","CMD 是终端的升级替代品","终端只属于苹果和 Linux","Windows 的终端窗口里可以跑 CMD 或 PowerShell——终端是壳，里面跑的是语言。"],a:3,why:'命令行的「现代窗口」。'}},
{id:'shell2',term:'Shell 脚本',full:'Shell Script',cn:'Shell 脚本',tl:'<b>命令的「批量打包」</b>：把一串命令写进文件按顺序执行，重复劳动一次写好天天用。',ana:'像<b>餐馆的开店流程卡</b>：开灯→开火→备料→开门，写成一串贴墙上——新员工照着跑一遍，谁都不会漏步骤。',zone:'misc',lv:3,one:'把一串命令写进文件批量执行',cf:'常见 Shell：bash（Linux/Mac）、PowerShell（Windows）——语法不同思路相通。',al:["Shell Script", "脚本"],rel:['terminal','cron','backup'],scn:'你查词工具的体检脚本是 Python 写的；纯系统的批量操作（备份、批量改名）用 Shell 更顺手——胶水活用 Shell，复杂逻辑用 Python。',dlg:[{q:'和 Python 的区别？',a:'Shell 擅长「串联系统命令」，Python 擅长「复杂逻辑」——胶水活用 Shell。'},{q:'写脚本的风险？',a:'删错目录不可逆——脚本里的删除命令要反复确认路径，先 echo 预览再执行。'}],new:true,quiz:{q:'和 Python 的区别？',o:["Shell 擅长「串联系统命令」，Python 擅长「复杂逻辑」——胶水活用 Shell。","Shell 比 Python 快一百倍","Shell 已被彻底淘汰没人用了","Python 不能调用系统命令"],a:0,why:'命令的「批量打包」。'}},
{id:'sudo',term:'Sudo',full:'以管理员执行',cn:'Sudo',tl:'<b>命令行的「临时队长袖标」</b>：在命令前加 sudo，这一条命令就以管理员身份执行——权限瞬间拉满。',ana:'像<b>临时借用保险柜钥匙</b>：开一次门办一件事（单条命令提权），比把钥匙配一把常挂腰上（一直用管理员账户）安全得多。',zone:'abbr',lv:3,one:'Linux/Mac 的「以管理员身份运行」',cf:'和 Windows「以管理员身份运行」的区别：思路一样（临时提权），形态不同——Windows 对单个程序右键提权，Linux/Mac 对单条命令加 sudo。',al:["Sudo", "提权"],rel:['chmod','terminal','harden'],scn:'Mac/Linux 教程里常见的 sudo 开头命令就是它；风险在于「管理员能删任何文件」——手滑等于系统级灾难，逐字核对再回车。',dlg:[{q:'风险在哪？',a:'管理员能删任何文件——sudo rm 手滑 = 系统级灾难，所以命令要逐字核对。'},{q:'为什么要设计它？',a:'平时用普通权限（安全），关键时刻才提权——最小权限原则。'}],new:true,quiz:{q:'风险在哪？',o:["sudo 会把密码发给黑客","用 sudo 需要额外付费","管理员能删任何文件——sudo rm 手滑 = 系统级灾难，所以命令要逐字核对。","sudo 只在深夜时段有风险"],a:2,why:'命令行的「临时队长袖标」。'}},
{id:'chmod',term:'权限修改',full:'Chmod',cn:'权限修改',tl:'<b>文件的「门禁卡设置」</b>：三个数字（如 755）分别规定「自己/同组/其他人」能读、能写、能执行到什么程度。',ana:'像<b>三道门的钥匙权限</b>：自己家（全控）、同楼层邻居（只能进楼）、访客（只能到大门）——数字越大权限越松，777 等于大门敞开。',zone:'abbr',lv:3,one:'三个数字一组（如 755）',cf:'数字含义：7=读写执行全有，5=读+执行，4=只读——三组数字分别是主人/同组/其他人。',al:["Chmod", "文件权限"],rel:['sudo','deploy','harden'],scn:'服务器部署报「Permission denied」多半要靠它解决；AI 给你一条 chmod 命令时看懂数字含义再执行，别无脑照抄。',dlg:[{q:'常见组合？',a:'755（自己全控，别人只能看和跑）、644（自己改，别人只能看）。'},{q:'改错会怎样？',a:'权限过松=别人能改你的文件；过紧=程序读不到报错——改前想清楚给谁用。'}],new:true,quiz:{q:'常见组合？',o:["111 表示谁都没权限，最安全","755（自己全控，别人只能看和跑）、644（自己改，别人只能看）。","000 是最高权限的通配写法","数字越大代表加密等级越高"],a:1,why:'文件的「门禁卡设置」。'}},
{id:'dns2',term:'DNS 解析',full:'域名解析',cn:'DNS 解析',tl:'<b>互联网的「通讯录查询」</b>：把域名（如你的 GitHub Pages 地址）翻译成机器认的 IP 门牌号。',ana:'像<b>手机通讯录</b>：你记「老王」（域名），手机拨号时查表换成 138xxxx（IP）——表翻不到（DNS 故障），号码再对也拨不出去。',zone:'abbr',lv:2,one:'互联网的「通讯录」',cf:'和 hosts 文件的区别：DNS 是全网公用的「114 查号台」，hosts 是你本机的「私人通讯录」（查号前先翻它）——改 hosts 可以强制某域名指向某 IP。',al:["DNS 解析", "Domain Name System"],rel:['ip','domain','router'],scn:'「网通着但网页打不开」先怀疑 DNS：换个公共 DNS（如 223.5.5.5）常能解决；你的查词站点解析也走这条路。',dlg:[{q:'为什么打不开网页先怀疑 DNS？',a:'网通了但「通讯录」翻不到，就显示无法访问——换个 DNS（如 223.5.5.5）常能解决。'},{q:'和 VPN 的区别？',a:'DNS 只做翻译，不加密不翻墙——两个概念常被混为一谈。'}],new:true,quiz:{q:'为什么打不开网页先怀疑 DNS？',o:["因为 DNS 病毒会烧坏网卡","DNS 服务器离家太远信号弱","打不开网页一定是宽带欠费","网通了但「通讯录」翻不到，就显示无法访问——换个 DNS（如 223.5.5.5）常能解决。"],a:3,why:'互联网的「通讯录查询」。'}},
{id:'ci3',term:'CDN 回源',full:'回源拉取',cn:'CDN 回源',tl:'<b>CDN 的「补货机制」</b>：节点没有或缓存过期时，回头向源站要数据——回源越多，CDN 省的钱越少。',ana:'像<b>便利店的补货</b>：顾客要的货店里没有（未缓存），店员骑车去总仓调（回源）——十次顾客九次能就地取货，便利店才划算。',zone:'abbr',lv:3,one:'「便利店缺货去仓库调货」',cf:'和「缓存」的区别：缓存是「存起来就近用」这件事本身，回源是「存货没了去补」的动作——缓存命中率高，回源就少，反之亦然。',al:["CDN 回源", "回源"],rel:['cdn','cache','bandwidth'],scn:'你的 GitHub Pages 站点更新后「看到的还是旧内容」，就是 CDN 缓存没过期——等十分钟或加个随机参数强制绕缓存。',dlg:[{q:'什么时候发生回源？',a:'首次访问、缓存过期、缓存被清——回源多了 CDN 就白买了。'},{q:'怎么减少回源？',a:'延长缓存时间、预热（提前推内容到节点）、合理设置过期策略。'}],new:true,quiz:{q:'什么时候发生回源？',o:["首次访问、缓存过期、缓存被清——回源多了 CDN 就白买了。","用户每次刷新页面都会回源","只在凌晨低峰期定时回源","回源是运营商的强制行为"],a:0,why:'CDN 的「补货机制」。'}},
{id:'sdk2',term:'SDK 面板',full:'软件开发包',cn:'SDK 面板',tl:'<b>功能集成的「预制工具箱」</b>：厂商把支付/地图/推送打包成一套代码+工具，按文档拼进你的应用就能用。',ana:'像<b>宜家的整套装柜</b>：板材、螺丝、说明书配齐（SDK 文档+示例代码），照着装一天出货；自己开料打柜（从零实现）得一个月。',zone:'abbr',lv:1,one:'Software Development Kit',cf:'和 API 的区别：API 是「服务窗口」（你发请求它回数据），SDK 是「工具箱+说明书」（含调用 API 的代码）。',al:["SDK", "开发工具包"],rel:['api','plugin','deploy'],scn:'App 里「微信登录」「地图选点」都是接 SDK——自己写要几个月，集成几天；SDK 报错先看版本兼容，八成是版本对不上。',dlg:[{q:'为什么要用 SDK？',a:'支付、地图、推送这些功能自己写要几个月，SDK 集成几天。'},{q:'集成 SDK 注意什么？',a:'看权限要多少、体积多大、是否常更新——僵尸 SDK 是隐患。'}],new:true,quiz:{q:'为什么要用 SDK？',o:["SDK 能让 App 体积小一半","不用 SDK 应用无法上架商店","支付、地图、推送这些功能自己写要几个月，SDK 集成几天。","SDK 反正免费，不用白不用"],a:2,why:'功能集成的「预制工具箱」。'}},
{id:'ramageddon',term:'RAMageddon',full:'RAMageddon',cn:'内存末日 / 内存荒',zone:'misc',lv:2,
 tl:'<b>AI 公司把内存条抢光了，内存涨价，手机和游戏机跟着变贵</b>。2026 年科技圈的自嘲黑话。',
